<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師題庫總覽｜第一、二單元總複習</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff4e9;color:#173f35;font-family:system-ui,'Noto Sans TC',sans-serif;line-height:1.7}header{background:#214d3d;color:white;padding:30px 20px}header div,main{max-width:920px;margin:auto}header a{color:#ddf0dc}h1{margin:7px 0;font-size:clamp(28px,5vw,40px)}header p{margin:0;color:#e2eee2}main{padding:24px 18px 60px}.intro{background:#dbead9;border-radius:12px;padding:14px 18px}section>h2{border-bottom:2px solid #8da990;padding-bottom:7px;margin-top:36px}.q{background:#fffefa;border:1px solid #d2dfcd;border-radius:13px;padding:18px 20px;margin:14px 0;break-inside:avoid}.meta{font-size:14px;color:#597b60}.q h3{font-size:19px;margin:5px 0 10px}.visual svg{max-width:340px;max-height:170px;display:block;margin:8px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}.correct{font-weight:700;color:#246544}.why{margin:10px 0 0;font-size:15px;color:#476052}@media(max-width:600px){.options{grid-template-columns:1fr}}@media print{header{background:white;color:#173f35}header p,header a{color:#173f35}body{background:white}.q{box-shadow:none}}
</style></head><body><header><div><a href="./">← 返回遊戲</a><h1>教師題庫總覽</h1><p>第一、二單元各 30 題，共 60 題</p></div></header><main><p class="intro">每題列出選項、正確答案與解析。遊戲中的選項會隨機排列，答案字母可能與此處不同。</p><div id="questions"></div></main><script src="questions.js"></script><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function plant(kind){let leaf=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="29" ry="9" fill="#579563" stroke="#315e40" stroke-width="2"/>`;let roots=x=>`<path d="M${x} 177l-16 22m16-22l2 27m-2-27l18 20" stroke="#8c6d48" fill="none" stroke-width="3"/>`;let content='';if(kind==='free')content=`${leaf(210,76)}${leaf(258,77)}<path d="M232 80v38m0-20l-23 31m23-24l20 26m-20-15l-9 27" stroke="#806b48" stroke-width="3" fill="none"/>`;if(kind==='floating-leaf')content=`<path d="M230 177Q208 124 170 83M230 177Q255 122 290 83" stroke="#568150" stroke-width="5" fill="none"/>${leaf(170,80)}${leaf(290,80)}${roots(230)}`;if(kind==='emergent')content=`<path d="M230 177L200 40M230 177L280 27" stroke="#568150" stroke-width="5"/>${leaf(200,40)}${leaf(280,27)}${roots(230)}`;if(kind==='submerged')content=`<path d="M230 177Q260 132 242 102" stroke="#568150" stroke-width="5" fill="none"/>${[115,135,155].map((y,i)=>`<ellipse cx="232" cy="${y}" rx="20" ry="6" transform="rotate(30 232 ${y})" fill="#579563"/><ellipse cx="258" cy="${y-5}" rx="20" ry="6" transform="rotate(-30 258 ${y-5})" fill="#579563"/>`).join('')}${roots(230)}`;return `<div class="visual"><svg viewBox="0 0 460 225" role="img" aria-label="植物生長位置示意圖，請觀察根、葉與水面的關係"><rect width="460" height="225" rx="18" fill="#f6f8ee"/><path d="M0 80H460V180H0" fill="#d9eeeb"/><path d="M0 180H460V225H0" fill="#d5b98c"/><path d="M0 80H460" stroke="#79b8b0" stroke-width="3" stroke-dasharray="7 4"/>${content}<g font-size="17" fill="#355c55"><text x="12" y="70">水面</text><text x="12" y="208">水底泥土</text></g></svg></div>`}
document.querySelector('#questions').innerHTML=[1,2].map(u=>{const qs=BANK.filter(q=>q.unit===u);return `<section><h2>單元 ${u}｜${u===1?'地表的靜與動':'水生生物與環境'}（${qs.length} 題）</h2>${qs.map((q,i)=>`<article class="q"><div class="meta">第 ${i+1} 題 ｜${esc(q.topic)}｜課本第 ${q.page} 頁</div><h3>${esc(q.stem)}</h3>${q.visual&&q.visual!=='flow'?plant(q.visual):''}<div class="options">${q.opts.map((o,j)=>`<div class="${j===q.answer?'correct':''}">${'ABCD'[j]}. ${esc(o)} ${j===q.answer?'✓ 正確答案':''}</div>`).join('')}</div><p class="why">解析：${esc(q.why)}</p></article>`).join('')}</section>`}).join('');
</script></body></html>
