<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四季農莊：島嶼物語 12-1 新版</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#0f172a}
    .version-bar{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:#fff7df;border-bottom:2px solid #d59c3a;color:#603813;font-weight:900;position:relative;z-index:5}
    .version-left{display:flex;align-items:center;gap:10px;min-width:0}
    .badge{background:#237a3b;color:white;border-radius:999px;padding:5px 9px;font-size:12px;white-space:nowrap}
    .version-note{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .version-links{display:flex;gap:8px;white-space:nowrap}
    .version-links a{color:#155e35;text-decoration:none;border:1px solid #77a980;border-radius:9px;padding:5px 8px;background:white;font-size:12px}
    #game{width:100%;height:calc(100% - 44px);border:0;background:#0f172a;display:block}
    #loading{position:fixed;inset:44px 0 0 0;display:grid;place-items:center;background:#0f172a;color:white;z-index:4;text-align:center;padding:24px}
    #loading .box{max-width:520px;background:#172033;border:1px solid #334155;border-radius:18px;padding:20px 24px;box-shadow:0 16px 50px rgba(0,0,0,.35)}
    #loading strong{display:block;font-size:20px;margin-bottom:8px}
    #loading small{color:#cbd5e1;line-height:1.7}
    @media(max-width:720px){.version-note{display:none}.version-bar{height:42px;padding:0 8px}.version-links a{padding:4px 6px}#game{height:calc(100% - 42px)}#loading{inset:42px 0 0}}
  </style>
</head>
<body>
  <div class="version-bar">
    <div class="version-left">
      <span class="badge">12-1 新版</span>
      <span class="version-note">視覺改版測試：全作物種子各 1 包｜測試資金最低 100000｜與原版存檔分離</span>
    </div>
    <div class="version-links">
      <a href="12.html" target="_blank" rel="noopener">開啟原版 12</a>
    </div>
  </div>
  <iframe id="game" title="四季農莊 12-1 新版"></iframe>
  <div id="loading"><div class="box"><strong>正在建立 12-1 新版...</strong><small>原始 12.html 不會被修改。新版會在瀏覽器中載入原遊戲，再套用已確認的圖片流程與測試設定。</small></div></div>

  <script>
    const frame = document.getElementById('game');
    const loading = document.getElementById('loading');

    function replaceOnce(source, search, replacement, label){
      if(!source.includes(search)) throw new Error('找不到改版掛載點：' + label);
      return source.replace(search, replacement);
    }

    async function buildRevision(){
      let html = await fetch('./12.html?source=12-1', {cache:'no-store'}).then(r => {
        if(!r.ok) throw new Error('無法讀取原版 12.html：HTTP ' + r.status);
        return r.text();
      });

      // 12-1 使用獨立存檔 key，測試新版不會覆蓋原版進度。
      html = html.split('farm_tycoon_save_v2').join('farm_tycoon_save_v2_12_1');
      html = html.replace('<title>四季農莊：島嶼物語</title>', '<title>四季農莊：島嶼物語｜12-1 新版</title>');

      // 新遊戲直接從 100000 開始。
      html = replaceOnce(
        html,
        'const [gold, setGold] = useState(100);',
        'const [gold, setGold] = useState(100000);',
        '12-1 測試起始資金'
      );

      // 舊的 12-1 測試存檔若低於 100000，載入時自動補到 100000；高於 100000 則保留原金額。
      html = replaceOnce(
        html,
        'setGold(state.gold);',
        'setGold(Math.max(100000, Number(state.gold) || 0));',
        '12-1 載入存檔測試資金'
      );

      // 新遊戲的背包直接放入每一種作物種子各 1 包。
      html = replaceOnce(
        html,
        'scissors: 10, chili: 10, seeds: {}, crops: {}',
        'scissors: 10, chili: 10, seeds: Object.fromEntries(Object.values(CROPS).flat().filter(Boolean).map(crop => [crop.id, 1])), crops: {}',
        '12-1 全作物測試種子'
      );

      // 載入舊測試存檔時保留原數量，但缺少或歸零的作物種子補到 1 包。
      html = replaceOnce(
        html,
        'setInventory({ ...state.inventory, crops: state.inventory.crops || {} });',
        'setInventory({ ...state.inventory, seeds: { ...(state.inventory?.seeds || {}), ...Object.fromEntries(Object.values(CROPS).flat().filter(Boolean).map(crop => [crop.id, Math.max(1, Number(state.inventory?.seeds?.[crop.id]) || 0)])) }, crops: state.inventory?.crops || {} });',

      );

      const artCss = [
        '<style>',

        '      const mature = growth >= crop.days;',
        "      let stage = mature ? 'mature' : 'seedling';",
        "      if (!mature && sprites.pre && growth / crop.days >= 0.38) stage = 'pre';",
        '      const pos = sprites[stage];',
        '      if (!pos) return <span className={fallbackClass}>{fallback}</span>;',
        "      const legendary = ['golden_peach','crystal_melon','giant_pumpkin','white_strawberry'].includes(crop.id);",
