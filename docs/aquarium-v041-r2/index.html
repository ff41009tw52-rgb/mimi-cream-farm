 → 精修"></a><figcaption>孔雀魚、金魚、鼠魚：原版 → 精修</figcaption></figure><h3>教材插圖</h3><div class="compare"><figure><a href="teaching-before.png"><img loading="lazy" src="teaching-before.png" alt="原版教材示意魚"></a><figcaption>原版教材示意魚</figcaption></figure><figure><a href="teaching-new.png"><img loading="lazy" src="teaching-new.png" alt="新版教材示意魚：鱗片、鰭條、標示與高亮"></a><figcaption>新版教材示意魚：鱗片、鰭條、標示與高亮</figcaption></figure></div><h3>觀察模式結構</h3><p>原版將自己的魚縮在上方，下方直接顯示教材；新版先讓自己的魚成為主角，再由大分頁切換到課本複習。</p><div class="compare"><figure><a href="observation-before.jpg"><img loading="lazy" src="observation-before.jpg" alt="原版：自己的魚與教材混在同頁"></a><figcaption>原版：自己的魚與教材混在同頁</figcaption></figure><figure><a href="own-new.jpg"><img loading="lazy" src="own-new.jpg" alt="新版：預設先看自己的魚"></a><figcaption>新版：預設先看自己的魚</figcaption></figure></div><h3>主畫面</h3><div class="compare"><figure><a href="main-before.jpg"><img loading="lazy" src="main-before.jpg" alt="精修前"></a><figcaption>精修前</figcaption></figure><figure><a href="main-new.jpg"><img loading="lazy" src="main-new.jpg" alt="精修後：功能收納、背景與魚類美術"></a><figcaption>精修後：功能收納、背景與魚類美術</figcaption></figure></div><p><small>平板畫面是 Chromium 的尺寸與觸控模擬；並非實體 iPad 效能量測。完整結果及限制見工程報告。</small></p></main></html>
