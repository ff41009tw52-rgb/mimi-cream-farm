<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《天啊！我被香草包圍了》- 遊戲體驗</title>
    <!-- 引入 Noto Sans TC 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --color-grass: #65a30d;
            --color-sky: #38bdf8;
            --color-yellow: #facc15;
            --color-cream: #fbf8f1;
            --color-dark-green: #14532d;
            --color-player: #0284c7;
            --color-system: #475569;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        #game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; background-color: #000; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        .screen.active { opacity: 1; pointer-events: auto; }

        /* ================= 首頁 ================= */
        .home-bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: linear-gradient(135deg, #7dd3fc, #d9f99d); }
        .bg-image { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .home-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(125, 211, 252, 0.6) 0%, rgba(217, 249, 157, 0.6) 100%); z-index: 2; }
        .ui-layer { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 800px; padding: 0 2rem; }
        .game-logo { text-align: center; line-height: 1.2; margin-bottom: 3rem; text-shadow: 3px 3px 0 var(--color-dark-green), -3px 3px 0 var(--color-dark-green), 3px -3px 0 var(--color-dark-green), -3px -3px 0 var(--color-dark-green), 0px 6px 0 var(--color-dark-green), 0px 8px 15px rgba(0,0,0,0.5); transform: rotate(-2deg); }
        .title-small { font-size: clamp(2rem, 5vw, 3rem); color: var(--color-yellow); display: inline-block; margin-bottom: 0.5rem; transform: translateX(-15%); }
        .title-large { font-size: clamp(3rem, 8vw, 5.5rem); color: var(--color-cream); display: block; letter-spacing: 0.05em; }
        .btn-start { background-color: var(--color-grass); color: white; font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 900; padding: 1rem 3rem; border-radius: 999px; border: 4px solid white; box-shadow: 0 8px 0 #3f6212, 0 15px 20px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.1s ease; letter-spacing: 0.1em; text-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
        .btn-start:active { transform: translateY(8px); box-shadow: 0 0px 0 #3f6212, 0 5px 10px rgba(0,0,0,0.3); }
        .demo-subtitle { margin-top: 2rem; font-size: clamp(1rem, 2.5vw, 1.25rem); color: #fff; background: rgba(0,0,0,0.6); padding: 0.5rem 1.5rem; border-radius: 999px; letter-spacing: 0.05em; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); }
        
        .leaf-decoration { position: absolute; z-index: 3; opacity: 0.9; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2)); animation: float 6s ease-in-out infinite; }
        .leaf-1 { top: 10%; left: 15%; transform: rotate(-15deg); width: 8vw; max-width: 80px; animation-delay: 0s; }
        .leaf-2 { top: 20%; right: 10%; transform: rotate(25deg) scaleX(-1); width: 10vw; max-width: 100px; animation-delay: -2s; }
        .leaf-3 { bottom: 15%; left: 8%; transform: rotate(45deg); width: 12vw; max-width: 120px; animation-delay: -4s; }
        .leaf-4 { bottom: 10%; right: 15%; transform: rotate(-30deg); width: 9vw; max-width: 90px; animation-delay: -1s; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-20px) rotate(calc(var(--rot, 0deg) + 5deg)); } }

        /* ================= 主畫面 ================= */
        .game-bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: opacity 0.3s ease; }
        .bg-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e293b, #334155); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.5); font-size: 2rem; font-weight: 700; text-align: center; z-index: 0; }
        /* 背景些微動態感 */
        #main-bg-image { animation: slow-pan 30s alternate infinite ease-in-out; transform-origin: center; transform: scale(1.05); }
        @keyframes slow-pan { 0% { transform: scale(1.05) translateX(0); } 100% { transform: scale(1.05) translateX(-2%); } }
        
        /* 畫面變暗特效 */
        .effect-darken::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index: 5; pointer-events:none; transition: opacity 0.8s ease; opacity: 1; }
        #screen-game:not(.effect-darken)::after { opacity: 0; }
        
        /* 全黑 Fade 特效 */
        .effect-fadeout::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,1); z-index: 50; pointer-events:auto; transition: opacity 1.5s ease; opacity: 1; }
        #screen-game:not(.effect-fadeout)::after { opacity: 0; pointer-events:none;}

        .hud-container { position: absolute; top: 0; left: 0; width: 100%; padding: 1rem 1.5rem; z-index: 10; display: flex; justify-content: space-between; pointer-events: none; }
        @media (orientation: portrait) { .hud-container { top: 2.5rem; } }
        .hud-item { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(8px); padding: 0.5rem 1rem; border-radius: 999px; font-size: clamp(0.9rem, 2vw, 1.1rem); font-weight: 700; color: var(--color-dark-green); border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 4px 6px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 0.5rem; transition: all 0.3s ease; }

        /* ================= 對話框 ================= */
        .dialogue-wrapper { position: absolute; bottom: 3%; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1200px; height: 22%; min-height: 140px; z-index: 10; }
        .speaker-portrait {
            position: absolute;
            left: 1.25rem;
            bottom: calc(100% - 5px);
            width: clamp(170px, 22vw, 260px);
            max-height: 330px;
            object-fit: contain;
            z-index: 16;
            pointer-events: none;
            background: rgba(255,255,255,0.98);
            border: 3px solid rgba(255,255,255,0.92);
            border-bottom: 0;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 10px 24px rgba(0,0,0,0.32);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .speaker-portrait.hidden { display: none; }
        .dialogue-wrapper.has-portrait .choices-container { width: min(62%, 720px); left: 64%; }
        @media (max-width: 768px) {
            .speaker-portrait { left: 0.2rem; width: 155px; max-height: 230px; bottom: calc(100% - 3px); }
            .dialogue-wrapper.has-portrait .choices-container { width: 65%; left: 66%; }
        }
        .dialogue-box { position: relative; width: 100%; height: 100%; background: rgba(20, 83, 45, 0.85); backdrop-filter: blur(8px); border: 3px solid rgba(255, 255, 255, 0.6); border-radius: 16px; padding: 2rem 2.5rem 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; cursor: pointer; }
        .character-name { position: absolute; top: -20px; left: 2rem; background-color: var(--color-grass); color: white; font-size: clamp(1.2rem, 2.5vw, 1.5rem); font-weight: 900; padding: 0.4rem 1.5rem; border-radius: 12px; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); letter-spacing: 0.05em; transition: background-color 0.3s; }
        .character-name.type-player { background-color: var(--color-player); }
        .character-name.type-system { background-color: var(--color-system); border-radius: 6px; }
        .character-name.hidden { display: none; }
        .dialogue-text { color: var(--color-cream); font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; line-height: 1.6; letter-spacing: 0.05em; flex-grow: 1; overflow-y: auto; }
        .dialogue-text.type-player { font-style: italic; color: #e0f2fe; }
        .continue-indicator { position: absolute; bottom: 1rem; right: 2rem; color: var(--color-yellow); font-size: 1.5rem; animation: bounce 1s infinite; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .continue-indicator.show { opacity: 1; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

        /* ================= 選項系統 ================= */
        .choices-container { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); width: 85%; max-width: 800px; display: flex; flex-direction: column; gap: 1rem; z-index: 15; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s; padding-bottom: 2rem; }
        .choices-container.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
        .choice-btn { background: rgba(255, 255, 255, 0.95); border: 3px solid var(--color-grass); border-radius: 16px; padding: 1rem 2rem; font-size: clamp(1.1rem, 2.5vw, 1.5rem); font-weight: 700; color: var(--color-dark-green); text-align: left; box-shadow: 0 6px 15px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; line-height: 1.4; }
        .choice-btn:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); border-color: #4d7c0f; }
        .choice-btn.selected { background: var(--color-grass); color: white; border-color: white; }
        .choice-btn.disabled { pointer-events: none; opacity: 0.6; }
        .choice-label { display: inline-block; background: var(--color-yellow); color: #854d0e; padding: 0.2rem 0.8rem; border-radius: 8px; margin-right: 1rem; font-weight: 900; flex-shrink: 0; }

        /* ================= 系統 Toast ================= */
        #toast-container { position: fixed; top: 15%; right: 5%; z-index: 100; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
        .toast-msg { background: rgba(15, 23, 42, 0.85); color: white; padding: 1rem 1.5rem; border-radius: 8px; border-left: 6px solid var(--color-yellow); font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 700; backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-msg.show { transform: translateX(0); }
        .toast-msg strong { color: var(--color-yellow); display: block; margin-bottom: 0.2rem; }

        /* ================= 系統 Overlay ================= */
        .system-overlay-bg { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 50; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.4s; backdrop-filter: blur(4px); }
        .system-overlay-bg.active { opacity:1; pointer-events:auto; }
        .overlay-content { text-align: center; color: white; padding: 3rem; border: 2px dashed rgba(255,255,255,0.4); border-radius: 16px; background: rgba(20, 83, 45, 0.5); max-width: 80%; }
        .overlay-content h2 { color: var(--color-yellow); font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 1rem; letter-spacing: 0.1em; }
        .overlay-content p { font-size: clamp(1.2rem, 2.5vw, 1.8rem); font-weight: 700; line-height: 1.6; }
        .btn-continue-overlay { margin-top: 2rem; background: transparent; border: 2px solid white; color: white; padding: 0.5rem 2rem; border-radius: 999px; font-size: 1.2rem; cursor: pointer; transition: background 0.2s; }
        .btn-continue-overlay:hover { background: rgba(255,255,255,0.2); }

        /* ================= 影片 Placeholder ================= */
        .video-placeholder-bg { position: absolute; top:0; left:0; width:100%; height:100%; background:#1e293b; z-index: 60; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.5s; overflow:hidden;}
        .video-placeholder-bg.active { opacity:1; pointer-events:auto; }
        .vp-bg-anim { position: absolute; top:0; left:0; width:200%; height:100%; background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%); animation: slide-bg 4s linear infinite; z-index: 1;}
        @keyframes slide-bg { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .vp-content { text-align: center; color: white; width: 60%; position: relative; z-index: 2; }
        .vp-content h2 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 1rem; }
        .vp-content p { font-size: 1.2rem; margin-bottom: 2rem; color: #cbd5e1;}
        .vp-progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; position: relative; }
        .vp-progress-fill { position: absolute; top:0; left:0; height:100%; background: var(--color-grass); width: 0%; animation: load-progress linear forwards; }
        .video-placeholder-bg.active .vp-progress-fill { animation-duration: 4s; }
        @keyframes load-progress { 0% { width: 0%; } 100% { width: 100%; } }

        /* ================= Bad End ================= */
        #bad-end-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: #000; z-index: 100; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.8s; color: white; }
        #bad-end-screen.active { opacity:1; pointer-events:auto; }
        .be-title { color: #ef4444; font-size: clamp(3rem, 6vw, 4rem); font-weight: 900; margin-bottom: 1rem; letter-spacing: 0.1em; text-shadow: 2px 2px 0 rgba(255,0,0,0.3); }
        .be-subtitle { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 0.5rem; color: #fca5a5; }
        .be-desc { font-size: 1.2rem; margin-bottom: 3rem; color: #9ca3af; }

        /* ================= Demo End ================= */
        #demo-end-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(135deg, #0f172a, #1e293b); z-index: 100; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 1s; color: white; }
        #demo-end-screen.active { opacity:1; pointer-events:auto; }
        .de-logo { color: var(--color-cream); font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; margin-bottom: 0.5rem; }
        .de-title { color: var(--color-yellow); font-size: clamp(3rem, 6vw, 5rem); font-weight: 900; margin-bottom: 2rem; letter-spacing: 0.2em; text-shadow: 0 0 20px rgba(250,204,21,0.5); }
        .de-stats { background: rgba(0,0,0,0.4); padding: 2rem 4rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 2rem; text-align: left; }
        .de-stats p { font-size: 1.5rem; margin: 0.5rem 0; color: #e2e8f0; display: flex; justify-content: space-between; gap: 2rem;}
        .de-stats p span { color: var(--color-sky); font-weight: 700; }
        .de-btns { display: flex; gap: 1rem; }

        /* 開發測試用：上一部 / 回首頁 */
        .dev-nav { position: absolute; top: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; z-index: 20; pointer-events: auto; }
        .dev-btn-home, .dev-btn-back { background: rgba(0, 0, 0, 0.6); color: white; border: 1px solid rgba(255,255,255,0.5); padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.9rem; cursor: pointer; pointer-events: auto; white-space: nowrap; }
        .dev-btn-home:hover, .dev-btn-back:hover { background: rgba(20, 83, 45, 0.9); }
        .dev-btn-back:disabled { opacity: 0.35; cursor: not-allowed; }

    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- ==================== 首頁 ==================== -->
        <div id="screen-home" class="screen active">
            <div class="home-bg-layer">
                <img class="bg-image" src="picture/herb-game/scene-00-minan-school-cover.jpg" alt="民安國小" onerror="this.style.display='none'">
            </div>
            <div class="home-overlay"></div>
            <svg class="leaf-decoration leaf-1" style="--rot: -15deg;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C12 2 4 4 4 12C4 20 12 22 12 22C12 22 20 20 20 12C20 4 12 2 12 2Z" fill="#65a30d" stroke="#3f6212" stroke-width="1"/><path d="M12 22V12" stroke="#3f6212" stroke-width="1.5" stroke-linecap="round"/></svg>
            <svg class="leaf-decoration leaf-2" style="--rot: 25deg;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 4C20 4 12 2 6 8C0 14 4 22 4 22C4 22 12 24 18 18C24 12 20 4 20 4Z" fill="#84cc16" stroke="#4d7c0f" stroke-width="1"/><path d="M4 22L14 12" stroke="#4d7c0f" stroke-width="1.5" stroke-linecap="round"/></svg>
            <div class="ui-layer">
                <h1 class="game-logo"><span class="title-small">天啊！</span><br><span class="title-large">我被香草包圍了</span></h1>
                <button id="btn-start" class="btn-start">開始遊戲</button>
                <p class="demo-subtitle">校園香草園互動體驗 Demo</p>
            </div>
        </div>

        <!-- ==================== 主遊戲畫面 ==================== -->
        <div id="screen-game" class="screen">
            
            <!-- 場景背景 -->
            <div class="game-bg-layer">
                <div class="bg-placeholder" id="bg-placeholder"></div>
                <img class="bg-image" id="main-bg-image" style="position: relative; z-index: 1;" src="" alt="場景">
            </div>

            <!-- HUD -->
            <div class="hud-container">
                <div class="hud-item"><span style="font-size: 1.2em;">🕒</span> 星期三 <span id="hud-time">07:45</span> <span id="hud-location" style="font-size: 0.8em; margin-left:8px; opacity:0.8;">民安國小</span></div>
                <div class="dev-nav">
                    <button id="btn-back-step" class="dev-btn-back" disabled>← 回到上一步</button>
                    <button id="btn-back-home" class="dev-btn-home">↺ 回首頁測試</button>
                </div>
                <div class="hud-item"><span style="font-size: 1.2em;">🌿</span> 香草園探索度 <span id="hud-exploration">0%</span></div>
            </div>

            <!-- Toast 容器 -->
            <div id="toast-container"></div>

            <!-- 對話區 -->
            <div class="dialogue-wrapper">
                <div class="choices-container" id="choices-container"></div>
                <img class="speaker-portrait hidden" id="speaker-portrait" alt="陳冠瑋老師人物立繪">
                
                <div class="dialogue-box" id="dialogue-box">
                    <div class="character-name" id="char-name"></div>
                    <div class="dialogue-text" id="dialogue-text"></div>
                    <div class="continue-indicator" id="continue-icon">▼</div>
                </div>
            </div>

            <!-- 全螢幕系統 Overlay -->
            <div class="system-overlay-bg" id="system-overlay"></div>
            
            <!-- 影片過場 Placeholder -->
            <div class="video-placeholder-bg" id="video-placeholder"></div>

        </div>

        <!-- ==================== Bad End 畫面 ==================== -->
        <div id="bad-end-screen">
            <h1 class="be-title">BAD END</h1>
            <h2 class="be-subtitle">《香草園消失之日》</h2>
            <p class="be-desc">這不是我們說的整理。<br><span style="font-size: 0.8em;">(看到綠色植物之前，請先確認它到底是誰。)</span></p>
            <button id="btn-be-retry" class="btn-start" style="font-size: 1.5rem;">重新選擇</button>
        </div>

        <!-- ==================== Demo End 畫面 ==================== -->
        <div id="demo-end-screen">
            <h2 class="de-logo">《天啊！我被香草包圍了》</h2>
            <h1 class="de-title">DEMO END</h1>
            <div class="de-stats">
                <p>香草園探索度 <span id="de-exp">10%</span></p>
                <p>已認識人物 <span id="de-chars">2</span></p>
                <p>完成任務 <span id="de-quests">1</span></p>
            </div>
            <p style="margin-bottom: 2rem; color: #94a3b8; letter-spacing: 0.2em;">未完待續……</p>
            <div class="de-btns">
                <button id="btn-de-restart" class="btn-start" style="font-size: 1.5rem; background: var(--color-player); border-color: var(--color-sky);">重新體驗</button>
                <button id="btn-de-home" class="btn-start" style="font-size: 1.5rem; background: transparent; color: white;">回到首頁</button>
            </div>
        </div>

    </div>

    <!-- ==================== JavaScript 整合區 ==================== -->
    <script>
        /**
         * 1. 故事資料庫 (STORY_DATA)
         */
        const STORY_DATA = {
            initialScene: "scene01_01",
            nodes: {
                // ==========================================
                // Scene 01: 校門口
                // ==========================================
                "scene01_01": { type: "dialogue", sceneImage: "picture/herb-game/scene-01-school-gate.jpg", fallbackImage: "picture/herb-game/scene-00-minan-school-cover.jpg", speaker: "我", speakerType: "player", text: "今天也是普通的一天。", next: "scene01_02" },
                "scene01_02": { type: "dialogue", speaker: "我", speakerType: "player", text: "書包有帶。", next: "scene01_03" },
                "scene01_03": { type: "dialogue", speaker: "我", speakerType: "player", text: "水壺有帶。", next: "scene01_04" },
                "scene01_04": { type: "dialogue", speaker: "我", speakerType: "player", text: "總覺得……", next: "scene01_05" },
                "scene01_05": {
                    type: "dialogue", speaker: "我", speakerType: "player", text: "好像忘了什麼？",

        /**
         * 2. 遊戲核心引擎 (GameEngine)
         */
        class GameEngine {
            constructor() {
                this.dom = {
                    screenHome: document.getElementById('screen-home'),
                    screenGame: document.getElementById('screen-game'),
                    btnStart: document.getElementById('btn-start'),
                    btnBackStep: document.getElementById('btn-back-step'),
                    btnBackHome: document.getElementById('btn-back-home'),
                    bgImage: document.getElementById('main-bg-image'),
                    bgPlaceholder: document.getElementById('bg-placeholder'),
                    hudTime: document.getElementById('hud-time'),
                    hudLocation: document.getElementById('hud-location'),
                    hudExploration: document.getElementById('hud-exploration'),
                    dialogueBox: document.getElementById('dialogue-box'),
                    charName: document.getElementById('char-name'),
                    dialogueText: document.getElementById('dialogue-text'),
                    speakerPortrait: document.getElementById('speaker-portrait'),
                    continueIcon: document.getElementById('continue-icon'),
                    choicesContainer: document.getElementById('choices-container'),
                    toastContainer: document.getElementById('toast-container'),
                    systemOverlay: document.getElementById('system-overlay'),
                    videoPlaceholder: document.getElementById('video-placeholder'),
                    badEndScreen: document.getElementById('bad-end-screen'),
                    demoEndScreen: document.getElementById('demo-end-screen')
                };

                // 核心變數
                this.currentNodeId = null;
                this.isTyping = false;
                this.typeInterval = null;
                this.currentFullText = "";
                this.isShowingChoices = false;
                this.isProcessingEvent = false; 
                this.currentBgPath = "";

                // 測試用「回到上一步」歷史紀錄
                this.history = [];
                this.tempResponseCounter = 0;
                
                // 遊戲狀態紀錄
                this.gameState = {
                    credibility: 0,
                    exploration: 0,
                    observation: 0,
                    unlockedChars: new Set(),
                    questsCompleted: 0
                };

                this.initEvents();
            }

            initEvents() {
                this.dom.btnStart.addEventListener('click', () => {
                    this.dom.screenHome.classList.remove('active');
                    this.dom.screenGame.classList.add('active');
                    this.startGame();
                });

                this.dom.btnBackStep.addEventListener('click', () => {
                    this.goBackOneStep();
                });

                this.dom.btnBackHome.addEventListener('click', () => {
                    this.resetGameUI();
                    this.history = [];
                    this.updateBackButton();
                    this.dom.screenGame.classList.remove('active');
                    this.dom.screenHome.classList.add('active');
                });

                this.dom.dialogueBox.addEventListener('click', () => this.handleDialogueClick());

                // Bad End 重新選擇
                document.getElementById('btn-be-retry').addEventListener('click', () => {
                    this.dom.badEndScreen.classList.remove('active');
                    this.isProcessingEvent = false;
                    this.dom.dialogueBox.parentElement.style.display = 'block'; 
                    this.loadNode(STORY_DATA.nodes[this.currentNodeId].returnNode); // 從 Bad End 節點讀取回去的節點
                });

                // Demo End 按鈕
                document.getElementById('btn-de-restart').addEventListener('click', () => {
                    this.dom.demoEndScreen.classList.remove('active');
                    this.startGame(); // 完全重製並開始
                });
                document.getElementById('btn-de-home').addEventListener('click', () => {
                    this.dom.demoEndScreen.classList.remove('active');
                    this.resetGameUI();
                    this.dom.screenGame.classList.remove('active');
                    this.dom.screenHome.classList.add('active');
                });
            }

            resetGameUI() {
                this.dom.screenGame.classList.remove('effect-fadeout');
                this.dom.screenGame.classList.remove('effect-darken');
                this.dom.badEndScreen.classList.remove('active');
                this.dom.demoEndScreen.classList.remove('active');
                this.dom.systemOverlay.classList.remove('active');
                this.dom.videoPlaceholder.classList.remove('active');
            }

            startGame() {
                this.resetGameUI();
                // 初始化狀態
                this.gameState = { credibility: 0, exploration: 0, observation: 0, unlockedChars: new Set(), questsCompleted: 0 };
                this.history = [];
                this.tempResponseCounter = 0;
                this.currentNodeId = null;
                this.currentBgPath = "";
                this.dom.hudTime.innerHTML = '07:45';
                this.dom.hudLocation.innerHTML = '民安國小';
                this.dom.hudExploration.innerHTML = '0%';
                this.updateBackButton();
                
                this.loadNode(STORY_DATA.initialScene, { skipHistory: true });
            }

            cloneGameState() {
                return {
                    credibility: this.gameState.credibility,
                    exploration: this.gameState.exploration,
                    observation: this.gameState.observation,
                    unlockedChars: new Set(this.gameState.unlockedChars),
                    questsCompleted: this.gameState.questsCompleted
                };
            }

            pushHistorySnapshot() {
                if (!this.currentNodeId || !STORY_DATA.nodes[this.currentNodeId]) return;

                this.history.push({
                    nodeId: this.currentNodeId,
                    gameState: this.cloneGameState(),
                    hudTime: this.dom.hudTime.innerText,
                    hudLocation: this.dom.hudLocation.innerText,
                    hudExploration: this.dom.hudExploration.innerText,
                    currentBgPath: this.currentBgPath,
                    bgImageSrc: this.dom.bgImage.getAttribute('src') || '',
                    bgImageDisplay: this.dom.bgImage.style.display,
                    bgPlaceholderDisplay: this.dom.bgPlaceholder.style.display,
                    bgPlaceholderHTML: this.dom.bgPlaceholder.innerHTML
                });

                // 避免長時間測試造成紀錄無限增加
                if (this.history.length > 200) this.history.shift();
                this.updateBackButton();
            }

            updateBackButton() {
                if (!this.dom.btnBackStep) return;
                this.dom.btnBackStep.disabled = this.history.length === 0;
            }

            restoreBackgroundSnapshot(snapshot) {
                this.currentBgPath = snapshot.currentBgPath || '';
                this.dom.bgImage.src = snapshot.bgImageSrc || '';
                this.dom.bgImage.style.display = snapshot.bgImageDisplay || 'block';
                this.dom.bgPlaceholder.style.display = snapshot.bgPlaceholderDisplay || 'none';
                this.dom.bgPlaceholder.innerHTML = snapshot.bgPlaceholderHTML || '';
                document.querySelector('.game-bg-layer').style.opacity = 1;
            }

            goBackOneStep() {
                if (this.history.length === 0) return;

                clearInterval(this.typeInterval);
                this.isTyping = false;
                this.isShowingChoices = false;
                this.isProcessingEvent = false;
                this.dom.choicesContainer.classList.remove('show');
                this.dom.systemOverlay.classList.remove('active');
                this.dom.videoPlaceholder.classList.remove('active');
                this.dom.badEndScreen.classList.remove('active');
                this.dom.demoEndScreen.classList.remove('active');
                this.dom.screenGame.classList.remove('effect-fadeout', 'effect-darken');
                this.dom.dialogueBox.parentElement.style.display = 'block';

                const snapshot = this.history.pop();
                this.gameState = {
                    credibility: snapshot.gameState.credibility,
                    exploration: snapshot.gameState.exploration,
                    observation: snapshot.gameState.observation,
                    unlockedChars: new Set(snapshot.gameState.unlockedChars),
                    questsCompleted: snapshot.gameState.questsCompleted
                };
                this.dom.hudTime.innerText = snapshot.hudTime;
                this.dom.hudLocation.innerText = snapshot.hudLocation;
                this.dom.hudExploration.innerText = snapshot.hudExploration;
                this.restoreBackgroundSnapshot(snapshot);

                this.loadNode(snapshot.nodeId, {
                    skipHistory: true,
                    skipSideEffects: true,
                    skipEffects: true,
                    skipBackground: true
                });
                this.updateBackButton();
            }

            loadNode(nodeId, options = {}) {
                const {
                    skipHistory = false,
                    skipSideEffects = false,
                    skipEffects = false,
                    skipBackground = false
                } = options;

                if (!nodeId || !STORY_DATA.nodes[nodeId]) {
                    console.error(`Story node [${nodeId}] not found.`);
                    return;
                }

                if (!skipHistory && this.currentNodeId && this.currentNodeId !== nodeId) {
                    this.pushHistorySnapshot();
                }

                const node = STORY_DATA.nodes[nodeId];
                this.currentNodeId = nodeId;
                this.isProcessingEvent = false;
                this.updateBackButton();
                
                // 特殊節點處理
                if (node.type === 'bad_end') { this.showBadEnd(); return; }
                if (node.type === 'demo_end') { this.showDemoEnd(); return; }

                // 背景切換與特效
                if (!skipBackground && node.sceneImage) this.updateBackground(node.sceneImage, node.fallbackImage);
                if (!skipEffects) {
                    if (node.effect === "flash-dark") this.triggerScreenEffect('flash-dark');
                    if (node.effect === "fade-out") this.triggerScreenEffect('fade-out');
                    if (node.effect === "darken") this.triggerScreenEffect('darken');
                }
                
                // HUD 更新
                if (node.updateTime) this.dom.hudTime.innerText = node.updateTime;
                if (node.updateLocation) this.dom.hudLocation.innerText = node.updateLocation;

                // 畫面類型渲染
                switch (node.type) {
                    case "dialogue": this.showDialogue(node); break;
                    case "systemOverlay": this.showSystemOverlay(node); break;
                    case "video_placeholder": this.showVideoPlaceholder(node); break;
                }
                
                // 事件處理 / 狀態變數增減
                // 回到上一步時略過副作用，避免 Toast、解鎖、探索度等重複累加
                if (!skipSideEffects) {
                    if (node.toast) this.showToast(node.toast);
                    if (node.characterUnlock && !this.gameState.unlockedChars.has(node.characterUnlock)) {
                        this.gameState.unlockedChars.add(node.characterUnlock);
                        this.showToast({ title: "【人物資料更新】", message: node.characterUnlock, duration: 2500 });
                    }
                    if (node.regionUnlock) {
                        this.showSystemOverlay({ title: "【新區域解鎖】", text: node.regionUnlock, duration: 2000, next: node.next, isAuto: true });
                    }
                    if (node.missionUpdate) this.showMissionOverlay(node.missionUpdate, false);
                    if (node.missionComplete) {
                        this.gameState.questsCompleted++;
                        this.showMissionOverlay(node.missionComplete, true);
                    }
                    
                    if (node.addObservation) {
                        this.gameState.observation += node.addObservation;
                        this.showToast({ title: "【系統】", message: `觀察力 +${node.addObservation}`, duration: 2000 });
                    }
                    if (node.addExploration) {
                        this.gameState.exploration += node.addExploration;
                        this.dom.hudExploration.innerText = `${this.gameState.exploration}%`;
                        setTimeout(() => {
                            this.showToast({ title: "【系統】", message: `香草園探索度 +${node.addExploration}%`, duration: 2500 });
                        }, 500); // 稍微錯開 Toast
                    }
                }
            }

            updateBackground(imagePath, fallbackPath) {
                if (this.currentBgPath === imagePath) return; 
                
                const gameBgLayer = document.querySelector('.game-bg-layer');
                gameBgLayer.style.opacity = 0;
                
                setTimeout(() => {
                    if (imagePath.startsWith("PLACEHOLDER")) {
                        this.dom.bgImage.style.display = 'none';
                        this.dom.bgPlaceholder.style.display = 'flex';
                        const num = imagePath.split('_')[2];
                        this.dom.bgPlaceholder.innerHTML = `<div>SCENE ${num}<br><span style="font-size: 1rem;">正式素材待替換</span></div>`;
                    } else {
                        const img = new Image();
                        img.onload = () => {
                            this.dom.bgImage.src = imagePath;
                            this.dom.bgImage.style.display = 'block';
                            this.dom.bgPlaceholder.style.display = 'none';
                        };
                        img.onerror = () => {
                            if (fallbackPath && fallbackPath.startsWith("PLACEHOLDER_SCENE_12")) {
                                this.dom.bgImage.style.display = 'none';
                                this.dom.bgPlaceholder.style.display = 'flex';
                                this.dom.bgPlaceholder.innerHTML = `<div>SCENE 12<br>民安國小香草園<br><span style="font-size: 1rem;">正式照片待替換</span></div>`;
                            } else if (fallbackPath && fallbackPath.startsWith("PLACEHOLDER_SCENE_14")) {
                                this.dom.bgImage.style.display = 'none';
                                this.dom.bgPlaceholder.style.display = 'flex';
                                this.dom.bgPlaceholder.innerHTML = `<div style="display:flex; width:100%; height:100%;">
                                    <div style="flex:1; border-right:2px dashed #fff; display:flex; align-items:center; justify-content:center;">左側植物</div>
                                    <div style="flex:1; display:flex; align-items:center; justify-content:center;">右側植物</div>
                                </div><div style="position:absolute; top:20%; width:100%; font-size:1rem;">正式植物判斷照片待補</div>`;
                            } else if (fallbackPath) {
                                 this.dom.bgImage.src = fallbackPath;
                                 this.dom.bgImage.style.display = 'block';
                                 this.dom.bgPlaceholder.style.display = 'none';
                            } else {
                                 this.dom.bgImage.style.display = 'none';
                                 this.dom.bgPlaceholder.style.display = 'flex';
                                 this.dom.bgPlaceholder.innerHTML = `<div>照片待載入<br><span style="font-size: 0.8rem;">(路徑: ${imagePath})</span></div>`;
                            }
                        };
                        img.src = imagePath; 
                    }
                    this.currentBgPath = imagePath;
                    gameBgLayer.style.opacity = 1;
                }, 300); 
            }

            triggerScreenEffect(type) {
                const gameScreen = this.dom.screenGame;
                if(type === 'flash-dark') {
                    gameScreen.classList.add('effect-darken');
                    setTimeout(() => gameScreen.classList.remove('effect-darken'), 800);
                } else if (type === 'fade-out') {
                    gameScreen.classList.add('effect-fadeout');
                    // 自動移除由下一個節點邏輯控制，或是保持全黑直到場景切換
                    setTimeout(() => gameScreen.classList.remove('effect-fadeout'), 1500); 
                } else if (type === 'darken') {
                    gameScreen.classList.add('effect-darken'); // 長期變暗，不用 setTimeout 移除
                }
            }

            getPortraitForNode(node) {
                if (!node || node.speaker !== "陳冠瑋老師") return null;

                const text = node.text || "";
                const surprisedTexts = ["等等——"];
                const thinkingTexts = [
                    "那邊那位同學。",
                    "你是不是剛到？",
                    "是嗎？",
                    "至少你有趕過來。",
                    "……巡視校園？",
                    "好。",
                    "那你等等就順便巡視一下香草園。"
                ];

                if (surprisedTexts.some(t => text.includes(t))) {
                    return "picture/herb-game/characters/chen-guanwei-surprised.jpg?v=20260906-portrait-fix";
                }
                if (thinkingTexts.some(t => text.includes(t))) {
                    return "picture/herb-game/characters/chen-guanwei-thinking.jpg?v=20260906-portrait-fix";
                }
                return "picture/herb-game/characters/chen-guanwei-normal.jpg?v=20260906-portrait-fix";
            }

            updateSpeakerPortrait(node) {
                const portraitEl = this.dom.speakerPortrait;
                const wrapperEl = this.dom.dialogueBox.parentElement;
                const portraitPath = this.getPortraitForNode(node);

                if (portraitPath) {
                    portraitEl.src = portraitPath;
                    portraitEl.classList.remove('hidden');
                    wrapperEl.classList.add('has-portrait');
                } else {
                    portraitEl.removeAttribute('src');
                    portraitEl.classList.add('hidden');
                    wrapperEl.classList.remove('has-portrait');
                }
            }

            showDialogue(node) {
                this.dom.systemOverlay.classList.remove('active');
                this.dom.videoPlaceholder.classList.remove('active');
                this.dom.dialogueBox.parentElement.style.display = 'block';
                this.dom.choicesContainer.classList.remove('show');
                
                this.isShowingChoices = false;
                this.currentFullText = node.text;
                this.updateSpeakerPortrait(node);
                
                const charEl = this.dom.charName;
                const textEl = this.dom.dialogueText;
                
                if (node.speaker) {
                    charEl.textContent = node.speakerType === 'system' ? `【${node.speaker}】` : node.speaker;
                    charEl.classList.remove('hidden', 'type-player', 'type-system');
                    textEl.classList.remove('type-player');
                    
                    if (node.speakerType === 'player') {
                        charEl.classList.add('type-player');
                        textEl.classList.add('type-player');
                    } else if (node.speakerType === 'system') {
                        charEl.classList.add('type-system');
                    }
                } else {
                    charEl.classList.add('hidden');
                }

                this.dom.dialogueText.innerHTML = "";
                this.dom.continueIcon.classList.remove('show');
                this.isTyping = true;
                
                let charIndex = 0;
                clearInterval(this.typeInterval);
                
                this.typeInterval = setInterval(() => {
                    if (charIndex < this.currentFullText.length) {
                        this.dom.dialogueText.innerHTML += this.currentFullText.charAt(charIndex);
                        charIndex++;
                    } else {
                        this.finishTyping(node);
                    }
                }, 30);
            }

            finishTyping(node) {
                clearInterval(this.typeInterval);
                this.dom.dialogueText.innerHTML = this.currentFullText;
                this.isTyping = false;
                
                if (node.choices) {
                    this.showChoices(node.choices);
                } else {
                    this.dom.continueIcon.classList.add('show');
                }
            }
            
            handleDialogueClick() {
                if (this.isProcessingEvent || this.isShowingChoices) return;
                const node = STORY_DATA.nodes[this.currentNodeId];

                if (this.isTyping) {
                    this.finishTyping(node);
                } else {
                    if (node.next) this.loadNode(node.next);
                }
            }

            showChoices(choices) {
                this.isShowingChoices = true;
                this.dom.continueIcon.classList.remove('show');
                this.dom.choicesContainer.innerHTML = '';
                
                choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerHTML = `<span class="choice-label">${choice.id}</span> ${choice.text}`;
                    btn.addEventListener('click', (e) => this.handleChoiceSelection(choice, btn, e));
                    this.dom.choicesContainer.appendChild(btn);
                });
                
                this.dom.choicesContainer.classList.add('show');
            }
            
            handleChoiceSelection(choice, clickedBtn, event) {
                event.stopPropagation(); 
                if (!this.isShowingChoices) return;

                // 選擇前先保存目前節點與狀態，方便「回到上一步」真正回到選擇前
                this.pushHistorySnapshot();
                this.isShowingChoices = false;
                
                if (choice.credibilityChange) {
                    this.gameState.credibility += choice.credibilityChange;
                    const sign = choice.credibilityChange > 0 ? "+" : "";
                    this.showToast({ title: "【可信度變化】", message: `可信度 ${sign}${choice.credibilityChange}`, duration: 2000 });
                }

                const allBtns = this.dom.choicesContainer.querySelectorAll('.choice-btn');
                allBtns.forEach(btn => {
                    if (btn === clickedBtn) btn.classList.add('selected');
                    else btn.classList.add('disabled');
                });
                
                setTimeout(() => {
                    this.dom.choicesContainer.classList.remove('show');
                    if (choice.response) {
                        const tempId = `_tempResponse_${++this.tempResponseCounter}`;
                        STORY_DATA.nodes[tempId] = choice.response;
                        this.loadNode(tempId, { skipHistory: true });
                    } else if (choice.next) {
                        this.loadNode(choice.next, { skipHistory: true });
                    }
                }, 350);
            }

            showToast(toastData) {
                const toastEl = document.createElement('div');
                toastEl.className = 'toast-msg';
                toastEl.innerHTML = `<strong>${toastData.title}</strong><br>${toastData.message}`;
                this.dom.toastContainer.appendChild(toastEl);
                void toastEl.offsetWidth; 
                toastEl.classList.add('show');
                
                setTimeout(() => {
                    toastEl.classList.remove('show');
                    setTimeout(() => toastEl.remove(), 300);
                }, toastData.duration || 2000);
            }
            
            showSystemOverlay(node) {
                this.isProcessingEvent = true;
                this.dom.dialogueBox.parentElement.style.display = 'none'; 
                
                const overlay = this.dom.systemOverlay;
                overlay.innerHTML = `
                    <div class="overlay-content">
                        <h2>${node.title}</h2>
                        <p>${node.text}</p>
                        ${node.isAuto ? '' : '<button id="btn-overlay-continue" class="btn-continue-overlay">我知道了</button>'}
                    </div>
                `;
                overlay.classList.add('active');
                
                if(node.isAuto) {
                    setTimeout(() => {
                        overlay.classList.remove('active');
                        if (node.next) this.loadNode(node.next);
                    }, node.duration || 2000);
                } else {
                    document.getElementById('btn-overlay-continue').addEventListener('click', () => {
                        overlay.classList.remove('active');
                        if (node.next) this.loadNode(node.next);
                    });
                }
            }

            showMissionOverlay(missionData, isComplete = false) {
                this.isProcessingEvent = true;
                this.dom.dialogueBox.parentElement.style.display = 'none'; 
                
                const overlay = this.dom.systemOverlay;
                let objHtml = missionData.objectives.map(obj => `<div style="text-align:left; margin: 0.5rem 0;">${obj}</div>`).join('');
                let borderColor = isComplete ? '#65a30d' : '#facc15'; // 完成為綠，接取為黃

                overlay.innerHTML = `
                    <div class="overlay-content mission-card" style="border-color: ${borderColor}; background: rgba(30, 41, 59, 0.9);">
                        <h2 style="color: var(--color-sky); font-size: 1.5rem;">${missionData.title}</h2>
                        <h3 style="font-size: 2.5rem; margin-bottom: 1.5rem; color: white;">${missionData.name}</h3>
                        <div style="font-size: 1.2rem; color: #cbd5e1; padding-left: 2rem;">
                            ${objHtml}
                        </div>
                        <button id="btn-mission-continue" class="btn-continue-overlay" style="border-color: var(--color-sky); color: var(--color-sky);">知道了</button>
                    </div>
                `;
                overlay.classList.add('active');
                
                document.getElementById('btn-mission-continue').addEventListener('click', () => {
                    overlay.classList.remove('active');
                    const currentNode = STORY_DATA.nodes[this.currentNodeId];
                    if (currentNode.next) this.loadNode(currentNode.next);
                });
            }
            
            showVideoPlaceholder(node) {
                this.isProcessingEvent = true;
                this.dom.dialogueBox.parentElement.style.display = 'none';
                
                const vp = this.dom.videoPlaceholder;
                vp.innerHTML = `
                    <div class="vp-bg-anim"></div>
                    <div class="vp-content">
                        <h2>${node.title}</h2>
                        <p>${node.subtitle}</p>
                        <div class="vp-progress-bar"><div class="vp-progress-fill"></div></div>
                    </div>
                `;
                vp.classList.add('active');
                
                setTimeout(() => {
                    vp.classList.remove('active');
                    if (node.next) this.loadNode(node.next);
                }, node.duration || 4000);
            }

            showBadEnd() {
                this.isProcessingEvent = true;
                this.dom.dialogueBox.parentElement.style.display = 'none';
                this.dom.badEndScreen.classList.add('active');
                // 重試邏輯綁定在 initEvents 中
            }

            showDemoEnd() {
                this.isProcessingEvent = true;
                this.dom.dialogueBox.parentElement.style.display = 'none';
                
                document.getElementById('de-exp').innerText = `${this.gameState.exploration}%`;
                document.getElementById('de-chars').innerText = this.gameState.unlockedChars.size;
                document.getElementById('de-quests').innerText = this.gameState.questsCompleted;
                
                this.dom.demoEndScreen.classList.add('active');
            }
        }

        // 啟動引擎
        window.addEventListener('DOMContentLoaded', () => {
            window.gameEngine = new GameEngine();
        });
    </script>
</body>
</html>
