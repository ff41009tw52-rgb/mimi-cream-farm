<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橘咪咪與白奶油的科學農場</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- 配色設定 --- */
        :root {
            --mimi-orange: #FF8C42;     /* 鮮豔橘 (橘咪咪) */
            --ragdoll-cream: #EFEBE9;   /* 布偶貓的奶油灰白色 */
            --mimi-light: #FFAD60;      /* 淺橘 */
            --cream-bg: #FFF9E6;        /* 背景底色 */
            --farm-green: #76B947;      /* 農場綠 */
            --soil-brown: #5D4037;      /* 文字深褐 */
        }

        body {
            font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif;
            background-color: var(--cream-bg);
            color: var(--soil-brown);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(#FFAD60 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 頂部招牌 */
        header {
            background-color: var(--mimi-orange);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 8px solid var(--farm-green);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative; 
            overflow: hidden; 
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            position: relative; 
            z-index: 2;
        }

        /* 副標題小字 */
        header .subtitle {
            margin-top: 15px;
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: bold;
            letter-spacing: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            position: relative;
            z-index: 2;
        }

        /* --- 裝飾圖片統一樣式 --- */
        .deco-img {
            border: 4px solid white;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            object-fit: cover;
        }
        .deco-img:hover {
            transform: scale(1.05) rotate(0deg) !important;
        }

        /* 左上角：迎賓貓 */
        .header-cat {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(-5deg);
            width: 140px; 
            height: auto;
            border-radius: 15px;
            z-index: 1; 
        }

        /* 左下角：頁尾貓 */
        .footer-cat {
            position: absolute;
            left: 20px;
            bottom: -15px; 
            width: 120px; 
            height: auto;
            border-radius: 15px 15px 15px 0; 
            transform: rotate(3deg);
            z-index: 1;
        }

        .cat-orange { color: #FFD700; filter: drop-shadow(2px 2px 0 #d35400); }
        .cat-ragdoll { color: var(--ragdoll-cream); filter: drop-shadow(2px 2px 0 #8D6E63); }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* --- 農場主人圓形頭像區 --- */
        .owners-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .owner-avatar { text-align: center; }

        .owner-link {
            display: block;
            text-decoration: none;
            cursor: pointer;
        }

        .owner-img-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--mimi-orange);
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
            margin: 0 auto 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .owner-link:hover .owner-img-box {
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--mimi-orange);
        }

        .owner-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .owner-name {
            font-weight: bold;
            color: var(--soil-brown);
        }

        /* --- 年級分類篩選按鈕區 --- */
        .filter-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: white;
            border: 3px solid var(--farm-green);
            color: var(--farm-green);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .filter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(118, 185, 71, 0.2);
        }

        .filter-btn.active {
            background-color: var(--farm-green);
            color: white;
            box-shadow: 0 4px 10px rgba(118, 185, 71, 0.4);
        }

        .filter-btn:focus-visible,
        .open-btn:focus-visible,
        .owner-link:focus-visible,
        .feedback-float-btn:focus-visible {
            outline: 4px solid #1F5D1F;
            outline-offset: 4px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* --- 農場田地網格 --- */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            padding: 10px 0;
        }

        /* 卡片設計 */
        .science-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid var(--mimi-light);
            box-shadow: 8px 8px 0px rgba(93, 64, 55, 0.1);
            transition: transform 0.3s, border-color 0.3s, opacity 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .science-card.hidden {
            display: none;
        }

        .science-card:hover {
            transform: translateY(-8px);
            border-color: var(--mimi-orange);
        }

        .card-icon-header {
            height: 150px;
            background-color: #FFF0D4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            color: var(--mimi-orange);
            border-bottom: 3px dashed var(--mimi-light);
            position: relative;
        }

        .grade-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: var(--mimi-orange);
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        .card-body { padding: 1.5rem; flex-grow: 1; }
        h3 { margin: 0 0 15px 0; color: var(--soil-brown); font-size: 1.4rem; }
        p.desc { margin: 0; color: #666; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }

        .open-btn {
            display: block; text-decoration: none; text-align: center;
            background-color: var(--farm-green); color: white; padding: 18px;
            font-size: 1.1rem; font-weight: bold; 
            transition: all 0.3s ease;
            position: relative;
        }
        .open-btn:hover { 
            background-color: #5da035; 
            letter-spacing: 1px;
        }
        .open-btn:active {
            background-color: #4a822a;
            transform: scale(0.98);
        }
        .open-btn i { 
            margin-left: 8px; 
            transition: transform 0.3s ease; 
            display: inline-block;
        }
        .open-btn:hover i { 
            transform: scale(1.2) rotate(-10deg); 
        }

        footer {
            margin-top: 40px;
            text-align: center; 
            padding: 40px 20px; 
            background-color: var(--soil-brown); 
            color: var(--cream-bg); 
            font-weight: bold;
            position: relative;
        }
        
        footer p {
            position: relative;
            z-index: 2;
        }

        .feedback-float-btn {
            position: fixed; 
            bottom: 30px;
            right: 30px;
            background-color: var(--mimi-orange);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 9999;
            border: 3px solid white;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-float-btn:hover {
            transform: scale(1.1) translateY(-5px);
            background-color: #FF7043;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

        @media (max-width: 900px) {
            .header-cat, .footer-cat {
                position: static; 
                display: block;
                margin: 10px auto; 
                transform: none;    
            }
            header { padding-top: 1rem; }
            footer {
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            .feedback-float-btn {
                padding: 12px 20px;
                font-size: 0.95rem;
                bottom: 20px;
                right: 20px;
            }
            .filter-btn {
                font-size: 1rem;
                padding: 8px 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="picture/welcome-cats.JPG" alt="歡迎光臨" class="deco-img header-cat" onerror="this.style.display='none'">
        <h1>
            <i class="fas fa-cat cat-orange" aria-hidden="true"></i>
            橘咪咪與白奶油的科學農場 
            <i class="fas fa-cat cat-ragdoll" aria-hidden="true"></i>
        </h1>
        <div class="subtitle">
            這裡種的不是胡蘿蔔，而是充滿智慧的科學知識！請點選下方農地開始學習。
        </div>
    </header>

    <div class="owners-section">
        <div class="owner-avatar">
            <a href="06.html" class="owner-link" title="點擊查看橘咪咪的介紹">
                <div class="owner-img-box">
                    <img src="picture/mimi-solo.JPG" alt="橘咪咪園長" onerror="this.src='https://via.placeholder.com/120x120?text=🐱'">
                </div>
            </a>
            <div class="owner-name"><i class="fas fa-paw cat-orange" aria-hidden="true"></i> 橘咪咪園長</div>
        </div>
        <div class="owner-avatar">
            <a href="06.html" class="owner-link" title="點擊查看白奶油的介紹">
                <div class="owner-img-box">
                    <img src="picture/cream-solo.JPG" alt="白奶油園長" onerror="this.src='https://via.placeholder.com/120x120?text=🐾'">
                </div>
            </a>
            <div class="owner-name"><i class="fas fa-paw cat-ragdoll" aria-hidden="true"></i> 白奶油園長</div>
        </div>
    </div>

    <div class="container">
        <!-- 過濾導覽列 -->
        <div class="filter-nav" role="group" aria-label="依年級篩選遊戲">
            <button class="filter-btn active" data-filter="all" aria-controls="game-grid">全部遊戲</button>
            <button class="filter-btn" data-filter="3" aria-controls="game-grid">三年級</button>
            <button class="filter-btn" data-filter="4" aria-controls="game-grid">四年級</button>
            <button class="filter-btn" data-filter="5" aria-controls="game-grid">五年級</button>
            <button class="filter-btn" data-filter="6" aria-controls="game-grid">六年級</button>
        </div>

        <p id="filter-status" class="sr-only" aria-live="polite"></p>

        <div class="farm-grid" id="game-grid">
            <noscript>
                <p>請啟用瀏覽器的 JavaScript，才能載入科學遊戲清單。</p>
            </noscript>
        </div> <!-- farm-grid end -->
    </div> <!-- container end -->

    <footer>
        <img src="picture/sleepy-cats.JPG" alt="休息一下" class="deco-img footer-cat" onerror="this.style.display='none'">
        <p>Created with ❤️ by 兩隻科學貓咪：橘咪咪與白奶油的主人</p>
    </footer>

    <a href="feedback.html" class="feedback-float-btn" title="有問題請找我們">
        <i class="fas fa-comment-dots" aria-hidden="true"></i> 回報問題
    </a>

    <script src="games-data.js"></script>
    <script src="games-renderer.js"></script>
</body>
</html>
