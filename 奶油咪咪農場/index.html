<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橘咪咪與白奶油的科學農場</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- 配色設定 --- */
        :root {
            --mimi-orange: #FF8C42;     /* 鮮豔橘 (橘咪咪) */
            --ragdoll-cream: #EFEBE9;   /* 布偶貓的奶油灰白色 */
            --mimi-light: #FFAD60;      /* 淺橘 */
            --cream-bg: #FFF9E6;        /* 背景底色 */
            --farm-green: #76B947;      /* 農場綠 */
            --soil-brown: #5D4037;      /* 文字深褐 */
        }

        body {
            font-family: "微軟正黑體", "Microsoft JhengHei", sans-serif;
            background-color: var(--cream-bg);
            color: var(--soil-brown);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(#FFAD60 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 頂部招牌 */
        header {
            background-color: var(--mimi-orange);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 8px solid var(--farm-green);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; /* 貓咪跟文字的距離 */
            flex-wrap: wrap; /* 手機版如果太擠會自動換行 */
        }

        /* 副標題小字 (原本的歡迎詞) */
        header .subtitle {
            margin-top: 15px;
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: bold;
            letter-spacing: 1px;
            background-color: rgba(255, 255, 255, 0.2); /* 半透明白色背景 */
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
        }

        /* 橘貓樣式 */
        .cat-orange {
            color: #FFD700;
            filter: drop-shadow(2px 2px 0 #d35400);
        }

        /* 布偶貓樣式 (無蝴蝶結版) */
        .cat-ragdoll {
            color: var(--ragdoll-cream); 
            /* 加深一點陰影，讓淺色貓在橘色背景上更立體，模擬布偶貓的蓬鬆感 */
            filter: drop-shadow(2px 2px 0 #8D6E63); 
        }

        .container {
            max-width: 1100px;
            margin: 30px auto; /* 調整了間距 */
            padding: 0 20px;
        }

        /* --- 農場田地網格 --- */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            padding: 10px 0;
        }

        /* 卡片設計 */
        .science-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid var(--mimi-light);
            box-shadow: 8px 8px 0px rgba(93, 64, 55, 0.1);
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .science-card:hover {
            transform: translateY(-8px);
            border-color: var(--mimi-orange);
        }

        .card-icon-header {
            height: 150px;
            background-color: #FFF0D4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            color: var(--mimi-orange);
            border-bottom: 3px dashed var(--mimi-light);
        }

        .card-body { padding: 1.5rem; flex-grow: 1; }
        h3 { margin: 0 0 15px 0; color: var(--soil-brown); font-size: 1.4rem; }
        p.desc { margin: 0; color: #666; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }

        /* 按鈕樣式 */
        .open-btn {
            display: block; text-decoration: none; text-align: center;
            background-color: var(--farm-green); color: white; padding: 18px;
            font-size: 1.1rem; font-weight: bold; transition: background-color 0.3s;
        }
        .open-btn:hover { background-color: #5da035; }
        .open-btn i { margin-left: 8px; }

        footer {
            margin-top: 60px; text-align: center; padding: 30px;
            background-color: var(--soil-brown); color: var(--cream-bg); font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <i class="fas fa-cat cat-orange"></i> 
            橘咪咪與白奶油的科學農場 
            <i class="fas fa-cat cat-ragdoll"></i>
        </h1>
        
        <div class="subtitle">
            這裡種的不是胡蘿蔔，而是充滿智慧的科學知識！請點選下方卡片開始學習。
        </div>
    </header>

    <div class="container">
        <div class="farm-grid">
            
            <div class="science-card">
                <div class="card-icon-header"><i class="fas fa-flask"></i></div>
                <div class="card-body">
                    <h3>🧪 酸鹼滴定</h3>
                    <p class="desc">就像農場土壤需要酸鹼平衡一樣，讓我們來學習如何知道溶液的酸鹼！</p>
                </div>
                <a href="https://gemini.google.com/share/7716072c630e" target="_blank" class="open-btn">
                    前往閱讀筆記 <i class="fas fa-external-link-alt"></i>
                </a>
            </div>

            <div class="science-card">
                <div class="card-icon-header"><i class="fas fa-boxes"></i></div>
                <div class="card-body">
                    <h3>📦 特性分類 (基礎)</h3>
                    <p class="desc">橘咪咪把農具分類整理好了！這份簡報將帶你認識物質的基本特性與分類方法。</p>
                </div>
                <a href="https://gemini.google.com/share/6b2c00db6902" target="_blank" class="open-btn">
                    前往閱讀筆記 <i class="fas fa-external-link-alt"></i>
                </a>
            </div>

            <div class="science-card">
                <div class="card-icon-header"><i class="fas fa-microscope"></i></div>
                <div class="card-body">
                    <h3>🚀 特性分類 (進階)</h3>
                    <p class="desc">白奶油發現了更深奧的分類學問！適合已經了解基礎概念的小小科學家挑戰。</p>
                </div>
                <a href="../02.html" target="_blank" class="open-btn">
                    前往閱讀筆記 <i class="fas fa-external-link-alt"></i>
                </a>
            </div>

            <div class="science-card">
                <div class="card-icon-header"><i class="fas fa-bolt"></i></div>
                <div class="card-body">
                    <h3>⚡ 電流磁效應</h3>
                    <p class="desc">不可思議的電與磁！與橘咪咪一起來探索電流如何產生磁場</p>
                </div>
                <a href="https://gemini.google.com/share/d107c017837b" target="_blank" class="open-btn">
                    前往閱讀筆記 <i class="fas fa-external-link-alt"></i>
                </a>
            </div>

        </div>
    </div>

    <footer>
        <p>Created with ❤️ by 兩隻科學貓咪：橘咪咪 與白奶油的主人
    </footer>

</body>

</html>
