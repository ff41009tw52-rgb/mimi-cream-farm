const { useState } = React;

function ChevronRight({ size = 16, className = '' }) {
  return (
    <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="m9 18 6-6-6-6" />
    </svg>
  );
}

function Menu({ size = 24, className = '' }) {
  return (
    <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  );
}

function X({ size = 24, className = '' }) {
  return (
    <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  );
}

const globalCss = `
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=IBM+Plex+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;600&display=swap');

  :root {
    --bg-dark: #161819;
    --bg-paper: #F2EFE7;
    --bg-paper-alt: #EBE7DC;
    --text-light: #E8E4DB;
    --text-dark: #2A2C2E;
    --text-muted-light: rgba(232, 228, 219, 0.55);
    --text-muted-dark: rgba(42, 44, 46, 0.65);
    --accent: #B98752;

    --border-light: rgba(120, 115, 105, 0.25);
    --border-dark: rgba(120, 115, 105, 0.4);
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-light);
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .font-serif-custom { font-family: 'Noto Serif TC', 'Cormorant Garamond', serif; }
  .font-sans-custom { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
  .font-mono-custom { font-family: 'IBM Plex Mono', monospace; }

  .bg-noise {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
  }

  .math-bg {
    position: absolute;
    color: rgba(255, 255, 255, 0.03);
    font-family: 'Cormorant Garamond', serif;
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    z-index: 0;
  }
`;

function App() {
  const [activeSection, setActiveSection] = useState('home');
  const [isMenuOpen, setIsMenuOpen] = useState(false);

  const navItems = [
    { id: 'home', label: '首頁' },
    { id: 'timeline', label: '生平紀事' },
    { id: 'achievements', label: '學術與成就' },
    { id: 'legacy', label: '歷史檔案' },
  ];

  const handleNav = (id) => {
    setActiveSection(id);
    setIsMenuOpen(false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const renderContent = () => {
    switch (activeSection) {
      case 'home':
        return <HomeSection onNavigate={() => handleNav('legacy')} />;
      case 'timeline':
        return <TimelineSection />;
      case 'achievements':
        return <AchievementsSection />;
      case 'legacy':
        return <LegacySection />;
      default:
        return <HomeSection onNavigate={() => handleNav('legacy')} />;
    }
  };

  return (
    <div className="min-h-screen flex flex-col font-sans-custom selection:bg-[var(--accent)] selection:text-white">
      <style dangerouslySetInnerHTML={{ __html: globalCss }} />
      <nav className="sticky top-0 z-50 bg-[var(--bg-dark)] border-b border-[var(--border-dark)] h-[68px]">
        <div className="max-w-[1400px] mx-auto px-6 h-full flex items-center justify-between">
          <div className="flex items-baseline gap-6">
            <div className="font-serif-custom text-xl tracking-[0.15em] text-[var(--text-light)]">OPPENHEIMER</div>
            <div className="hidden lg:block font-mono-custom text-[10px] tracking-widest text-[var(--text-muted-light)] uppercase">Archive Ref. JRO-1945</div>
          </div>

          <div className="hidden lg:flex items-center gap-5 xl:gap-8">
            {navItems.map((item) => (
              <button
                key={item.id}
                onClick={() => handleNav(item.id)}
                className={`font-sans-custom text-sm tracking-widest transition-colors duration-300 ${
                  activeSection === item.id
                    ? 'text-[var(--accent)] font-medium'
                    : 'text-[var(--text-muted-light)] hover:text-[var(--text-light)]'
                }`}
              >
                {item.label}
              </button>
            ))}
          </div>

          <button className="lg:hidden text-[var(--text-light)]" onClick={() => setIsMenuOpen(!isMenuOpen)} aria-label="切換選單">
            {isMenuOpen ? <X size={24} /> : <Menu size={24} />}
          </button>
        </div>
      </nav>

      {isMenuOpen && (
        <div className="lg:hidden fixed top-[68px] left-0 w-full bg-[var(--bg-dark)] border-b border-[var(--border-dark)] z-40 p-4 flex flex-col gap-4 shadow-2xl">
          {navItems.map((item) => (
            <button
              key={item.id}
              onClick={() => handleNav(item.id)}
              className={`text-left p-3 font-sans-custom tracking-widest text-sm border-l-2 ${
                activeSection === item.id
                  ? 'border-[var(--accent)] text-[var(--accent)] bg-white/5'
                  : 'border-transparent text-[var(--text-muted-light)]'
              }`}
            >
              {item.label}
            </button>
          ))}
        </div>
      )}

      <main className="flex-grow bg-[var(--bg-dark)] relative">{renderContent()}</main>
    </div>
  );
}

function HomeSection({ onNavigate }) {
  return (
    <div className="relative min-h-[calc(100vh-68px)] flex flex-col overflow-hidden bg-[var(--bg-dark)]">
      <div className="absolute inset-0 bg-noise opacity-80 pointer-events-none z-10"></div>
      <div className="math-bg text-[120px] top-[10%] -left-[5%] rotate-[-15deg]">iℏ ∂ψ/∂t = Ĥψ</div>
      <div className="math-bg text-[80px] bottom-[20%] right-[10%] rotate-[10deg]">E = mc²</div>
      <div className="math-bg text-[180px] top-[40%] right-[30%] opacity-50">∫</div>

      <div className="max-w-[1400px] mx-auto w-full px-6 flex-grow flex flex-col lg:flex-row relative z-20">
        <div className="w-full lg:w-[60%] flex flex-col justify-center pt-16 pb-12 lg:py-0 lg:pr-16 relative">
          <div className="flex flex-col gap-4 border-b border-[var(--border-dark)] pb-6 mb-12 w-full max-w-lg">
            <div className="font-mono-custom text-xs text-[var(--text-muted-light)] flex flex-col gap-2 tracking-[0.1em]">
              <div className="flex"><span className="w-24 opacity-60 shrink-0">FILE NO.</span> <span>40-1904-67</span></div>
              <div className="flex"><span className="w-24 opacity-60 shrink-0">SUBJECT</span> <span>BIOGRAPHICAL DOSSIER</span></div>
            </div>
            <div className="font-mono-custom text-[var(--classified)] text-sm font-bold tracking-[0.2em] border-2 border-[var(--classified)] px-3 py-1.5 w-fit uppercase -rotate-2 mt-2 mix-blend-screen opacity-90">TOP SECRET // RESTRICTED DATA</div>
          </div>

          <div className="mb-10">
            <h1 className="font-serif-custom text-5xl sm:text-6xl md:text-7xl lg:text-[84px] leading-[1.1] text-[var(--text-light)] font-medium mb-3 tracking-wide">
              J・羅伯特・<br />奧本海默
            </h1>
            <div className="font-serif-custom text-[var(--text-muted-light)] text-xl sm:text-2xl tracking-[0.25em] uppercase mb-8 ml-1">J. Robert Oppenheimer</div>

            <div className="flex items-center gap-4 text-[var(--accent)] font-serif-custom text-2xl mb-8">
              <span>1904</span>
              <span className="w-12 h-[1px] bg-[var(--accent)] opacity-50"></span>
              <span>1967</span>
            </div>

            <div className="border-l-2 border-[var(--accent)] pl-5 py-1 mb-8">
              <h2 className="font-serif-custom text-[var(--text-muted-light)] text-lg sm:text-xl tracking-wider leading-relaxed">
                理論物理學家<br />
                洛斯阿拉莫斯實驗室主任<br />
                曼哈頓計畫科學領導者
              </h2>
            </div>

            <p className="font-sans-custom text-[var(--text-light)] text-base sm:text-lg leading-[1.9] max-w-xl opacity-90 tracking-[0.01em] font-normal">
              美國理論物理學家，在第二次世界大戰期間領導洛斯阿拉莫斯實驗室的科學研究，並在曼哈頓計畫中扮演核心角色。他的科學工作與人生選擇，深刻改變了二十世紀的歷史進程。
            </p>
          </div>
        </div>

        <div className="w-full lg:w-[40%] h-[400px] lg:h-auto relative lg:absolute right-0 top-0 bottom-0 overflow-hidden hidden sm:block">
          <div className="absolute inset-0 bg-gradient-to-t lg:bg-gradient-to-r from-[var(--bg-dark)] via-[var(--bg-dark)]/80 to-transparent z-10 lg:w-[48%]"></div>
          <div className="absolute inset-0 bg-gradient-to-t from-[var(--bg-dark)] via-transparent to-transparent z-10"></div>
          <div className="absolute inset-0 bg-zinc-800 grayscale contrast-125 opacity-80">
            <img
              src="https://upload.wikimedia.org/wikipedia/commons/8/85/Oppenheimer_%28cropped%29.jpg"
              alt="J. Robert Oppenheimer portrait, 1944"
              className="w-full h-full object-cover object-[58%_22%] lg:object-[58%_22%]"
            />
          </div>
        </div>
      </div>

      <div className="w-full bg-[var(--bg-paper)] mt-auto relative z-20 border-t border-[var(--border-dark)] py-12 px-6">
        <div className="max-w-[1400px] mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-8">
          <p className="font-serif-custom text-2xl md:text-3xl text-[var(--text-dark)] leading-relaxed font-medium max-w-3xl">「一位處於二十世紀最具影響力的科學與政治事件中心的物理學家。」</p>
          <button onClick={onNavigate} className="group border border-[var(--text-dark)] hover:bg-[var(--text-dark)] hover:text-[var(--bg-paper)] text-[var(--text-dark)] px-8 py-3 font-mono-custom text-sm tracking-widest uppercase transition-colors duration-300 flex items-center justify-center gap-3 shrink-0">
            檢視歷史檔案 <ChevronRight size={16} className="group-hover:translate-x-1 transition-transform" />
          </button>
        </div>
      </div>
    </div>
  );
}

function TimelineSection() {
  const events = [
    { year: "1904", title: "早年與求學", subTitle: "EARLY LIFE", desc: "出生於紐約。自幼展現出極高的天賦與廣泛的興趣，包括礦物學、化學與詩歌。隨後進入哈佛大學就讀化學，並以最高榮譽畢業。" },
    { year: "1925–1927", title: "理論物理研究", subTitle: "THEORETICAL PHYSICS IN EUROPE", desc: "前往歐洲，在英國劍橋大學與德國哥廷根大學深造，師從馬克斯·玻恩，獲得博士學位，並在量子力學領域嶄露頭角。" },
    { year: "1929–1942", title: "柏克萊歲月", subTitle: "BERKELEY YEARS", desc: "返回美國，在加州大學柏克萊分校（UC Berkeley）建立了一支頂尖的美國理論物理學派，研究範圍涵蓋天體物理學、光譜學和量子場論。" },
    { year: "1942", title: "曼哈頓計畫", subTitle: "THE MANHATTAN PROJECT", desc: "被萊斯利·格羅夫斯將軍任命為「曼哈頓計畫」的科學負責人，領導開發人類歷史上第一批核武器，以應對納粹德國的威脅。" },
    { year: "1943", title: "洛斯阿拉莫斯", subTitle: "LOS ALAMOS LABORATORY", desc: "在新墨西哥州的荒野建立洛斯阿拉莫斯實驗室（Project Y），召集世界頂尖科學家進行高度機密的武器研發工作。" },
    { year: "July 16, 1945", title: "三位一體核試驗", subTitle: "THE TRINITY TEST", desc: "人類史上首次核子試爆「三位一體」成功引爆。奧本海默在此刻想起了《薄伽梵歌》的詩句：「我現在成了死神，世界的毀滅者。」" },
    { year: "1947–1952", title: "戰後歲月", subTitle: "POST-WAR ADVISORY", desc: "擔任普林斯頓高等研究院院長，並成為美國原子能委員會（AEC）總顧問委員會主席，積極倡導國際軍備控制，反對氫彈研發。" },
    { year: "1954", title: "安全聽證", subTitle: "THE SECURITY HEARING", desc: "在麥卡錫主義氛圍下，因戰前左翼傾向及反對氫彈，遭受不公正的秘密聽證會審查，最終被撤銷安全許可，學術與政治影響力重挫。" },
    { year: "1963", title: "費米獎", subTitle: "ENRICO FERMI AWARD", desc: "獲得美國總統頒發的恩里科·費米獎，作為政治上某種程度的平反與歷史和解。" }
  ];

  return (
    <div className="bg-[var(--bg-paper)] text-[var(--text-dark)] min-h-screen py-20 relative">
      <div className="absolute inset-0 bg-noise opacity-30 pointer-events-none"></div>
      <div className="max-w-4xl mx-auto px-6 relative z-10">
        <div className="mb-20 border-b border-[var(--border-dark)] pb-8 pt-4">
          <h2 className="font-serif-custom text-4xl md:text-5xl font-bold mb-4 tracking-wide">01 // 生平紀事</h2>
          <p className="font-mono-custom text-[var(--text-muted-dark)] tracking-[0.15em] uppercase text-xs">Historical Timeline (1904-1967)</p>
        </div>

        <div className="relative border-l border-[var(--border-dark)] ml-4 md:ml-8 space-y-16 pb-12">
          {events.map((event, index) => (
            <div key={index} className="relative pl-10 md:pl-16 group">
              <div className="absolute w-3 h-3 bg-[var(--bg-paper)] border-2 border-[var(--text-dark)] rounded-none -left-[6.5px] top-2 transition-all duration-300 group-hover:bg-[var(--accent)] group-hover:border-[var(--accent)]"></div>
              <div className="flex flex-col md:flex-row md:items-baseline gap-2 md:gap-8 mb-4">
                <span className="font-serif-custom text-[var(--accent)] font-semibold text-xl md:text-2xl w-36 shrink-0">{event.year}</span>
                <div>
                  <h3 className="font-serif-custom text-2xl md:text-3xl font-bold mb-1 tracking-wide">{event.title}</h3>
                  <h4 className="font-mono-custom text-xs text-[var(--text-muted-dark)] tracking-[0.15em] uppercase">{event.subTitle}</h4>
                </div>
              </div>
              <div className="bg-[var(--bg-paper-alt)] border border-[var(--border-light)] p-6 shadow-sm relative">
                <p className="font-sans-custom text-[var(--text-dark)] leading-relaxed text-sm md:text-base">{event.desc}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function AchievementsSection() {
  const achievements = [
    { id: "REF-01", title: "玻恩-奧本海默近似", subTitle: "BORN-OPPENHEIMER APPROXIMATION", category: "理論物理", year: "1927", desc: "與導師馬克斯·玻恩共同提出。這個量子力學近似方法允許科學家將原子核的運動與電子的運動分開處理，是現代量子化學的基石。" },
    { id: "REF-02", title: "黑洞理論先驅", subTitle: "GRAVITATIONAL CONTRACTION", category: "天體物理", year: "1939", desc: "首次運用廣義相對論計算出大質量恆星耗盡核燃料後會無限坍縮，這正是現代「黑洞」理論的最早數學基礎之一。" },

    { id: "REF-05", title: "美國理論物理學派", subTitle: "AMERICAN SCHOOL OF PHYSICS", category: "學術教育", year: "1929-1942", desc: "在柏克萊培養了一整代傑出的美國物理學家，使美國的物理研究水平得以與歐洲抗衡甚至超越。" },
    { id: "REF-06", title: "核能國際控制", subTitle: "ATOMIC CONTROL", category: "政策倫理", year: "Post-1945", desc: "二戰後積極推動對核武器的國際控制，參與起草《艾奇遜-利連索爾報告》，極力反對美蘇核軍備競賽。" }

        <div className="mb-16 border-b border-[var(--border-dark)] pb-8 pt-4 flex flex-col md:flex-row md:items-end justify-between gap-6">
          <div>
            <h2 className="font-serif-custom text-4xl md:text-5xl font-bold mb-4 tracking-wide">02 // 學術與成就</h2>
            <p className="font-mono-custom text-[var(--text-muted-dark)] tracking-[0.15em] uppercase text-xs">Scientific Contributions</p>
          </div>
          <div className="font-mono-custom text-[var(--text-muted-dark)] text-xs border border-[var(--border-dark)] px-3 py-1">CATALOG G-55</div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
          {achievements.map((item, index) => (
            <div key={index} className="bg-[var(--bg-paper-alt)] border border-[var(--border-dark)] p-8 relative flex flex-col h-full hover:bg-[#E2DECF] transition-colors duration-300">
              <div className="flex justify-between items-start mb-6 border-b border-[var(--border-dark)] pb-4">

function LegacySection() {
  return (
    <div className="bg-[var(--bg-paper)] text-[var(--text-dark)] min-h-screen pt-12 pb-24 relative border-t border-[var(--border-dark)]">
      <div className="absolute inset-0 bg-noise opacity-[0.25] pointer-events-none"></div>
      <div className="max-w-[1200px] mx-auto px-6 relative z-10">
        <div className="flex justify-between items-end mb-12 border-b border-[var(--border-dark)] pb-6">
          <div className="font-mono-custom text-[10px] text-[var(--text-muted-dark)] tracking-widest uppercase flex gap-6">
            <span>Archive Section 03</span>
            <span className="hidden sm:inline">Declassified Records</span>
          </div>
          <div className="font-mono-custom text-[10px] text-[var(--text-muted-dark)] tracking-widest uppercase">REF: US-AEC-1954</div>
