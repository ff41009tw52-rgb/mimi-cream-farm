<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>槓桿與輪軸互動對對碰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective {
            perspective: 1000px;
        }
        .flip-card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
        @keyframes success-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .matched {
            animation: success-pulse 0.5s ease-in-out;
            opacity: 0.6;
        }
        .svg-container {
            width: 100%;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

<div class="max-w-4xl mx-auto px-4 py-8">
    <!-- 標題與資訊欄 -->
    <header class="text-center mb-6">
        <h1 class="text-3xl font-bold text-indigo-700 mb-2">⚙️ 槓桿與輪軸對對碰</h1>
        <div class="inline-block bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full font-bold mb-4" id="level-indicator">
            第一關：基礎槓桿與滑輪
        </div>
        
        <div class="flex justify-center gap-4 md:gap-8 text-lg font-semibold bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="text-indigo-600">步數：<span id="moves">0</span></div>
            <div class="text-emerald-600">配對：<span id="matches">0</span> / 8</div>
            <div class="text-amber-600">時間：<span id="timer">0</span>s</div>
        </div>
    </header>

    <!-- 遊戲區域 -->
    <div id="game-grid" class="grid grid-cols-4 gap-3 max-w-2xl mx-auto perspective">
        <!-- 由 JS 動態生成 -->
    </div>

    <!-- 控制按鈕 -->
    <div class="text-center mt-8 space-x-4">
        <button onclick="resetGame()" class="bg-slate-500 hover:bg-slate-600 text-white px-6 py-2 rounded-full font-bold transition active:scale-95">
            重新開始本關
        </button>
    </div>

    <!-- 結算彈窗 -->
    <div id="win-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-3xl font-bold text-indigo-700 mb-4" id="modal-title">🎉 挑戰成功！</h2>
            <p id="final-stats" class="text-lg text-slate-600 mb-6"></p>
            <button id="next-btn" onclick="nextLevel()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold transition mb-3">
                進入下一關
            </button>
            <button onclick="resetGame()" class="w-full text-slate-500 py-2 hover:underline">
                重玩本關
            </button>
        </div>
    </div>
</div>

<script>
    // SVG 模板：抗力點示意圖
    const resistanceSVG = `
        <svg viewBox="0 0 100 60" class="w-full h-full">
            <line x1="10" y1="25" x2="90" y2="45" stroke="#334155" stroke-width="4" stroke-linecap="round" />
            <polygon points="60,37 54,50 66,50" fill="#64748b" /> 
            <rect x="70" y="28" width="16" height="16" fill="#8b5cf6" transform="rotate(14, 78, 36)" />
            <path d="M78,5 L78,22 M73,14 L78,22 L83,14" fill="none" stroke="#ef4444" stroke-width="2.5" />
        </svg>
    `;

    // SVG 模板：輪軸示意圖 (參考上傳圖片繪製：紅色實驗器材樣式)
    const axleSVG = `
        <svg viewBox="0 0 100 100" class="w-full h-full">
            <!-- 大輪 (紅色) -->
            <circle cx="50" cy="50" r="40" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
            <!-- 小軸 (深紅色) -->
            <circle cx="50" cy="50" r="15" fill="#b91c1c" stroke="#991b1b" stroke-width="1.5" />
            <!-- 輪上的溝槽線條 (示意圖片中的突起與繞線處) -->
            <line x1="50" y1="10" x2="50" y2="20" stroke="white" stroke-width="2" opacity="0.6" />
            <line x1="50" y1="80" x2="50" y2="90" stroke="white" stroke-width="2" opacity="0.6" />
            <!-- 中間的軸心黑點 -->
            <circle cx="50" cy="50" r="4" fill="#1e293b" />
            <!-- 示意繞繩 (米白色) -->
            <path d="M35,50 Q40,40 50,40 Q60,40 65,50" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="2" />
        </svg>
    `;

    // SVG 模板：汽車方向盤
    const steeringWheelSVG = `
        <svg viewBox="0 0 100 60" class="w-full h-full">
            <circle cx="50" cy="30" r="22" fill="none" stroke="#334155" stroke-width="3" />
            <circle cx="50" cy="30" r="4" fill="#334155" />
            <line x1="50" y1="34" x2="50" y2="52" stroke="#334155" stroke-width="3" />
            <line x1="28" y1="30" x2="46" y2="30" stroke="#334155" stroke-width="3" />
            <line x1="54" y1="30" x2="72" y2="30" stroke="#334155" stroke-width="3" />
        </svg>
    `;

    const allData = {
        level1: [
            { id: 1, name: '定滑輪', icon: '🎡', desc: '改變施力方向', color: 'bg-blue-50', textCol: 'bg-blue-600' },
            { id: 2, name: '動滑輪', icon: '🏗️', desc: '省力但費時', color: 'bg-orange-50', textCol: 'bg-orange-600' },
            { id: 3, name: '支點', icon: '📍', desc: '轉動不動點', color: 'bg-red-50', textCol: 'bg-red-600' },
            { id: 4, name: '施力點', icon: '💪', desc: '手施加力量處', color: 'bg-green-50', textCol: 'bg-green-600' },
            { id: 5, name: '抗力點', customSVG: resistanceSVG, desc: '', color: 'bg-purple-50', textCol: 'bg-purple-600' },
            { id: 6, name: '省力槓桿', icon: '✂️', desc: '施力臂 > 抗力臂', color: 'bg-yellow-50', textCol: 'bg-yellow-600' },
            { id: 7, name: '齒輪', icon: '⚙️', desc: '傳遞動力', color: 'bg-slate-100', textCol: 'bg-slate-700' },
            { id: 8, name: '費力槓桿', icon: '🥢', desc: '施力臂 < 抗力臂', color: 'bg-pink-50', textCol: 'bg-pink-600' }
        ],
        level2: [
            { id: 3, name: '支點', icon: '📍', desc: '轉動中心', color: 'bg-red-50', textCol: 'bg-red-600' },
            { id: 5, name: '抗力點', customSVG: resistanceSVG, desc: '', color: 'bg-purple-50', textCol: 'bg-purple-600' },
            { id: 9, name: '輪軸', customSVG: axleSVG, desc: '', color: 'bg-rose-50', textCol: 'bg-rose-600' },
            { id: 10, name: '施力在輪', customSVG: steeringWheelSVG, desc: '大圓帶動小圓(省力)', color: 'bg-emerald-50', textCol: 'bg-emerald-600' },
            { id: 11, name: '施力在軸', icon: '🚁', desc: '小圓帶動大圓(費力)', color: 'bg-amber-50', textCol: 'bg-amber-600' },
            { id: 13, name: '施力臂', icon: '📏', desc: '支點到施力點距離', color: 'bg-blue-50', textCol: 'bg-blue-600' },
            { id: 14, name: '抗力臂', icon: '📐', desc: '支點到抗力點距離', color: 'bg-teal-50', textCol: 'bg-teal-600' },
            { id: 1, name: '定滑輪', icon: '🎡', desc: '改變方向不省力', color: 'bg-blue-50', textCol: 'bg-blue-600' }
        ]
    };

    let currentLevel = 1;
    let flippedCards = [];
    let matchedCount = 0;
    let moves = 0;
    let seconds = 0;
    let timerInterval;
    let isLocked = false;

    const gameGrid = document.getElementById('game-grid');
    const movesDisplay = document.getElementById('moves');
    const matchesDisplay = document.getElementById('matches');
    const timerDisplay = document.getElementById('timer');
    const winModal = document.getElementById('win-modal');
    const levelIndicator = document.getElementById('level-indicator');

    function prepareCards() {
        const activeData = currentLevel === 1 ? allData.level1 : allData.level2;
        const deck = [];
        activeData.forEach(pair => {
            deck.push({
                id: pair.id,
                type: 'image',
                content: pair.customSVG ? `<div class="svg-container">${pair.customSVG}</div>` : `<span class="text-4xl mb-1">${pair.icon}</span>`,
                desc: pair.desc,
                bgColor: pair.color
            });
            deck.push({
                id: pair.id,
                type: 'text',
                content: `<h3 class="font-bold text-base text-white">${pair.name}</h3>`,
                bgColor: pair.textCol
            });
        });
        return deck.sort(() => Math.random() - 0.5);
    }

    function initLevel() {
        const shuffledDeck = prepareCards();
        gameGrid.innerHTML = '';
        levelIndicator.textContent = currentLevel === 1 ? '第一關：基礎槓桿與滑輪' : '第二關：輪軸與機械應用';

        shuffledDeck.forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'aspect-square relative cursor-pointer flip-card';
            card.dataset.id = data.id;
            
            card.innerHTML = `
                <div class="flip-card-inner w-full h-full relative border-2 border-white rounded-xl shadow-sm">
                    <div class="flip-card-front bg-slate-400 rounded-xl flex items-center justify-center text-white text-2xl font-bold">
                        ?
                    </div>
                    <div class="flip-card-back ${data.bgColor} rounded-xl flex flex-col items-center justify-center p-2 text-center border-2 border-slate-200">
                        ${data.content}
                        ${data.desc ? `<p class="text-[10px] text-slate-500 mt-1 font-medium leading-tight">${data.desc}</p>` : ''}
                    </div>
                </div>
            `;
            
            card.addEventListener('click', () => flipCard(card));
            gameGrid.appendChild(card);
        });

        startTimer();
    }

    function flipCard(card) {
        if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
        card.classList.add('flipped');
        flippedCards.push(card);
        if (flippedCards.length === 2) checkMatch();
    }

    function checkMatch() {
        isLocked = true;
        moves++;
        movesDisplay.textContent = moves;
        const [card1, card2] = flippedCards;
        const isMatch = card1.dataset.id === card2.dataset.id;

        if (isMatch) {
            matchedCount++;
            matchesDisplay.textContent = matchedCount;
            card1.classList.add('matched');
            card2.classList.add('matched');
            resetFlipped();
            if (matchedCount === 8) endGame();
        } else {
            setTimeout(() => {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                resetFlipped();
            }, 800);
        }
    }

    function resetFlipped() {
        flippedCards = [];
        isLocked = false;
    }

    function startTimer() {
        clearInterval(timerInterval);
        seconds = 0;
        timerDisplay.textContent = seconds;
        timerInterval = setInterval(() => {
            seconds++;
            timerDisplay.textContent = seconds;
        }, 1000);
    }

    function endGame() {
        clearInterval(timerInterval);
        const nextBtn = document.getElementById('next-btn');
        if (currentLevel === 2) {
            document.getElementById('modal-title').textContent = '🏆 成為機械大師！';
            nextBtn.textContent = '重回第一關';
            nextBtn.onclick = () => { currentLevel = 1; resetGame(); };
        } else {
            document.getElementById('modal-title').textContent = '🎉 關卡完成！';
            nextBtn.textContent = '進入第二關：輪軸挑戰';
            nextBtn.onclick = nextLevel;
        }
        document.getElementById('final-stats').innerHTML = `時間：${seconds}秒 | 步數：${moves}步`;
        winModal.classList.remove('hidden');
    }

    function nextLevel() {
        currentLevel = 2;
        resetGame();
    }

    function resetGame() {
        winModal.classList.add('hidden');
        moves = 0;
        matchedCount = 0;
        movesDisplay.textContent = '0';
        matchesDisplay.textContent = '0';
        initLevel();
    }

    window.onload = initLevel;
</script>

    <script src="home-button.js"></script>
</body>
</html>
