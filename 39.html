<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橘咪咪與白奶油的科學農場 - 小小雨量偵探</title>
    <style>
        :root {
            --primary-color: #2ecc71;
            --secondary-color: #f39c12;
            --water-color: rgba(52, 152, 219, 0.8);
            --bg-color: #E6F3FF;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Nunito', 'Microsoft JhengHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* 背景裝飾 */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#7dd3fc 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        /* 回農場按鈕 */
        .home-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 10px 20px;
            background: white;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-weight: bold;
            z-index: 100;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        header {
            text-align: center;
            padding: 30px 20px 10px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: #1e40af;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 1px 1px 0px white;
        }
        
        header p {
            font-size: 1.1rem;
            color: #3b82f6;
            font-weight: bold;
            margin: 0;
        }

        /* 角色對話區 */
        .dialogue-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .character {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            object-fit: cover;
            background-color: white;
        }

        .dialogue-box {
            background-color: white;
            padding: 18px 25px;
            border-radius: 20px;
            margin: 0 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 600px;
            position: relative;
            border: 2px solid #e2e8f0;
        }

        .dialogue-box::after {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 12px 14px 12px 0;
            border-style: solid;
            border-color: transparent white transparent transparent;
        }
        
        .dialogue-box::before {
            content: '';
            position: absolute;
            left: -15px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 13px 15px 13px 0;
            border-style: solid;
            border-color: transparent #e2e8f0 transparent transparent;
        }
        
        .cream-talks .dialogue-box::after {
             left: auto;
             right: -12px;
             border-width: 12px 0 12px 14px;
             border-color: transparent transparent transparent white;
        }
        .cream-talks .dialogue-box::before {
             left: auto;
             right: -15px;
             border-width: 13px 0 13px 15px;
             border-color: transparent transparent transparent #e2e8f0;
        }

        #mimi-text, #cream-text {
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #334155;
            font-weight: bold;
        }

        /* 雨量控制器 */
        .rain-selector-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .rain-selector-container strong {
            color: #1e40af;
        }

        .rain-btn {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: #64748b;
            transition: all 0.2s;
        }
        
        .rain-btn:hover:not(:disabled) {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        .rain-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .rain-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 實驗主區域 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0px 20px 40px;
            position: relative;
        }

        /* 下雨動畫背景 */
        #rain-overlay {
            position: absolute;
            top: -100px;
            left: 0;
            width: 100%;
            height: calc(100% + 100px);
            pointer-events: none;
            z-index: 10;
            display: none;
            overflow: hidden;
        }

        .rain-drop {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(52, 152, 219, 0.9));
            border-radius: 50%;
            bottom: 100%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(150vh); }
        }

        /* 容器展示區與木製層架 */
        .stage-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            perspective: 1000px;
            margin-bottom: 40px; /* 給標籤預留空間 */
        }

        .containers-stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 40px;
            margin-bottom: 0px;
            padding-bottom: 25px; /* 預留架子的高度 */
            width: 90%;
            max-width: 800px;
            position: relative;
            z-index: 5;
            transform-origin: bottom center;
        }
        
        .shelf {
            position: absolute;
            bottom: 0;
            left: -5%;
            width: 110%;
            height: 25px;
            background: linear-gradient(to bottom, #d4a373, #faedcd 5%, #d4a373 15%, #a98467);
            border-radius: 8px;
            box-shadow: 0 15px 20px rgba(0,0,0,0.15), inset 0 2px 5px rgba(255,255,255,0.4);
            z-index: 0;
            border-bottom: 3px solid #8a5a44;
        }

        /* 完美校正的紅外線基準線 */
        .baseline {
            position: absolute;
            width: 105%;
            left: -2.5%;
            height: 2px;
            background-color: #ef4444; 
            bottom: 45px; /* 預設位置，將由 JS 精確計算 */
            z-index: 15;
            display: none;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.8), 0 0 5px rgba(239, 68, 68, 0.5);
            border-radius: 2px;
        }
        .baseline::after {
            content: '標準雨量高度';
            position: absolute;
            right: 10px;
            top: -28px;
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .baseline::before {
            content: '';
            position: absolute;
            right: 45px;
            top: -4px;
            border-width: 5px 5px 0 5px;
            border-style: solid;
            border-color: #ef4444 transparent transparent transparent;
        }

        /* 個別容器包裝 */
        .container-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: filter 0.3s;
            position: relative;
            z-index: 5;
        }

        .container-wrapper:hover .glass-svg {
            filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.8));
        }
        
        .container-wrapper.selected .glass-svg {
            filter: drop-shadow(0 0 25px rgba(243, 156, 18, 0.9));
        }
        .container-wrapper.selected .container-label {
            background-color: var(--secondary-color);
            color: white;
            transform: scale(1.1);
        }

        /* SVG 玻璃容器樣式 */
        .glass-svg {
            width: 120px;
            height: 220px;
            display: block;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
            transition: filter 0.3s;
        }

        /* 水位動畫設定 */
        .svg-water {
            transform: translateY(220px); 
            transition: transform 3.5s cubic-bezier(0.25, 0.1, 0.25, 1); 
        }

        .container-label {
            position: absolute;
            bottom: -35px;
            margin-top: 0;
            font-weight: bold;
            font-size: 1.1rem;
            color: #475569;
            background: rgba(255,255,255,0.8);
            padding: 5px 12px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s;
            white-space: nowrap;
        }

        /* 測量尺 (全新亞克力高質感版) */
        .measuring-ruler {
            position: absolute;
            right: -25px; /* 貼齊實驗桌右側 */
            bottom: 29px; /* 精準計算：確保尺的0mm刻度線與水槽底部的44px高度完美吻合 */
            width: 75px;
            height: 195px;
            z-index: 25;
            display: none; 
            filter: drop-shadow(4px 8px 12px rgba(0,0,0,0.15));
        }
        .ruler-drop-in {
            display: block;
            animation: dropIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes dropIn {
            from { transform: translateY(-100px) rotate(5deg); opacity: 0; }
            to { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        /* 控制區 */
        .controls {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            z-index: 20;
        }

        .btn {
            padding: 14px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-weight: 900;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        #start-btn {
            background: linear-gradient(to bottom, #4ade80, #22c55e);
            color: white;
            border: 2px solid #16a34a;
        }
        #start-btn:hover:not(:disabled) { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }
        #start-btn:active:not(:disabled) { transform: translateY(2px); }
        #start-btn:disabled { 
            background: #cbd5e1; 
            border-color: #94a3b8;
            color: #64748b;
            cursor: not-allowed; 
            box-shadow: none;
        }

        #reset-btn {
            background: linear-gradient(to bottom, #f87171, #ef4444);
            color: white;
            border: 2px solid #dc2626;
        }
        #reset-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        /* 結論區 */
        #conclusion-area {
            margin-top: 30px;
            padding: 25px 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 800px;
            display: none; 
            text-align: center;
            border-top: 6px solid var(--secondary-color);
        }
        #conclusion-area h3 {
            color: var(--secondary-color);
            font-size: 1.6rem;
            margin-top: 0;
            margin-bottom: 15px;
        }
        #conclusion-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #334155;
            margin: 0;
            text-align: left;
        }

        /* RWD 適應 */
        @media (max-width: 768px) {
            .containers-stage { transform: scale(0.65); gap: 20px; margin-bottom: -30px; }
            .dialogue-box { padding: 12px 20px; }
            #mimi-text, #cream-text { font-size: 1rem; }
            .btn { font-size: 1rem; padding: 10px 20px; }
            .character { width: 70px; height: 70px; }
            .rain-selector-container { flex-wrap: wrap; }
        }
        @media (max-width: 480px) {
            .containers-stage { transform: scale(0.5); gap: 10px; margin-bottom: -50px;}
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <a href="index.html" class="home-btn">🏠 回農場</a>

    <header>
        <h1>小小雨量偵探</h1>
        <p>✨ 專業玻璃儀器測量實驗 ✨</p>
    </header>

    <!-- 橘咪咪對話 -->
    <section class="dialogue-container">
        <img src="Christmasmimi.jpg" alt="橘咪咪園長" class="character">
        <div class="dialogue-box">
            <p id="mimi-text">喵～我準備了神奇的「雨量控制器」！你可以自由決定要下小雨、中雨還是大雨。選好容器和雨量，我們就可以精準觀察囉！</p>
        </div>
    </section>

    <main>
        <!-- 雨量控制器 -->
        <div class="rain-selector-container">
            <strong>調節雨量：</strong>
            <button class="rain-btn" id="btn-light" onclick="setRainLevel('light')">🌧️ 小雨</button>
            <button class="rain-btn active" id="btn-medium" onclick="setRainLevel('medium')">🌧️ 中雨</button>
            <button class="rain-btn" id="btn-heavy" onclick="setRainLevel('heavy')">⛈️ 大雨</button>
        </div>

        <!-- 下雨特效層 -->
        <div id="rain-overlay"></div>

        <!-- 存放 SVG 共用漸層與遮罩 -->
        <svg style="width:0;height:0;position:absolute;" aria-hidden="true">
            <defs>
                <linearGradient id="glass-bg" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
                    <stop offset="10%" stop-color="rgba(255,255,255,0.1)" />
                    <stop offset="90%" stop-color="rgba(255,255,255,0.05)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.4)" />
                </linearGradient>
                <linearGradient id="cylinder-bg" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
                    <stop offset="15%" stop-color="rgba(255,255,255,0.1)" />
                    <stop offset="50%" stop-color="rgba(255,255,255,0.0)" />
                    <stop offset="85%" stop-color="rgba(255,255,255,0.1)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0.6)" />
                </linearGradient>
                <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.8)" />
                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>
                <linearGradient id="water-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="rgba(52, 152, 219, 0.7)" />
                    <stop offset="20%" stop-color="rgba(100, 181, 246, 0.6)" />
                    <stop offset="80%" stop-color="rgba(52, 152, 219, 0.7)" />
                    <stop offset="100%" stop-color="rgba(31, 119, 180, 0.8)" />
                </linearGradient>
                
                <clipPath id="clip-a">
                    <path d="M 45 20 L 75 20 L 75 60 C 75 80, 95 90, 100 120 L 100 190 C 100 200, 90 200, 90 200 L 30 200 C 30 200, 20 200, 20 190 L 20 120 C 25 90, 45 80, 45 60 Z" />
                </clipPath>
                <clipPath id="clip-b">
                    <path d="M 15 20 L 105 20 L 90 195 C 89 200, 80 200, 80 200 L 40 200 C 40 200, 31 200, 30 195 Z" />
                </clipPath>
                <clipPath id="clip-c">
                    <path d="M 30 20 L 30 194 A 30 6 0 0 0 90 194 L 90 20 Z" />
                </clipPath>
                <clipPath id="clip-d">
                    <rect x="30" y="20" width="60" height="180" />
                </clipPath>
            </defs>
        </svg>

        <!-- 容器展示舞台 -->
        <div class="stage-wrapper">
            <div class="containers-stage">
                <!-- 紅色基準線 -->
                <div class="baseline" id="baseline"></div>
                <!-- 木製層架底座 -->
                <div class="shelf"></div>

                <!-- 農場專用雨量尺 (全新亞克力高質感版) -->
                <div class="measuring-ruler" id="measuring-ruler">
                    <svg viewBox="0 0 75 195" width="100%" height="100%">
                        <!-- 尺的本體 (亞克力半透明質感) -->
                        <rect x="5" y="5" width="60" height="190" rx="6" fill="rgba(255, 255, 255, 0.9)" stroke="#cbd5e1" stroke-width="1.5" />
                        <!-- 左側高光 (玻璃邊緣反光) -->
                        <rect x="7" y="7" width="4" height="186" rx="2" fill="rgba(255,255,255,0.9)" />
                        
                        <!-- 單位 (向上微調位置) -->
                        <text x="35" y="22" font-family="'Nunito', sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">mm</text>

                        <!-- 刻度與數字 (Y軸 180 是 0mm，往上每 5px 為 5mm) -->
                        <g font-family="'Nunito', sans-serif" fill="#1e293b">
                            <!-- 150mm -->
                            <line x1="5" y1="30" x2="25" y2="30" stroke="#1e293b" stroke-width="2"/>
                            <text x="30" y="34" font-size="13" font-weight="900">150</text>
                            
                            <!-- 125mm -->
                            <line x1="5" y1="55" x2="18" y2="55" stroke="#475569" stroke-width="1.5"/>
                            <text x="22" y="59" font-size="10" font-weight="700" fill="#475569">125</text>

                            <!-- 100mm -->
                            <line x1="5" y1="80" x2="25" y2="80" stroke="#1e293b" stroke-width="2"/>
                            <text x="30" y="84" font-size="13" font-weight="900">100</text>

                            <!-- 75mm -->
                            <line x1="5" y1="105" x2="18" y2="105" stroke="#475569" stroke-width="1.5"/>
                            <text x="22" y="109" font-size="10" font-weight="700" fill="#475569">75</text>

                            <!-- 50mm -->
                            <line x1="5" y1="130" x2="25" y2="130" stroke="#1e293b" stroke-width="2"/>
                            <text x="30" y="134" font-size="13" font-weight="900">50</text>

                            <!-- 25mm -->
                            <line x1="5" y1="155" x2="18" y2="155" stroke="#475569" stroke-width="1.5"/>
                            <text x="22" y="159" font-size="10" font-weight="700" fill="#475569">25</text>

                            <!-- 0mm -->
                            <line x1="5" y1="180" x2="25" y2="180" stroke="#1e293b" stroke-width="2"/>
                            <text x="30" y="184" font-size="13" font-weight="900">0</text>

                            <!-- 繪製所有 5mm 和 10mm 的小刻度 -->
                            <g stroke="#94a3b8" stroke-width="1">
                                <!-- 0~25 -->
                                <line x1="5" y1="175" x2="12" y2="175" />
                                <line x1="5" y1="170" x2="15" y2="170" />
                                <line x1="5" y1="165" x2="12" y2="165" />
                                <line x1="5" y1="160" x2="15" y2="160" />
                                <!-- 25~50 -->
                                <line x1="5" y1="150" x2="15" y2="150" />
                                <line x1="5" y1="145" x2="12" y2="145" />
                                <line x1="5" y1="140" x2="15" y2="140" />
                                <line x1="5" y1="135" x2="12" y2="135" />
                                <!-- 50~75 -->
                                <line x1="5" y1="125" x2="12" y2="125" />
                                <line x1="5" y1="120" x2="15" y2="120" />
                                <line x1="5" y1="115" x2="12" y2="115" />
                                <line x1="5" y1="110" x2="15" y2="110" />
                                <!-- 75~100 -->
                                <line x1="5" y1="100" x2="15" y2="100" />
                                <line x1="5" y1="95" x2="12" y2="95" />
                                <line x1="5" y1="90" x2="15" y2="90" />
                                <line x1="5" y1="85" x2="12" y2="85" />
                                <!-- 100~125 -->
                                <line x1="5" y1="75" x2="12" y2="75" />
                                <line x1="5" y1="70" x2="15" y2="70" />
                                <line x1="5" y1="65" x2="12" y2="65" />
                                <line x1="5" y1="60" x2="15" y2="60" />
                                <!-- 125~150 -->
                                <line x1="5" y1="50" x2="15" y2="50" />
                                <line x1="5" y1="45" x2="12" y2="45" />
                                <line x1="5" y1="40" x2="15" y2="40" />
                                <line x1="5" y1="35" x2="12" y2="35" />
                            </g>
                        </g>
                    </svg>
                </div>

                <!-- 容器 A: 窄口瓶 -->
                <div class="container-wrapper" id="container-a" onclick="selectContainer('a')">
                    <svg viewBox="0 0 120 220" class="glass-svg">
                        <path d="M 45 20 L 75 20 L 75 60 C 75 80, 95 90, 100 120 L 100 190 C 100 200, 90 200, 90 200 L 30 200 C 30 200, 20 200, 20 190 L 20 120 C 25 90, 45 80, 45 60 Z" fill="url(#glass-bg)" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" />
                        <g clip-path="url(#clip-a)">
                            <g id="water-a" class="svg-water">
                                <rect x="0" y="0" width="120" height="220" fill="url(#water-grad)" />
                                <line x1="0" y1="0" x2="120" y2="0" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
                            </g>
                        </g>
                        <path d="M 25 120 C 28 95, 48 85, 48 60 L 48 20 L 52 20 L 52 60 C 52 85, 32 95, 29 120 L 25 190 L 22 190 Z" fill="url(#glare)" />
                        <rect x="41" y="16" width="38" height="6" rx="3" fill="rgba(255,255,255,0.7)" stroke="white" stroke-width="1"/>
                    </svg>
                    <div class="container-label">A. 窄口瓶</div>
                </div>

                <!-- 容器 B: 寬口杯 -->
                <div class="container-wrapper" id="container-b" onclick="selectContainer('b')">
                    <svg viewBox="0 0 120 220" class="glass-svg">
                        <path d="M 15 20 L 105 20 L 90 195 C 89 200, 80 200, 80 200 L 40 200 C 40 200, 31 200, 30 195 Z" fill="url(#glass-bg)" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" />
                        <g clip-path="url(#clip-b)">
                            <g id="water-b" class="svg-water">
                                <rect x="0" y="0" width="120" height="220" fill="url(#water-grad)" />
                                <line x1="0" y1="0" x2="120" y2="0" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
                            </g>
                        </g>
                        <path d="M 22 25 L 28 25 L 38 190 L 32 190 Z" fill="url(#glare)" />
                        <ellipse cx="60" cy="20" rx="45" ry="5" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
                    </svg>
                    <div class="container-label">B. 寬口杯</div>
                </div>

                <!-- 容器 C: 圓柱杯 -->
                <div class="container-wrapper" id="container-c" onclick="selectContainer('c')">
                    <svg viewBox="0 0 120 220" class="glass-svg">
                        <ellipse cx="60" cy="20" rx="30" ry="6" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
                        <path d="M 30 20 L 30 194 A 30 6 0 0 0 90 194 L 90 20 Z" fill="url(#cylinder-bg)" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" />
                        <g clip-path="url(#clip-c)">
                            <g id="water-c" class="svg-water">
                                <rect x="0" y="0" width="120" height="220" fill="url(#water-grad)" />
                                <ellipse cx="60" cy="0" rx="30" ry="6" fill="rgba(100, 181, 246, 0.9)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
                            </g>
                        </g>
                        <path d="M 30 20 A 30 6 0 0 0 90 20" fill="none" stroke="rgba(255,255,255,1)" stroke-width="2.5"/>
                        <path d="M 30 194 A 30 6 0 0 0 90 194" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
                        <rect x="35" y="25" width="4" height="165" fill="rgba(255,255,255,0.8)" rx="2"/>
                    </svg>
                    <div class="container-label">C. 圓柱杯</div>
                </div>

                <!-- 容器 D: 方形杯 (重製：方正幾何造型) -->
                <div class="container-wrapper" id="container-d" onclick="selectContainer('d')">
                    <svg viewBox="0 0 120 220" class="glass-svg">
                        <!-- 後方杯緣平直線條 -->
                        <rect x="30" y="15" width="60" height="5" fill="rgba(255,255,255,0.4)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
                        <!-- 直筒玻璃本體 -->
                        <rect x="30" y="20" width="60" height="180" fill="url(#glass-bg)" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" />
                        <!-- 動態水層 -->
                        <g clip-path="url(#clip-d)">
                            <g id="water-d" class="svg-water">
                                <rect x="0" y="0" width="120" height="220" fill="url(#water-grad)" />
                                <!-- 直線水平面 -->
                                <rect x="30" y="0" width="60" height="4" fill="rgba(100, 181, 246, 0.9)" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
                            </g>
                        </g>
                        <!-- 前方杯緣 -->
                        <rect x="29" y="18" width="62" height="4" fill="none" stroke="rgba(255,255,255,1)" stroke-width="2"/>
                        <!-- 兩側銳利直角高光 -->
                        <rect x="32" y="22" width="3" height="176" fill="rgba(255,255,255,0.9)"/>
                        <rect x="85" y="22" width="2" height="176" fill="rgba(255,255,255,0.5)"/>
                    </svg>
                    <div class="container-label">D. 方形杯</div>
                </div>
            </div>
        </div>

        <!-- 控制按鈕 -->
        <div class="controls">
            <button id="start-btn" class="btn" onclick="startRain()" disabled>🌧️ 開始下雨</button>
            <button id="reset-btn" class="btn" onclick="resetExperiment()">🔄 倒掉重來</button>
        </div>

        <!-- 結論區 -->
        <div id="conclusion-area">
            <h3>🔬 實驗結果分析</h3>
            <p id="conclusion-text"></p>
        </div>

    </main>
    
    <!-- 白奶油對話 -->
    <section class="dialogue-container cream-talks" style="margin-top: 10px; display: none;" id="cream-section">
        <div class="dialogue-box">
            <p id="cream-text">哼！這一定是哪裡搞錯了！</p>
        </div>
        <img src="Christmascream.jpg" alt="白奶油園長" class="character">
    </section>

    <script>
        let selectedContainerId = null;
        let isRaining = false;
        let currentRainLevel = 'medium';
        
        const mimiText = document.getElementById('mimi-text');
        const creamSection = document.getElementById('cream-section');
        const creamText = document.getElementById('cream-text');
        const startBtn = document.getElementById('start-btn');
        const rainOverlay = document.getElementById('rain-overlay');
        const baseline = document.getElementById('baseline');
        const conclusionArea = document.getElementById('conclusion-area');
        const conclusionText = document.getElementById('conclusion-text');

        // 完美的物理設定：Y座標越小代表水位越高 (容器底部固定在 Y=200)
        // 根據真實物理：
        // 刻度 1 (Y=175), 刻度 2 (Y=150), 刻度 4 (Y=100)
        const rainData = {
            'light': {
                name: '小雨',
                targets: { 'c': 175, 'd': 175, 'a': 188, 'b': 150 } 
                // C和D完美停在刻度 1。 B 暴衝到刻度 2。
            },
            'medium': {
                name: '中雨',
                targets: { 'c': 150, 'd': 150, 'a': 175, 'b': 100 }
                // C和D完美停在刻度 2。 B 暴衝到刻度 4。 A 停在刻度 1。
            },
            'heavy': {
                name: '大雨',
                targets: { 'c': 100, 'd': 100, 'a': 145, 'b': 30 }
                // C和D完美停在刻度 4。 B 暴衝到快滿出來！
            }
        };

        function setRainLevel(level) {
            if (isRaining) return; // 下雨中不能切換
            currentRainLevel = level;
            
            // 更新按鈕樣式
            document.querySelectorAll('.rain-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + level).classList.add('active');
            
            // 如果已經有結果，切換雨量要重置實驗
            if (baseline.style.display === 'block') {
                resetExperiment();
            }
        }

        function selectContainer(id) {
            if (isRaining) return;

            document.querySelectorAll('.container-wrapper').forEach(el => el.classList.remove('selected'));
            
            selectedContainerId = id;
            document.getElementById('container-' + id).classList.add('selected');
            
            startBtn.disabled = false;
            let containerName = "";
            if(id==='a') containerName = "窄口瓶";
            if(id==='b') containerName = "寬口杯";
            if(id==='c') containerName = "圓柱杯";
            if(id==='d') containerName = "方形杯";

            mimiText.innerHTML = `你選擇了 <strong>${containerName}</strong>。現在是設定在「${rainData[currentRainLevel].name}」，準備好就按下「開始下雨」吧！`;
            
            creamSection.style.display = "none";
            baseline.style.display = "none";
            conclusionArea.style.display = "none";
        }

        function startRain() {
            if (!selectedContainerId) return;
            
            isRaining = true;
            startBtn.disabled = true;
            document.querySelectorAll('.rain-btn').forEach(btn => btn.disabled = true);
            
            mimiText.innerHTML = `嘩啦嘩啦！現在下起 <strong>${rainData[currentRainLevel].name}</strong> 啦！👀 請觀察容器的形狀如何影響水位上升的速度喔！`;
            
            rainOverlay.style.display = 'block';
            createRainDrops(currentRainLevel);

            // 啟動水位上升動畫
            setTimeout(() => {
                 const targets = rainData[currentRainLevel].targets;
                 for (let id in targets) {
                    const waterEl = document.getElementById('water-' + id);
                    waterEl.style.transform = `translateY(${targets[id]}px)`;
                 }
            }, 300);

            setTimeout(stopRain, 3800);
        }

        function stopRain() {
            isRaining = false;
            document.querySelectorAll('.rain-btn').forEach(btn => btn.disabled = false);
            rainOverlay.style.display = 'none';
            
            // 精準計算紅外線基準線的絕對位置
            // 說明：shelf 底座高 25px。SVG 內部容器底部在 Y=200。
            // SVG 總高 220。所以容器底部距離外框底部有 20px 空隙。
            // 水的實際高度 = 200 - targetY。
            // 基準線的 bottom 位置 = shelf(25) + 空隙(20) + 水高(200-targetY)
            const targetY = rainData[currentRainLevel].targets['c'];
            const preciseBottom = 25 + 20 + (200 - targetY) - 1; // 減1px讓2px高的紅線完美居中對齊水面
            baseline.style.bottom = `${preciseBottom}px`;
            baseline.style.display = 'block'; 
            
            // 放下雨量尺
            const ruler = document.getElementById('measuring-ruler');
            if(ruler) ruler.classList.add('ruler-drop-in');

            mimiText.innerHTML = `雨停了！我把『農場專用雨量尺』拿出來囉！這條紅線是 <strong>C(圓柱杯) 和 D(方形杯)</strong> 測量出的「正確雨量高度」。`;
            
            creamSection.style.display = "flex";
            conclusionArea.style.display = "block";
            analyzeResult();
        }

        function analyzeResult() {
            let conclusion = "";
            const levelName = rainData[currentRainLevel].name;

            if (selectedContainerId === 'c' || selectedContainerId === 'd') {
                creamText.innerText = "喵什麼？！這條紅線怎麼剛好卡在邊緣上，而且圓柱杯和方形杯的水一樣高！本喵不服氣！";
                conclusion = `🎉 <strong>恭喜你選對了！請對照旁邊的「雨量尺」！</strong> 🎉<br><br>
                在剛才的<strong>${levelName}</strong>中，你可以看到 **C (圓柱杯)** 和 **D (方形杯)** 的水位完美對齊了紅線，你可以精準地讀出降雨了多少毫米（mm）！<br>
                因為它們的「杯口」和「杯底」一樣大（平底直筒）。不管雨下大還是下小，這種形狀的容器所收集到的水位高度，永遠等於真正的降雨量喔！`;
            } else if (selectedContainerId === 'a') {
                creamText.innerText = "哈哈哈！你看看你選的瓶子，水少得可憐，連紅線的邊都摸不到！";
                conclusion = `💡 <strong>物理學上的美麗誤會喔！來對照一下雨量尺：</strong><br><br>
                A 容器（窄口瓶）瓶口非常窄，所以接到的雨水「總量很少」。少少的水流進大大的肚子裡，所以測量出來的水位會<strong>遠低於</strong>旁邊紅線與尺的實際降雨量。`;
            } else if (selectedContainerId === 'b') {
                creamText.innerText = "哇！你的水怎麼飆得那麼高？難道你那邊下的雨比較大嗎？這不公平！";
                conclusion = `💡 <strong>這是測量雨量時最容易犯的錯誤喔！</strong><br><br>
                B 容器（寬口杯）上面的開口非常大，像漏斗一樣接到了「超級多」的雨水。因為底部很窄小，水全部擠在裡面，你可以看到它的水位在尺上暴衝得非常高！<br>
                所以測量出來的高度會<strong>遠高於</strong>紅線的實際降雨量。`;
            }
            conclusionText.innerHTML = conclusion;
            
            setTimeout(() => {
                conclusionArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 500);
        }

        function resetExperiment() {
            selectedContainerId = null;
            isRaining = false;
            startBtn.disabled = true;
            
            document.querySelectorAll('.container-wrapper').forEach(el => el.classList.remove('selected'));
            
            // 讓水位降回最底端 (Y=220px)
            document.querySelectorAll('.svg-water').forEach(el => {
                el.style.transform = 'translateY(220px)';
            });
            
            rainOverlay.style.display = 'none';
            baseline.style.display = 'none';
            conclusionArea.style.display = 'none';
            creamSection.style.display = "none";
            
            // 收起雨量尺
            const ruler = document.getElementById('measuring-ruler');
            if(ruler) ruler.classList.remove('ruler-drop-in');
            
            mimiText.innerHTML = "喵～水已經倒掉囉！你可以調整雨量大小，再選一個容器試試看！";
            
            while (rainOverlay.firstChild) {
                rainOverlay.removeChild(rainOverlay.firstChild);
            }
        }

        function createRainDrops(level) {
            // 根據雨量決定雨滴數量與下落速度
            let baseCount = 80;
            let speedMultiplier = 1;
            
            if(level === 'light') { baseCount = 30; speedMultiplier = 1.5; }
            if(level === 'heavy') { baseCount = 150; speedMultiplier = 0.7; }
            
            const dropCount = window.innerWidth < 768 ? Math.floor(baseCount * 0.6) : baseCount;
            
            for (let i = 0; i < dropCount; i++) {
                let drop = document.createElement('div');
                drop.classList.add('rain-drop');
                drop.style.left = Math.random() * 100 + '%';
                
                // 大雨雨滴比較粗，小雨比較細
                let width = 2;
                let height = 15;
                if(level === 'heavy') { width = 3; height = 25; }
                if(level === 'light') { width = 1.5; height = 10; }
                
                drop.style.width = width + 'px';
                drop.style.height = height + 'px';
                
                const duration = (Math.random() * 0.3 + 0.4) * speedMultiplier;
                drop.style.animationDuration = duration + 's';
                drop.style.animationDelay = Math.random() * 1.5 + 's';
                rainOverlay.appendChild(drop);
            }
        }
    </script>
</body>
</html>
