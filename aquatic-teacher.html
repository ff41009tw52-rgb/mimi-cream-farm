<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>教師端｜水生植物觀察任務</title>
  <link rel="stylesheet" href="assets/aquatic/aquatic.css?v=20260924-3">
  <link rel="stylesheet" href="assets/aquatic/aquatic-fixes.css?v=20260924-3">
</head>
<body class="teacher-body">
  <header class="topbar teacher-topbar"><a class="brand" href="aquatic.html"><span aria-hidden="true">📋</span><span>水生植物觀察・教師端</span></a><button id="teacher-logout" class="text-button light" type="button" hidden>登出</button></header>
  <main class="app-shell teacher-shell">
    <section id="teacher-login-view" class="teacher-login">
      <form id="teacher-login-form" class="card profile-card">
        <p class="eyebrow">教師專用</p><h1>橘咪咪與白奶油<br>教師管理中心</h1>
        <p>請輸入教師專區密碼。</p>
        <label>教師密碼<input name="password" type="password" inputmode="numeric" autocomplete="current-password" required></label>
        <div class="form-actions"><a class="secondary-button button-link" href="aquatic.html">取消</a><button class="primary-button" type="submit">確定</button></div><p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>
    <section id="teacher-dashboard-view" hidden>
      <div class="page-heading"><div><p class="eyebrow">橘咪咪與白奶油 教師管理中心</p><h1><span id="dashboard-class-title">307班</span>・水生植物觀察</h1></div><button id="teacher-refresh" class="secondary-button" type="button">重新整理</button></div>
      <div id="summary-cards" class="summary-cards"></div>
      <section id="plant-progress-summary" class="card plant-progress-summary" aria-label="各植物完成數"></section>
      <section class="card filters"><label>選擇班級<select id="class-filter"></select></label><label>搜尋座號<input id="student-search" type="search" inputmode="numeric" placeholder="例如：12"></label></section>
      <nav class="teacher-tabs" aria-label="教師端檢視"><button class="active" type="button" data-tab="students">學生進度</button><button type="button" data-tab="photos">全班照片牆</button></nav>
      <section id="students-panel" class="teacher-panel"><div class="table-wrap"><table><thead><tr><th>座號</th><th>植物紀錄</th><th>分類</th><th>環境調查</th><th>狀態</th><th></th></tr></thead><tbody id="student-rows"></tbody></table></div><p id="students-empty" class="empty-state" hidden>目前沒有符合條件的座號。</p></section>
      <section id="photos-panel" class="teacher-panel" hidden><p class="wall-help">選擇植物後，可直接投影查看全班 01～25 號的照片。</p><div id="plant-filter" class="plant-filter" aria-label="選擇照片牆植物"></div><div id="photo-wall" class="photo-wall"></div></section>
    </section>
    <section id="student-detail-view" hidden><button id="detail-back" class="back-button" type="button">← 返回班級名單</button><div id="student-detail"></div></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>window.AQUATIC_API_URL = window.AQUATIC_API_URL || 'https://script.google.com/macros/s/AKfycbxAH8T5Qg6rp9_HacZrw0FTNq7BoOEBTwvxc8Bppu_cMdjdvGJzNQ3cqjR0oKmT9aZG/exec';</script>
  <script type="module" src="assets/aquatic/aquatic-teacher.js?v=20260924-3"></script>
  <script type="module" src="assets/aquatic/aquatic-teacher-login-fix.js?v=20260924-3"></script>
</body>
</html>
