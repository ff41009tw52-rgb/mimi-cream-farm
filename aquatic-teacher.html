<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>教師端｜水生植物觀察任務</title>
  <link rel="stylesheet" href="assets/aquatic/aquatic.css">
</head>
<body class="teacher-body">
  <header class="topbar teacher-topbar"><a class="brand" href="aquatic.html"><span aria-hidden="true">📋</span><span>水生植物觀察・教師端</span></a><button id="teacher-logout" class="text-button light" type="button" hidden>登出</button></header>
  <main class="app-shell teacher-shell">
    <section id="teacher-login-view" class="teacher-login">
      <form id="teacher-login-form" class="card profile-card">
        <p class="eyebrow">教師專用</p><h1>查看全班觀察紀錄</h1>
        <label>教師密碼<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">登入</button><p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>
    <section id="teacher-dashboard-view" hidden>
      <div class="page-heading"><div><p class="eyebrow">班級儀表板</p><h1>全班觀察進度</h1></div><button id="teacher-refresh" class="secondary-button" type="button">重新整理</button></div>
      <div id="summary-cards" class="summary-cards"></div>
      <section class="card filters"><label>選擇班級<select id="class-filter"><option value="">全部班級</option></select></label><label>搜尋學生<input id="student-search" type="search" placeholder="姓名或座號"></label></section>
      <nav class="teacher-tabs" aria-label="教師端檢視"><button class="active" type="button" data-tab="students">學生進度</button><button type="button" data-tab="photos">全班照片牆</button></nav>
      <section id="students-panel" class="teacher-panel"><div class="table-wrap"><table><thead><tr><th>班級</th><th>座號</th><th>姓名</th><th>已觀察</th><th>分類</th><th>心得</th><th></th></tr></thead><tbody id="student-rows"></tbody></table></div><p id="students-empty" class="empty-state" hidden>目前還沒有學生資料。</p></section>
      <section id="photos-panel" class="teacher-panel" hidden><div id="photo-wall" class="photo-wall"></div><p id="photos-empty" class="empty-state" hidden>目前還沒有學生照片。</p></section>
    </section>
    <section id="student-detail-view" hidden><button id="detail-back" class="back-button" type="button">← 返回班級名單</button><div id="student-detail"></div></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>window.AQUATIC_API_URL = window.AQUATIC_API_URL || 'https://aquatic-observation-api.ff41009tw52.workers.dev';</script>
  <script type="module" src="assets/aquatic/aquatic-teacher.js"></script>
</body>
</html>
