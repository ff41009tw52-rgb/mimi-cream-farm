<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>四季農莊：島嶼物語</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 overflow-x-hidden">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // --- 音效引擎 ---
    const useAudio = () => {
      const audioCtx = useRef(null);
      const initAudio = () => {
        if (!audioCtx.current) {
          audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
        }
      };

      const playEffect = (type) => {
        initAudio();
        const now = audioCtx.current.currentTime;
        
        if (type === 'water') {
          const osc = audioCtx.current.createOscillator();
          const gain = audioCtx.current.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.current.destination);
          osc.start();
          osc.stop(now + 0.1);
        } else if (type === 'weed') {
          const bufferSize = audioCtx.current.sampleRate * 0.1;
          const buffer = audioCtx.current.createBuffer(1, bufferSize, audioCtx.current.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = audioCtx.current.createBufferSource();
          noise.buffer = buffer;
          const filter = audioCtx.current.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 1000;
          const gain = audioCtx.current.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.current.destination);
          noise.start();
        } else if (type === 'coin') {
          const osc = audioCtx.current.createOscillator();
          const gain = audioCtx.current.createGain();
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(1500, now + 0.3);
          gain.gain.setValueAtTime(0.5, now); 
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.current.destination);
          osc.start();
          osc.stop(now + 0.4);
        }
      };

      return { playEffect };
    };

    // --- 自定義 UI 元件：手繪尖刺雜草 ---
    const WeedIcon = ({ className }) => (
      <svg viewBox="0 0 100 100" className={className} xmlns="http://www.w3.org/2000/svg">
        <path 
          d="M 25 85 Q 20 60 10 45 Q 30 50 40 65 Q 45 30 50 20 Q 55 30 60 60 Q 80 40 90 35 Q 80 60 75 85 Z" 
          fill="#16a34a" 
          stroke="#14532d" 
          strokeWidth="6" 
          strokeLinejoin="round" 
          strokeLinecap="round" 
        />
      </svg>
    );

    // --- 自定義 UI 元件：專屬肥料袋 ---
    const FertilizerBag = ({ type }) => {
      const config = {
        leaf: { bg: 'bg-green-500', top: 'bg-green-600', text: '葉菜', tie: 'bg-amber-800' },
        root: { bg: 'bg-yellow-600', top: 'bg-yellow-700', text: '根莖', tie: 'bg-amber-900' },
        fruit: { bg: 'bg-purple-500', top: 'bg-purple-600', text: '瓜果', tie: 'bg-purple-900' }
      }[type];

      return (
        <div className="flex flex-col items-center justify-end w-9 h-10 drop-shadow-md transition-transform">
          <div className={`w-5 h-2 ${config.top} rounded-t-sm`}></div>
          <div className={`w-6 h-1.5 ${config.tie} rounded-full z-10 -my-[2px] shadow-sm`}></div>
          <div className={`w-8 h-7 ${config.bg} rounded-b-xl rounded-t-sm flex items-center justify-center shadow-[inset_0_-3px_4px_rgba(0,0,0,0.3)] pb-0.5`}>
            <span className="text-[9px] font-black text-white/95 leading-none tracking-tighter drop-shadow-sm">{config.text}</span>
          </div>
        </div>
      );
    };

    // --- 自定義 UI 元件：專屬種子袋 ---
    const SeedBag = ({ crop }) => {
      const isSpecial = crop.price === 0;
      return (
        <div className={`flex flex-col items-center justify-end w-9 h-10 drop-shadow-md transition-transform relative ${isSpecial ? 'animate-pulse scale-110' : ''}`}>
          <div className={`w-5 h-2 ${isSpecial ? 'bg-yellow-300' : 'bg-amber-700'} rounded-t-sm`}></div>
          <div className={`w-6 h-1.5 ${isSpecial ? 'bg-red-500' : 'bg-amber-900'} rounded-full z-10 -my-[2px] shadow-sm`}></div>
          <div className={`w-8 h-7 ${isSpecial ? 'bg-gradient-to-br from-yellow-300 via-yellow-500 to-orange-500 border border-yellow-200' : 'bg-amber-600'} rounded-b-xl rounded-t-sm flex items-center justify-center shadow-[inset_0_-3px_4px_rgba(0,0,0,0.3)] pb-0.5 overflow-hidden relative`}>
            {isSpecial && <div className="absolute inset-0 bg-white/40 animate-ping rounded-b-xl"></div>}
            <span className="text-[12px] leading-none drop-shadow-md z-10">{crop.icon}</span>
          </div>
          {isSpecial && <span className="absolute -top-1 -right-2 text-[12px] animate-bounce drop-shadow-lg">✨</span>}
        </div>
      );
    };

    // --- 作物數據設定 ---
    const CROPS = {
      SPRING: [
        { id: 'sweetpotatoleaf', name: '地瓜葉', type: 'leaf', price: 100, days: 3, value: 40, icon: '🌿', desc: '【環境】喜高溫多濕，對土壤適應性極強。\n【種植】多以扦插繁殖，生長迅速，需保持土壤濕潤，不需過度施肥即可旺盛生長。' },
        { id: 'bokchoy', name: '青江菜', type: 'leaf', price: 500, days: 4, value: 150, icon: '🥬', desc: '【環境】喜冷涼氣候，日照需充足。\n【種植】種子直播，因根系較淺需勤澆水保持濕潤。極易受十字花科害蟲啃食，需注重防蟲。' },
        { id: 'guava', name: '芭樂', type: 'fruit', price: 1500, days: 8, value: 500, icon: '🍐', desc: '【環境】需全日照，喜好排水良好的砂質壤土。\n【種植】需定時修剪枝條以促進開花結果，適度施用磷鉀肥可大幅提升果實甜度與脆度。' },
      ],
      SUMMER: [
        { id: 'waterspinach', name: '空心菜', type: 'leaf', price: 200, days: 3, value: 80, icon: '🥬', desc: '【環境】極度喜高溫與潮濕，耐澇性強。\n【種植】播種或扦插皆可，莖部中空能適應積水環境。只要水分充足，夏天生長速度極快。' },
        { id: 'loofah', name: '絲瓜', type: 'fruit', price: 800, days: 6, value: 250, icon: '🥒', desc: '【環境】喜高溫多濕，不耐寒，需搭設棚架。\n【種植】攀藤生長，開花後需人工或仰賴昆蟲授粉。必須在果實鮮嫩時採收。' },
        { id: 'mango', name: '芒果', type: 'fruit', price: 2500, days: 12, value: 800, icon: '🥭', desc: '【環境】熱帶果樹，喜高溫乾燥，需充足日照。\n【種植】開花期極忌連續降雨會導致落花。果實發育期需套袋，防止蟲害與烈日曬傷。' },
      ],
      AUTUMN: [
        { id: 'waterbamboo', name: '筊白筍', type: 'root', price: 400, days: 5, value: 150, icon: '🎋', desc: '【環境】需生長於水溫穩定、活水流動的淺水田中。\n【種植】實為菰草受「黑穗菌」共生感染後膨大的幼嫩莖部。水質控制是絕對關鍵。' },
        { id: 'taro', name: '芋頭', type: 'root', price: 1500, days: 9, value: 500, icon: '🥔', desc: '【環境】喜高溫多濕，栽培分為水芋與旱芋兩種。\n【種植】生長期長，需深厚且保水力強的土壤。屬於重肥作物，生長期間需大量養分。' },
        { id: 'pomelo', name: '文旦', type: 'fruit', price: 3500, days: 15, value: 1250, icon: '🍋', desc: '【環境】喜高溫與日照，需排水良好的山坡地。\n【種植】果樹需多年栽培。果實採收後不宜馬上食用，需放置通風處數日進行「辭水」。' },
      ],
      WINTER: [
        { id: 'whiteradish', name: '蘿蔔', type: 'root', price: 600, days: 4, value: 200, icon: '🥕', desc: '【環境】喜冷涼氣候，忌高溫多濕。\n【種植】屬根莖類，種子必須「直播」於深厚、鬆軟的土壤中，若移植或遇硬土會導致變形。' },
        { id: 'cabbage', name: '高麗菜', type: 'leaf', price: 2000, days: 7, value: 750, icon: '🥬', desc: '【環境】極喜冷涼，高山地區日夜溫差大最為適宜。\n【種植】結球期需要大量水分與養分，溫差越大則口感越清脆甘甜。需注意田間排水。' },
        { id: 'strawberry', name: '草莓', type: 'fruit', price: 6000, days: 14, value: 2000, icon: '🍓', desc: '【環境】極度嬌貴，喜冷涼氣候與充足日照，怕雨水。\n【種植】根系淺怕積水，極易染病蟲害。現代多採用高架覆膜種植，除保持通風也避免腐爛。' },
      ],
      SPECIAL: [
        { id: 'golden_peach', name: '黃金仙桃', type: 'fruit', price: 0, days: 10, value: 600, icon: '🍑', desc: '【環境】春季限定的傳說果實，散發出神聖的微光。\n【種植】相傳是天庭掉落的種子，對水分要求極高，成功收成後價值連城，是鎮長夢寐以求的極品。' },
        { id: 'crystal_melon', name: '水晶寶石西瓜', type: 'fruit', price: 0, days: 12, value: 600, icon: '🍉', desc: '【環境】夏季限定，果肉如紅寶石般晶瑩剔透。\n【種植】極度需要充足水分與烈日曝曬，在極端高溫下反而能凝結出絕佳的脆度與甜味。' },
        { id: 'giant_pumpkin', name: '巨無霸南瓜', type: 'fruit', price: 0, days: 15, value: 600, icon: '🎃', desc: '【環境】秋季限定的變異品種，體積異常巨大。\n【種植】種下後會瞬間霸佔整塊農田吸收所有養分。在田地中緩慢膨脹的過程極具視覺震撼力！' },
        { id: 'white_strawberry', name: '初雪白草莓', type: 'fruit', price: 0, days: 14, value: 600, icon: '🍓', desc: '【環境】冬季限定，對溫度極度敏感的嬌貴品種。\n【種植】需要在嚴寒中小心呵護，果實純白如初雪，香氣馥郁，是高級拍賣會上千金難求的珍寶。' }
      ]
    };

    const PLOT_PRICES = [0, 5000, 15000, 30000];

    const getRainProbability = (season) => {
      switch(season) {
        case 'SPRING': return 0.35; 
        case 'SUMMER': return 0.45; 
        case 'AUTUMN': return 0.25; 
        case 'WINTER': return 0.20; 
        default: return 0.2;
      }
    };

    // --- 飛行作物動畫元件 ---
    const FlyingCropComponent = ({ data, onRemove }) => {
      const [active, setActive] = useState(false);
      useEffect(() => {
        const raf = requestAnimationFrame(() => {
            requestAnimationFrame(() => setActive(true));
        });
        // 0.5秒後動畫結束，移除 DOM
        const timer = setTimeout(() => onRemove(data.id), 500);
        return () => { cancelAnimationFrame(raf); clearTimeout(timer); };
      }, [data, onRemove]);

      return (
        <div 
            className="fixed z-[9999] pointer-events-none drop-shadow-2xl flex items-center justify-center"
            style={{
                left: active ? data.endX : data.startX,
                top: active ? data.endY : data.startY,
                transform: `translate(-50%, -50%) scale(${active ? 0.3 : 1.2})`,
                opacity: active ? 0.2 : 1,
                transition: 'all 0.5s cubic-bezier(0.25, 1, 0.5, 1)',
                fontSize: '4rem'
            }}
        >
            {data.icon}
        </div>
      );
    };

    const App = () => {
      const { playEffect } = useAudio();
      
      const [isGameStarted, setIsGameStarted] = useState(false);
      const [farmName, setFarmName] = useState('');

      const [day, setDay] = useState(1);
      const [weather, setWeather] = useState('sunny'); 
      const [gold, setGold] = useState(100); 
      
      const [tutorialStep, setTutorialStep] = useState(0); 
      const [flags, setFlags] = useState({ 
        seenRain: false, seenTyphoon: false, seenQuest: false, seenBug: false, 
        seenWeed: false, seenDay2Water: false, seenHarvest: false,
        seenAfterHarvest: false, seenQuestReward: false, seenForgotWater: false
      });

      const [inventory, setInventory] = useState({ 
        nets: 0, windbreaks: 0, fert_leaf: 0, fert_root: 0, fert_fruit: 0, 
        scissors: 10, chili: 10, seeds: {}, crops: {} 
      }); 
      const [gallery, setGallery] = useState({}); 
      
      const [selectedTool, setSelectedTool] = useState('water');
      const [selectedSeed, setSelectedSeed] = useState(null);
      
      const [showShop, setShowShop] = useState(false); 
      const [shopTab, setShopTab] = useState('buy');
      
      const [schoolQuest, setSchoolQuest] = useState(null); 
      const [showQuestModal, setShowQuestModal] = useState(false);
      
      const [eventQueue, setEventQueue] = useState([]);
      const currentEvent = eventQueue[0]; 
      
      const [flyingCrops, setFlyingCrops] = useState([]);
      const dropZoneRef = useRef(null);
      
      const closeEventModal = () => {
        setEventQueue(prev => prev.slice(1)); 
      };
      
      const [plots, setPlots] = useState(Array(4).fill(null).map((_, i) => ({
        id: i,
        isUnlocked: i === 0, 
        isNetted: false,
        isWindbreaked: false, 
        slots: Array(8).fill(null).map((_, j) => ({
          id: j, crop: null, growth: 0, isWatered: false, isFertilized: false, hasBug: false, hasWeed: false, perfectGrowth: true
        }))
      })));
      
      const [activePlot, setActivePlot] = useState(null);
      const [message, setMessage] = useState("歡迎來到 四季農莊！");
      const [showModal, setShowModal] = useState(null);
      const [saveExists, setSaveExists] = useState(false);

      useEffect(() => {
        const saved = localStorage.getItem('farm_tycoon_save_v2');
        if (saved) setSaveExists(true);
      }, []);

      const removeFlyingCrop = useCallback((id) => {
        setFlyingCrops(prev => prev.filter(c => c.id !== id));
      }, []);

      // --- 點擊收成與飛行觸發邏輯 ---
      const handleHarvestClick = (e, plotId, slotId, crop, isGiant) => {
        e.stopPropagation(); // 避免觸發底層的其他點擊事件
        
        // 取得點擊作物的起始座標
        const rect = e.currentTarget.getBoundingClientRect();
        const startX = rect.left + rect.width / 2;
        const startY = rect.top + rect.height / 2;

        // 取得收成箱的目標座標
        let endX = window.innerWidth / 2;
        let endY = 0;
        if (dropZoneRef.current) {
            const boxRect = dropZoneRef.current.getBoundingClientRect();
            endX = boxRect.left + boxRect.width / 2;
            endY = boxRect.top + boxRect.height / 2;
        }

        // 推入飛行陣列觸發動畫
        const newId = Date.now() + Math.random();
        setFlyingCrops(prev => [...prev, { id: newId, icon: crop.icon, startX, startY, endX, endY }]);

        // 延遲播放金幣聲音，讓作物「飛到箱子」時才響
        setTimeout(() => playEffect('coin'), 400);

        // 立即處理後台收成邏輯
        processHarvest(plotId, slotId, crop, isGiant);
      };

      const processHarvest = (plotId, slotId, crop, isGiant) => {
        const newPlots = JSON.parse(JSON.stringify(plots));
        const targetPlot = newPlots[plotId];
        
        if (isGiant) {
          targetPlot.slots.forEach(s => { 
            s.crop = null; s.growth = 0; s.hasBug = false; s.hasWeed = false; s.isFertilized = false; s.perfectGrowth = true; 
          });
        } else {
          const s = targetPlot.slots[slotId];
          s.crop = null; s.growth = 0; s.hasBug = false; s.hasWeed = false; s.isFertilized = false; s.perfectGrowth = true; 
        }

        setPlots(newPlots);

        // 檢查收成後，畫面上是否還有其他「已經成熟」的作物
        const remainingMature = newPlots.some(p => p.slots.some(s => s.crop && s.growth >= s.crop.days));

        setGallery(prevG => ({
          ...prevG,
          [crop.id]: { unlocked: true, perfect: prevG[crop.id]?.perfect || true } 
        }));

        setInventory(inv => ({
          ...inv,
          crops: { ...inv.crops, [crop.id]: (inv.crops?.[crop.id] || 0) + 1 }
        }));

        setMessage(`✨ 收成了 ${crop.name}！已存入倉庫，請至商店變現。`);

        // 當畫面上的成熟作物全部被清空時，才觸發第一次收成獎勵與進階教學
        setFlags(prev => {
          if (!prev.seenAfterHarvest && !remainingMature) {
            setEventQueue(q => [...q, { type: 'tutorial_after_harvest' }]);
            setInventory(inv => ({ ...inv, fert_leaf: (inv.fert_leaf||0) + 1, nets: (inv.nets||0) + 1 }));
            setTutorialStep(7); // 開啟進階任務1：販賣教學
            return { ...prev, seenAfterHarvest: true };
          }
          return prev;
        });
      };

      useEffect(() => {
        if (tutorialStep === 2 && (inventory.seeds['sweetpotatoleaf'] || 0) > 0) setTutorialStep(3);
        if (tutorialStep === 3 && selectedTool === 'seed' && selectedSeed?.id === 'sweetpotatoleaf') setTutorialStep(4);
        if (tutorialStep === 4 && plots[0].slots.some(s => s.crop)) setTutorialStep(5);
        if (tutorialStep === 5) {
          const plantedSlots = plots[0].slots.filter(s => s.crop);
          if (plantedSlots.length > 0 && plantedSlots.every(s => s.isWatered)) {
            setTutorialStep(6);
          }
        }
        if (tutorialStep === 6 && day > 1) setTutorialStep(0);
      }, [tutorialStep, inventory.seeds, selectedTool, selectedSeed, plots, day]);

      const handleSave = () => {
        try {
          const stateToSave = {
            isGameStarted, farmName, day, weather, gold, inventory, gallery, plots, schoolQuest, flags, tutorialStep
          };
          localStorage.setItem('farm_tycoon_save_v2', JSON.stringify(stateToSave));
          setMessage("💾 遊戲進度已成功儲存！");
          setSaveExists(true);
          playEffect('coin');
          setShowModal(null);
        } catch (e) {
          setMessage("❌ 存檔失敗，請確認瀏覽器設定。");
        }
      };

      const handleLoad = () => {
        try {
          const saved = localStorage.getItem('farm_tycoon_save_v2');
          if (saved) {
            const state = JSON.parse(saved);
            setIsGameStarted(state.isGameStarted);
            setFarmName(state.farmName);
            setDay(state.day);
            setWeather(state.weather);
            setGold(state.gold);
            setInventory({ ...state.inventory, crops: state.inventory.crops || {} });
            setGallery(state.gallery || {});
            setPlots(state.plots);
            setSchoolQuest(state.schoolQuest);
            setFlags(state.flags || { seenRain: false, seenTyphoon: false, seenQuest: false, seenBug: false, seenWeed: false, seenDay2Water: false, seenHarvest: false, seenAfterHarvest: false, seenQuestReward: false, seenForgotWater: false });
            setTutorialStep(state.tutorialStep || 0);
            
            setMessage("📂 遊戲進度讀取成功！歡迎回來！");
            setShowModal(null);
            setEventQueue([]); 
            setActivePlot(null);
            playEffect('water');
          }
        } catch (e) {
          setMessage("❌ 讀檔失敗，存檔資料可能已損毀。");
        }
      };

      const season = day <= 90 ? 'SPRING' : day <= 180 ? 'SUMMER' : day <= 270 ? 'AUTUMN' : 'WINTER';
      const seasonName = { SPRING: '春', SUMMER: '夏', AUTUMN: '秋', WINTER: '冬' }[season];
      const seasonColor = { SPRING: 'bg-green-100', SUMMER: 'bg-yellow-100', AUTUMN: 'bg-orange-100', WINTER: 'bg-blue-100' }[season];

      const processNextDay = () => {
        if (day >= 365) {
          setShowModal('result');
          return;
        }
        
        let hasDeadCrops = false;
        let typhoonDamageCount = 0;
        
        const nextDayNum = day + 1;
        const nextSeason = nextDayNum <= 90 ? 'SPRING' : nextDayNum <= 180 ? 'SUMMER' : nextDayNum <= 270 ? 'AUTUMN' : 'WINTER';
        
        const isTyphoonNext = (nextSeason === 'SUMMER' || nextSeason === 'AUTUMN') && Math.random() < 0.08;
        const isRainingNext = nextDayNum > 3 ? Math.random() < getRainProbability(nextSeason) : false;
        const nextWeatherType = isTyphoonNext ? 'typhoon' : (isRainingNext ? 'rainy' : 'sunny');

        // 在處理下一天前，檢查今天是否有生長中的作物「忘記澆水」
        const forgotWaterYesterday = plots.some(p => p.slots.some(s => s.crop && s.growth < s.crop.days && !s.isWatered));

        const nextPlots = plots.map(plot => {
          const updatedSlots = plot.slots.map(slot => {
            if (!slot.crop) return slot;
            
            const isMature = slot.growth >= slot.crop.days;
            
            if (weather === 'typhoon' && !plot.isWindbreaked && !isMature) {
              if (Math.random() < 0.5) { 
                typhoonDamageCount++;
                return { id: slot.id, crop: null, growth: 0, isWatered: false, isFertilized: false, hasBug: false, hasWeed: false, perfectGrowth: true };
              }
            }

            if (slot.hasBug || slot.hasWeed) {
              hasDeadCrops = true;
              return { id: slot.id, crop: null, growth: 0, isWatered: false, isFertilized: false, hasBug: false, hasWeed: false, perfectGrowth: true };
            }

            let newGrowth = slot.growth;
            let stillPerfect = slot.perfectGrowth;
            let bug = slot.hasBug;
            let weed = slot.hasWeed;

            if (!isMature) {
              if (!plot.isNetted && !bug && Math.random() < 0.15) { bug = true; stillPerfect = false; }
              if (!weed && Math.random() < 0.2) { weed = true; stillPerfect = false; }
            }

            if (slot.isWatered || weather === 'typhoon') {
              newGrowth += 1;
            } 
            
            if (!slot.isWatered && weather !== 'typhoon' || bug || weed) {
              stillPerfect = false;
            }

            return { 
              ...slot, 
              growth: newGrowth, 
              isWatered: (nextWeatherType === 'rainy' || nextWeatherType === 'typhoon') ? true : false, 
              isFertilized: false, 
              hasBug: bug, 
              hasWeed: weed, 
              perfectGrowth: stillPerfect 
            };
          });

          const hasMatureCrop = updatedSlots.some(s => s.crop && s.growth >= s.crop.days);

          return {
            ...plot,
            isNetted: hasMatureCrop ? false : plot.isNetted,
            slots: updatedSlots
          };
        });

        const currentHasBug = nextPlots.some(p => p.slots.some(s => s.hasBug));
        const currentHasWeed = nextPlots.some(p => p.slots.some(s => s.hasWeed));
        const currentHasMature = nextPlots.some(p => p.slots.some(s => s.crop && s.growth >= s.crop.days));

        setPlots(nextPlots);
        
        let newQuest = null;
        if (schoolQuest) {
          setSchoolQuest(prev => (prev && prev.daysLeft > 1) ? { ...prev, daysLeft: prev.daysLeft - 1 } : null);
        } else {
          if (nextDayNum > 5 && Math.random() < 0.15) { 
            const seasonCrops = CROPS[nextSeason].slice(0, 2); 
            const randomCrop = seasonCrops[Math.floor(Math.random() * seasonCrops.length)];
            newQuest = { crop: randomCrop, required: 8, daysLeft: 5 }; 
            setSchoolQuest(newQuest);
          }
        }

        setDay(nextDayNum);
        setWeather(nextWeatherType);
        setShowModal(null);
        
        let newEvents = [];

        // 若第一次忘記澆水，推入提示事件
        if (forgotWaterYesterday && !flags.seenForgotWater) {
          newEvents.push({ type: 'tutorial_forgot_water' });
          setFlags(prev => ({...prev, seenForgotWater: true}));
        }

        if (nextDayNum === 2 && !flags.seenDay2Water) {
          newEvents.push({ type: 'tutorial_day2_water' });
          setFlags(prev => ({...prev, seenDay2Water: true}));
        }
        if (currentHasBug && !flags.seenBug) {
          newEvents.push({ type: 'tutorial_bug' });
          setFlags(prev => ({...prev, seenBug: true}));
        }
        if (currentHasWeed && !flags.seenWeed) {
          newEvents.push({ type: 'tutorial_weed' });
          setFlags(prev => ({...prev, seenWeed: true}));
        }
        if (currentHasMature && !flags.seenHarvest) {
          newEvents.push({ type: 'tutorial_harvest' });
          setFlags(prev => ({...prev, seenHarvest: true}));
        }
        if (nextWeatherType === 'rainy' && !flags.seenRain) {
          newEvents.push({ type: 'tutorial_rain' });
          setFlags(prev => ({...prev, seenRain: true}));
        }
        if (hasDeadCrops) {
          newEvents.push({ type: 'crop_died' });
        }

        if (nextDayNum === 20) {
          newEvents.push({ type: 'irrigation_upgrade' });
        }
        if (isTyphoonNext) {
          newEvents.push({ type: 'typhoon_warning', isFirst: !flags.seenTyphoon });
          if (!flags.seenTyphoon) {
            setFlags(prev => ({...prev, seenTyphoon: true}));
            // 新手教學：第一次遇到颱風送 1 個防風網
            setInventory(inv => ({ ...inv, windbreaks: (inv.windbreaks || 0) + 1 }));
          }
        }
        if (typhoonDamageCount > 0) {
          newEvents.push({ type: 'typhoon_damage', count: typhoonDamageCount });
        }
        if (newQuest) {
          newEvents.push({ type: 'school_quest', data: newQuest });
          if (!flags.seenQuest) setFlags(prev => ({...prev, seenQuest: true}));
        }
        
        setEventQueue(newEvents);

        if (typhoonDamageCount > 0) {
          setMessage(`😭 災情回報：昨晚的颱風摧毀了你 ${typhoonDamageCount} 株缺乏保護的作物！`);
          playEffect('weed');
        } else if (hasDeadCrops) {
          setMessage("警告：有作物因為未處理蟲害或雜草而枯死了！");
          playEffect('weed');
        } else {
          if (nextWeatherType === 'typhoon') {
            setMessage(`第 ${nextDayNum} 天颱風來襲 🌀！外面狂風暴雨，農田自動澆滿水了。`);
          } else if (nextWeatherType === 'rainy') {
            setMessage(`第 ${nextDayNum} 天早安！今天下雨了 🌧️，田地都已經自動吸滿水份囉！`);
          } else {
            setMessage(`第 ${nextDayNum} 天早安！晴空萬里 ☀️，別忘了幫作物澆水喔。`);
          }
        }
        
        if (nextDayNum % 100 === 0 && nextDayNum <= 300) setShowModal('contest');
      };

      const handleSlotClick = (plotId, slotId) => {
        setPlots(prev => {
          const newPlots = JSON.parse(JSON.stringify(prev));
          const targetPlot = newPlots[plotId];
          const targetSlot = targetPlot.slots[slotId];

          if (!targetPlot.isUnlocked) return prev; 
          
          const isGiantPumpkin = targetPlot.slots[0]?.crop?.id === 'giant_pumpkin';

          if (selectedTool === 'water') {
            let wateredAny = false;
            if (day >= 20 || isGiantPumpkin) {
              targetPlot.slots.forEach(s => {
                if (s.crop && !s.isWatered) {
                  s.isWatered = true;
                  wateredAny = true;
                }
              });

              if (!wateredAny) {
                setMessage(weather === 'rainy' ? "今天是雨天，不需要人工澆水喔！" : "此區塊目前沒有需要澆水的作物！");
                return prev; 
              }
              playEffect('water');
              setMessage(`💦 灑水完成！第 ${plotId + 1} 區的作物皆已吸滿水分！`);
            } else {
              if (targetSlot.crop && !targetSlot.isWatered) {
                targetSlot.isWatered = true;
                wateredAny = true;
              }
              if (!wateredAny) {
                setMessage(weather === 'rainy' ? "今天是雨天，不需要人工澆水喔！" : "這格沒有需要澆水的作物！");
                return prev; 
              }
              playEffect('water');
              setMessage(`💧 已為該格作物澆水！`);
            }
          } 
          
          else if (selectedTool === 'weed') {
            if (isGiantPumpkin) {
              const hasAnyWeed = targetPlot.slots.some(s => s.hasWeed);
              if (!hasAnyWeed) return prev;
              if (inventory.scissors <= 0) {
                setMessage("除草剪刀已完全損壞，請至商店購買新的剪刀！");
                return prev;
              }
              targetPlot.slots.forEach(s => s.hasWeed = false);
              setInventory(inv => ({ ...inv, scissors: inv.scissors - 1 }));
              playEffect('weed');
              setMessage(`✨ 割除巨無霸南瓜周圍的雜草成功！(剪刀剩餘 ${inventory.scissors - 1} 次)`);
            } else {
              if (!targetSlot.hasWeed) return prev; 
              if (inventory.scissors <= 0) {
                setMessage("除草剪刀已完全損壞，請至商店購買新的剪刀！");
                return prev;
              }
              targetSlot.hasWeed = false;
              setInventory(inv => ({ ...inv, scissors: inv.scissors - 1 }));
              playEffect('weed');
              setMessage(`✨ 割除雜草成功！(剪刀剩餘 ${inventory.scissors - 1} 次)`);
            }
          } 
          
          else if (selectedTool === 'chili') {
            if (isGiantPumpkin) {
              const hasAnyBug = targetPlot.slots.some(s => s.hasBug);
              if (!hasAnyBug) return prev;
              if (inventory.chili <= 0) {
                setMessage("辣椒水已耗盡，請至商店購買補充包！");
                return prev;
              }
              targetPlot.slots.forEach(s => s.hasBug = false);
              setInventory(inv => ({ ...inv, chili: inv.chili - 1 }));
              playEffect('water'); 
              setMessage(`✨ 成功驅除巨無霸南瓜上的害蟲！(剩餘 ${inventory.chili - 1} 次)`);
            } else {
              if (!targetSlot.hasBug) return prev; 
              if (inventory.chili <= 0) {
                setMessage("辣椒水已耗盡，請至商店購買補充包！");
                return prev;
              }
              targetSlot.hasBug = false;
              setInventory(inv => ({ ...inv, chili: inv.chili - 1 }));
              playEffect('water'); 
              setMessage(`✨ 噴灑辣椒水驅蟲成功！(剩餘 ${inventory.chili - 1} 次)`);
            }
          } 
          
          else if (selectedTool.startsWith('fert_')) {
            const fertType = selectedTool.split('_')[1]; 
            const fertNames = { leaf: '氮肥', root: '磷肥', fruit: '鉀肥' };
            const fertName = fertNames[fertType];

            if (inventory[selectedTool] <= 0) {
              setMessage(`${fertName}庫存不足，請去商店購買！`);
              return prev;
            }

            let fertilizedAny = false;
            let alreadyFertilizedAny = false;
            let wrongTypeAny = false;
            
            targetPlot.slots.forEach(s => {
              if (s.crop && s.growth < s.crop.days) {
                if (s.crop.type === fertType) {
                  if (!s.isFertilized) {
                    s.growth += 1;
                    s.isFertilized = true; 
                    fertilizedAny = true;
                  } else {
                    alreadyFertilizedAny = true; 
                  }
                } else {
                  wrongTypeAny = true;
                }
              }
            });

            if (!fertilizedAny) {
              if (alreadyFertilizedAny) {
                setMessage(`此區塊對應的作物今天都已經施過肥了，太肥會死掉，請明天再來！`);
              } else if (wrongTypeAny) {
                setMessage(`此區塊沒有適合施打【${fertName}】的作物類型！請確認作物屬性。`);
              } else {
                setMessage("此區塊目前沒有生長中的作物可以施肥！");
              }
              return prev;
            }
            
            let netBrokeMsg = "";
            const hasMature = targetPlot.slots.some(s => s.crop && s.growth >= s.crop.days);
            if (hasMature && targetPlot.isNetted) {
              targetPlot.isNetted = false;
              netBrokeMsg = " (作物成熟撐破了防蟲網！)";
            }

            setInventory(inv => ({ ...inv, [selectedTool]: Math.max(0, inv[selectedTool] - 1) }));
            playEffect('water'); 
            setMessage(`✨ 施打${fertName}成功！第 ${plotId + 1} 區對應屬性的作物生長進度縮短了 1 天。${netBrokeMsg}`);
            
            // 進階肥料教學完成檢查
            if (tutorialStep === 8) setTutorialStep(9);
          }

          else if (selectedTool === 'seed' && selectedSeed) {
            const isOccupied = targetPlot.slots.some(s => s.crop !== null);
            if (isOccupied) {
              setMessage("防呆警告：此區塊尚有植物，請先收成完畢再重新種植！");
              return prev;
            }
            
            if (!selectedSeed?.id || (inventory.seeds[selectedSeed.id] || 0) <= 0) {
              setMessage("種子庫存不足！請先去商店購買。");
              return prev;
            }
            
            setInventory(inv => ({
              ...inv,
              seeds: { ...inv.seeds, [selectedSeed.id]: Math.max(0, inv.seeds[selectedSeed.id] - 1) }
            }));
            
            targetPlot.slots = targetPlot.slots.map(s => ({
              ...s,
              crop: selectedSeed,
              growth: 0,
              perfectGrowth: true,
              isWatered: weather === 'rainy' ? true : false, 
              isFertilized: false, 
              hasBug: false,
              hasWeed: false
            }));
            
            setMessage(`消耗了 1 包 [${selectedSeed.name || '未知'}種子]，在第 ${plotId + 1} 區種滿了！`);
            playEffect('water');
            
            if (inventory.seeds[selectedSeed.id] <= 1) {
              setSelectedTool('water');
              setSelectedSeed(null);
            }
          } 

          return newPlots;
        });
      };

      const buyItem = (type, cost) => {
        if (gold >= cost) {
          setGold(g => g - cost);
          if (type === 'net') {
            setInventory(i => ({ ...i, nets: i.nets + 1 }));
            setMessage("購買防蟲紗網成功！可在農田管理頁面部署。");
          } else if (type === 'fert_leaf') {
            setInventory(i => ({ ...i, fert_leaf: i.fert_leaf + 1 }));
            setMessage("購買氮肥成功！可加速「葉菜類」生長。");
          } else if (type === 'fert_root') {
            setInventory(i => ({ ...i, fert_root: i.fert_root + 1 }));
            setMessage("購買磷肥成功！可加速「根莖類」生長。");
          } else if (type === 'fert_fruit') {
            setInventory(i => ({ ...i, fert_fruit: i.fert_fruit + 1 }));
            setMessage("購買鉀肥成功！可加速「瓜果類」生長。");
          } else if (type === 'windbreak') {
            setInventory(i => ({ ...i, windbreaks: i.windbreaks + 1 }));
            setMessage("購買防風網成功！能抵禦強烈颱風。");
          } else if (type === 'scissors') {
            setInventory(i => ({ ...i, scissors: i.scissors + 10 }));
            setMessage("購買除草剪刀成功！獲得 10 次除草耐用度。");
          } else if (type === 'chili') {
            setInventory(i => ({ ...i, chili: i.chili + 10 }));
            setMessage("購買辣椒水成功！獲得 10 次驅蟲噴灑量。");
          }
        } else {
          setMessage("餘額不足，無法購買這項物品。");
        }
      };

      const sellCrop = (cropId, amount, unitPrice) => {
        const totalEarn = amount * unitPrice;
        setGold(g => g + totalEarn);
        setInventory(inv => ({
          ...inv,
          crops: { ...inv.crops, [cropId]: inv.crops[cropId] - amount }
        }));
        playEffect('coin');
        setMessage(`販賣了 ${amount} 份作物，獲得 $${totalEarn.toLocaleString()}！`);

        // 檢查販賣任務
        if (tutorialStep === 7) setTutorialStep(8);
      };

      const buyPlot = (plotId, price) => {
        if (gold >= price) {
          setGold(g => g - price);
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isUnlocked: true } : p));
          setMessage(`🎉 成功解鎖 第 ${plotId + 1} 區農田！農莊規模擴大了！`);
          playEffect('coin');
        } else {
          setMessage(`資金不足！解鎖 第 ${plotId + 1} 區需要 $${price.toLocaleString()}。`);
        }
      };

      const applyNet = (plotId) => {
        const hasMature = plots[plotId].slots.some(s => s.crop && s.growth >= s.crop.days);
        if (hasMature) {
          setMessage("此區塊已有作物成熟，空間不足以架設防蟲網！");
          return;
        }

        if (inventory.nets > 0 && !plots[plotId].isNetted) {
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isNetted: true } : p));
          setInventory(inv => ({ ...inv, nets: Math.max(0, inv.nets - 1) }));
          setMessage(`第 ${plotId + 1} 區已經罩上防蟲紗網，蟲子飛不進來了！`);
          
          // 進階防蟲網教學完成檢查
          if (tutorialStep === 9) setTutorialStep(0);
        }
      };

      const applyWindbreak = (plotId) => {
        if (inventory.windbreaks > 0 && !plots[plotId].isWindbreaked) {
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isWindbreaked: true } : p));
          setInventory(inv => ({ ...inv, windbreaks: Math.max(0, inv.windbreaks - 1) }));
          setMessage(`第 ${plotId + 1} 區已經架設防風網，能抵禦強風侵襲！`);
        }
      };

      const handleQuestDeliver = () => {
        const required = schoolQuest.required;
        const cropId = schoolQuest.crop.id;
        const currentAmount = inventory.crops?.[cropId] || 0;

        // 嚴格防呆檢查
        if (currentAmount < required) {
            setMessage(`⚠️ 庫存不足！還差 ${required - currentAmount} 個。`);
            return;
        }
        
        setGold(g => g + (schoolQuest.crop.value * 3 * required));
        setInventory(inv => ({
            ...inv,
            crops: { ...inv.crops, [cropId]: currentAmount - required }
        }));
        
        const seasonRewardMap = { SPRING: 'golden_peach', SUMMER: 'crystal_melon', AUTUMN: 'giant_pumpkin', WINTER: 'white_strawberry' };
        const rewardId = seasonRewardMap[season];
        
        setInventory(inv => ({
            ...inv,
            seeds: { ...inv.seeds, [rewardId]: (inv.seeds[rewardId] || 0) + 1 }
        }));
        
        playEffect('coin');
        setSchoolQuest(null);
        setShowQuestModal(false);
        
        if (!flags.seenQuestReward) {
            setFlags(f => ({ ...f, seenQuestReward: true }));
            setEventQueue(q => [...q, { type: 'tutorial_special_seed', crop: CROPS.SPECIAL.find(c=>c.id === rewardId) }]);
        } else {
            setMessage(`🎉 委託完成！獲得 3 倍獎金與【傳說種子 x1】！`);
        }
      };

      return (
        <div className={`min-h-screen p-2 md:p-4 font-sans text-slate-800 ${seasonColor} transition-colors duration-1000 select-none relative overflow-x-hidden pb-24`}>
          
          <style>{`
            @keyframes rainFall {
              0% { transform: translateY(-100%); opacity: 0; }
              20% { opacity: 1; }
              80% { opacity: 1; }
              100% { transform: translateY(300%); opacity: 0; }
            }
            .animate-rain { animation: rainFall 0.8s linear infinite; }
            .rain-delay-1 { animation-delay: 0.2s; }
            .rain-delay-2 { animation-delay: 0.5s; }
            .rain-delay-3 { animation-delay: 0.7s; }
            
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
          `}</style>

          {/* 飛行作物動畫層 */}
          {flyingCrops.map(fc => (
            <FlyingCropComponent key={fc.id} data={fc} onRemove={removeFlyingCrop} />
          ))}

          {/* --- 新手教學：步驟浮動提示框 (強制隱藏於彈窗開啟時) --- */}
          {tutorialStep > 1 && !currentEvent && !showModal && !showShop && !showQuestModal && (
            <div className="fixed bottom-10 md:bottom-8 left-0 right-0 z-[40] flex justify-center pointer-events-none px-4">
              <div className="bg-blue-600 text-white px-4 py-3 md:px-6 md:py-4 rounded-2xl shadow-2xl animate-bounce border-4 border-blue-400 max-w-md w-full text-center pointer-events-none">
                <div className="font-black text-base md:text-lg mb-1 md:mb-2 text-yellow-300">
                  {tutorialStep >= 7 ? `🎓 進階任務 (${tutorialStep - 6}/3)` : `🎓 新手任務 (${tutorialStep - 1}/5)`}
                </div>
                <div className="text-[11px] md:text-sm font-bold leading-relaxed">
                  {tutorialStep === 2 && "第一步：請點擊右上角的「🛒 商店」，購買一包【地瓜葉】種子！"}
                  {tutorialStep === 3 && "第二步：太棒了！現在請在左側「農具清單」中，點選裝備剛剛購買的【地瓜葉】。"}
                  {tutorialStep === 4 && "第三步：請點擊右側的「第 1 區」農田，進入該區塊，並點擊任何一塊空地將種子種下！"}
                  {tutorialStep === 5 && <span>第四步：植物必須<span className="text-yellow-300 font-black text-base md:text-lg mx-1">【每天】</span>澆水！請裝備左側的「💧 單格澆水」，將<span className="underline">所有剛種下的植物</span>都點擊澆滿水分。</span>}
                  {tutorialStep === 6 && "最後一步：完美！確認植物【都有澆水】後，點擊右上角的「🌙 睡覺 ➔」進入下一天！等待它們成熟吧。"}
                  {tutorialStep === 7 && "第一步：剛收成的作物都在倉庫裡！請點擊右上角「🛒 商店」，切換到「賣出農產」將其賣掉變現吧！"}
                  {tutorialStep === 8 && "第二步：政府送了肥料！請確保田裡有種植「地瓜葉」，然後裝備左側的【🧪 氮肥(葉菜)】對它點擊施肥加速生長！"}
                  {tutorialStep === 9 && "最後一步：政府還送了防蟲網！請點擊進入農田區塊，點選上方的「部署防蟲網」，保護農田免受蟲害！(別忘了也要幫植物澆水喔！)"}
                </div>
              </div>
            </div>
          )}

          {/* --- 開場畫面 / 觸發新手教學 --- */}
          {!isGameStarted && (
            <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-md flex items-center justify-center p-4 z-[100] overflow-y-auto hide-scrollbar">
              <div className="bg-white p-6 md:p-8 rounded-[2.5rem] max-w-2xl w-full shadow-2xl animate-in zoom-in duration-500 my-auto">
                <h1 className="text-3xl md:text-4xl font-black text-center mb-6 text-emerald-700">🌾 四季農莊：島嶼物語</h1>
                
                <div className="space-y-4 text-slate-700 font-bold text-sm bg-emerald-50 p-4 md:p-6 rounded-3xl mb-6 border-2 border-emerald-100 max-h-[40vh] overflow-y-auto hide-scrollbar">
                  <p className="text-sm md:text-base text-emerald-800">歡迎來到台灣專屬的農業經營模擬器！在這裡，你將體驗為期 365 天的農夫生活：</p>
                  <ul className="space-y-3 mt-4 text-xs md:text-sm">
                    <li className="flex items-start gap-2"><span className="text-xl">🌦️</span> <span><strong className="text-blue-700">四季變化與天氣</strong>：春雨、梅雨、秋颱、冬旱。雨天免澆水，但要提防颱風摧毀心血！</span></li>
                    <li className="flex items-start gap-2"><span className="text-xl">🥭</span> <span><strong className="text-green-700">台灣在地蔬果</strong>：種植大甲芋頭、愛文芒果等 12 種在地作物，體驗真實生長週期。</span></li>
                    <li className="flex items-start gap-2"><span className="text-xl">🏫</span> <span><strong className="text-amber-700">小鎮特殊委託</strong>：接取校長的委託，學習市場「供需法則」賺取 3 倍利潤。</span></li>
                    <li className="flex items-start gap-2"><span className="text-xl">🛡️</span> <span><strong className="text-purple-700">防災與生態管理</strong>：架設防蟲紗網與防風網，學習農業風險管理。</span></li>
                  </ul>
                </div>

                <div className="mb-6">
                  <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3 text-center">
                    請為你的農莊取個響亮的名字 (最多 8 個字)
                  </label>
                  <input
                    type="text"
                    maxLength={8}
                    placeholder="例如：開心農莊"
                    value={farmName}
                    onChange={(e) => setFarmName(e.target.value)}
                    className="w-full text-xl md:text-2xl font-black text-center text-slate-800 p-3 md:p-4 rounded-2xl border-4 border-slate-200 focus:border-emerald-500 focus:outline-none transition-colors"
                  />
                </div>

                <div className="flex flex-col gap-3 md:gap-4">
                  <button
                    onClick={() => {
                      if (!farmName.trim()) setFarmName('開心農莊');
                      setIsGameStarted(true);
                      setTutorialStep(1); 
                    }}
                    className="w-full bg-emerald-600 text-white py-4 md:py-5 rounded-2xl font-black text-lg md:text-xl tracking-widest hover:bg-emerald-700 active:scale-95 transition-all shadow-lg hover:shadow-emerald-600/50"
                  >
                    開始新經營！
                  </button>
                  
                  {saveExists && (
                    <button
                      onClick={handleLoad}
                      className="w-full bg-indigo-100 text-indigo-700 py-3 md:py-4 rounded-2xl font-black text-lg md:text-xl tracking-widest hover:bg-indigo-200 active:scale-95 transition-all shadow-md"
                    >
                      📂 繼續上次的進度
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 新手教學 Step 1 彈窗 */}
          {tutorialStep === 1 && (
            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-[110]">
              <div className="bg-white p-8 rounded-[2.5rem] max-w-md w-full text-center shadow-2xl animate-in zoom-in duration-300">
                <div className="text-6xl mb-4">👨‍🌾</div>
                <h2 className="text-2xl font-black mb-4 text-emerald-800">歡迎來到四季農莊！</h2>
                <p className="text-slate-600 font-bold text-sm mb-8 leading-relaxed">
                  看起來你是剛來到這座島嶼的新手農夫呢。<br/>不用擔心，我會一步一步教你如何種出第一批作物！<br/><br/>準備好開始你的農業生活了嗎？
                </p>
                <div className="flex flex-col gap-3">
                  <button onClick={() => setTutorialStep(2)} className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black text-lg hover:bg-emerald-700 transition-colors shadow-md">
                    開始新手教學！
                  </button>
                  <button onClick={() => setTutorialStep(0)} className="w-full bg-slate-100 text-slate-500 py-3 rounded-2xl font-bold text-sm hover:bg-slate-200 transition-colors">
                    我已經是老手了，跳過教學
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* RWD 頂部資訊欄 */}
          <div className="max-w-4xl mx-auto bg-white/80 backdrop-blur rounded-3xl p-4 md:p-6 shadow-xl mb-4 md:mb-6 flex flex-col md:flex-row gap-4 justify-between items-center border border-white/50 relative z-40">
            
            <div className="flex gap-4 items-center w-full md:w-auto justify-between md:justify-start">
              <div className="bg-slate-800 text-white p-2 md:p-3 rounded-2xl text-center min-w-[70px] md:min-w-[80px]">
                <div className="text-[9px] md:text-[10px] uppercase opacity-60">天數</div>
                <div className="text-lg md:text-xl font-black">{day}</div>
              </div>
              <div>
                <div className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-tighter">當前天氣</div>
                <div className="text-xl md:text-2xl font-black flex items-center gap-2">
                  <span className="text-3xl md:text-4xl cursor-help hover:scale-110 transition-transform" title={`${seasonName}季 - ${weather === 'typhoon' ? '狂風暴雨' : weather === 'rainy' ? '今日雨天免澆水' : '晴空萬里'}`}>
                    {weather === 'typhoon' ? '🌀' : weather === 'rainy' ? '🌧️' : '☀️'}
                  </span>
                </div>
              </div>
            </div>
            
            <div className="flex flex-wrap items-center justify-center gap-2 md:gap-4 w-full md:w-auto">
              {schoolQuest && (
                <button 
                  onClick={() => setShowQuestModal(true)}
                  className="bg-gradient-to-r from-yellow-300 to-amber-500 text-yellow-900 px-3 md:px-5 py-1.5 md:py-2 rounded-xl md:rounded-2xl border-2 border-yellow-200 shadow-md font-black hover:scale-105 active:scale-95 transition-all flex flex-col items-center justify-center animate-bounce"
                >
                  <span className="text-[9px] md:text-[10px] leading-none mb-0.5 font-black text-red-600 tracking-tighter bg-yellow-100/50 px-1 rounded">倒數 {schoolQuest.daysLeft} 天</span>
                  <span className="flex items-center gap-1 text-xs md:text-sm leading-none mt-0.5">🏫 委託交付</span>
                </button>
              )}

              <div className="bg-emerald-600/10 px-3 md:px-5 py-1.5 md:py-2 rounded-xl md:rounded-2xl border-2 border-emerald-600/20">
                <div className="text-[8px] md:text-[10px] font-bold text-emerald-800 uppercase text-center">農莊名稱</div>
                <div className="text-sm md:text-lg font-black text-emerald-700">{farmName || '農莊'}</div>
              </div>

              <div className="bg-yellow-400/20 px-3 md:px-5 py-1.5 md:py-2 rounded-xl md:rounded-2xl border-2 border-yellow-400/50">
                <div className="text-[8px] md:text-[10px] font-bold text-yellow-700 uppercase text-center">資金餘額</div>
                <div className="text-lg md:text-2xl font-mono font-black text-yellow-600">${gold.toLocaleString()}</div>
              </div>

              <button 
                onClick={() => setShowShop(true)}
                className={`bg-gradient-to-r from-green-400 to-emerald-600 text-white px-3 md:px-6 py-2 md:py-3 rounded-xl font-black hover:shadow-xl active:scale-95 transition-all flex items-center gap-1 md:gap-2 shadow-md ${tutorialStep === 2 || tutorialStep === 7 ? 'ring-4 ring-blue-500 animate-pulse' : ''}`}
              >
                <span className="text-base md:text-lg">🛒</span> <span className="text-xs md:text-base">商店</span>
              </button>
              
              <button 
                onClick={() => {
                  // 強制防呆：有教學任務進行時無法點擊睡覺
                  if (tutorialStep > 0 && tutorialStep !== 6) {
                    setMessage("⚠️ 請先完成畫面下方的「新手教學」步驟，才能結束這一天喔！");
                    return;
                  }
                  setShowModal('sleep');
                }} 
                className={`bg-slate-800 text-white px-3 md:px-6 py-2 md:py-3 rounded-xl font-bold hover:bg-slate-700 active:scale-95 transition-all shadow-md flex items-center gap-1 md:gap-2 ${tutorialStep === 6 ? 'ring-4 ring-blue-500 animate-pulse' : ''}`}
              >
                🌙 <span className="text-xs md:text-base">睡覺 ➔</span>
              </button>
            </div>
          </div>

          <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6 relative z-30">
            
            {/* 左側：收成箱與農具清單 */}
            <div className="md:col-span-1 flex flex-col h-auto md:h-[450px] gap-4 relative z-40">
              
              <div className="relative min-h-[90px] md:min-h-[110px]">
                <div 
                    ref={dropZoneRef}
                    className={`absolute inset-0 bg-white/80 border-4 border-dashed rounded-[1.5rem] md:rounded-[2rem] p-2 md:p-3 flex flex-col items-center justify-center border-slate-300 shadow-sm transition-all duration-300`}
                >
                    <div className="text-3xl md:text-4xl mb-1">📥</div>
                    <div className="font-black text-slate-700 text-sm md:text-base">收成箱</div>
                    <div className="font-bold mt-1 px-3 py-1 rounded-full text-[9px] md:text-[10px] bg-slate-100 text-slate-500">
                        點擊作物自動收成
                    </div>
                </div>
              </div>

              <div className={`bg-white/80 p-3 md:p-4 rounded-[2rem] shadow-sm border flex flex-col flex-1 overflow-hidden min-h-[180px] md:min-h-0 ${tutorialStep === 3 || tutorialStep === 5 ? 'border-4 border-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.5)]' : 'border-white'}`}>
                <h3 className="text-[10px] font-black mb-2 md:mb-3 text-slate-400 uppercase tracking-widest shrink-0">農具與庫存清單</h3>
                <div className="grid grid-cols-4 md:grid-cols-2 gap-3 overflow-y-auto p-2 hide-scrollbar flex-1 content-start">
                  {[
                    { id: 'water', label: day >= 20 ? '全區灑水' : '單格澆水', icon: '💧' },
                    { id: 'chili', label: '辣椒水', icon: '🌶️', count: inventory.chili },
                    { id: 'weed', label: '除草剪刀', icon: '✂️', count: inventory.scissors },
                    ...(inventory.fert_leaf > 0 ? [{ id: 'fert_leaf', label: '氮肥(葉菜)', icon: <FertilizerBag type="leaf" />, count: inventory.fert_leaf }] : []),
                    ...(inventory.fert_root > 0 ? [{ id: 'fert_root', label: '磷肥(根莖)', icon: <FertilizerBag type="root" />, count: inventory.fert_root }] : []),
                    ...(inventory.fert_fruit > 0 ? [{ id: 'fert_fruit', label: '鉀肥(瓜果)', icon: <FertilizerBag type="fruit" />, count: inventory.fert_fruit }] : []),
                    ...Object.keys(inventory.seeds || {})
                      .filter(id => inventory.seeds[id] > 0)
                      .map(id => {
                        const crop = Object.values(CROPS).flat().find(c => c?.id === id);
                        if (!crop) return null;
                        return {
                          id: `seed_${id}`,
                          type: 'seed',
                          cropData: crop,
                          label: `${crop.name}種子`, 
                          icon: <SeedBag crop={crop} />,
                          count: inventory.seeds[id]
                        };
                      })
                      .filter(Boolean)
                  ].map(tool => {
                    if (!tool) return null;
                    const isSelected = tool.type === 'seed' 
                      ? (selectedTool === 'seed' && selectedSeed?.id === tool.cropData?.id)
                      : selectedTool === tool.id;

                    const isHighlight = (tutorialStep === 3 && tool.type === 'seed' && tool.cropData.id === 'sweetpotatoleaf') || 
                                        (tutorialStep === 5 && tool.id === 'water') ||
                                        (tutorialStep === 8 && tool.id === 'fert_leaf');

                    return (
                      <button
                        key={tool.id}
                        onClick={() => {
                          if (tool.type === 'seed') {
                            setSelectedTool('seed');
                            setSelectedSeed(tool.cropData);
                          } else {
                            setSelectedTool(tool.id);
                            setSelectedSeed(null); 
                          }
                        }}
                        className={`p-2 md:p-3 rounded-xl md:rounded-2xl border-2 transition-all flex flex-col items-center justify-center group relative ${isSelected ? 'border-blue-500 bg-white shadow-md scale-105 z-10' : 'border-transparent bg-white/40 hover:bg-white'} ${isHighlight ? 'ring-4 ring-yellow-400 animate-pulse' : ''}`}
                      >
                        <span className="text-xl md:text-2xl group-active:scale-125 transition-transform flex items-center justify-center h-10 w-10">{tool.icon}</span>
                        <span className="text-[8px] md:text-[10px] font-black mt-1 uppercase text-center w-full truncate">{tool.label}</span>
                        {tool.count !== undefined && (
                          <span className={`absolute -top-1.5 -right-1.5 md:-top-2 md:-right-2 text-[9px] md:text-[11px] font-bold text-white px-1.5 py-0.5 rounded-full shadow-md z-20 ${tool.count > 0 ? 'bg-blue-500' : 'bg-slate-400'}`}>
                            {tool.count}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* 農田主畫面 (8格) */}
            <div className="md:col-span-3">
              {activePlot === null ? (
                <div className="grid grid-cols-2 gap-3 md:gap-4 h-[350px] md:h-[450px]">
                  {plots.map(plot => {
                    if (!plot) return null;
                    
                    if (!plot.isUnlocked) {
                      const price = PLOT_PRICES[plot.id];
                      return (
                        <div 
                          key={plot.id}
                          onClick={() => buyPlot(plot.id, price)}
                          className="bg-slate-200/60 border-4 border-dashed border-slate-400 rounded-[1.5rem] md:rounded-[2rem] flex flex-col items-center justify-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all shadow-inner group"
                        >
                          <div className="text-4xl md:text-5xl mb-2 opacity-40 group-hover:scale-110 transition-transform">🔒</div>
                          <div className="text-[10px] md:text-sm font-black text-slate-500 uppercase tracking-widest">第 {plot.id + 1} 區 (未開放)</div>
                          <div className="mt-3 bg-blue-100 text-blue-700 px-3 md:px-4 py-1.5 md:py-2 rounded-xl font-black text-[10px] md:text-sm border-2 border-blue-200 transition-colors group-hover:bg-blue-600 group-hover:text-white">
                            解鎖 $ {price.toLocaleString()}
                          </div>
                        </div>
                      );
                    }

                    const plantedCount = plot.slots.filter(s => s?.crop).length;
                    const matureCount = plot.slots.filter(s => s?.crop && s.growth >= s.crop.days).length;
                    const wateredCount = plot.slots.filter(s => s?.crop && s.isWatered).length;
                    const unhandledAlert = plot.slots.some(s => s?.hasBug || s?.hasWeed);
                    
                    const borderColor = unhandledAlert ? 'border-red-500' : (weather === 'rainy' ? 'border-blue-400 shadow-[0_0_15px_rgba(96,165,250,0.5)]' : 'border-white');
                    const isGiantPumpkin = plot.slots[0]?.crop?.id === 'giant_pumpkin';
                    const isHighlight = tutorialStep === 4 && plot.id === 0;

                    return (
                      <div 
                        key={plot.id}
                        onClick={() => setActivePlot(plot.id)}
                        className={`bg-amber-900/10 border-4 rounded-[1.5rem] md:rounded-[2rem] relative overflow-hidden cursor-pointer hover:border-amber-500 transition-all flex flex-col items-center justify-center group shadow-inner ${borderColor} ${isHighlight ? 'ring-4 ring-blue-500 animate-pulse' : ''}`}
                      >
                        {weather === 'rainy' && (
                          <div className="absolute inset-0 pointer-events-none overflow-hidden bg-blue-500/10 flex justify-evenly opacity-50 z-10">
                            <div className="w-[1px] md:w-[2px] h-8 md:h-12 bg-blue-300 animate-rain"></div>
                            <div className="w-[1px] md:w-[2px] h-6 md:h-8 bg-blue-300 animate-rain rain-delay-1 mt-4"></div>
                            <div className="w-[1px] md:w-[2px] h-10 md:h-16 bg-blue-300 animate-rain rain-delay-2 mt-8"></div>
                            <div className="w-[1px] md:w-[2px] h-8 md:h-10 bg-blue-300 animate-rain rain-delay-3 mt-2"></div>
                          </div>
                        )}

                        <div className="absolute top-2 left-2 md:top-4 md:left-4 text-[8px] md:text-[10px] font-black bg-amber-900/20 px-2 py-1 md:px-3 md:py-1 rounded-full uppercase z-20">第 {plot.id + 1} 區</div>
                        {plot.isNetted && <div className="absolute inset-0 bg-blue-400/10 border-2 border-dashed border-blue-400/50 rounded-[1.3rem] md:rounded-[1.8rem] pointer-events-none z-20"></div>}
                        {plot.isWindbreaked && <div className="absolute inset-0 border-4 border-emerald-600/60 rounded-[1.3rem] md:rounded-[1.8rem] pointer-events-none z-20"></div>}
                        
                        <div className={`text-4xl md:text-5xl group-hover:scale-110 transition-transform z-20 ${isGiantPumpkin && matureCount === plantedCount ? 'animate-pulse' : ''}`}>
                          {plantedCount > 0 ? (
                            isGiantPumpkin ? '🎃' : (matureCount === plantedCount ? '✨' : '🌿')
                          ) : '🕳️'}
                        </div>
                        <div className="mt-2 md:mt-4 flex flex-col items-center gap-1 z-20">
                          <div className="text-[8px] md:text-[10px] font-black uppercase text-amber-900/60 bg-white/40 px-2 py-0.5 rounded-full">
                            {plantedCount > 0 ? (isGiantPumpkin ? '巨型作物生長中' : `${plantedCount}/8 正在生長`) : '空置農田'}
                          </div>
                          {plantedCount > 0 && (
                            <div className={`text-[8px] md:text-[10px] font-black px-1.5 py-0.5 md:px-2 md:py-1 rounded ${wateredCount < plantedCount ? 'bg-amber-200 text-amber-700' : 'bg-blue-100 text-blue-600'}`}>
                              💧 澆水: {wateredCount}/{plantedCount}
                            </div>
                          )}
                          {unhandledAlert && (
                            <div className="text-[8px] md:text-[10px] font-black bg-red-100 text-red-600 px-1.5 py-0.5 md:px-2 md:py-0.5 rounded animate-pulse shadow-sm">
                              ⚠️ 發現蟲草
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="bg-white/80 p-4 md:p-8 rounded-[1.5rem] md:rounded-[2.5rem] shadow-2xl border border-white animate-in zoom-in duration-300 relative overflow-hidden flex flex-col h-full md:h-[450px]">
                  
                  {weather === 'rainy' && (
                    <div className="absolute inset-0 pointer-events-none overflow-hidden bg-blue-500/5 flex justify-evenly opacity-40 z-0">
                      <div className="w-[1px] md:w-[2px] h-12 md:h-20 bg-blue-400 animate-rain"></div>
                      <div className="w-[1px] md:w-[2px] h-10 md:h-16 bg-blue-400 animate-rain rain-delay-1 mt-10"></div>
                      <div className="w-[1px] md:w-[2px] h-16 md:h-24 bg-blue-400 animate-rain rain-delay-2 mt-20"></div>
                      <div className="w-[1px] md:w-[2px] h-8 md:h-12 bg-blue-400 animate-rain rain-delay-3 mt-5"></div>
                      <div className="w-[1px] md:w-[2px] h-12 md:h-18 bg-blue-400 animate-rain rain-delay-1 mt-30"></div>
                    </div>
                  )}

                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 md:mb-6 gap-3 relative z-10 shrink-0">
                    <button onClick={() => setActivePlot(null)} className="bg-slate-100 hover:bg-slate-200 px-3 md:px-4 py-1.5 md:py-2 rounded-xl text-[10px] md:text-xs font-black transition-colors shrink-0">❮ 前往其他農地</button>
                    <div className="flex items-center gap-2 flex-wrap justify-start sm:justify-end w-full sm:w-auto">
                      <span className="font-black text-slate-400 uppercase text-[10px] md:text-xs tracking-widest mr-1 md:mr-2">第 {activePlot + 1} 區管理中</span>
                      
                      {inventory.nets > 0 && !plots[activePlot].isNetted && (
                        <button onClick={() => applyNet(activePlot)} className={`bg-blue-600 text-white text-[9px] md:text-[10px] px-2 py-1.5 md:px-3 md:py-2 rounded-lg md:rounded-xl font-black hover:bg-blue-700 transition-all ${tutorialStep === 9 ? 'ring-4 ring-yellow-400 animate-pulse' : ''}`}>部署防蟲網</button>
                      )}
                      {plots[activePlot].isNetted && <span className="bg-blue-100 text-blue-600 text-[9px] md:text-[10px] px-2 py-1.5 md:px-2 md:py-2 rounded-lg md:rounded-xl font-black">防蟲中 🕸️</span>}
                      
                      {inventory.windbreaks > 0 && !plots[activePlot].isWindbreaked && (
                        <button onClick={() => applyWindbreak(activePlot)} className="bg-emerald-600 text-white text-[9px] md:text-[10px] px-2 py-1.5 md:px-3 md:py-2 rounded-lg md:rounded-xl font-black hover:bg-emerald-700 transition-all">架設防風網</button>

                              <button onClick={() => sellCrop(cropId, 1, crop.value)} className="bg-yellow-100 text-yellow-700 px-3 py-1.5 rounded-lg font-black text-[10px] md:text-xs hover:bg-yellow-500 hover:text-white transition-all active:scale-95 border border-yellow-200">賣 1 個</button>
                              {amount > 1 && (
                                <button onClick={() => sellCrop(cropId, amount, crop.value)} className="bg-yellow-500 text-white px-3 py-1.5 rounded-lg font-black text-[10px] md:text-xs hover:bg-yellow-600 transition-all active:scale-95 shadow-sm">全賣</button>
                              )}
                            </div>
                          </div>
                        )
                      })
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 圖鑑系統 Modal */}
          {showModal === 'gallery' && (
            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-2 md:p-4 z-50">
              <div className="bg-white p-5 md:p-8 rounded-[2rem] md:rounded-[2.5rem] max-w-4xl w-full shadow-2xl animate-in zoom-in duration-300 max-h-[95vh] flex flex-col">
                <div className="flex justify-between items-center mb-4 md:mb-6 border-b pb-3 md:pb-4 shrink-0">
                  <h2 className="text-xl md:text-2xl font-black text-indigo-900 flex items-center gap-1 md:gap-2">📖 台灣蔬果農業圖鑑</h2>
                  <button onClick={() => setShowModal(null)} className="bg-slate-100 p-1.5 md:p-2 rounded-full hover:bg-slate-200 transition-colors">❌</button>
                </div>
                
                <div className="overflow-y-auto custom-scrollbar flex-1 pr-2 md:pr-4 pb-4">
                  <p className="text-[10px] md:text-xs font-bold text-slate-500 mb-4 md:mb-6">
                    收集所有四季作物吧！如果在未受蟲害且水分充足的「完美狀態」下收成，還能獲得額外的完美勳章喔！
                  </p>
                  
                  <div className="space-y-6 md:space-y-8">
                    {Object.entries(CROPS).map(([seasonKey, cropList]) => {
                      const sName = { SPRING: '春季', SUMMER: '夏季', AUTUMN: '秋季', WINTER: '冬季', SPECIAL: '傳說隱藏' }[seasonKey];
                      const sColor = { SPRING: 'text-green-600', SUMMER: 'text-yellow-600', AUTUMN: 'text-orange-600', WINTER: 'text-blue-600', SPECIAL: 'text-purple-600' }[seasonKey];
                      const sBorder = { SPRING: 'border-green-200', SUMMER: 'border-yellow-200', AUTUMN: 'border-orange-200', WINTER: 'border-blue-200', SPECIAL: 'border-purple-300' }[seasonKey];
                      const sBg = { SPRING: 'bg-green-50/30', SUMMER: 'bg-yellow-50/30', AUTUMN: 'bg-orange-50/30', WINTER: 'bg-blue-50/30', SPECIAL: 'bg-gradient-to-br from-purple-50 to-pink-50' }[seasonKey];
                      
                      return (
                        <div key={seasonKey}>
                          <h3 className={`text-base md:text-lg font-black mb-3 md:mb-4 border-b-2 inline-block pb-1 ${sColor}`}>
                            {seasonKey === 'SPECIAL' ? '✨ ' : ''}{sName}作物
                          </h3>
                          
                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 md:gap-4">
                            {cropList.map(crop => {
                              const record = gallery[crop?.id];
                              const isUnlocked = !!record?.unlocked;
                              const isPerfect = !!record?.perfect;

                              return (
                                <div key={crop?.id} className={`p-4 md:p-5 rounded-xl md:rounded-2xl border-2 flex items-start gap-4 md:gap-5 relative transition-all ${isUnlocked ? `${sBorder} ${sBg}` : 'border-slate-100 bg-slate-50 grayscale opacity-60'}`}>
                                  
                                  <div className={`text-5xl md:text-6xl shrink-0 drop-shadow-sm mt-1 ${seasonKey === 'SPECIAL' && isUnlocked ? 'animate-pulse' : ''}`}>
                                    {isUnlocked ? crop.icon : '❓'}
                                  </div>
                                  
                                  <div className="flex-1 min-w-0">
                                    <div className={`font-black text-base md:text-lg ${seasonKey === 'SPECIAL' && isUnlocked ? 'text-purple-800' : 'text-slate-700'}`}>
                                      {isUnlocked ? crop.name : '未知作物'}
                                    </div>
                                    
                                    {isUnlocked ? (
                                      <>
                                        <div className="text-[10px] md:text-[11px] text-indigo-700 font-black mt-1.5 bg-indigo-100/50 inline-block px-2 py-0.5 rounded border border-indigo-200">
                                          ⏳ 生長期：{crop.days} 天 ｜ {crop.type === 'leaf' ? '🌿 葉菜類' : crop.type === 'root' ? '🥔 根莖類' : '🍎 瓜果類'}
                                        </div>
                                        <div className="text-[10px] md:text-[11px] text-slate-600 mt-2 leading-relaxed whitespace-pre-line font-medium">
                                          {crop.desc}
                                        </div>
                                      </>
                                    ) : (
                                      <div className="text-[10px] md:text-xs font-bold text-slate-400 mt-1 md:mt-2 uppercase tracking-widest">未解鎖</div>
                                    )}
                                  </div>
                                  
                                  {isPerfect && (
                                    <div className="absolute -top-2 -right-2 bg-yellow-400 border-2 border-white w-6 h-6 md:w-8 md:h-8 rounded-full flex items-center justify-center shadow-md animate-bounce text-[10px] md:text-[12px]" title="完美收成勳章">
                                      ✨
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 睡覺與存檔確認彈窗 */}
          {showModal === 'sleep' && (
            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in duration-200">
                <div className="text-5xl md:text-6xl mb-3 md:mb-4">🌙</div>
                <h2 className="text-xl md:text-2xl font-black mb-3 md:mb-4">準備休息了嗎？</h2>
                <p className="text-slate-500 mb-5 md:mb-6 font-bold text-[10px] md:text-xs leading-relaxed">
                  請確認所有作物都已澆水，並且<span className="text-red-500">沒有未處理的蟲害或雜草</span>，否則作物在夜晚會直接枯死喔！
                </p>
                <div className="flex gap-3 md:gap-4">
                  <button onClick={() => setShowModal(null)} className="flex-1 bg-slate-100 text-slate-600 py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-200 transition-colors">
                    再巡一下
                  </button>
                  <button onClick={processNextDay} className="flex-1 bg-slate-800 text-white py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-700 transition-colors">
                    確定睡覺
                  </button>
                </div>
                
                <div className="flex flex-col gap-3 md:gap-4 w-full mt-6 pt-6 border-t border-slate-100">
                  <div className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1">系統存檔 (支援手機/平板瀏覽器)</div>
                  <div className="flex gap-3 md:gap-4">
                    <button onClick={handleSave} className="flex-1 bg-blue-100 text-blue-700 py-3 rounded-xl font-black text-sm hover:bg-blue-200 transition-colors active:scale-95 shadow-sm">
                      💾 儲存進度
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 結算彈窗 */}
          {showModal === 'contest' && (
            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white p-8 md:p-10 rounded-[2.5rem] md:rounded-[3rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in">
                <div className="text-6xl md:text-7xl mb-4 md:mb-6">🥇</div>
                <h2 className="text-xl md:text-3xl font-black mb-2 uppercase">季度大賽</h2>
                <p className="text-slate-400 text-[10px] md:text-xs mb-6 md:mb-8 font-bold">你在第 {day} 天的表現非常驚人，評審團給予了高度評價！</p>
                <div className="bg-slate-100 p-4 md:p-6 rounded-2xl md:rounded-3xl mb-6 md:mb-8">
                  <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 uppercase">季度獎金</div>
                  <div className="text-3xl md:text-4xl font-black text-yellow-600">${Math.floor(gold * 0.2).toLocaleString()}</div>
                </div>
                <button onClick={() => { setGold(g => g + Math.floor(g * 0.2)); setShowModal(null); playEffect('coin'); }} className="w-full bg-slate-800 text-white py-4 md:py-5 rounded-xl md:rounded-2xl font-black uppercase tracking-widest hover:bg-slate-700 transition-all">領取獎勵</button>
              </div>
            </div>
          )}

          {/* 遊戲結束結果 */}
          {showModal === 'result' && (
            <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-4 z-50">
              <div className="bg-white p-8 md:p-12 rounded-[2.5rem] md:rounded-[3.5rem] max-w-lg w-full text-center shadow-2xl overflow-y-auto max-h-[90vh] hide-scrollbar">
                <div className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-3 md:mb-4">365天經營結算</div>
                <h1 className="text-4xl md:text-5xl font-black mb-6 md:mb-8 italic">農莊年度結算</h1>
                <div className="grid grid-cols-2 gap-3 md:gap-4 mb-8 md:mb-10">
                  <div className="bg-slate-50 p-6 md:p-8 rounded-2xl md:rounded-3xl border border-slate-100">
                    <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 md:mb-2 uppercase">總資產</div>
                    <div className="text-xl md:text-3xl font-black font-mono text-slate-800">${gold.toLocaleString()}</div>
                  </div>
                  <div className="bg-blue-600 p-6 md:p-8 rounded-2xl md:rounded-3xl text-white shadow-xl shadow-blue-200">
                    <div className="text-[9px] md:text-[10px] font-black opacity-60 mb-1 md:mb-2 uppercase">最終評級</div>
                    <div className="text-5xl md:text-6xl font-black">{gold > 1000000 ? 'S' : gold > 500000 ? 'A' : gold > 100000 ? 'B' : 'C'}</div>
                  </div>
                </div>
                <button onClick={() => {
                  localStorage.removeItem('farm_tycoon_save_v2'); 
                  window.location.reload();
                }} className="w-full bg-slate-800 text-white py-5 md:py-6 rounded-2xl md:rounded-3xl font-black text-sm md:text-base uppercase tracking-widest hover:bg-slate-700 active:scale-95 transition-all">刪除存檔並開啟下一個循環</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
