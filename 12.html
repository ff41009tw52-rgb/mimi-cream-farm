            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in duration-200">
                <div className="text-5xl md:text-6xl mb-3 md:mb-4">🌙</div>
                <h2 className="text-xl md:text-2xl font-black mb-3 md:mb-4">準備休息了嗎？</h2>
                <p className="text-slate-500 mb-5 md:mb-6 font-bold text-[10px] md:text-xs leading-relaxed">
                  請確認所有作物都已澆水，並且<span className="text-red-500">沒有未處理的蟲害或雜草</span>，否則作物在夜晚會直接枯死喔！
                </p>
                <div className="flex gap-3 md:gap-4">
                  <button onClick={() => setShowModal(null)} className="flex-1 bg-slate-100 text-slate-600 py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-200 transition-colors">
                    再巡一下
                  </button>
                  <button onClick={processNextDay} className="flex-1 bg-slate-800 text-white py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-700 transition-colors">
                    確定睡覺
                  </button>
                </div>
                
                {/* 系統存檔區塊 (移除讀取進度) */}
                <div className="flex flex-col gap-3 md:gap-4 w-full mt-6 pt-6 border-t border-slate-100">
                  <div className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-1">系統存檔 (支援手機/平板瀏覽器)</div>
                  <div className="flex gap-3 md:gap-4">
                    <button onClick={handleSave} className="flex-1 bg-blue-100 text-blue-700 py-3 rounded-xl font-black text-sm hover:bg-blue-200 transition-colors active:scale-95 shadow-sm">
                      💾 儲存進度
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 結算彈窗 */}
          {showModal === 'contest' && (
            <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-white p-8 md:p-10 rounded-[2.5rem] md:rounded-[3rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in">
                <div className="text-6xl md:text-7xl mb-4 md:mb-6">🥇</div>
                <h2 className="text-2xl md:text-3xl font-black mb-2 uppercase">季度大賽</h2>
                <p className="text-slate-400 text-[10px] md:text-xs mb-6 md:mb-8 font-bold">你在第 {day} 天的表現非常驚人，評審團給予了高度評價！</p>
                <div className="bg-slate-100 p-4 md:p-6 rounded-2xl md:rounded-3xl mb-6 md:mb-8">
                  <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 uppercase">季度獎金</div>
                  <div className="text-3xl md:text-4xl font-black text-yellow-600">${Math.floor(gold * 0.2).toLocaleString()}</div>
                </div>
                <button onClick={() => { setGold(g => g + Math.floor(g * 0.2)); setShowModal(null); playEffect('coin'); }} className="w-full bg-slate-800 text-white py-4 md:py-5 rounded-xl md:rounded-2xl font-black uppercase tracking-widest hover:bg-slate-700 transition-all">領取獎勵</button>
              </div>
            </div>
          )}

          {/* 遊戲結束結果 */}
          {showModal === 'result' && (
            <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-4 z-50">
              <div className="bg-white p-8 md:p-12 rounded-[2.5rem] md:rounded-[3.5rem] max-w-lg w-full text-center shadow-2xl overflow-y-auto max-h-[90vh] hide-scrollbar">
                <div className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-3 md:mb-4">365天經營結算</div>
                <h1 className="text-4xl md:text-5xl font-black mb-6 md:mb-8 italic">農莊年度結算</h1>
                <div className="grid grid-cols-2 gap-3 md:gap-4 mb-8 md:mb-10">
                  <div className="bg-slate-50 p-6 md:p-8 rounded-2xl md:rounded-3xl border border-slate-100">
                    <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 md:mb-2 uppercase">總資產</div>
                    <div className="text-xl md:text-3xl font-black font-mono text-slate-800">${gold.toLocaleString()}</div>
                  </div>
                  <div className="bg-blue-600 p-6 md:p-8 rounded-2xl md:rounded-3xl text-white shadow-xl shadow-blue-200">
                    <div className="text-[9px] md:text-[10px] font-black opacity-60 mb-1 md:mb-2 uppercase">最終評級</div>
                    <div className="text-5xl md:text-6xl font-black">{gold > 1000000 ? 'S' : gold > 500000 ? 'A' : gold > 100000 ? 'B' : 'C'}</div>
                  </div>
                </div>
                <button onClick={() => {
                  localStorage.removeItem('farm_tycoon_save'); // 結束時清除存檔
                  window.location.reload();
                }} className="w-full bg-slate-800 text-white py-5 md:py-6 rounded-2xl md:rounded-3xl font-black text-sm md:text-base uppercase tracking-widest hover:bg-slate-700 active:scale-95 transition-all">刪除存檔並開啟下一個循環</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
