<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Q版電路小實驗 (手機觸控版)</title>
    <link rel="stylesheet" href="farm-ui.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #fffbeb; 
            /* 防止手機上拖曳時畫面捲動，這行很重要！ */
            touch-action: none; 
        }
        /* 防止選取文字 */
        .no-select { user-select: none; -webkit-user-select: none; }
.guided-card-08{position:fixed;left:14px;bottom:14px;z-index:60;width:min(390px,calc(100vw - 28px));background:rgba(255,255,255,.96);border:3px solid #fbbf24;border-radius:18px;padding:12px;box-shadow:0 10px 24px rgba(0,0,0,.18);font-family:"Microsoft JhengHei";color:#334155}.guided-card-08 h2{margin:0 0 6px;color:#b45309}.guided-card-08 ol{margin:0 0 6px 1.2em}.guided-card-08 .explain{background:#fffbeb;border-radius:12px;padding:8px;font-weight:700;color:#92400e}

        @media (max-width: 600px) {
            .circuit-header {
                margin-top: 62px !important;
                padding: 10px 12px !important;
                gap: 8px !important;
            }
            .circuit-header h1 { width: 100%; font-size: 1.25rem !important; }
            .circuit-toolbar {
                display: grid !important;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                width: 100%;
                gap: 6px !important;
            }
            .circuit-toolbar button {
                min-width: 0 !important;
                min-height: 44px;
                padding: 7px 4px !important;
                justify-content: center;
                font-size: 0.78rem !important;
            }
            .circuit-toolbar .power-button { grid-column: span 2; }
            .circuit-status { margin-top: 8px !important; padding: 6px 10px !important; font-size: 0.82rem !important; }
            .guided-card-08 {
                left: 10px;
                bottom: 10px;
                width: calc(100vw - 20px);
                max-height: 142px;
                overflow-y: auto;
                box-sizing: border-box;
                padding: 9px 10px;
                border-width: 2px;
                border-radius: 14px;
                font-size: 0.76rem;
                line-height: 1.35;
            }
            .guided-card-08 h2 { font-size: 0.95rem; }
            .guided-card-08 ol { margin-bottom: 4px; }
            .guided-card-08 .explain { padding: 5px 7px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
<section class="guided-card-08"><h2>💡 跟著做模式</h2><ol><li>先把電池的＋端連到燈泡下面的小圓點。</li><li>再把燈泡旁邊的金屬螺紋連回電池－端。</li><li>打開電源，觀察燈泡是否亮起。</li></ol><div class="explain">成功亮燈的原因：電流走成一個完整的圈圈。</div></section>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 簡易圖示元件 ---
        const IconBase = ({ children, color = "currentColor", size = 24, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {children}
            </svg>
        );

        const Plus = (props) => <IconBase {...props}><path d="M5 12h14"/><path d="M12 5v14"/></IconBase>;
        const RotateCcw = (props) => <IconBase {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconBase>;
        const Power = (props) => <IconBase {...props}><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></IconBase>;
        const Lightbulb = (props) => <IconBase {...props}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconBase>;
        const Eye = (props) => <IconBase {...props}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const EyeOff = (props) => <IconBase {...props}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></IconBase>;
        const RotateCw = (props) => <IconBase {...props}><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></IconBase>;

        const COMPONENT_TYPES = {
            BATTERY: 'battery',
            BULB: 'bulb'
        };

        const DESKTOP_COMPONENTS = [
            { id: 'bulb-1', type: COMPONENT_TYPES.BULB, x: 400, y: 150, rotation: 0 },
            { id: 'bat-1', type: COMPONENT_TYPES.BATTERY, x: 250, y: 350, rotation: 0 },
        ];

        const createInitialComponents = () => window.innerWidth <= 600 ? [
            { id: 'bulb-1', type: COMPONENT_TYPES.BULB, x: Math.max(210, window.innerWidth - 120), y: 70, rotation: 0 },
            { id: 'bat-1', type: COMPONENT_TYPES.BATTERY, x: 24, y: 240, rotation: 0 },
        ] : DESKTOP_COMPONENTS.map(component => ({ ...component }));

        function CircuitGame() {
            const [components, setComponents] = useState(createInitialComponents);
            const [wires, setWires] = useState([]);
            
            const [isDrawing, setIsDrawing] = useState(false);
            const [currentWireStart, setCurrentWireStart] = useState(null);
            
            const [draggingCompId, setDraggingCompId] = useState(null);
            const [draggingWireId, setDraggingWireId] = useState(null); 
            const [rotatingCompId, setRotatingCompId] = useState(null); 
            
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 }); 
            
            const [litBulbIds, setLitBulbIds] = useState(new Set());
            const [brightness, setBrightness] = useState(0); 
            const [errorMsg, setErrorMsg] = useState('');

            const [showControls, setShowControls] = useState(true);
            const [isSwitchOn, setIsSwitchOn] = useState(false);

            const canvasRef = useRef(null);

            const getConnectionPoint = (comp, pointType) => {
                if (!comp) return { x: 0, y: 0 };
                
                let width, height, localX, localY;

                if (comp.type === COMPONENT_TYPES.BATTERY) {
                    width = 140; height = 60;
                    if (pointType === 'pos') { localX = 10; localY = 40; } 
                    else if (pointType === 'neg') { localX = 130; localY = 40; } 
                } else if (comp.type === COMPONENT_TYPES.BULB) {
                    width = 80; height = 140;
                    if (pointType === 'thread') { localX = 20; localY = 100; } 
                    else if (pointType === 'tip') { localX = 40; localY = 125; } 
                }

                if (localX === undefined) return { x: 0, y: 0 };

                const cx = comp.x + width / 2;
                const cy = comp.y + height / 2;
                const relX = (comp.x + localX) - cx;
                const relY = (comp.y + localY) - cy;

                const rad = (comp.rotation * Math.PI) / 180;
                const rotatedX = relX * Math.cos(rad) - relY * Math.sin(rad);
                const rotatedY = relX * Math.sin(rad) + relY * Math.cos(rad);

                return {
                    x: cx + rotatedX,
                    y: cy + rotatedY
                };
            };

            const getWireGeometry = (startPos, endPos, controlOffset) => {
                const midX = (startPos.x + endPos.x) / 2;
                const midY = (startPos.y + endPos.y) / 2;
                const cpX = midX + (controlOffset?.x || 0);
                const cpY = midY + (controlOffset?.y || 0);
                return { cpX, cpY, midX, midY };
            };

            // --- 整合滑鼠與觸控的座標取得函式 ---
            const getClientCoords = (e) => {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    // 用於 touchend
                    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            };

            const handleMouseMove = (e) => {
                if (!canvasRef.current) return;
                
                // 支援觸控與滑鼠
                const coords = getClientCoords(e);
                
                const containerRect = canvasRef.current.getBoundingClientRect();
                const x = coords.x - containerRect.left;
                const y = coords.y - containerRect.top;
                setMousePos({ x, y });

                if (draggingCompId) {
                    setComponents(prev => prev.map(c => {
                        if (c.id === draggingCompId) {
                            const width = c.type === COMPONENT_TYPES.BATTERY ? 140 : 80;
                            const height = c.type === COMPONENT_TYPES.BATTERY ? 60 : 140;
                            const nextX = Math.max(0, Math.min(x - dragOffset.x, containerRect.width - width));
                            const nextY = Math.max(0, Math.min(y - dragOffset.y, containerRect.height - height));
                            return { ...c, x: nextX, y: nextY };
                        }
                        return c;
                    }));
                }
                
                if (rotatingCompId) {
                    setComponents(prev => prev.map(c => {
                        if (c.id === rotatingCompId) {
                            let width = c.type === COMPONENT_TYPES.BATTERY ? 140 : 80;
                            let height = c.type === COMPONENT_TYPES.BATTERY ? 60 : 140;
                            const cx = c.x + width / 2;
                            const cy = c.y + height / 2;
                            
                            const angleRad = Math.atan2(y - cy, x - cx);
                            let angleDeg = angleRad * (180 / Math.PI);
                            angleDeg += 90; 

                            return { ...c, rotation: angleDeg };
                        }
                        return c;
                    }));
                }

                if (draggingWireId) {
                    setWires(prev => prev.map(w => {
                        if (w.id === draggingWireId) {
                            const startComp = components.find(c => c.id === w.start.compId);
                            const endComp = components.find(c => c.id === w.end.compId);
                            if (!startComp || !endComp) return w;

                            const startPos = getConnectionPoint(startComp, w.start.pointType);
                            const endPos = getConnectionPoint(endComp, w.end.pointType);
                            
                            const midX = (startPos.x + endPos.x) / 2;
                            const midY = (startPos.y + endPos.y) / 2;

                            return {
                                ...w,
                                controlOffset: {
                                    x: x - midX,
                                    y: y - midY
                                }
                            };
                        }
                        return w;
                    }));
                }
            };

            const handleGlobalMouseUp = (e) => {
                // 手機版：放開手指時，偵測是否落在接點上 (Auto Snap)
                if (isDrawing && e && e.changedTouches && e.changedTouches.length > 0) {
                    const touch = e.changedTouches[0];
                    const target = document.elementFromPoint(touch.clientX, touch.clientY);
                    
                    if (target) {
                        // 尋找是否有帶有接點資料的 div
                        const nodeDiv = target.closest('[data-point-type]');
                        if (nodeDiv) {
                            const compId = nodeDiv.getAttribute('data-comp-id');
                            const pointType = nodeDiv.getAttribute('data-point-type');
                            // 觸發連線邏輯
                            handleNodeMouseUp(e, compId, pointType);
                        }
                    }
                }

                setDraggingCompId(null);
                setDraggingWireId(null);
                setRotatingCompId(null);
                
                if (isDrawing) {
                    setIsDrawing(false);
                    setCurrentWireStart(null);
                }
            };

            const handleMouseDownComp = (e, id) => {
                e.stopPropagation();
                if (isDrawing) return;
                if (isSwitchOn) togglePower();

                if (!canvasRef.current) return;
                
                const coords = getClientCoords(e);
                const comp = components.find(c => c.id === id);
                const containerRect = canvasRef.current.getBoundingClientRect();
                const offsetX = coords.x - containerRect.left - comp.x;
                const offsetY = coords.y - containerRect.top - comp.y;

                setDraggingCompId(id);
                setDragOffset({ x: offsetX, y: offsetY });
            };

            const handleRotateMouseDown = (e, id) => {
                e.stopPropagation();
                if (isSwitchOn) togglePower();
                setRotatingCompId(id);
            }

            const handleNodeMouseDown = (e, compId, pointType) => {
                e.stopPropagation();
                // 這裡不使用 preventDefault 以免影響點擊，但在 touchStart 時可能需要
                // e.preventDefault(); 
                if (!showControls) return;
                if (isSwitchOn) togglePower();

                setIsDrawing(true);
                setCurrentWireStart({ compId, pointType });
                setLitBulbIds(new Set()); 
                setErrorMsg('');
            };

            const handleNodeMouseUp = (e, compId, pointType) => {
                e.stopPropagation();
                if (isDrawing && currentWireStart) {
                    if (currentWireStart.compId === compId && currentWireStart.pointType === pointType) {
                        setIsDrawing(false);
                        setCurrentWireStart(null);
                        return;
                    }
                    const exists = wires.some(w => 
                        (w.start.compId === currentWireStart.compId && w.start.pointType === currentWireStart.pointType && w.end.compId === compId && w.end.pointType === pointType) ||
                        (w.end.compId === currentWireStart.compId && w.end.pointType === currentWireStart.pointType && w.start.compId === compId && w.start.pointType === pointType)
                    );

                    if (!exists) {
                        setWires([...wires, {
                            id: `wire-${Date.now()}`,
                            start: currentWireStart,
                            end: { compId, pointType },
                            controlOffset: { x: 0, y: 50 } 
                        }]);
                    }
                    setIsDrawing(false);
                    setCurrentWireStart(null);
                }
            };

            const handleWireControlMouseDown = (e, wireId) => {
                e.stopPropagation();
                if (!showControls) return;
                setDraggingWireId(wireId);
            };

            // --- 功能按鈕 ---
            const addBattery = () => {
                if (isSwitchOn) togglePower();
                if (components.filter(c => c.type === COMPONENT_TYPES.BATTERY).length >= 5) {
                    setErrorMsg('最多只能使用五顆電池喔！');
                    return;
                }
                setComponents([...components, { id: `bat-${Date.now()}`, type: COMPONENT_TYPES.BATTERY, x: 100, y: 350, rotation: 0 }]);
                setLitBulbIds(new Set());
            };

            const addBulb = () => {
                if (isSwitchOn) togglePower();
                if (components.filter(c => c.type === COMPONENT_TYPES.BULB).length >= 5) {
                    setErrorMsg('最多只能使用五顆燈泡喔！每顆燈泡都要有自己的完整迴路才會亮。');
                    return;
                }
                const offset = components.filter(c => c.type === COMPONENT_TYPES.BULB).length * 60; 
                setComponents([...components, { id: `bulb-${Date.now()}`, type: COMPONENT_TYPES.BULB, x: 150 + offset, y: 150 + (offset % 100), rotation: 0 }]);
                setLitBulbIds(new Set());
            };

            const resetBoard = () => {
                setComponents(createInitialComponents());
                setWires([]);
                setLitBulbIds(new Set());
                setBrightness(0);
                setErrorMsg('');
                setIsDrawing(false);
                setCurrentWireStart(null);
                setShowControls(true); 
                setIsSwitchOn(false);
            };

            const removeWire = (id) => {
                if (isSwitchOn) togglePower();
                setWires(wires.filter(w => w.id !== id));
                setLitBulbIds(new Set());
            };

            const togglePower = () => {
                if (isSwitchOn) {
                    setIsSwitchOn(false);
                    setLitBulbIds(new Set());
                    setBrightness(0);
                    setErrorMsg('');
                } else {
                    setIsSwitchOn(true);
                    runSimulation();
                }
            };

            // --- 核心邏輯 ---
            const evaluateCircuit = (currentComponents, currentWires) => {
                const node = (componentId, terminal) => `${componentId}:${terminal}`;
                const batteries = currentComponents.filter(component => component.type === COMPONENT_TYPES.BATTERY);
                const bulbs = currentComponents.filter(component => component.type === COMPONENT_TYPES.BULB);

                const buildGraph = ({ openBulbId = null, includeBulbConnections = true } = {}) => {
                    const graph = {};
                    const addNode = (key) => { if (!graph[key]) graph[key] = []; };
                    const connect = (left, right) => {
                        addNode(left);
                        addNode(right);
                        graph[left].push(right);
                        graph[right].push(left);
                    };

                    currentComponents.forEach(component => {
                        if (component.type === COMPONENT_TYPES.BATTERY) {
                            addNode(node(component.id, 'pos'));
                            addNode(node(component.id, 'neg'));
                        } else {
                            addNode(node(component.id, 'thread'));
                            addNode(node(component.id, 'tip'));
                        }
                    });

                    currentWires.forEach(wire => {
                        connect(
                            node(wire.start.compId, wire.start.pointType),
                            node(wire.end.compId, wire.end.pointType)
                        );
                    });

                    if (includeBulbConnections) {
                        bulbs
                            .filter(bulb => bulb.id !== openBulbId)
                            .forEach(bulb => connect(node(bulb.id, 'thread'), node(bulb.id, 'tip')));
                    }
                    return graph;
                };

                const reachable = (graph, startNode) => {
                    const seen = new Set([startNode]);
                    const queue = [startNode];
                    while (queue.length) {
                        const current = queue.shift();
                        (graph[current] || []).forEach(next => {
                            if (!seen.has(next)) {
                                seen.add(next);
                                queue.push(next);
                            }
                        });
                    }
                    return seen;
                };

                const wireOnlyGraph = buildGraph({ includeBulbConnections: false });
                const directShort = batteries.some(battery =>
                    reachable(wireOnlyGraph, node(battery.id, 'pos')).has(node(battery.id, 'neg'))
                );

                // A direct wire short circuit takes priority over lighting bulbs.
                if (directShort) {
                    return { litBulbIds: new Set(), directShort: true };
                }

                const litBulbIds = new Set();
                batteries.forEach(battery => {
                    bulbs.forEach(bulb => {
                        // Keep the tested bulb open. Its two terminals must be reached from
                        // opposite battery terminals through the rest of the circuit.
                        const graph = buildGraph({ openBulbId: bulb.id });
                        const fromPositive = reachable(graph, node(battery.id, 'pos'));
                        const fromNegative = reachable(graph, node(battery.id, 'neg'));
                        const thread = node(bulb.id, 'thread');
                        const tip = node(bulb.id, 'tip');
                        const completesCircuit =
                            (fromPositive.has(thread) && fromNegative.has(tip)) ||
                            (fromPositive.has(tip) && fromNegative.has(thread));
                        if (completesCircuit) litBulbIds.add(bulb.id);
                    });
                });

                return { litBulbIds, directShort: false };
            };

            // Available only on local test servers; it is used by automated circuit cases.
            if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
                window.__evaluateCircuit08 = evaluateCircuit;
            }

            const runSimulation = () => {
                setErrorMsg('');
                setLitBulbIds(new Set());
                setBrightness(0);

                const result = evaluateCircuit(components, wires);
                const batteryCount = components.filter(component => component.type === COMPONENT_TYPES.BATTERY).length;

                if (batteryCount === 0) {
                    setErrorMsg('需要電池才能供電！');
                    setIsSwitchOn(false);
                    return;
                }

                if (result.directShort) {
                    setErrorMsg('電池正負極被電線直接連起來了，請讓電流先經過燈泡。');
                    return;
                }

                if (result.litBulbIds.size > 0) {
                    setLitBulbIds(result.litBulbIds);
                    setBrightness(batteryCount >= 2 ? 2 : 1);
                    setErrorMsg(`電路形成完整圈圈！${result.litBulbIds.size} 顆燈泡發光。`);
                } else {
                    setErrorMsg('電源已開啟，但每一顆燈泡都還沒有形成完整迴路。');
                }
            };

            return (
                <div 
                    className="flex flex-col items-center min-h-screen bg-amber-50 font-sans no-select overflow-hidden"
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleGlobalMouseUp}
                    onTouchMove={handleMouseMove}    // 手指移動 = 滑鼠移動
                    onTouchEnd={handleGlobalMouseUp} // 手指放開 = 判斷是否連線
                >
                    <div className="circuit-header w-full bg-white shadow-md p-4 flex justify-between items-center z-10 gap-4 flex-wrap mt-14">
                        <h1 className="text-2xl font-bold text-slate-700 flex items-center gap-2 mr-auto">
                            <Zap className="text-yellow-500 fill-yellow-500" />
                            Q版電路小實驗
                        </h1>
                        
                        <div className="circuit-toolbar flex gap-2">
                            <button 
                                onClick={() => setShowControls(!showControls)}
                                className={`flex items-center gap-1 px-4 py-2 rounded-full transition font-bold ${showControls ? 'bg-purple-100 text-purple-700 hover:bg-purple-200' : 'bg-gray-200 text-gray-500 hover:bg-gray-300'}`}
                            >
                                {showControls ? <Eye size={18} /> : <EyeOff size={18} />}
                                <span className="hidden sm:inline">{showControls ? "隱藏輔助" : "顯示輔助"}</span>
                            </button>

                            <button onClick={addBattery} className="flex items-center gap-1 px-4 py-2 bg-blue-100 text-blue-700 rounded-full hover:bg-blue-200 transition font-bold"><Plus size={18} /> 電池</button>
                            <button onClick={addBulb} className="flex items-center gap-1 px-4 py-2 bg-yellow-100 text-yellow-700 rounded-full hover:bg-yellow-200 transition font-bold"><Lightbulb size={18} /> 燈泡</button>
                            <button onClick={resetBoard} className="flex items-center gap-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-full hover:bg-gray-200 transition font-bold"><RotateCcw size={18} /> 重置</button>
                            
                            <button 
                                onClick={togglePower} 
                                className={`power-button flex items-center gap-1 px-6 py-2 text-white rounded-full transition shadow-lg transform active:scale-95 font-bold text-lg min-w-[140px] justify-center
                                ${isSwitchOn ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'}
                                `}
                            >
                                <Power size={20} /> 
                                {isSwitchOn ? "關閉電源" : "開啟電源"}
                            </button>
                        </div>
                    </div>

                    <div className={`circuit-status mt-4 px-6 py-2 rounded-lg text-lg font-bold transition-all duration-300 ${
                        litBulbIds.size > 0 ? 'bg-yellow-100 text-yellow-800 border-2 border-yellow-400' : 
                        errorMsg ? (isSwitchOn ? 'bg-orange-100 text-orange-800' : 'bg-slate-200 text-slate-700') : 'bg-transparent text-transparent'
                    }`}>
                        {errorMsg || "準備就緒，請連接電路並開啟電源"}
                    </div> 

                    <div className="relative w-full flex-grow cursor-crosshair overflow-hidden" ref={canvasRef}>
                        
                        <div className="absolute inset-0 pointer-events-none opacity-10" style={{ backgroundImage: 'radial-gradient(#94a3b8 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

                        <div className="absolute bottom-4 left-4 text-slate-400 pointer-events-none z-0">
                        {showControls ? (
                            <>
                            <p>💡 拖曳元件移動位置</p>
                            <p>🔌 先連電池＋端，再連燈泡下面的小圓點與金屬螺紋</p>
                            <p>↻ 使用上方紫色圓點旋轉元件</p>
                            </>
                        ) : (
                            <p>📷 觀賞模式</p>
                        )}
                        </div>

                        <svg className="absolute inset-0 w-full h-full pointer-events-none z-0">
                        {wires.map(wire => {
                            const startComp = components.find(c => c.id === wire.start.compId);
                            const endComp = components.find(c => c.id === wire.end.compId);
                            if (!startComp || !endComp) return null;
                            
                            const startPos = getConnectionPoint(startComp, wire.start.pointType);
                            const endPos = getConnectionPoint(endComp, wire.end.pointType);
                            const { cpX, cpY } = getWireGeometry(startPos, endPos, wire.controlOffset);

                            return (
                            <g key={wire.id}>
                                <path d={`M ${startPos.x} ${startPos.y} Q ${cpX} ${cpY} ${endPos.x} ${endPos.y}`} stroke="#475569" strokeWidth="8" fill="none" strokeLinecap="round" />
                                <path d={`M ${startPos.x} ${startPos.y} Q ${cpX} ${cpY} ${endPos.x} ${endPos.y}`} stroke="#000000" strokeWidth="4" fill="none" strokeLinecap="round" />
                            </g>
                            );
                        })}
                        {isDrawing && currentWireStart && (() => {
                            const startComp = components.find(c => c.id === currentWireStart.compId);
                            const startPos = getConnectionPoint(startComp, currentWireStart.pointType);
                            const midX = (startPos.x + mousePos.x) / 2;
                            const midY = (startPos.y + mousePos.y) / 2;
                            return (
                            <g>
                                <path d={`M ${startPos.x} ${startPos.y} Q ${midX} ${midY + 50} ${mousePos.x} ${mousePos.y}`} stroke="#000000" strokeWidth="4" fill="none" strokeLinecap="round" />
                                <path d={`M ${startPos.x} ${startPos.y} Q ${midX} ${midY + 50} ${mousePos.x} ${mousePos.y}`} stroke="#fbbf24" strokeWidth="8" fill="none" strokeLinecap="round" opacity="0.3" />
                                <circle cx={mousePos.x} cy={mousePos.y} r="6" fill="#000000" />
                            </g>
                            )
                        })()}
                        </svg>

                        {showControls && wires.map(wire => {
                            const startComp = components.find(c => c.id === wire.start.compId);
                            const endComp = components.find(c => c.id === wire.end.compId);
                            if (!startComp || !endComp) return null;
                            const startPos = getConnectionPoint(startComp, wire.start.pointType);
                            const endPos = getConnectionPoint(endComp, wire.end.pointType);
                            const { cpX, cpY } = getWireGeometry(startPos, endPos, wire.controlOffset);
                            const midCurveX = 0.25 * startPos.x + 0.5 * cpX + 0.25 * endPos.x;
                            const midCurveY = 0.25 * startPos.y + 0.5 * cpY + 0.25 * endPos.y;

                            return (
                            <React.Fragment key={`controls-${wire.id}`}>
                                <div 
                                    className="absolute w-4 h-4 bg-blue-500 rounded-full border-2 border-white shadow-md cursor-move hover:scale-125 transition-transform z-30 pointer-events-auto" 
                                    style={{ left: cpX - 8, top: cpY - 8 }} 
                                    onMouseDown={(e) => handleWireControlMouseDown(e, wire.id)} 
                                    onTouchStart={(e) => handleWireControlMouseDown(e, wire.id)}
                                    title="調整形狀"
                                ></div>
                                <div className="absolute w-5 h-5 bg-red-100 hover:bg-red-500 hover:text-white text-red-500 rounded-full flex items-center justify-center cursor-pointer shadow-md border border-red-200 transition-colors z-30 pointer-events-auto" style={{ left: midCurveX - 10, top: midCurveY - 10 }} onClick={(e) => { e.stopPropagation(); removeWire(wire.id); }} title="移除電線"><span className="text-xs font-bold leading-none mb-[1px]">×</span></div>
                            </React.Fragment>
                            );
                        })}

                        {components.map(comp => (
                        <div
                            key={comp.id}
                            className="absolute z-20"
                            style={{ 
                            left: comp.x, 
                            top: comp.y, 
                            width: comp.type === COMPONENT_TYPES.BATTERY ? 140 : 80,
                            height: comp.type === COMPONENT_TYPES.BATTERY ? 60 : 140,
                            transform: `rotate(${comp.rotation}deg)`,
                            }}
                        >
                            {showControls && (
                                <div 
                                className="absolute left-1/2 -top-8 -ml-3 w-6 h-6 bg-purple-500 rounded-full border-2 border-white shadow-md cursor-grab active:cursor-grabbing hover:scale-110 flex items-center justify-center z-50 pointer-events-auto"
                                onMouseDown={(e) => handleRotateMouseDown(e, comp.id)}
                                onTouchStart={(e) => handleRotateMouseDown(e, comp.id)}
                                title="旋轉元件"
                                >
                                <RotateCw size={14} className="text-white" />
                                </div>
                            )}

                            <div 
                                className="w-full h-full cursor-grab active:cursor-grabbing"
                                onMouseDown={(e) => handleMouseDownComp(e, comp.id)}
                                onTouchStart={(e) => handleMouseDownComp(e, comp.id)}
                            >
                                {comp.type === COMPONENT_TYPES.BATTERY && (
                                <BatteryComponent 
                                    id={comp.id} 
                                    onNodeMouseDown={handleNodeMouseDown} 
                                    onNodeMouseUp={handleNodeMouseUp}
                                    isDrawing={isDrawing} 
                                    currentStart={currentWireStart}
                                    showControls={showControls}
                                />
                                )}
                                {comp.type === COMPONENT_TYPES.BULB && (
                                <BulbComponent 
                                    id={comp.id} 
                                    onNodeMouseDown={handleNodeMouseDown} 
                                    onNodeMouseUp={handleNodeMouseUp}
                                    isLit={litBulbIds.has(comp.id)}
                                    brightness={brightness}
                                    isDrawing={isDrawing}
                                    currentStart={currentWireStart}
                                    showControls={showControls}
                                />
                                )}
                            </div>
                        </div>
                        ))}

                    </div>
                </div>
            );
        }

        function BatteryComponent({ id, onNodeMouseDown, onNodeMouseUp, isDrawing, currentStart, showControls }) {
            const canConnect = isDrawing && currentStart && currentStart.compId !== id;
            return (
                <div className="relative w-[140px] h-[60px] select-none group">
                <div className="absolute inset-0 bg-gradient-to-b from-gray-700 to-gray-800 rounded-lg shadow-lg border-2 border-gray-900 flex items-center justify-center overflow-hidden">
                    <div className="absolute top-1 bottom-1 left-3 right-3 bg-gradient-to-r from-orange-400 to-orange-500 rounded flex items-center justify-between px-2">
                        <span className="text-white font-bold text-xl ml-1">+</span>
                        <div className="flex gap-1 opacity-30"><div className="w-1 h-4 bg-orange-700 rounded-full"></div><div className="w-1 h-4 bg-orange-700 rounded-full"></div><div className="w-1 h-4 bg-orange-700 rounded-full"></div></div>
                        <span className="text-white font-bold text-xl mr-1">-</span>
                    </div>
                    <div className="absolute top-1 left-2 right-2 h-3 bg-white opacity-20 rounded-full"></div>
                </div>
                <div className="absolute left-[-8px] top-[15px] w-2 h-8 bg-gray-400 rounded-l-sm border-l border-t border-b border-gray-600"></div>
                
                {showControls && (
                    <>
                    <div 
                        data-comp-id={id} data-point-type="pos"
                        className={`absolute left-0 top-[20px] w-6 h-6 rounded-full border-2 border-white shadow-sm z-30 cursor-pointer transition-transform hover:scale-125 ${canConnect ? 'bg-yellow-400 scale-125 animate-pulse' : 'bg-red-500 hover:bg-red-400'}`} 
                        onMouseDown={(e) => onNodeMouseDown(e, id, 'pos')} 
                        onTouchStart={(e) => onNodeMouseDown(e, id, 'pos')}
                        onMouseUp={(e) => onNodeMouseUp(e, id, 'pos')} 
                        title="正極 (+)"
                    ></div>
                    <div 
                        data-comp-id={id} data-point-type="neg"
                        className={`absolute right-0 top-[20px] w-6 h-6 rounded-full border-2 border-white shadow-sm z-30 cursor-pointer transition-transform hover:scale-125 ${canConnect ? 'bg-yellow-400 scale-125 animate-pulse' : 'bg-blue-500 hover:bg-blue-400'}`} 
                        onMouseDown={(e) => onNodeMouseDown(e, id, 'neg')} 
                        onTouchStart={(e) => onNodeMouseDown(e, id, 'neg')}
                        onMouseUp={(e) => onNodeMouseUp(e, id, 'neg')} 
                        title="負極 (-)"
                    ></div>
                    </>
                )}
                </div>
            );
        }

        function BulbComponent({ id, onNodeMouseDown, onNodeMouseUp, isLit, brightness, isDrawing, currentStart, showControls }) {
            const canConnect = isDrawing && currentStart && currentStart.compId !== id;
            const lightStyles = isLit ? { filter: brightness > 1 ? 'drop-shadow(0 0 30px #fde047) drop-shadow(0 0 60px #facc15)' : 'drop-shadow(0 0 15px #fde047)', opacity: 1 } : { filter: 'none', opacity: 0.8 };
            const bulbColor = isLit ? (brightness > 1 ? '#fef08a' : '#fef9c3') : '#e2e8f0';

            return (
                <div className="relative w-[80px] h-[140px] flex flex-col items-center select-none">
                {isLit && (<div className={`absolute top-0 w-32 h-32 rounded-full bg-yellow-300 blur-2xl -z-10 transition-opacity duration-500 ${brightness > 1 ? 'opacity-80' : 'opacity-40'}`}></div>)}
                <div className="w-[70px] h-[70px] rounded-full border-2 border-gray-400 z-10 relative transition-colors duration-500 overflow-hidden" style={{ backgroundColor: bulbColor, ...lightStyles }}>
                    <div className="absolute top-3 left-3 w-6 h-6 bg-white rounded-full opacity-60"></div>
                    <div className="absolute top-5 left-8 w-2 h-2 bg-white rounded-full opacity-60"></div>
                    <div className="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-6 h-6 border-t-2 border-gray-600 rounded-full opacity-50"></div>
                </div>
                <div className="relative w-10 h-12 bg-gray-300 border border-gray-500 flex flex-col items-center -mt-2 z-20">
                    <div className="w-full h-[1px] bg-gray-500 mt-2 transform -rotate-6"></div>
                    <div className="w-full h-[1px] bg-gray-500 mt-2 transform -rotate-6"></div>
                    <div className="w-full h-[1px] bg-gray-500 mt-2 transform -rotate-6"></div>
                    {showControls && (
                        <div 
                            data-comp-id={id} data-point-type="thread"
                            className={`absolute -left-3 top-3 w-5 h-5 rounded-full border-2 border-white shadow-sm cursor-pointer hover:scale-125 transition-transform ${canConnect ? 'bg-yellow-400 scale-125 animate-pulse' : 'bg-green-500 hover:bg-green-400'}`} 
                            onMouseDown={(e) => onNodeMouseDown(e, id, 'thread')} 
                            onTouchStart={(e) => onNodeMouseDown(e, id, 'thread')}
                            onMouseUp={(e) => onNodeMouseUp(e, id, 'thread')} 
                            title="螺紋接點"
                        ></div>
                    )}
                </div>
                <div className="w-8 h-4 bg-black rounded-b-lg relative z-20 flex justify-center">
                    {showControls && (
                        <div 
                            data-comp-id={id} data-point-type="tip"
                            className={`absolute -bottom-2 w-5 h-5 rounded-full border-2 border-white shadow-sm cursor-pointer hover:scale-125 transition-transform ${canConnect ? 'bg-yellow-400 scale-125 animate-pulse' : 'bg-green-500 hover:bg-green-400'}`} 
                            onMouseDown={(e) => onNodeMouseDown(e, id, 'tip')} 
                            onTouchStart={(e) => onNodeMouseDown(e, id, 'tip')}
                            onMouseUp={(e) => onNodeMouseUp(e, id, 'tip')} 
                            title="底部接點"
                        ></div>
                    )}
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CircuitGame />);
    </script>
    <script src="farm-ui.js"></script>
</body>
</html>
