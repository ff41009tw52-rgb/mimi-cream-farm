<body class="bg-slate-900 overflow-x-hidden">

  <div id="root"></div><div class="farm12-version-switch"><span>12-2 繪本農莊</span><a href="index.html">遊戲首頁</a><a href="12-1.html">12-1 加強版</a><a href="12.html">原版</a></div>

  <script src="assets/farm12/picturebook/gameplay-v3.js?v=20261002-normal"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const Care = window.Farm12Care;

    // --- 音效引擎 ---
    const useAudio = () => {
      const audioCtx = useRef(null);
      const initAudio = () => {
        if (!audioCtx.current) {
          audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
        }
      };

      const playEffect = (type) => {
        initAudio();
        const now = audioCtx.current.currentTime;

        if (type === 'water') {
          const osc = audioCtx.current.createOscillator();
          const gain = audioCtx.current.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.current.destination);
          osc.start();
          osc.stop(now + 0.1);
        } else if (type === 'weed') {
          const bufferSize = audioCtx.current.sampleRate * 0.1;
          const buffer = audioCtx.current.createBuffer(1, bufferSize, audioCtx.current.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = audioCtx.current.createBufferSource();
          noise.buffer = buffer;
          const filter = audioCtx.current.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 1000;
          const gain = audioCtx.current.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.current.destination);
          noise.start();
        } else if (type === 'coin') {
          const osc = audioCtx.current.createOscillator();
          const gain = audioCtx.current.createGain();
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(1500, now + 0.3);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.current.destination);
          osc.start();
          osc.stop(now + 0.4);
        }
      };

      return { playEffect };
    };

    // 12-2 uses its own hand-painted atlas set, independent of 12-1 assets.
    const STORY_ROOT = 'assets/farm12/picturebook/';
    const StorySprite = ({ sheet, index = 0, columns = 4, label = '', className = '' }) => (
      <span role={label ? 'img' : undefined} aria-label={label || undefined} aria-hidden={label ? undefined : true}
        className={'story-sprite ' + className}
        style={{ backgroundImage: `url(${STORY_ROOT}${sheet}-v2.webp)`, backgroundSize: `${columns * 100}% ${columns * 100}%`, backgroundPosition: `${(index % columns) * 100 / (columns - 1)}% ${Math.floor(index / columns) * 100 / (columns - 1)}%` }} />
    );
    const STORY_CROPS = ['sweetpotatoleaf','bokchoy','guava','waterspinach','loofah','mango','waterbamboo','taro','pomelo','whiteradish','cabbage','strawberry','golden_peach','crystal_melon','giant_pumpkin','white_strawberry'];
    const CropArt = ({ crop, growth = 0, mode = 'field' }) => {
      if (!crop) return null;
      const index = STORY_CROPS.indexOf(crop.id);
      if (index < 0) return null;
      const stage = Care.cropStage(crop, growth);
      return <span className={'farm12-art-wrap farm12-' + mode + ' story-' + stage} title={crop.name + '・' + Care.stageLabel(stage)}>
        <StorySprite sheet={stage === 'mature' ? 'crops-atlas' : stage === 'growing' ? 'growth-atlas' : 'sprouts-atlas'} index={index} label={crop.name + '・' + Care.stageLabel(stage)} className="farm12-art" />
      </span>;
    };
    const HenCard = ({ hen, day, onRename, onPet }) => {
      const [draft, setDraft] = useState(hen.name);
      const [editing, setEditing] = useState(false);
      useEffect(() => setDraft(hen.name), [hen.name]);
      return <article className="story-hen-card">
        <StorySprite sheet="hens-atlas" columns={3} index={hen.color + (hen.greetedDay === day ? 6 : hen.fedToday ? 3 : 0)} label={hen.name + (hen.fedToday ? '吃飽了' : '等待餵食')} className="story-hen-art" />
        <div className="story-hen-info"><h3>{hen.name}</h3><p>{hen.fedToday ? '吃飽了，明天有蛋' : '肚子餓了，需要 1 份飼料'}</p>
          <p>親密度 {hen.affection} / 10</p>
          {editing ? <form onSubmit={e => { e.preventDefault(); if (draft.trim()) { onRename(hen.id, draft.trim()); setEditing(false); } }}>
            <label htmlFor={'name-' + hen.id}>新名字（最多 8 字）</label>
            <input id={'name-' + hen.id} value={draft} maxLength={8} onChange={e => setDraft(e.target.value)} autoFocus />
            <button type="submit" className="picturebook-secondary" disabled={!draft.trim()}>儲存名字</button>
          </form> : <button className="story-rename" onClick={() => setEditing(true)}>替牠取名</button>}
          <button className="picturebook-secondary" onClick={() => onPet(hen.id)}>{hen.greetedDay === day ? '再摸摸牠' : '摸摸牠'}</button>
        </div>
      </article>;
    };
    const Farm12StatusArt = ({ type, mode = 'small', className = '' }) => <StorySprite sheet="ui-atlas" columns={5} index={type === 'pest' ? 7 : 8} label={type === 'pest' ? '菜蟲' : '雜草'} className={'farm12-status-art farm12-status-' + mode + ' ' + className} />;
    const STORY_TOOLS = { wateringCan:0, sprinkler:1, chili:2, weed:3, fert_leaf:4, fert_root:5, fert_fruit:6, net:7, windbreak:8 };
    const STORY_TOOL_NAMES = { wateringCan:'澆水壺', sprinkler:'灑水器', chili:'辣椒水', weed:'除草剪刀', fert_leaf:'氮肥', fert_root:'磷肥', fert_fruit:'鉀肥', net:'防蟲網', windbreak:'防風網' };
    const Farm12ItemArt = ({ item, mode = 'tool', className = '' }) => <StorySprite sheet="tools-atlas" columns={3} index={STORY_TOOLS[item] ?? 0} label={STORY_TOOL_NAMES[item] || '農具'} className={'farm12-item-art farm12-item-' + mode + ' ' + className} />;

    const FARM12_EMOJI_ICONS = {
      '✨':'sparkle', '🎓':'education', '💡':'idea', '🛒':'cart', '⚠️':'warning', '⚠':'warning',
      '🐛':'bug', '🌱':'sprout', '💧':'water', '💦':'water', '🛡️':'shield', '🛡':'shield', '🏫':'school',
      '🎃':'pumpkin', '🌿':'leaf', '🌾':'leaf', '🎋':'leaf', '❌':'close', '🧪':'fertilizer', '🥬':'leaf',
      '🕳️':'soil', '🕳':'soil', '🔲':'check-empty', '✅':'check', '📖':'book', '🎉':'celebrate',
      '🌶️':'pesticide', '🌶':'pesticide', '🌧️':'rain', '🌧':'rain', '🌙':'moon', '🌀':'storm', '❓':'question',
      '✂️':'scissors', '✂':'scissors', '🥭':'fruit', '🥔':'root', '🕸️':'net', '🕸':'net', '📥':'inbox',
      '📂':'folder', '💾':'save', '🎁':'gift', '🍓':'strawberry', '☀️':'sun', '☀':'sun', '🪦':'grave',
      '🥕':'root', '🥒':'fruit', '🥇':'medal', '🥀':'wilt', '🛠️':'tools', '🛠':'tools', '🚜':'tractor',
      '😭':'sad', '🔒':'lock', '📢':'announcement', '👨‍🌾':'farmer', '🍑':'fruit', '🍐':'fruit', '🍎':'fruit',
      '🍋':'fruit', '🍉':'melon', '🌪️':'storm', '🌪':'storm', '🌦️':'weather', '🌦':'weather', '⏳':'hourglass'
    };
    const FARM12_ICON_LABELS = {
      sparkle:'閃亮', education:'教學', idea:'提示', cart:'商店', warning:'警告', bug:'菜蟲', sprout:'幼苗',
      water:'澆水', shield:'防護', school:'學校任務', pumpkin:'南瓜', leaf:'葉菜', close:'關閉', fertilizer:'肥料',
      soil:'農地', 'check-empty':'未完成', check:'完成', book:'圖鑑', celebrate:'恭喜', pesticide:'辣椒水', rain:'雨天',
      moon:'睡覺', storm:'颱風', question:'未知', scissors:'除草剪刀', fruit:'水果', root:'根莖作物', net:'防蟲網',
      inbox:'收成籃', folder:'讀取進度', save:'儲存進度', gift:'獎勵', strawberry:'草莓', sun:'晴天', grave:'枯死',
      medal:'勳章', wilt:'枯萎', tools:'農用耗材', tractor:'灌溉系統', sad:'災損', lock:'尚未解鎖',
      announcement:'通知', farmer:'農夫', melon:'西瓜', weather:'天氣', hourglass:'生長期'
    };

    const STORY_UI = { sun:0, rain:1, weather:1, storm:2, moon:3, coin:4, water:5, sprout:6, bug:7, shield:9, lock:10, question:11, egg:12, feed:13, soil:14, check:15, 'check-empty':14, close:16, save:17, folder:18, gift:18, sparkle:19, celebrate:19, medal:19, school:20, education:20, grave:21, wilt:21, sad:21, farmer:22, warning:23, announcement:23, book:24, idea:19, hourglass:17 };
    const Farm12UiIcon = ({ name, className = '' }) => {
      const cls = 'farm12-ui-icon ' + className;
      if (name === 'cart' || name === 'inbox') return <StorySprite sheet="village-atlas" columns={2} index={name === 'cart' ? 0 : 2} label={FARM12_ICON_LABELS[name]} className={cls} />;
      const tool = { fertilizer:'fert_leaf', net:'net', pesticide:'chili', scissors:'weed', tools:'weed', tractor:'sprinkler' }[name];
      if (tool) return <Farm12ItemArt item={tool} className={cls} />;
      const cropIndex = { fruit:5, root:9, leaf:0, pumpkin:14, melon:13, strawberry:11 }[name];
      if (cropIndex !== undefined) return <StorySprite sheet="crops-atlas" index={cropIndex} label={FARM12_ICON_LABELS[name]} className={cls} />;
      return <StorySprite sheet="ui-atlas" columns={5} index={STORY_UI[name] ?? 11} label={FARM12_ICON_LABELS[name] || '功能圖示'} className={cls} />;
    };

    const FARM12_NATIVE_CREATE_ELEMENT = React.createElement.bind(React);
    const FARM12_EMOJI_PATTERN = new RegExp('(' + Object.keys(FARM12_EMOJI_ICONS).sort((a,b) => b.length-a.length).map(key => key.replace(/[.*+?^${}()|[\]\\]/g, '\\    // --- 自定義 UI 元件：專屬種子袋 ---')).join('|') + ')', 'gu');
    const farm12IconizeText = (value) => {
      if (typeof value !== 'string' || !FARM12_EMOJI_PATTERN.test(value)) { FARM12_EMOJI_PATTERN.lastIndex = 0; return value; }
      FARM12_EMOJI_PATTERN.lastIndex = 0;
      return value.split(FARM12_EMOJI_PATTERN).filter(Boolean).map((part, index) => {
        const iconName = FARM12_EMOJI_ICONS[part];
        return iconName ? FARM12_NATIVE_CREATE_ELEMENT(Farm12UiIcon, { name: iconName, key: 'farm12-icon-' + index }) : part;
      });
    };
    React.createElement = function(type, props, ...children) {
      const converted = children.map(child => Array.isArray(child) ? child.map(farm12IconizeText) : farm12IconizeText(child));
      return FARM12_NATIVE_CREATE_ELEMENT(type, props, ...converted);
    };
    // --- 自定義 UI 元件：專屬種子袋 ---
    const SeedBag = ({ crop }) => <CropArt crop={crop} growth={crop.days} mode="seedbag" />;

    // --- 作物數據設定 ---
    const CROPS = {
      SPRING: [
        { id: 'sweetpotatoleaf', name: '地瓜葉', type: 'leaf', price: 100, days: 3, value: 40, icon: '🌿', desc: '【環境】喜高溫多濕，對土壤適應性極強。\n【種植】多以扦插繁殖，生長迅速，需保持土壤濕潤，不需過度施肥即可旺盛生長。' },
        { id: 'bokchoy', name: '青江菜', type: 'leaf', price: 500, days: 4, value: 150, icon: '🥬', desc: '【環境】喜冷涼氣候，日照需充足。\n【種植】種子直播，因根系較淺需勤澆水保持濕潤。極易受十字花科害蟲啃食，需注重防蟲。' },
        { id: 'guava', name: '芭樂', type: 'fruit', price: 1500, days: 8, value: 500, icon: '🍐', desc: '【環境】需全日照，喜好排水良好的砂質壤土。\n【種植】需定時修剪枝條以促進開花結果，適度施用磷鉀肥可大幅提升果實甜度與脆度。' },
      ],
      SUMMER: [
        { id: 'waterspinach', name: '空心菜', type: 'leaf', price: 200, days: 3, value: 80, icon: '🥬', desc: '【環境】極度喜高溫與潮濕，耐澇性強。\n【種植】播種或扦插皆可，莖部中空能適應積水環境。只要水分充足，夏天生長速度極快。' },
        { id: 'loofah', name: '絲瓜', type: 'fruit', price: 800, days: 6, value: 250, icon: '🥒', desc: '【環境】喜高溫多濕，不耐寒，需搭設棚架。\n【種植】攀藤生長，開花後需人工或仰賴昆蟲授粉。必須在果實鮮嫩時採收。' },
        { id: 'mango', name: '芒果', type: 'fruit', price: 2500, days: 12, value: 800, icon: '🥭', desc: '【環境】熱帶果樹，喜高溫乾燥，需充足日照。\n【種植】開花期極忌連續降雨會導致落花。果實發育期需套袋，防止蟲害與烈日曬傷。' },
      ],
      AUTUMN: [
        { id: 'waterbamboo', name: '筊白筍', type: 'root', price: 400, days: 5, value: 150, icon: '🎋', desc: '【環境】需生長於水溫穩定、活水流動的淺水田中。\n【種植】實為菰草受「黑穗菌」共生感染後膨大的幼嫩莖部。水質控制是絕對關鍵。' },
        { id: 'taro', name: '芋頭', type: 'root', price: 1500, days: 9, value: 500, icon: '🥔', desc: '【環境】喜高溫多濕，栽培分為水芋與旱芋兩種。\n【種植】生長期長，需深厚且保水力強的土壤。屬於重肥作物，生長期間需大量養分。' },
        { id: 'pomelo', name: '文旦', type: 'fruit', price: 3500, days: 15, value: 1250, icon: '🍋', desc: '【環境】喜高溫與日照，需排水良好的山坡地。\n【種植】果樹需多年栽培。果實採收後不宜馬上食用，需放置通風處數日進行「辭水」。' },
      ],
      WINTER: [
        { id: 'whiteradish', name: '蘿蔔', type: 'root', price: 600, days: 4, value: 200, icon: '🥕', desc: '【環境】喜冷涼氣候，忌高溫多濕。\n【種植】屬根莖類，種子必須「直播」於深厚、鬆軟的土壤中，若移植或遇硬土會導致變形。' },
        { id: 'cabbage', name: '高麗菜', type: 'leaf', price: 2000, days: 7, value: 750, icon: '🥬', desc: '【環境】極喜冷涼，高山地區日夜溫差大最為適宜。\n【種植】結球期需要大量水分與養分，溫差越大則口感越清脆甘甜。需注意田間排水。' },
        { id: 'strawberry', name: '草莓', type: 'fruit', price: 6000, days: 14, value: 2000, icon: '🍓', desc: '【環境】極度嬌貴，喜冷涼氣候與充足日照，怕雨水。\n【種植】根系淺怕積水，極易染病蟲害。現代多採用高架覆膜種植，除保持通風也避免腐爛。' },
      ],
      SPECIAL: [
        { id: 'golden_peach', name: '黃金仙桃', type: 'fruit', price: 0, days: 10, value: 600, icon: '🍑', desc: '【環境】春季限定的傳說果實，散發出神聖的微光。\n【種植】相傳是天庭掉落的種子，對水分要求極高，成功收成後價值連城，是鎮長夢寐以求的極品。' },
        { id: 'crystal_melon', name: '水晶寶石西瓜', type: 'fruit', price: 0, days: 12, value: 600, icon: '🍉', desc: '【環境】夏季限定，果肉如紅寶石般晶瑩剔透。\n【種植】極度需要充足水分與烈日曝曬，在極端高溫下反而能凝結出絕佳的脆度與甜味。' },
        { id: 'giant_pumpkin', name: '巨無霸南瓜', type: 'fruit', price: 0, days: 15, value: 600, icon: '🎃', desc: '【環境】秋季限定的變異品種，果實大而鮮豔。\n【種植】一包種子可種滿一區的 8 格農田，與其他作物一樣逐格照顧、逐格收成。' },
        { id: 'white_strawberry', name: '初雪白草莓', type: 'fruit', price: 0, days: 14, value: 600, icon: '🍓', desc: '【環境】冬季限定，對溫度極度敏感的嬌貴品種。\n【種植】需要在嚴寒中小心呵護，果實純白如初雪，香氣馥郁，是高級拍賣會上千金難求的珍寶。' }
      ]
    };

    const PLOT_PRICES = [0, 5000, 15000, 30000];



    // --- 飛行作物動畫元件 ---
    const FlyingCropComponent = ({ data, onRemove }) => {
      const [active, setActive] = useState(false);
      useEffect(() => {
        const raf = requestAnimationFrame(() => {
            requestAnimationFrame(() => setActive(true));
        });
        // 0.5秒後動畫結束，移除 DOM
        const timer = setTimeout(() => onRemove(data.id), 500);
        return () => { cancelAnimationFrame(raf); clearTimeout(timer); };
      }, [data, onRemove]);

      return (
        <div
            className="fixed z-[9999] pointer-events-none drop-shadow-2xl flex items-center justify-center"
            style={{
                left: active ? data.endX : data.startX,
                top: active ? data.endY : data.startY,
                transform: `translate(-50%, -50%) scale(${active ? 0.3 : 1.2})`,
                opacity: active ? 0.2 : 1,
                transition: 'all 0.5s cubic-bezier(0.25, 1, 0.5, 1)',
                fontSize: '4rem'
            }}
        >
            <CropArt crop={{ id: data.cropId, name: data.cropName || '作物', days: 1, icon: data.icon }} growth={1} mode="flying" fallback={data.icon} />
        </div>
      );
    };

    const App = () => {
      const { playEffect } = useAudio();

      const [isGameStarted, setIsGameStarted] = useState(false);
      const [farmName, setFarmName] = useState('');

      const [day, setDay] = useState(1);
      const [weather, setWeather] = useState('sunny');
      const [weatherMotion, setWeatherMotion] = useState(true);
      const [gold, setGold] = useState(100);

      const [tutorialStep, setTutorialStep] = useState(0);
      const [flags, setFlags] = useState({
        seenRain: false, seenTyphoon: false, seenQuest: false, seenBug: false,
        seenWeed: false, seenDay2Water: false, seenHarvest: false,
        seenAfterHarvest: false, seenQuestReward: false, seenForgotWater: false,
        tutSell: false, tutFert: false, tutNet: false
      });

      const [inventory, setInventory] = useState(() => Care.startingInventory());
      const [gallery, setGallery] = useState({});
      const [coop, setCoop] = useState(() => Care.normalizeCoop());

      const [coopMessage, setCoopMessage] = useState('');
      const [careMessage, setCareMessage] = useState('');
      const hungryHens = coop.hens.filter(hen => !hen.fedToday);
      const [selectedTool, setSelectedTool] = useState('water');
      const [bagFilter, setBagFilter] = useState('all');
      const [selectedSeed, setSelectedSeed] = useState(null);

      const [showShop, setShowShop] = useState(false);
      const [shopTab, setShopTab] = useState('buy');

      const [schoolQuest, setSchoolQuest] = useState(null);
      const [showQuestModal, setShowQuestModal] = useState(false);

      const [eventQueue, setEventQueue] = useState([]);
      const currentEvent = eventQueue[0];

      const [flyingCrops, setFlyingCrops] = useState([]);
      const dropZoneRef = useRef(null);

      const closeEventModal = () => {
        setEventQueue(prev => prev.slice(1));
      };

      const [plots, setPlots] = useState(Array(4).fill(null).map((_, i) => ({
        id: i,
        isUnlocked: i === 0,
        isNetted: false,
        isWindbreaked: false,
        slots: Array(8).fill(null).map((_, j) => ({
          id: j, crop: null, growth: 0, isWatered: false, isFertilized: false, hasBug: false, hasWeed: false, hazardDays: 0
        }))
      })));

      const [activePlot, setActivePlot] = useState(null);
      const [message, setMessage] = useState("歡迎來到 四季農莊！");
      const [showModal, setShowModal] = useState(null);
      const [saveExists, setSaveExists] = useState(false);
      const [lastSave, setLastSave] = useState(null);
      const [saveError, setSaveError] = useState(false);
      const [actionFx, setActionFx] = useState(null);
      const actionFxTimer = useRef(null);

      const triggerActionFx = useCallback((type, point) => {
        const itemMap = {
          water: day >= 20 ? 'sprinkler' : 'wateringCan',
          weed: 'weed',
          chili: 'chili',
          fert_leaf: 'fert_leaf',
          fert_root: 'fert_root',
          fert_fruit: 'fert_fruit',
          net: 'net',
          windbreak: 'windbreak'
        };
        const item = itemMap[type];
        if (!item) return;
        const x = Number.isFinite(point?.clientX) ? point.clientX : window.innerWidth / 2;
        const y = Number.isFinite(point?.clientY) ? point.clientY : window.innerHeight / 2;
        window.clearTimeout(actionFxTimer.current);
        setActionFx({ id: Date.now(), item, x, y });
        actionFxTimer.current = window.setTimeout(() => setActionFx(null), 760);
      }, [day]);

      useEffect(() => {
        const saved = localStorage.getItem(Care.SAVE_KEY);
        if (saved) {
          setSaveExists(true);
          try {
            const state = JSON.parse(saved);
            if (state.savedAt) setLastSave({ at: state.savedAt, day: state.day });
          } catch (_) { /* The load button will report an invalid old save. */ }
        }
        return () => window.clearTimeout(actionFxTimer.current);
      }, []);

      const removeFlyingCrop = useCallback((id) => {
        setFlyingCrops(prev => prev.filter(c => c.id !== id));
      }, []);

      // --- 點擊收成與飛行觸發邏輯 ---
      const handleHarvestClick = (e, plotId, slotId, crop) => {
        e.stopPropagation(); // 避免觸發底層的其他點擊事件

        // 取得點擊作物的起始座標
        const rect = e.currentTarget.getBoundingClientRect();
        const startX = rect.left + rect.width / 2;
        const startY = rect.top + rect.height / 2;

        // 取得收成籃的目標座標
        let endX = window.innerWidth / 2;
        let endY = 0;
        if (dropZoneRef.current) {
            const boxRect = dropZoneRef.current.getBoundingClientRect();
            endX = boxRect.left + boxRect.width / 2;
            endY = boxRect.top + boxRect.height / 2;
        }

        // 推入飛行陣列觸發動畫
        const newId = Date.now() + Math.random();
        setFlyingCrops(prev => [...prev, { id: newId, icon: crop.icon, cropId: crop.id, cropName: crop.name, startX, startY, endX, endY }]);

        // 延遲播放金幣聲音，讓作物「飛到箱子」時才響
        setTimeout(() => playEffect('coin'), 400);

        // 立即處理後台收成邏輯
        processHarvest(plotId, slotId, crop);
      };

      const processHarvest = (plotId, slotId, crop) => {
        const newPlots = JSON.parse(JSON.stringify(plots));
        const targetPlot = newPlots[plotId];

        const s = targetPlot.slots[slotId];
        s.crop = null; s.growth = 0; s.hasBug = false; s.hasWeed = false; s.hazardDays = 0; s.isFertilized = false;

        setPlots(newPlots);

        // 檢查收成後，畫面上是否還有其他「已經成熟」的作物
        const remainingMature = newPlots.some(p => p.slots.some(s => s.crop && s.growth >= s.crop.days));

        setGallery(prevG => ({
          ...prevG,
          [crop.id]: { unlocked: true }
        }));

        setInventory(inv => ({
          ...inv,
          crops: { ...inv.crops, [crop.id]: (inv.crops?.[crop.id] || 0) + 1 }
        }));

        setMessage(`✨ 收成了 ${crop.name}！已存入倉庫，請至商店變現。`);

        // 當畫面上的成熟作物全部被清空時，才觸發第一次收成獎勵與進階教學
        setFlags(prev => {
          if (!prev.seenAfterHarvest && !remainingMature) {
            setEventQueue(q => [...q, { type: 'tutorial_after_harvest' }]);
            setInventory(inv => ({ ...inv, fert_leaf: (inv.fert_leaf||0) + 1, nets: (inv.nets||0) + 1 }));
            setTutorialStep(7); // 開啟進階任務1：販賣教學
            return { ...prev, seenAfterHarvest: true };
          }
          return prev;
        });
      };

      useEffect(() => {
        if (tutorialStep === 2 && (inventory.seeds['sweetpotatoleaf'] || 0) > 0) setTutorialStep(3);
        if (tutorialStep === 3 && selectedTool === 'seed' && selectedSeed?.id === 'sweetpotatoleaf') setTutorialStep(4);
        if (tutorialStep === 4 && plots[0].slots.some(s => s.crop)) setTutorialStep(5);
        if (tutorialStep === 5) {
          const plantedSlots = plots[0].slots.filter(s => s.crop);
          if (plantedSlots.length > 0 && plantedSlots.every(s => s.isWatered)) {
            setTutorialStep(6);
          }
        }
        if (tutorialStep === 6 && day > 1) setTutorialStep(0);
      }, [tutorialStep, inventory.seeds, selectedTool, selectedSeed, plots, day]);

      // 新增：進階任務檢查 (自由順序完成)
      useEffect(() => {
        if (tutorialStep >= 7 && flags.tutSell && flags.tutFert && flags.tutNet) {
          setTutorialStep(0);
          setMessage("🎉 恭喜完成所有進階教學！現在你可以自由經營你的農莊了！");
          playEffect('coin');
        }
      }, [tutorialStep, flags.tutSell, flags.tutFert, flags.tutNet, playEffect]);

      const persistGame = () => {
        const savedAt = Date.now();
        const stateToSave = {
          isGameStarted, farmName, day, weather, gold, inventory, gallery, plots, schoolQuest, flags, tutorialStep, coop, savedAt
        };
        localStorage.setItem(Care.SAVE_KEY, JSON.stringify(stateToSave));
        setLastSave({ at: savedAt, day });
        setSaveExists(true);
        setSaveError(false);
      };

      const handleSave = () => {
        try {
          persistGame();
          setMessage("💾 遊戲進度已成功儲存！");
          playEffect('coin');
          setShowModal(null);
        } catch (e) {
          setSaveError(true);
          setMessage("❌ 存檔失敗，請確認瀏覽器設定。");
        }
      };

      // Save the settled state after planting, tending, harvesting, and each new day.
      useEffect(() => {
        if (!isGameStarted) return;
        const timer = window.setTimeout(() => {
          try { persistGame(); }
          catch (_) { setSaveError(true); }
        }, 500);
        return () => window.clearTimeout(timer);
      }, [isGameStarted, farmName, day, weather, gold, inventory, gallery, plots, schoolQuest, flags, tutorialStep, coop]);

      const handleLoad = () => {
        try {
          const saved = localStorage.getItem(Care.SAVE_KEY);
          if (saved) {
            const state = JSON.parse(saved);
            setIsGameStarted(state.isGameStarted);
            setFarmName(state.farmName);
            setDay(state.day);
            setWeather(state.weather);
            setGold(Care.count(state.gold));
            setInventory(Care.normalizeInventory(state.inventory || {}));
            setGallery(Object.fromEntries(Object.entries(state.gallery || {}).map(([id, record]) => [id, { unlocked: !!record?.unlocked }])));
            setCoop(Care.normalizeCoop(state.coop || {}));
            setPlots(state.plots.map(plot => ({
              ...plot,
              slots: plot.slots.map(slot => {
                const { perfectGrowth, ...rest } = slot;
                return { ...rest, hazardDays: slot.hazardDays || 0 };
              })
            })));
            setSchoolQuest(Care.normalizeQuest(state.schoolQuest));
            setFlags(state.flags || { seenRain: false, seenTyphoon: false, seenQuest: false, seenBug: false, seenWeed: false, seenDay2Water: false, seenHarvest: false, seenAfterHarvest: false, seenQuestReward: false, seenForgotWater: false, tutSell: false, tutFert: false, tutNet: false });
            setTutorialStep(state.tutorialStep || 0);
            setLastSave(state.savedAt ? { at: state.savedAt, day: state.day } : null);
            setSaveError(false);

            setMessage("📂 遊戲進度讀取成功！歡迎回來！");
            setShowModal(null);
            setEventQueue([]);
            setActivePlot(null);
            playEffect('water');
          }
        } catch (e) {
          setMessage("❌ 讀檔失敗，存檔資料可能已損毀。");
        }
      };

      const season = Care.seasonForDay(day);
      const seasonName = { SPRING: '春', SUMMER: '夏', AUTUMN: '秋', WINTER: '冬' }[season];
      const seasonColor = { SPRING: 'bg-green-100', SUMMER: 'bg-yellow-100', AUTUMN: 'bg-orange-100', WINTER: 'bg-blue-100' }[season];
      const lastSaveLabel = lastSave ? `第 ${lastSave.day} 天・${new Date(lastSave.at).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })} 已儲存` : '尚未儲存';
      const sleepChecklist = plots.filter(plot => plot.isUnlocked).map(plot => {
        const growing = plot.slots.filter(slot => slot.crop && slot.growth < slot.crop.days);
        return {
          plotId: plot.id,
          water: weather === 'rainy' || weather === 'typhoon' ? 0 : growing.filter(slot => !slot.isWatered).length,
          bugs: growing.filter(slot => slot.hasBug).length,
          weeds: growing.filter(slot => slot.hasWeed).length,
          urgent: growing.filter(slot => (slot.hasBug || slot.hasWeed) && (slot.hazardDays || 0) >= 1).length,
          windRisk: weather === 'typhoon' && !plot.isWindbreaked ? growing.length : 0
        };
      }).filter(item => item.water || item.bugs || item.weeds || item.windRisk);

      const processNextDay = () => {
        if (day >= 365) {
          setShowModal('result');
          return;
        }

        const nextDayNum = day + 1;
        const nextSeason = Care.seasonForDay(nextDayNum);
        const nextWeatherType = Care.weatherForDay(nextDayNum);
        const isTyphoonNext = nextWeatherType === 'typhoon';
        const forgotWaterYesterday = !Care.rainy(weather) && plots.some(p => p.isUnlocked && p.slots.some(s => s.crop && s.growth < s.crop.days && !s.isWatered));
        const { nextPlots, typhoonDamageCount, hasDeadCrops } = Care.advanceFields(plots, weather, nextWeatherType);

        const currentHasBug = nextPlots.some(p => p.slots.some(s => s.hasBug));
        const currentHasWeed = nextPlots.some(p => p.slots.some(s => s.hasWeed));
        const currentHasMature = nextPlots.some(p => p.slots.some(s => s.crop && s.growth >= s.crop.days));
        const needsRescue = nextPlots.some(p => p.slots.some(s => s.crop && (s.hasBug || s.hasWeed) && s.hazardDays >= 1));

        setPlots(nextPlots);
        setCoop(prev => Care.advanceCoopDay(prev));
        setCoopMessage('');
        setCareMessage('');

        let newQuest = null;
        if (schoolQuest) {
          setSchoolQuest(prev => (prev && prev.daysLeft > 1) ? { ...prev, daysLeft: prev.daysLeft - 1 } : null);
        } else {
          if (nextDayNum > 5 && Math.random() < 0.15) {
            const seasonCrops = CROPS[nextSeason].slice(0, 2);
            const randomCrop = seasonCrops[Math.floor(Math.random() * seasonCrops.length)];
            newQuest = { crop: randomCrop, required: 8, daysLeft: Care.questDuration(randomCrop), durationDays: Care.questDuration(randomCrop), deadlineVersion: 2 };
            setSchoolQuest(newQuest);
          }
        }

        setDay(nextDayNum);
        setWeather(nextWeatherType);
        setShowModal(null);

        let newEvents = [];

        // 若第一次忘記澆水，推入提示事件
        if (forgotWaterYesterday && !flags.seenForgotWater) {
          newEvents.push({ type: 'tutorial_forgot_water' });
          setFlags(prev => ({...prev, seenForgotWater: true}));
        }

        if (nextDayNum === 2 && !flags.seenDay2Water) {
          newEvents.push({ type: 'tutorial_day2_water' });
          setFlags(prev => ({...prev, seenDay2Water: true}));
        }
        if (currentHasBug && !flags.seenBug) {
          newEvents.push({ type: 'tutorial_bug' });
          setFlags(prev => ({...prev, seenBug: true}));
        }
        if (currentHasWeed && !flags.seenWeed) {
          newEvents.push({ type: 'tutorial_weed' });
          setFlags(prev => ({...prev, seenWeed: true}));
        }
        if (currentHasMature && !flags.seenHarvest) {
          newEvents.push({ type: 'tutorial_harvest' });
          setFlags(prev => ({...prev, seenHarvest: true}));
        }
        if (nextWeatherType === 'rainy' && !flags.seenRain) {
          newEvents.push({ type: 'tutorial_rain' });
          setFlags(prev => ({...prev, seenRain: true}));
        }
        if (hasDeadCrops) {
          newEvents.push({ type: 'crop_died' });
        }

        if (nextDayNum === 20) {
          newEvents.push({ type: 'irrigation_upgrade' });
        }
        if (isTyphoonNext) {
          newEvents.unshift({ type: 'typhoon_warning', isFirst: !flags.seenTyphoon });
          if (!flags.seenTyphoon) {
            setFlags(prev => ({...prev, seenTyphoon: true}));
            // 新手教學：第一次遇到颱風送 1 個防風網
            setInventory(inv => ({ ...inv, windbreaks: (inv.windbreaks || 0) + 1 }));
          }
        }
        if (weather === 'typhoon') {
          newEvents.unshift({ type: 'typhoon_report', count: typhoonDamageCount, stormDay: day });
        }
        if (newQuest) {
          newEvents.push({ type: 'school_quest', data: newQuest });
          if (!flags.seenQuest) setFlags(prev => ({...prev, seenQuest: true}));
        }

        setEventQueue(newEvents);

        if (typhoonDamageCount > 0) {
          setMessage(`😭 災情回報：昨晚的颱風摧毀了你 ${typhoonDamageCount} 株缺乏保護的作物！`);
          playEffect('weed');
        } else if (hasDeadCrops) {
          setMessage("警告：有作物連續兩晚未處理蟲害或雜草而枯死了！");
          playEffect('weed');
        } else if (needsRescue) {
          setMessage("有作物因蟲害或雜草暫停生長；請在今晚前清理，還有一次補救機會！");
        } else {
          if (nextWeatherType === 'typhoon') {
            setMessage(`第 ${nextDayNum} 天颱風來襲 🌀！外面狂風暴雨，農田自動澆滿水了。`);
          } else if (nextWeatherType === 'rainy') {
            setMessage(`第 ${nextDayNum} 天早安！今天下雨了 🌧️，田地都已經自動吸滿水份囉！`);
          } else {
            setMessage(`第 ${nextDayNum} 天早安！晴空萬里 ☀️，別忘了幫作物澆水喔。`);
          }
        }

        if (nextDayNum % 100 === 0 && nextDayNum <= 300) setShowModal('contest');
      };

      const handleSlotClick = (plotId, slotId, clickPoint) => {
        const actionPoint = clickPoint ? { clientX: clickPoint.clientX, clientY: clickPoint.clientY } : null;
        setPlots(prev => {
          const newPlots = JSON.parse(JSON.stringify(prev));
          const targetPlot = newPlots[plotId];
          const targetSlot = targetPlot.slots[slotId];

          if (!targetPlot.isUnlocked) return prev;

          if (selectedTool === 'water') {
            let wateredAny = false;
            if (day >= 20) {
              targetPlot.slots.forEach(s => {
                if (s.crop && !s.isWatered) {
                  s.isWatered = true;
                  wateredAny = true;
                }
              });

              if (!wateredAny) {
                setMessage(Care.rainy(weather) ? "今天已有雨水，不需要人工澆水喔！" : "此區塊目前沒有需要澆水的作物！");
                return prev;
              }
              playEffect('water');
              triggerActionFx('water', actionPoint);
              setMessage(`💦 灑水完成！第 ${plotId + 1} 區的作物皆已吸滿水分！`);
            } else {
              if (targetSlot.crop && !targetSlot.isWatered) {
                targetSlot.isWatered = true;
                wateredAny = true;
              }
              if (!wateredAny) {
                setMessage(Care.rainy(weather) ? "今天已有雨水，不需要人工澆水喔！" : "這格沒有需要澆水的作物！");
                return prev;
              }
              playEffect('water');
              triggerActionFx('water', actionPoint);
              setMessage(`💧 已為該格作物澆水！`);
            }
          }

          else if (selectedTool === 'weed') {
            if (!targetSlot.hasWeed) return prev;
            if (inventory.scissors <= 0) {
              setMessage("除草剪刀已完全損壞，請至商店購買新的剪刀！");
              return prev;
            }
            targetSlot.hasWeed = false;
            if (!targetSlot.hasBug) targetSlot.hazardDays = 0;
            setInventory(inv => ({ ...inv, scissors: inv.scissors - 1 }));
            playEffect('weed');
            triggerActionFx('weed', actionPoint);
            setMessage(`✨ 割除雜草成功！(剪刀剩餘 ${inventory.scissors - 1} 次)`);
          }

          else if (selectedTool === 'chili') {
            if (!targetSlot.hasBug) return prev;
            if (inventory.chili <= 0) {
              setMessage("辣椒水已耗盡，請至商店購買補充包！");
              return prev;
            }
            targetSlot.hasBug = false;
            if (!targetSlot.hasWeed) targetSlot.hazardDays = 0;
            setInventory(inv => ({ ...inv, chili: inv.chili - 1 }));
            playEffect('water');
            triggerActionFx('chili', actionPoint);
            setMessage(`✨ 噴灑辣椒水驅蟲成功！(剩餘 ${inventory.chili - 1} 次)`);
          }

          else if (selectedTool.startsWith('fert_')) {
            const fertType = selectedTool.split('_')[1];
            const fertNames = { leaf: '氮肥', root: '磷肥', fruit: '鉀肥' };
            const fertName = fertNames[fertType];

            if (inventory[selectedTool] <= 0) {
              setMessage(`${fertName}庫存不足，請去商店購買！`);
              return prev;
            }

            let fertilizedAny = false;
            let alreadyFertilizedAny = false;
            let wrongTypeAny = false;

            targetPlot.slots.forEach(s => {
              if (s.crop && s.growth < s.crop.days && !s.hasBug && !s.hasWeed) {
                if (s.crop.type === fertType) {
                  if (!s.isFertilized) {
                    s.growth += 1;
                    s.isFertilized = true;
                    fertilizedAny = true;
                  } else {
                    alreadyFertilizedAny = true;
                  }
                } else {
                  wrongTypeAny = true;
                }
              }
            });

            if (!fertilizedAny) {
              if (alreadyFertilizedAny) {
                setMessage(`此區塊對應的作物今天都已經施過肥了，太肥會死掉，請明天再來！`);
              } else if (wrongTypeAny) {
                setMessage(`此區塊沒有適合施打【${fertName}】的作物類型！請確認作物屬性。`);
              } else {
                setMessage("此區塊目前沒有生長中的作物可以施肥！");
              }
              return prev;
            }

            let netBrokeMsg = "";
            const hasMature = targetPlot.slots.some(s => s.crop && s.growth >= s.crop.days);
            if (hasMature && targetPlot.isNetted) {
              targetPlot.isNetted = false;
              netBrokeMsg = " (作物成熟撐破了防蟲網！)";
            }

            setInventory(inv => ({ ...inv, [selectedTool]: Math.max(0, inv[selectedTool] - 1) }));
            playEffect('water');
            triggerActionFx(selectedTool, actionPoint);
            setMessage(`✨ 施打${fertName}成功！第 ${plotId + 1} 區對應屬性的作物生長進度縮短了 1 天。${netBrokeMsg}`);

            // 進階肥料教學完成檢查 (不限順序)
            if (tutorialStep >= 7 && !flags.tutFert) {
              setFlags(prev => ({ ...prev, tutFert: true }));
            }
          }

          else if (selectedTool === 'seed' && selectedSeed) {
            const isOccupied = targetPlot.slots.some(s => s.crop !== null);
            if (isOccupied) {
              setMessage("防呆警告：此區塊尚有植物，請先收成完畢再重新種植！");
              return prev;
            }

            if (!selectedSeed?.id || (inventory.seeds[selectedSeed.id] || 0) <= 0) {
              setMessage("種子庫存不足！請先去商店購買。");
              return prev;
            }

            setInventory(inv => ({
              ...inv,
              seeds: { ...inv.seeds, [selectedSeed.id]: Math.max(0, inv.seeds[selectedSeed.id] - 1) }
            }));

            targetPlot.slots = targetPlot.slots.map(s => ({
              ...s,
              crop: selectedSeed,
              growth: 0,
              hazardDays: 0,
              isWatered: Care.rainy(weather),
              isFertilized: false,
              hasBug: false,
              hasWeed: false
            }));

            setMessage(`消耗了 1 包 [${selectedSeed.name || '未知'}種子]，在第 ${plotId + 1} 區種滿了！`);
            playEffect('water');

            if (inventory.seeds[selectedSeed.id] <= 1) {
              setSelectedTool('water');
              setSelectedSeed(null);
            }
          }

          return newPlots;
        });
      };

      const buyItem = (type, cost) => {
        if (gold >= cost) {
          setGold(g => g - cost);
          if (type === 'net') {
            setInventory(i => ({ ...i, nets: i.nets + 1 }));
            setMessage("購買防蟲紗網成功！可在農田管理頁面部署。");
          } else if (type === 'fert_leaf') {
            setInventory(i => ({ ...i, fert_leaf: i.fert_leaf + 1 }));
            setMessage("購買氮肥成功！可加速「葉菜類」生長。");
          } else if (type === 'fert_root') {
            setInventory(i => ({ ...i, fert_root: i.fert_root + 1 }));
            setMessage("購買磷肥成功！可加速「根莖類」生長。");
          } else if (type === 'fert_fruit') {
            setInventory(i => ({ ...i, fert_fruit: i.fert_fruit + 1 }));
            setMessage("購買鉀肥成功！可加速「瓜果類」生長。");
          } else if (type === 'windbreak') {
            setInventory(i => ({ ...i, windbreaks: i.windbreaks + 1 }));
            setMessage("購買防風網成功！能抵禦強烈颱風。");
          } else if (type === 'scissors') {
            setInventory(i => ({ ...i, scissors: i.scissors + 10 }));
            setMessage("購買除草剪刀成功！獲得 10 次除草耐用度。");
          } else if (type === 'chili') {
            setInventory(i => ({ ...i, chili: i.chili + 10 }));
            setMessage("購買辣椒水成功！獲得 10 次驅蟲噴灑量。");
          }
        } else {
          setMessage("餘額不足，無法購買這項物品。");
        }
      };

      const sellCrop = (cropId, amount, unitPrice) => {
        const totalEarn = amount * unitPrice;
        setGold(g => g + totalEarn);
        setInventory(inv => ({
          ...inv,
          crops: { ...inv.crops, [cropId]: inv.crops[cropId] - amount }
        }));
        playEffect('coin');
        setMessage(`販賣了 ${amount} 份作物，獲得 $${totalEarn.toLocaleString()}！`);

        // 檢查販賣任務 (不限順序)
        if (tutorialStep >= 7 && !flags.tutSell) {
          setFlags(prev => ({ ...prev, tutSell: true }));
        }
      };

      const handlePlotCare = (plotId, kind, event) => {
        const stockKey = kind === 'weed' ? 'scissors' : 'chili';
        const result = Care.treatPlot(plots[plotId], kind, inventory[stockKey]);
        const name = kind === 'weed' ? '除草' : '驅蟲';
        const text = result.used ? `已${name} ${result.used} 格，消耗 ${result.used} 次。${result.remaining ? `耗材不足，還有 ${result.remaining} 格待處理；先處理了最需要補救的作物。` : '這一區處理好了！'}` : result.remaining ? `耗材不足，還有 ${result.remaining} 格需要${name}。` : `這一區不用${name}。`;
        setCareMessage(text); setMessage(text);
        if (!result.used) return;
        setPlots(prev => prev.map(plot => plot.id === plotId ? result.plot : plot));
        setInventory(prev => ({ ...prev, [stockKey]: prev[stockKey] - result.used }));
        triggerActionFx(kind, event); playEffect('water');
      };

      const buildCoop = () => {
        if (coop.built || gold < 3000) return;
        setGold(g => g - 3000);
        setCoop(Care.normalizeCoop({ built: true, feed: 2 }));
        setCoopMessage('小米搬進來了！附兩份飼料，也可以替牠取個新名字。');
        playEffect('coin');
      };
      const buyFeed = () => {
        const portions = coop.hens.length, price = portions * 60;
        if (!portions || gold < price) return;
        setGold(g => g - price);
        setCoop(prev => ({ ...prev, feed: prev.feed + portions }));
        setCoopMessage(`買好 ${portions} 份飼料，剛好夠全體母雞吃一天。`);
      };
      const feedHen = () => {
        const result = Care.feedCoop(coop);
        if (!result.used) return;
        setCoop(result.coop);
        setCoopMessage(`餵飽 ${result.used} 隻母雞。${result.remaining ? `還有 ${result.remaining} 隻沒吃到，記得補買飼料。` : '明早來雞窩收蛋吧！'}`);
        playEffect('water');
      };
      const upgradeCoop = () => {
        const price = Care.upgradePrice(coop);
        if (!coop.built || !price || gold < price) return;
        const hen = Care.makeHen(coop.hens.length);
        setGold(g => g - price);
        setCoop(prev => ({ ...prev, hens: [...prev.hens, hen] }));
        setCoopMessage(`${hen.name}搬進新雞窩了！牠今天還沒吃飼料。`);
        playEffect('coin');
      };
      const renameHen = (id, name) => {
        setCoop(prev => ({ ...prev, hens: prev.hens.map(hen => hen.id === id ? { ...hen, name: name.slice(0, 8) } : hen) }));
        setCoopMessage(`名字存好了，${name.slice(0, 8)}很喜歡牠的新名字。`);
      };
      const petHen = id => {
        const hen = coop.hens.find(h => h.id === id);
        if (!hen) return;
        setCoop(prev => ({ ...prev, hens: prev.hens.map(h => h.id === id ? { ...h, greetedDay: day, affection: Math.min(10, h.affection + (h.greetedDay === day ? 0 : 1)) } : h) }));
        setCoopMessage(hen.greetedDay === day ? `${hen.name}靠過來陪你。今天已增加過親密度，明天再來吧！` : `${hen.name}開心地拍拍翅膀！${hen.affection < 10 ? '親密度 +1。' : '牠已經非常信任你了。'}`);
      };

      const collectEggs = () => {
        if (coop.eggs < 1) return;
        setInventory(prev => ({ ...prev, eggs: (prev.eggs || 0) + coop.eggs }));
        setMessage(`收下 ${coop.eggs} 顆雞蛋，已放進農產包包。`);
        setCoopMessage(`收下 ${coop.eggs} 顆雞蛋，已放進農產包包。`);
        setCoop(prev => ({ ...prev, eggs: 0 }));
        playEffect('coin');
      };

      const sellEggs = () => {
        const count = inventory.eggs || 0;
        if (!count) return;
        setGold(g => g + count * 120);
        setInventory(prev => ({ ...prev, eggs: 0 }));
        setMessage(`賣出 ${count} 顆雞蛋，獲得 $${(count * 120).toLocaleString()}。`);
        playEffect('coin');
      };

      const buyPlot = (plotId, price) => {
        if (gold >= price) {
          setGold(g => g - price);
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isUnlocked: true } : p));
          setMessage(`🎉 成功解鎖 第 ${plotId + 1} 區農田！農莊規模擴大了！`);
          playEffect('coin');
        } else {
          setMessage(`資金不足！解鎖 第 ${plotId + 1} 區需要 $${price.toLocaleString()}。`);
        }
      };

      const applyNet = (plotId, clickPoint) => {
        const hasMature = plots[plotId].slots.some(s => s.crop && s.growth >= s.crop.days);
        if (hasMature) {
          setMessage("此區塊已有作物成熟，空間不足以架設防蟲網！");
          return;
        }

        if (inventory.nets > 0 && !plots[plotId].isNetted) {
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isNetted: true } : p));
          setInventory(inv => ({ ...inv, nets: Math.max(0, inv.nets - 1) }));
          triggerActionFx('net', clickPoint);
          setMessage(`第 ${plotId + 1} 區已經罩上防蟲紗網，蟲子飛不進來了！`);

          // 進階防蟲網教學完成檢查 (不限順序)
          if (tutorialStep >= 7 && !flags.tutNet) {
            setFlags(prev => ({ ...prev, tutNet: true }));
          }
        }
      };

      const applyWindbreak = (plotId, clickPoint) => {
        if (inventory.windbreaks > 0 && !plots[plotId].isWindbreaked) {
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isWindbreaked: true } : p));
          setInventory(inv => ({ ...inv, windbreaks: Math.max(0, inv.windbreaks - 1) }));
          triggerActionFx('windbreak', clickPoint);
          setMessage(`第 ${plotId + 1} 區已經架設防風網，能抵禦強風侵襲！`);
        }
      };

      const handleQuestDeliver = () => {
        const required = schoolQuest.required;
        const cropId = schoolQuest.crop.id;
        const currentAmount = inventory.crops?.[cropId] || 0;

        // 嚴格防呆檢查
        if (currentAmount < required) {
            setMessage(`⚠️ 庫存不足！還差 ${required - currentAmount} 個。`);
            return;
        }

        setGold(g => g + (schoolQuest.crop.value * 3 * required));
        setInventory(inv => ({
            ...inv,
            crops: { ...inv.crops, [cropId]: currentAmount - required }
        }));

        const seasonRewardMap = { SPRING: 'golden_peach', SUMMER: 'crystal_melon', AUTUMN: 'giant_pumpkin', WINTER: 'white_strawberry' };
        const rewardId = seasonRewardMap[season];

        setInventory(inv => ({
            ...inv,
            seeds: { ...inv.seeds, [rewardId]: (inv.seeds[rewardId] || 0) + 1 }
        }));

        playEffect('coin');
        setSchoolQuest(null);
        setShowQuestModal(false);

        if (!flags.seenQuestReward) {
            setFlags(f => ({ ...f, seenQuestReward: true }));
            setEventQueue(q => [...q, { type: 'tutorial_special_seed', crop: CROPS.SPECIAL.find(c=>c.id === rewardId) }]);
        } else {
            setMessage(`🎉 委託完成！獲得 3 倍獎金與【傳說種子 x1】！`);
        }
      };

      return (
        <div className="farm12-picturebook min-h-screen p-3 md:p-5 text-slate-800 select-none relative overflow-x-hidden pb-24">

          <style>{`
            @keyframes rainFall {
              0% { transform: translateY(-100%); opacity: 0; }
              20% { opacity: 1; }
              80% { opacity: 1; }
              100% { transform: translateY(300%); opacity: 0; }
            }
            .animate-rain { animation: rainFall 0.8s linear infinite; }
            .rain-delay-1 { animation-delay: 0.2s; }
            .rain-delay-2 { animation-delay: 0.5s; }
            .rain-delay-3 { animation-delay: 0.7s; }

            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
          `}</style>

          {/* 飛行作物動畫層 */}
          {flyingCrops.length > 0 && <div className="story-harvest-toast" role="status"><Farm12UiIcon name="inbox" />{flyingCrops[flyingCrops.length - 1].cropName || '作物'} +1・已收入包包</div>}
          {flyingCrops.map(fc => (
            <FlyingCropComponent key={fc.id} data={fc} onRemove={removeFlyingCrop} />
          ))}

          {actionFx && (
            <div
              key={actionFx.id}
              className="farm12-action-fx"
              style={{ left: `${actionFx.x}px`, top: `${actionFx.y}px` }}
              aria-hidden="true"
            >
              <Farm12ItemArt item={actionFx.item} mode="fx" />
            </div>
          )}

          {/* --- 新手教學：步驟浮動提示框 (強制隱藏於彈窗開啟時) --- */}
          {tutorialStep > 1 && !currentEvent && !showModal && !showShop && !showQuestModal && (
            <div className="fixed bottom-8 md:bottom-6 left-0 right-0 z-[40] flex justify-center pointer-events-none px-4">
              <div className="bg-blue-600 text-white px-3 py-2 md:px-4 md:py-3 rounded-2xl shadow-2xl animate-bounce border-2 border-blue-400 max-w-sm w-full text-center pointer-events-none">
                <div className="font-black text-sm md:text-base mb-1 text-yellow-300">
                  {tutorialStep >= 7 ? `🎓 進階任務 (自由順序)` : `🎓 新手任務 (${tutorialStep - 1}/5)`}
                </div>
                <div className="text-[10px] md:text-xs font-bold leading-relaxed">
                  {tutorialStep === 2 && "第一步：請點擊右上角的「🛒 商店」，購買一包【地瓜葉】種子！"}
                  {tutorialStep === 3 && "第二步：太棒了！現在請在下方「工具袋」中，點選裝備剛剛購買的【地瓜葉】。"}
                  {tutorialStep === 4 && "第三步：請點擊畫面中的「第 1 區」農田，進入該區塊，並點擊任何一塊空地將種子種下！"}
                  {tutorialStep === 5 && <span>第四步：植物必須<span className="text-yellow-300 font-black text-sm md:text-sm mx-1">【每天】</span>澆水！請裝備下方的「💧 單格澆水」，將<span className="underline">所有剛種下的植物</span>都點擊澆滿水分。</span>}
                  {tutorialStep === 6 && "最後一步：完美！確認植物【都有澆水】後，點擊右上角的「🌙 睡覺 ➔」進入下一天！等待它們成熟吧。"}
                  {tutorialStep >= 7 && (
                    <div className="flex flex-col gap-1.5 text-left bg-blue-700/50 p-2 rounded-xl mt-1.5">
                      <p className="text-yellow-100">請完成以下三項進階農務（不限順序）：</p>
                      <label className={`flex items-start gap-1.5 ${flags.tutSell ? 'opacity-50 line-through text-yellow-300' : ''}`}>
                        <span>{flags.tutSell ? '✅' : '🔲'}</span> <span>去「🛒 商店」賣出剛收成的作物。</span>
                      </label>
                      <label className={`flex items-start gap-1.5 ${flags.tutFert ? 'opacity-50 line-through text-yellow-300' : ''}`}>
                        <span>{flags.tutFert ? '✅' : '🔲'}</span> <span>裝備【🧪 氮肥(葉菜)】並對地瓜葉施肥。</span>
                      </label>
                      <label className={`flex items-start gap-1.5 ${flags.tutNet ? 'opacity-50 line-through text-yellow-300' : ''}`}>
                        <span>{flags.tutNet ? '✅' : '🔲'}</span> <span>點擊進入農田區塊，部署【防蟲網】。</span>
                      </label>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* --- 開場畫面 / 觸發新手教學 --- */}
          {!isGameStarted && (
            <div className="picturebook-opening fixed inset-0 flex items-center justify-center p-4 z-[100] overflow-y-auto hide-scrollbar">
              <div className="picturebook-start-panel p-6 md:p-8 rounded-[2.5rem] max-w-2xl w-full animate-in zoom-in duration-500 my-auto">
                <div className="story-opening-art"><StorySprite sheet="village-atlas" columns={2} index={0} label="繪本農莊" /></div><div className="story-eyebrow">THE LITTLE FARM · 12-2</div><h1 className="text-3xl md:text-4xl font-black text-center mb-6 text-emerald-700">四季農莊</h1><p className="story-opening-subtitle">種一點蔬菜，照顧幾隻雞。<br/>在島嶼的四季裡，過自己的小日子。</p>

                <div className="story-opening-guide space-y-4 text-slate-700 font-bold text-sm bg-emerald-50 p-4 md:p-6 rounded-3xl mb-6 border-2 border-emerald-100 max-h-[40vh] overflow-y-auto hide-scrollbar">
                  <p className="text-sm md:text-base text-emerald-800">歡迎來到台灣專屬的農業經營模擬器！在這裡，你將體驗為期 365 天的農夫生活：</p>
                  <ul className="space-y-3 mt-4 text-xs md:text-sm">
                    <li className="flex items-start gap-2"><span className="text-xl">🌦️</span> <span><strong className="text-blue-700">四季變化與天氣</strong>：春雨、梅雨、秋颱、冬旱。雨天免澆水，但要提防颱風摧毀心血！</span></li>

                                    <dl className="story-crop-guide">
                                      <div><dt>生長天數</dt><dd>{crop.days} 天・{crop.type === 'leaf' ? '葉菜類' : crop.type === 'root' ? '根莖類' : '瓜果類'}</dd></div>
                                      <div><dt>種子來源</dt><dd>{seasonKey === 'SPECIAL' ? ({golden_peach:'春季',crystal_melon:'夏季',giant_pumpkin:'秋季',white_strawberry:'冬季'})[crop.id] + '完成委託獎勵' : sName + '商店・$' + crop.price.toLocaleString()}</dd></div>
                                      <div><dt>收成單價</dt><dd>${crop.value.toLocaleString()}</dd></div>
                                      <div><dt>適用肥料</dt><dd>{({leaf:'氮肥',root:'磷肥',fruit:'鉀肥'})[crop.type]}・同類作物加快 1 天</dd></div>
                                    </dl>
                                    <p className="story-guide-tip">每天澆水，雨天自動澆水。防蟲網擋菜蟲、防風網防颱風；雜草仍需清除。</p>
                                    <div className="story-crop-story">{isUnlocked ? <><strong>已收成・作物故事</strong><p>{crop.desc}</p></> : <p>首次收成後，解鎖作物故事。</p>}</div>
                                  </div>

                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 小型雞舍：最多三隻，每隻各自記錄餵食與互動 */}
          {showModal === 'coop' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div role="dialog" aria-modal="true" aria-label="小雞的家" className="story-paper picturebook-coop-modal w-full max-h-[90vh] overflow-y-auto text-center">
                <button className="float-right text-xl p-2" aria-label="關閉雞舍" onClick={() => setShowModal(null)}>×</button>
                <StorySprite sheet="village-atlas" columns={2} index={1} label="木造雞舍與母雞" className="story-coop-illustration" />
                <small className="story-eyebrow">A HOME FOR OUR HENS</small><h2 className="text-2xl font-black text-amber-950 mb-2">小雞的家</h2>
                {!coop.built ? <>
                  <p className="mb-4">從一隻母雞開始，最多擴建到三隻。每隻每天吃 1 份飼料，隔天產 1 顆蛋；忘記餵食也不會失去母雞。</p>
                  <button onClick={buildCoop} disabled={gold < 3000} className="picturebook-primary w-full">建造雞舍・$3,000（附 2 份飼料）</button>
                </> : <div className="space-y-4">
                  <p className="font-bold">{hungryHens.length ? `還有 ${hungryHens.length} 隻需要餵食` : '大家都吃飽了，明天來收蛋吧！'}</p>
                  <p>飼料 {coop.feed} 份・雞窩 {coop.eggs} 顆蛋・包包 {inventory.eggs || 0} 顆蛋</p>
                  <div className="story-hens">{coop.hens.map(hen => <HenCard key={hen.id} hen={hen} day={day} onRename={renameHen} onPet={petHen} />)}</div>
                  <div className="story-coop-actions">
                    <button onClick={feedHen} disabled={!hungryHens.length || coop.feed < 1} className="picturebook-primary">{hungryHens.length ? (coop.feed ? `餵食 ${Math.min(hungryHens.length, coop.feed)} 份` : '請先購買飼料') : '全體已餵食'}</button>
                    <button onClick={buyFeed} disabled={gold < 60 * coop.hens.length} className="picturebook-secondary">買 {coop.hens.length} 份飼料・${60 * coop.hens.length}</button>
                  </div>
                  <button onClick={collectEggs} disabled={coop.eggs < 1} className="picturebook-secondary w-full"><Farm12UiIcon name="egg" className="story-egg" />收蛋 {coop.eggs} 顆到包包</button>
                  {coop.hens.length < 3 ? <button onClick={upgradeCoop} disabled={gold < Care.upgradePrice(coop)} className="picturebook-secondary w-full">擴建到 {coop.hens.length + 1} 隻・${Care.upgradePrice(coop).toLocaleString()}（含新母雞）</button> : <p>三隻母雞都到齊了，雞舍已完整擴建。</p>}
                  <p className="story-guide-tip">每天首次摸摸增加 1 點親密度（上限 10），不影響產蛋。雞蛋可在商店出售，每顆 $120。</p>
                </div>}
                <p className="story-coop-feedback" role="status">{coopMessage}</p>
              </div>
            </div>
          )}

          {/* 睡覺與存檔確認彈窗 */}
          {showModal === 'sleep' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="story-paper bg-white p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in duration-200 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div className="text-5xl md:text-6xl mb-3 md:mb-4">🌙</div>
                <h2 className="text-xl md:text-2xl font-black mb-3">睡前待辦</h2>
                <p className="text-slate-500 mb-3 font-bold text-[10px] md:text-xs leading-relaxed">
                  缺水會暫停生長；蟲害與雜草第一次未處理會暫停生長，第二次過夜仍未處理才會枯死。
                </p>
                <div className="space-y-2 text-left mb-5 max-h-[30vh] overflow-y-auto custom-scrollbar" aria-label="各區睡前待辦">
                  {sleepChecklist.length === 0 ? (
                    <p className="rounded-xl bg-emerald-50 p-3 text-center font-bold text-emerald-700 text-xs">全部照顧好了，可以安心休息！</p>
                  ) : sleepChecklist.map(item => (
                    <button key={item.plotId} onClick={() => { setActivePlot(item.plotId); setShowModal(null); }} className="block w-full rounded-xl border border-amber-200 bg-amber-50 p-3 text-left hover:bg-amber-100 transition-colors">
                      <strong className="block text-sm text-amber-900">第 {item.plotId + 1} 區 → 前往處理</strong>
                      <span className="block text-xs text-slate-700 mt-1">
                        {[item.water > 0 && `澆水 ${item.water} 格`, item.bugs > 0 && `驅蟲 ${item.bugs} 格`, item.weeds > 0 && `除草 ${item.weeds} 格`, item.windRisk > 0 && `防風 ${item.windRisk} 格`].filter(Boolean).join('・')}
                      </span>
                      {item.windRisk > 0 && <span className="block mt-1 text-xs font-black text-red-700">今晚每株有 50% 受損機率，請先架設防風網</span>}
                      {item.urgent > 0 && <span className="block mt-1 text-xs font-black text-red-700">其中 {item.urgent} 格若再過夜將枯死</span>}
                    </button>
                  ))}
                </div>
                {coop.built && hungryHens.length > 0 && <button onClick={() => setShowModal('coop')} className="picturebook-coop-reminder">小雞舍：{hungryHens.length} 隻尚未餵食 → 前往照顧</button>}
                <div className="flex gap-3 md:gap-4">
                  <button onClick={() => setShowModal(null)} className="flex-1 bg-slate-100 text-slate-600 py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-200 transition-colors">
                    再巡一下
                  </button>
                  <button onClick={processNextDay} className="flex-1 bg-slate-800 text-white py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-700 transition-colors">
                    確定睡覺
                  </button>
                </div>

                <div className="flex flex-col gap-3 md:gap-4 w-full mt-6 pt-6 border-t border-slate-100">
                  <div className="text-[10px] md:text-xs font-black text-slate-500">{saveError ? '自動儲存失敗，請檢查瀏覽器設定' : `自動儲存：${lastSaveLabel}`}</div>
                  <div className="flex gap-3 md:gap-4">
                    <button onClick={handleSave} className="flex-1 bg-blue-100 text-blue-700 py-3 rounded-xl font-black text-sm hover:bg-blue-200 transition-colors active:scale-95 shadow-sm">
                      💾 儲存進度
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 結算彈窗 */}
          {showModal === 'contest' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="story-paper bg-white p-8 md:p-10 rounded-[2.5rem] md:rounded-[3rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in">
                <div className="text-6xl md:text-7xl mb-4 md:mb-6">🥇</div>
                <h2 className="text-xl md:text-3xl font-black mb-2 uppercase">季度大賽</h2>
                <p className="text-slate-400 text-[10px] md:text-xs mb-6 md:mb-8 font-bold">你在第 {day} 天的表現非常驚人，評審團給予了高度評價！</p>
                <div className="bg-slate-100 p-4 md:p-6 rounded-2xl md:rounded-3xl mb-6 md:mb-8">
                  <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 uppercase">季度獎金</div>
                  <div className="text-3xl md:text-4xl font-black text-yellow-600">${Math.floor(gold * 0.2).toLocaleString()}</div>
                </div>
                <button onClick={() => { setGold(g => g + Math.floor(g * 0.2)); setShowModal(null); playEffect('coin'); }} className="w-full bg-slate-800 text-white py-4 md:py-5 rounded-xl md:rounded-2xl font-black uppercase tracking-widest hover:bg-slate-700 transition-all">領取獎勵</button>
              </div>
            </div>
          )}

          {/* 遊戲結束結果 */}
          {showModal === 'result' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-4 z-50">
              <div className="story-paper bg-white p-8 md:p-12 rounded-[2.5rem] md:rounded-[3.5rem] max-w-lg w-full text-center shadow-2xl overflow-y-auto max-h-[90vh] hide-scrollbar">
                <div className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-3 md:mb-4">365天經營結算</div>
                <h1 className="text-4xl md:text-5xl font-black mb-6 md:mb-8 italic">農莊年度結算</h1>
                <div className="grid grid-cols-2 gap-3 md:gap-4 mb-8 md:mb-10">
                  <div className="bg-slate-50 p-6 md:p-8 rounded-2xl md:rounded-3xl border border-slate-100">
                    <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 md:mb-2 uppercase">總資產</div>
                    <div className="text-xl md:text-3xl font-black font-mono text-slate-800">${gold.toLocaleString()}</div>
                  </div>
                  <div className="bg-blue-600 p-6 md:p-8 rounded-2xl md:rounded-3xl text-white shadow-xl shadow-blue-200">
                    <div className="text-[9px] md:text-[10px] font-black opacity-60 mb-1 md:mb-2 uppercase">最終評級</div>
                    <div className="text-5xl md:text-6xl font-black">{gold > 1000000 ? 'S' : gold > 500000 ? 'A' : gold > 100000 ? 'B' : 'C'}</div>
                  </div>
                </div>
                <button onClick={() => {
                  localStorage.removeItem(Care.SAVE_KEY);
                  window.location.reload();
                }} className="w-full bg-slate-800 text-white py-5 md:py-6 rounded-2xl md:rounded-3xl font-black text-sm md:text-base uppercase tracking-widest hover:bg-slate-700 active:scale-95 transition-all">刪除存檔並開啟下一個循環</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
