  <script src="assets/farm12/picturebook/gameplay-v3.js?v=20261002-normal"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    const Care = window.Farm12Care;

    // --- 音效引擎 ---
    const useAudio = () => {
      const audioCtx = useRef(null);
      const initAudio = () => {
        if (!audioCtx.current) {
          audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
        }
      };

      const playEffect = (type) => {
        initAudio();
        const now = audioCtx.current.currentTime;

        if (type === 'water') {
          const osc = audioCtx.current.createOscillator();
          const gain = audioCtx.current.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain);
          gain.connect(audioCtx.current.destination);
          osc.start();
          osc.stop(now + 0.1);
        } else if (type === 'weed') {
          const bufferSize = audioCtx.current.sampleRate * 0.1;
          const buffer = audioCtx.current.createBuffer(1, bufferSize, audioCtx.current.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = audioCtx.current.createBufferSource();
          noise.buffer = buffer;
          const filter = audioCtx.current.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 1000;
          const gain = audioCtx.current.createGain();
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.current.destination);
          noise.start();
        } else if (type === 'coin') {
          const osc = audioCtx.current.createOscillator();
          const gain = audioCtx.current.createGain();
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(1500, now + 0.3);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.current.destination);
          osc.start();
          osc.stop(now + 0.4);
        }
      };

      return { playEffect };
    };

    // 12-2 uses its own hand-painted atlas set, independent of 12-1 assets.
    const STORY_ROOT = 'assets/farm12/picturebook/';
    const STORY_CROP_SHEETS = new Set(['crops-atlas', 'sprouts-atlas', 'growth-atlas']);
    const StorySprite = ({ sheet, index = 0, columns = 4, label = '', className = '' }) => (
      <span role={label ? 'img' : undefined} aria-label={label || undefined} aria-hidden={label ? undefined : true}
        className={'story-sprite ' + className}
        style={{ backgroundImage: `url(${STORY_ROOT}${sheet}-${STORY_CROP_SHEETS.has(sheet) ? 'v3' : 'v2'}.webp)`, backgroundSize: `${columns * 100}% ${columns * 100}%`, backgroundPosition: `${(index % columns) * 100 / (columns - 1)}% ${Math.floor(index / columns) * 100 / (columns - 1)}%` }} />
    );
    const STORY_CROPS = ['sweetpotatoleaf','bokchoy','guava','waterspinach','loofah','mango','waterbamboo','taro','pomelo','whiteradish','cabbage','strawberry','golden_peach','crystal_melon','giant_pumpkin','white_strawberry'];
    const CropArt = ({ crop, growth = 0, mode = 'field' }) => {
      if (!crop) return null;
      const index = STORY_CROPS.indexOf(crop.id);
      if (index < 0) return null;
      const stage = Care.cropStage(crop, growth);
      return <span className={'farm12-art-wrap farm12-' + mode + ' story-' + stage} title={crop.name + '・' + Care.stageLabel(stage)}>
        <StorySprite sheet={stage === 'mature' ? 'crops-atlas' : stage === 'growing' ? 'growth-atlas' : 'sprouts-atlas'} index={index} label={crop.name + '・' + Care.stageLabel(stage)} className="farm12-art" />
      </span>;
    };
    const HenCard = ({ hen, day, onRename, onPet }) => {
      const [draft, setDraft] = useState(hen.name);
      const [editing, setEditing] = useState(false);
      useEffect(() => setDraft(hen.name), [hen.name]);
      return <article className="story-hen-card">
        <StorySprite sheet="hens-atlas" columns={3} index={hen.color + (hen.greetedDay === day ? 6 : hen.fedToday ? 3 : 0)} label={hen.name + (hen.fedToday ? '吃飽了' : '等待餵食')} className="story-hen-art" />
        <div className="story-hen-info"><h3>{hen.name}</h3><p>{hen.fedToday ? '吃飽了，明天有蛋' : '肚子餓了，需要 1 份飼料'}</p>
          <p>親密度 {hen.affection} / 10</p>
          {editing ? <form onSubmit={e => { e.preventDefault(); if (draft.trim()) { onRename(hen.id, draft.trim()); setEditing(false); } }}>
            <label htmlFor={'name-' + hen.id}>新名字（最多 8 字）</label>
            <input id={'name-' + hen.id} value={draft} maxLength={8} onChange={e => setDraft(e.target.value)} autoFocus />
            <button type="submit" className="picturebook-secondary" disabled={!draft.trim()}>儲存名字</button>
          </form> : <button className="story-rename" onClick={() => setEditing(true)}>替牠取名</button>}
          <button className="picturebook-secondary" onClick={() => onPet(hen.id)}>{hen.greetedDay === day ? '再摸摸牠' : '摸摸牠'}</button>
        </div>
      </article>;
    };
    const Farm12StatusArt = ({ type, mode = 'small', className = '' }) => <StorySprite sheet="ui-atlas" columns={5} index={type === 'pest' ? 7 : 8} label={type === 'pest' ? '菜蟲' : '雜草'} className={'farm12-status-art farm12-status-' + mode + ' ' + className} />;
    const hazardLevel = slot => !slot?.crop || slot.growth >= slot.crop.days || (!slot.hasBug && !slot.hasWeed) ? 'clear' : (slot.hazardDays || 0) >= 1 ? 'urgent' : 'notice';
    const plotCareSummary = (plot, weather) => {
      const planted = plot.slots.filter(slot => slot?.crop);
      const growing = planted.filter(slot => slot.growth < slot.crop.days);
      return { planted: planted.length, mature: planted.length - growing.length, water: Care.rainy(weather) ? 0 : growing.filter(slot => !slot.isWatered).length,
        bugs: growing.filter(slot => slot.hasBug).length, weeds: growing.filter(slot => slot.hasWeed).length,
        urgent: growing.filter(slot => hazardLevel(slot) === 'urgent').length,
        wind: weather === 'typhoon' && !plot.isWindbreaked ? growing.length : 0 };
    };
    const addHarvestReceipt = (previous, crop, now) => ({
      at: now,
      crops: {
        ...(previous && now - previous.at < 3000 ? previous.crops : {}),
        [crop.id]: { name: crop.name, count: (previous && now - previous.at < 3000 ? previous.crops[crop.id]?.count || 0 : 0) + 1 }
      }
    });
    const HazardBadges = ({ slot, overview = false }) => {
      const level = hazardLevel(slot);
      return <span className={'story-hazard-badges' + (overview ? ' is-overview' : '')} data-level={level}>
        {level !== 'clear' && <>
          {slot.hasBug && <span className="story-hazard-badge" title="有蟲，需要辣椒水"><Farm12StatusArt type="pest" /></span>}
          {slot.hasWeed && <span className="story-hazard-badge" title="有雜草，需要除草剪刀"><Farm12StatusArt type="weed" /></span>}
        </>}
      </span>;
    };
    const PlotCareStatus = ({ plot, weather, detailed = false }) => {
      const status = plotCareSummary(plot, weather);
      const done = status.planted && !status.water && !status.bugs && !status.weeds && !status.wind;
      return <div className={'story-plot-care-status' + (detailed ? ' is-detailed' : '')}>
        {status.mature > 0 && <strong className="story-care-harvest">可收成 {status.mature} 株</strong>}
        {status.water > 0 && <span className="story-care-water"><Farm12UiIcon name="water" />缺水 {status.water} 株</span>}
        {status.bugs > 0 && <span className="story-care-notice"><Farm12StatusArt type="pest" />有蟲 {status.bugs} 株</span>}
        {status.weeds > 0 && <span className="story-care-notice"><Farm12StatusArt type="weed" />雜草 {status.weeds} 株</span>}
        {status.urgent > 0 && <strong className="story-care-urgent">今天要處理 · {status.urgent} 株</strong>}
        {status.wind > 0 && <span className="story-care-notice">今晚需要防風</span>}
        {!!done && <span className="story-care-done">今天照顧好了</span>}
        {!status.planted && <span className="story-care-empty">選好種子，就能播種</span>}
        {detailed && status.bugs + status.weeds > 0 && <p className={status.urgent ? 'story-care-deadline is-urgent' : 'story-care-deadline'}>{status.urgent ? '標示「今天要處理」的作物已停長一天。今晚睡覺前，要把蟲害和雜草都清除，才能救回來。' : '蟲害或雜草會讓作物暫停生長。今天先處理好；若漏了一晚，隔天還有一次補救機會。'}</p>}
      </div>;
    };
    const STORY_TOOLS = { wateringCan:0, sprinkler:1, chili:2, weed:3, fert_leaf:4, fert_root:5, fert_fruit:6, net:7, windbreak:8 };
    const STORY_TOOL_NAMES = { wateringCan:'澆水壺', sprinkler:'灑水器', chili:'辣椒水', weed:'除草剪刀', fert_leaf:'氮肥', fert_root:'磷肥', fert_fruit:'鉀肥', net:'防蟲網', windbreak:'防風網' };
    const Farm12ItemArt = ({ item, mode = 'tool', className = '' }) => <StorySprite sheet="tools-atlas" columns={3} index={STORY_TOOLS[item] ?? 0} label={STORY_TOOL_NAMES[item] || '農具'} className={'farm12-item-art farm12-item-' + mode + ' ' + className} />;

    const FARM12_EMOJI_ICONS = {
      '✨':'sparkle', '🎓':'education', '💡':'idea', '🛒':'cart', '⚠️':'warning', '⚠':'warning',
      '🐛':'bug', '🌱':'sprout', '💧':'water', '💦':'water', '🛡️':'shield', '🛡':'shield', '🏫':'school',
      '🎃':'pumpkin', '🌿':'leaf', '🌾':'leaf', '🎋':'leaf', '❌':'close', '🧪':'fertilizer', '🥬':'leaf',
      '🕳️':'soil', '🕳':'soil', '🔲':'check-empty', '✅':'check', '📖':'book', '🎉':'celebrate',
      '🌶️':'pesticide', '🌶':'pesticide', '🌧️':'rain', '🌧':'rain', '🌙':'moon', '🌀':'storm', '❓':'question',
      '✂️':'scissors', '✂':'scissors', '🥭':'fruit', '🥔':'root', '🕸️':'net', '🕸':'net', '📥':'inbox',
      '📂':'folder', '💾':'save', '🎁':'gift', '🍓':'strawberry', '☀️':'sun', '☀':'sun', '🪦':'grave',
      '🥕':'root', '🥒':'fruit', '🥇':'medal', '🥀':'wilt', '🛠️':'tools', '🛠':'tools', '🚜':'tractor',
      '😭':'sad', '🔒':'lock', '📢':'announcement', '👨‍🌾':'farmer', '🍑':'fruit', '🍐':'fruit', '🍎':'fruit',
      '🍋':'fruit', '🍉':'melon', '🌪️':'storm', '🌪':'storm', '🌦️':'weather', '🌦':'weather', '⏳':'hourglass'
    };
    const FARM12_ICON_LABELS = {
      sparkle:'閃亮', education:'教學', idea:'提示', cart:'商店', warning:'警告', bug:'菜蟲', sprout:'幼苗',
      water:'澆水', shield:'防護', school:'學校任務', pumpkin:'南瓜', leaf:'葉菜', close:'關閉', fertilizer:'肥料',
      soil:'農地', 'check-empty':'未完成', check:'完成', book:'圖鑑', celebrate:'恭喜', pesticide:'辣椒水', rain:'雨天',
      moon:'睡覺', storm:'颱風', question:'未知', scissors:'除草剪刀', fruit:'水果', root:'根莖作物', net:'防蟲網',
      inbox:'收成籃', folder:'讀取進度', save:'儲存進度', gift:'獎勵', strawberry:'草莓', sun:'晴天', grave:'枯死',
      medal:'勳章', wilt:'枯萎', tools:'農具與照顧用品', tractor:'灌溉系統', sad:'災損', lock:'尚未解鎖',
      announcement:'通知', farmer:'農夫', melon:'西瓜', weather:'天氣', hourglass:'生長期'
    };

    const STORY_UI = { sun:0, rain:1, weather:1, storm:2, moon:3, coin:4, water:5, sprout:6, bug:7, shield:9, lock:10, question:11, egg:12, feed:13, soil:14, check:15, 'check-empty':14, close:16, save:17, folder:18, gift:18, sparkle:19, celebrate:19, medal:19, school:20, education:20, grave:21, wilt:21, sad:21, farmer:22, warning:23, announcement:23, book:24, idea:19, hourglass:17 };
    const Farm12UiIcon = ({ name, className = '' }) => {
      const cls = 'farm12-ui-icon ' + className;
      if (name === 'cart' || name === 'inbox') return <StorySprite sheet="village-atlas" columns={2} index={name === 'cart' ? 0 : 2} label={FARM12_ICON_LABELS[name]} className={cls} />;
      const tool = { fertilizer:'fert_leaf', net:'net', pesticide:'chili', scissors:'weed', tools:'weed', tractor:'sprinkler' }[name];
      if (tool) return <Farm12ItemArt item={tool} className={cls} />;
      const cropIndex = { fruit:5, root:9, leaf:0, pumpkin:14, melon:13, strawberry:11 }[name];
      if (cropIndex !== undefined) return <StorySprite sheet="crops-atlas" index={cropIndex} label={FARM12_ICON_LABELS[name]} className={cls} />;
      return <StorySprite sheet="ui-atlas" columns={5} index={STORY_UI[name] ?? 11} label={FARM12_ICON_LABELS[name] || '功能圖示'} className={cls} />;
    };

    const FARM12_NATIVE_CREATE_ELEMENT = React.createElement.bind(React);
    const FARM12_EMOJI_PATTERN = new RegExp('(' + Object.keys(FARM12_EMOJI_ICONS).sort((a,b) => b.length-a.length).map(key => key.replace(/[.*+?^${}()|[\]\\]/g, '\\    // --- 自定義 UI 元件：專屬種子袋 ---')).join('|') + ')', 'gu');
    const farm12IconizeText = (value) => {
      if (typeof value !== 'string' || !FARM12_EMOJI_PATTERN.test(value)) { FARM12_EMOJI_PATTERN.lastIndex = 0; return value; }
      FARM12_EMOJI_PATTERN.lastIndex = 0;
      return value.split(FARM12_EMOJI_PATTERN).filter(Boolean).map((part, index) => {
        const iconName = FARM12_EMOJI_ICONS[part];
        return iconName ? FARM12_NATIVE_CREATE_ELEMENT(Farm12UiIcon, { name: iconName, key: 'farm12-icon-' + index }) : part;
      });
    };
    React.createElement = function(type, props, ...children) {

        const currentHasBug = nextPlots.some(p => p.slots.some(s => s.hasBug));
        const currentHasWeed = nextPlots.some(p => p.slots.some(s => s.hasWeed));
        const currentHasMature = nextPlots.some(p => p.slots.some(s => s.crop && s.growth >= s.crop.days));
        const needsRescue = nextPlots.some(p => p.slots.some(s => s.crop && (s.hasBug || s.hasWeed) && s.hazardDays >= 1));

        setPlots(nextPlots);
        setCoop(prev => Care.advanceCoopDay(prev));
        setCoopMessage('');
        setCareMessage('');

        let newQuest = null;
        if (schoolQuest) {
          setSchoolQuest(prev => (prev && prev.daysLeft > 1) ? { ...prev, daysLeft: prev.daysLeft - 1 } : null);
        } else {
          if (nextDayNum > 5 && Math.random() < 0.15) {
            const seasonCrops = CROPS[nextSeason].slice(0, 2);
            const randomCrop = seasonCrops[Math.floor(Math.random() * seasonCrops.length)];
            newQuest = { crop: randomCrop, required: 8, daysLeft: Care.questDuration(randomCrop), durationDays: Care.questDuration(randomCrop), deadlineVersion: 2 };
            setSchoolQuest(newQuest);
          }
        }

        setDay(nextDayNum);
        setWeather(nextWeatherType);
        setShowModal(null);

        let newEvents = [];

        // 若第一次忘記澆水，推入提示事件
        if (forgotWaterYesterday && !flags.seenForgotWater) {
          newEvents.push({ type: 'tutorial_forgot_water' });
          setFlags(prev => ({...prev, seenForgotWater: true}));
        }

        if (nextDayNum === 2 && !flags.seenDay2Water) {
          newEvents.push({ type: 'tutorial_day2_water' });
          setFlags(prev => ({...prev, seenDay2Water: true}));
        }
        if (currentHasBug && !flags.seenBug) {
          newEvents.push({ type: 'tutorial_bug' });
          setFlags(prev => ({...prev, seenBug: true}));
        }
        if (currentHasWeed && !flags.seenWeed) {
          newEvents.push({ type: 'tutorial_weed' });
          setFlags(prev => ({...prev, seenWeed: true}));
        }
        if (currentHasMature && !flags.seenHarvest) {
          newEvents.push({ type: 'tutorial_harvest' });
          setFlags(prev => ({...prev, seenHarvest: true}));
        }
        if (nextWeatherType === 'rainy' && !flags.seenRain) {
          newEvents.push({ type: 'tutorial_rain' });
          setFlags(prev => ({...prev, seenRain: true}));
        }
        if (hasDeadCrops) {
          newEvents.push({ type: 'crop_died' });
        }

        if (nextDayNum === 20) {
          newEvents.push({ type: 'irrigation_upgrade' });
        }
        if (isTyphoonNext) {
          newEvents.unshift({ type: 'typhoon_warning', isFirst: !flags.seenTyphoon });
          if (!flags.seenTyphoon) {
            setFlags(prev => ({...prev, seenTyphoon: true}));
            // 新手教學：第一次遇到颱風送 1 個防風網
            setInventory(inv => ({ ...inv, windbreaks: (inv.windbreaks || 0) + 1 }));
          }
        }
        if (weather === 'typhoon') {
          newEvents.unshift({ type: 'typhoon_report', count: typhoonDamageCount, stormDay: day });
        }
        if (newQuest) {
          newEvents.push({ type: 'school_quest', data: newQuest });
          if (!flags.seenQuest) setFlags(prev => ({...prev, seenQuest: true}));
        }

        setEventQueue(newEvents);

        if (typhoonDamageCount > 0) {
          setMessage(`昨晚的強風帶走了 ${typhoonDamageCount} 株作物。整理好農田，再種下一批吧。`);
          playEffect('weed');
        } else if (hasDeadCrops) {
          setMessage("有些作物因蟲害或雜草連續兩晚沒有清理而枯萎了。空出的農田可以重新播種。");
          playEffect('weed');
        } else if (needsRescue) {
          setMessage("有些作物正在等你幫忙。今晚睡覺前清除蟲害與雜草，就能把握最後一次補救機會。");
        } else {
          if (nextWeatherType === 'typhoon') {
            setMessage(`第 ${nextDayNum} 天颱風來襲 🌀！外面狂風暴雨，農田自動澆滿水了。`);
          } else if (nextWeatherType === 'rainy') {
            setMessage(`第 ${nextDayNum} 天早安！今天下雨了 🌧️，田地都已經自動吸滿水份囉！`);
          } else {
            setMessage(`第 ${nextDayNum} 天早安！晴空萬里 ☀️，別忘了幫作物澆水喔。`);
          }
        }

        if (nextDayNum % 100 === 0 && nextDayNum <= 300) setShowModal('contest');
      };

      const handleSlotClick = (plotId, slotId, clickPoint) => {
        const actionPoint = clickPoint ? { clientX: clickPoint.clientX, clientY: clickPoint.clientY } : null;
        setPlots(prev => {
          const newPlots = JSON.parse(JSON.stringify(prev));
          const targetPlot = newPlots[plotId];
          const targetSlot = targetPlot.slots[slotId];

          if (!targetPlot.isUnlocked) return prev;

          if (selectedTool === 'water') {
            let wateredAny = false;
            if (day >= 20) {
              targetPlot.slots.forEach(s => {
                if (s.crop && !s.isWatered) {
                  s.isWatered = true;
                  wateredAny = true;
                }
              });

              if (!wateredAny) {
                setMessage(Care.rainy(weather) ? "今天有雨水幫忙，不用再澆水了。" : "這一區暫時不用澆水，可以去看看其他農田。");
                return prev;
              }
              playEffect('water');
              triggerActionFx('water', actionPoint);
              setMessage(`第 ${plotId + 1} 區澆好水了，作物都喝到水了。`);
            } else {
              if (targetSlot.crop && !targetSlot.isWatered) {
                targetSlot.isWatered = true;
                wateredAny = true;
              }
              if (!wateredAny) {
                setMessage(Care.rainy(weather) ? "今天有雨水幫忙，不用再澆水了。" : "這格暫時不用澆水。");
                return prev;
              }
              playEffect('water');
              triggerActionFx('water', actionPoint);
              setMessage(`這格澆好水了。再看看其他幼苗吧。`);
            }
          }

          else if (selectedTool === 'weed') {
            if (!targetSlot.hasWeed) return prev;
            if (inventory.scissors <= 0) {
              setMessage("除草剪刀用完了，到田邊雜貨舖添購一把吧。");
              return prev;
            }
            targetSlot.hasWeed = false;
            if (!targetSlot.hasBug) targetSlot.hazardDays = 0;
            setInventory(inv => ({ ...inv, scissors: inv.scissors - 1 }));
            playEffect('weed');
            triggerActionFx('weed', actionPoint);
            setMessage(`雜草清乾淨了。剪刀還能使用 ${inventory.scissors - 1} 次。`);
          }

          else if (selectedTool === 'chili') {
            if (!targetSlot.hasBug) return prev;
            if (inventory.chili <= 0) {
              setMessage("辣椒水用完了，可以到田邊雜貨舖補充。");
              return prev;
            }
            targetSlot.hasBug = false;
            if (!targetSlot.hasWeed) targetSlot.hazardDays = 0;
            setInventory(inv => ({ ...inv, chili: inv.chili - 1 }));
            playEffect('water');
            triggerActionFx('chili', actionPoint);
            setMessage(`菜蟲離開了。辣椒水還能使用 ${inventory.chili - 1} 次。`);
          }

          else if (selectedTool.startsWith('fert_')) {
            const fertType = selectedTool.split('_')[1];
            const fertNames = { leaf: '氮肥', root: '磷肥', fruit: '鉀肥' };
            const fertName = fertNames[fertType];

            if (inventory[selectedTool] <= 0) {
              setMessage(`${fertName}用完了，可以到田邊雜貨舖補充。`);
              return prev;
            }

            let fertilizedAny = false;
            let alreadyFertilizedAny = false;
            let wrongTypeAny = false;

            targetPlot.slots.forEach(s => {
              if (s.crop && s.growth < s.crop.days && !s.hasBug && !s.hasWeed) {
                if (s.crop.type === fertType) {
                  if (!s.isFertilized) {
                    s.growth += 1;
                    s.isFertilized = true;
                    fertilizedAny = true;
                  } else {
                    alreadyFertilizedAny = true;
                  }
                } else {
                  wrongTypeAny = true;
                }
              }
            });

            if (!fertilizedAny) {
              if (alreadyFertilizedAny) {
                setMessage(`這一區適用的作物今天都施過肥了，明天再來照顧吧。`);
              } else if (wrongTypeAny) {
                setMessage(`這一區的作物不適合用${fertName}。看看圖鑑，選一種合適的肥料吧。`);
              } else {
                setMessage("這一區暫時沒有可以施肥的作物。");
              }
              return prev;
            }

            let netBrokeMsg = "";
            const hasMature = targetPlot.slots.some(s => s.crop && s.growth >= s.crop.days);
            if (hasMature && targetPlot.isNetted) {
              targetPlot.isNetted = false;
              netBrokeMsg = " 作物成熟了，防蟲網也撐破了；下次播種可以重新架設。";
            }

            setInventory(inv => ({ ...inv, [selectedTool]: Math.max(0, inv[selectedTool] - 1) }));
            playEffect('water');
            triggerActionFx(selectedTool, actionPoint);
            setMessage(`施好${fertName}了。第 ${plotId + 1} 區適用的作物多長大了 1 天。${netBrokeMsg}`);

            // 進階肥料教學完成檢查 (不限順序)
            if (tutorialStep >= 7 && !flags.tutFert) {
              setFlags(prev => ({ ...prev, tutFert: true }));
            }
          }

          else if (selectedTool === 'seed' && selectedSeed) {
            const isOccupied = targetPlot.slots.some(s => s.crop !== null);
            if (isOccupied) {
              setMessage("這一區還有作物。等全部收成、空出農田後，再種下一批吧。");
              return prev;
            }

            if (!selectedSeed?.id || (inventory.seeds[selectedSeed.id] || 0) <= 0) {
              setMessage("種子用完了。到田邊雜貨舖挑一包喜歡的種子吧。");
              return prev;
            }

            setInventory(inv => ({
              ...inv,
              seeds: { ...inv.seeds, [selectedSeed.id]: Math.max(0, inv.seeds[selectedSeed.id] - 1) }
            }));

            targetPlot.slots = targetPlot.slots.map(s => ({
              ...s,
              crop: selectedSeed,
              growth: 0,
              hazardDays: 0,
              isWatered: Care.rainy(weather),
              isFertilized: false,
              hasBug: false,
              hasWeed: false
            }));

            setMessage(`種下 1 包${selectedSeed.name || '作物'}種子，第 ${plotId + 1} 區的 8 格農田都種好了。`);
            playEffect('water');

            if (inventory.seeds[selectedSeed.id] <= 1) {
              setSelectedTool('water');
              setSelectedSeed(null);
            }
          }

          return newPlots;
        });
      };

      const buyItem = (type, cost) => {
        if (gold >= cost) {
          setGold(g => g - cost);
          if (type === 'net') {
            setInventory(i => ({ ...i, nets: i.nets + 1 }));
            setMessage("防蟲網放進工具袋了。打開農田，就可以架設。");
          } else if (type === 'fert_leaf') {
            setInventory(i => ({ ...i, fert_leaf: i.fert_leaf + 1 }));
            setMessage("氮肥準備好了，可以幫葉菜類作物長得更快。");
          } else if (type === 'fert_root') {
            setInventory(i => ({ ...i, fert_root: i.fert_root + 1 }));
            setMessage("磷肥準備好了，可以幫根莖類作物長得更快。");
          } else if (type === 'fert_fruit') {
            setInventory(i => ({ ...i, fert_fruit: i.fert_fruit + 1 }));
            setMessage("鉀肥準備好了，可以幫瓜果類作物長得更快。");
          } else if (type === 'windbreak') {
            setInventory(i => ({ ...i, windbreaks: i.windbreaks + 1 }));
            setMessage("防風網準備好了。打開農田架設，就能保護這一區的作物。");
          } else if (type === 'scissors') {
            setInventory(i => ({ ...i, scissors: i.scissors + 10 }));
            setMessage("添好除草剪刀了，可以再除草 10 次。");
          } else if (type === 'chili') {
            setInventory(i => ({ ...i, chili: i.chili + 10 }));
            setMessage("辣椒水補充好了，可以再驅蟲 10 次。");
          }
        } else {
          setMessage("帶的錢還不夠，可以先賣出一些收成。");
        }
      };

      const sellCrop = (cropId, amount, unitPrice) => {
        const totalEarn = amount * unitPrice;
        setGold(g => g + totalEarn);
        setInventory(inv => ({
          ...inv,
          crops: { ...inv.crops, [cropId]: inv.crops[cropId] - amount }
        }));
        playEffect('coin');
        setMessage(`賣出 ${amount} 份農產，收入 $${totalEarn.toLocaleString()}。`);

        // 檢查販賣任務 (不限順序)
        if (tutorialStep >= 7 && !flags.tutSell) {
          setFlags(prev => ({ ...prev, tutSell: true }));
        }
      };

      const heldItem = selectedTool === 'seed' ? {
        name: (selectedSeed?.name || '作物') + '種子', stock: inventory.seeds[selectedSeed?.id] || 0, unit: '包',
        hint: '先進入完全空出的農地，再點空格；1 包種子會一次種滿 8 格。'
      } : {
        name: selectedTool === 'water' ? (day >= 20 ? '全區灑水器' : '澆水壺') : STORY_TOOL_NAMES[selectedTool],
        item: selectedTool === 'water' ? (day >= 20 ? 'sprinkler' : 'wateringCan') : selectedTool,
        stock: selectedTool === 'water' ? null : inventory[selectedTool === 'weed' ? 'scissors' : selectedTool] || 0,
        unit: selectedTool.startsWith('fert_') ? '份' : '次',
        hint: selectedTool === 'water' ? (Care.rainy(weather) ? '今天雨水已經澆好田，可以選其他工具照顧作物。' : day >= 20 ? '進入農地後，點一株未成熟作物，就能替整區澆水。' : '進入農地後，點一株缺水的作物，替它澆水。') : selectedTool === 'weed' ? '點有雜草的作物除草，每株消耗 1 次；進入農地後，也可使用「全區除草」。' : selectedTool === 'chili' ? '點有蟲的作物驅蟲，每株消耗 1 次；進入農地後，也可使用「全區驅蟲」。' : '點一株未成熟作物，替整區符合肥料種類的作物施肥；蟲害與雜草要先處理。'
      };

      const handlePlotCare = (plotId, kind, event) => {
        const stockKey = kind === 'weed' ? 'scissors' : 'chili';
        const result = Care.treatPlot(plots[plotId], kind, inventory[stockKey]);
        const name = kind === 'weed' ? '除草' : '驅蟲';
        const text = result.used ? `已${name} ${result.used} 格，消耗 ${result.used} 次。${result.remaining ? `耗材不足，還有 ${result.remaining} 格待處理；先處理了最需要補救的作物。` : '這一區處理好了！'}` : result.remaining ? `耗材不足，還有 ${result.remaining} 格需要${name}。` : `這一區不用${name}。`;
        setCareMessage(text); setMessage(text);
        if (!result.used) return;
        setPlots(prev => prev.map(plot => plot.id === plotId ? result.plot : plot));
        setInventory(prev => ({ ...prev, [stockKey]: prev[stockKey] - result.used }));
        triggerActionFx(kind, event); playEffect('water');
      };

      const buildCoop = () => {
        if (coop.built || gold < 3000) return;
        setGold(g => g - 3000);
        setCoop(Care.normalizeCoop({ built: true, feed: 2 }));
        setCoopMessage('小米搬進來了！附兩份飼料，也可以替牠取個新名字。');
        playEffect('coin');
      };
      const buyFeed = () => {
        const portions = coop.hens.length, price = portions * 60;
        if (!portions || gold < price) return;
        setGold(g => g - price);
        setCoop(prev => ({ ...prev, feed: prev.feed + portions }));
        setCoopMessage(`買好 ${portions} 份飼料，剛好夠全體母雞吃一天。`);
      };
      const feedHen = () => {
        const result = Care.feedCoop(coop);
        if (!result.used) return;
        setCoop(result.coop);
        setCoopMessage(`餵飽 ${result.used} 隻母雞。${result.remaining ? `還有 ${result.remaining} 隻沒吃到，記得補買飼料。` : '明早來雞窩收蛋吧！'}`);
        playEffect('water');
      };
      const upgradeCoop = () => {
        const price = Care.upgradePrice(coop);
        if (!coop.built || !price || gold < price) return;
        const hen = Care.makeHen(coop.hens.length);
        setGold(g => g - price);
        setCoop(prev => ({ ...prev, hens: [...prev.hens, hen] }));
        setCoopMessage(`${hen.name}搬進新雞窩了！牠今天還沒吃飼料。`);
        playEffect('coin');
      };
      const renameHen = (id, name) => {
        setCoop(prev => ({ ...prev, hens: prev.hens.map(hen => hen.id === id ? { ...hen, name: name.slice(0, 8) } : hen) }));
        setCoopMessage(`名字存好了，${name.slice(0, 8)}很喜歡牠的新名字。`);
      };
      const petHen = id => {
        const hen = coop.hens.find(h => h.id === id);
        if (!hen) return;
        setCoop(prev => ({ ...prev, hens: prev.hens.map(h => h.id === id ? { ...h, greetedDay: day, affection: Math.min(10, h.affection + (h.greetedDay === day ? 0 : 1)) } : h) }));
        setCoopMessage(hen.greetedDay === day ? `${hen.name}靠過來陪你。今天已增加過親密度，明天再來吧！` : `${hen.name}開心地拍拍翅膀！${hen.affection < 10 ? '親密度 +1。' : '牠已經非常信任你了。'}`);
      };

      const collectEggs = () => {
        if (coop.eggs < 1) return;
        setInventory(prev => ({ ...prev, eggs: (prev.eggs || 0) + coop.eggs }));
        setMessage(`收下 ${coop.eggs} 顆雞蛋，已放進農產包包。`);
        setCoopMessage(`收下 ${coop.eggs} 顆雞蛋，已放進農產包包。`);
        setCoop(prev => ({ ...prev, eggs: 0 }));
        playEffect('coin');
      };

      const sellEggs = () => {
        const count = inventory.eggs || 0;
        if (!count) return;
        setGold(g => g + count * 120);
        setInventory(prev => ({ ...prev, eggs: 0 }));
        setMessage(`賣出 ${count} 顆雞蛋，獲得 $${(count * 120).toLocaleString()}。`);
        playEffect('coin');
      };

      const buyPlot = (plotId, price) => {
        if (gold >= price) {
          setGold(g => g - price);
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isUnlocked: true } : p));
          setMessage(`第 ${plotId + 1} 區開墾好了！又多了一片可以播種的農田。`);
          playEffect('coin');
        } else {
          setMessage(`開墾第 ${plotId + 1} 區需要 $${price.toLocaleString()}，再存一點錢吧。`);
        }
      };

      const applyNet = (plotId, clickPoint) => {
        const hasMature = plots[plotId].slots.some(s => s.crop && s.growth >= s.crop.days);
        if (hasMature) {
          setMessage("這一區已有成熟的作物。先收成，再為下一批作物架設防蟲網吧。");
          return;
        }

        if (inventory.nets > 0 && !plots[plotId].isNetted) {
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isNetted: true } : p));
          setInventory(inv => ({ ...inv, nets: Math.max(0, inv.nets - 1) }));
          triggerActionFx('net', clickPoint);
          setMessage(`第 ${plotId + 1} 區架好防蟲網了，能擋住新來的菜蟲；原本的菜蟲仍要清除。`);

          // 進階防蟲網教學完成檢查 (不限順序)
          if (tutorialStep >= 7 && !flags.tutNet) {
            setFlags(prev => ({ ...prev, tutNet: true }));
          }
        }
      };

      const applyWindbreak = (plotId, clickPoint) => {
        if (inventory.windbreaks > 0 && !plots[plotId].isWindbreaked) {
          setPlots(prev => prev.map(p => p.id === plotId ? { ...p, isWindbreaked: true } : p));
          setInventory(inv => ({ ...inv, windbreaks: Math.max(0, inv.windbreaks - 1) }));
          triggerActionFx('windbreak', clickPoint);
          setMessage(`第 ${plotId + 1} 區架好防風網了，颱風天也多一份安心。`);
        }
      };

      const handleQuestDeliver = () => {
        const required = schoolQuest.required;
        const cropId = schoolQuest.crop.id;
        const currentAmount = inventory.crops?.[cropId] || 0;

        // 嚴格防呆檢查
        if (currentAmount < required) {
            setMessage(`還差 ${required - currentAmount} 份農產。收齊後，再來交付委託吧。`);
            return;
        }

        setGold(g => g + (schoolQuest.crop.value * 3 * required));
        setInventory(inv => ({
            ...inv,
            crops: { ...inv.crops, [cropId]: currentAmount - required }
        }));

        const seasonRewardMap = { SPRING: 'golden_peach', SUMMER: 'crystal_melon', AUTUMN: 'giant_pumpkin', WINTER: 'white_strawberry' };
        const rewardId = seasonRewardMap[season];

        setInventory(inv => ({
            ...inv,
            seeds: { ...inv.seeds, [rewardId]: (inv.seeds[rewardId] || 0) + 1 }
        }));

        playEffect('coin');
        setSchoolQuest(null);
        setShowQuestModal(false);

        if (!flags.seenQuestReward) {
            setFlags(f => ({ ...f, seenQuestReward: true }));
            setEventQueue(q => [...q, { type: 'tutorial_special_seed', crop: CROPS.SPECIAL.find(c=>c.id === rewardId) }]);
        } else {
            setMessage(`委託完成！已收到 3 倍售價的報酬，還有 1 包傳說種子。`);
        }
      };

      return (
        <div className="farm12-picturebook min-h-screen p-3 md:p-5 text-slate-800 select-none relative overflow-x-hidden pb-24">

          <style>{`
            @keyframes rainFall {
              0% { transform: translateY(-100%); opacity: 0; }
              20% { opacity: 1; }
              80% { opacity: 1; }
              100% { transform: translateY(300%); opacity: 0; }
            }
            .animate-rain { animation: rainFall 0.8s linear infinite; }
            .rain-delay-1 { animation-delay: 0.2s; }
            .rain-delay-2 { animation-delay: 0.5s; }
            .rain-delay-3 { animation-delay: 0.7s; }

                        if (!crop) return null;
                        return (
                          <div key={cropId} className="p-3 md:p-4 rounded-xl md:rounded-2xl border-2 border-slate-100 flex justify-between items-center bg-white shadow-sm">
                            <div className="flex items-center gap-3">
                              <CropArt crop={crop} growth={crop.days} mode="sell" fallback={crop.icon} />
                              <div>
                                <div className="font-black text-sm md:text-base text-slate-800">{crop.name}</div>
                                <div className="text-[10px] md:text-xs text-slate-500 font-bold mt-1">
                                  持有： <span className="text-indigo-600 font-black">{amount}</span> ｜ 售價： <span className="text-yellow-600">${crop.value.toLocaleString()}</span>
                                </div>
                              </div>
                            </div>
                            <div className="flex flex-col gap-1.5 shrink-0">
                              <button onClick={() => sellCrop(cropId, 1, crop.value)} className="bg-yellow-100 text-yellow-700 px-3 py-1.5 rounded-lg font-black text-[10px] md:text-xs hover:bg-yellow-500 hover:text-white transition-all active:scale-95 border border-yellow-200">賣 1 個</button>
                              {amount > 1 && (
                                <button onClick={() => sellCrop(cropId, amount, crop.value)} className="bg-yellow-500 text-white px-3 py-1.5 rounded-lg font-black text-[10px] md:text-xs hover:bg-yellow-600 transition-all active:scale-95 shadow-sm">全部出售</button>
                              )}
                            </div>
                          </div>
                        )
                      })}
                      </>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 圖鑑系統 Modal */}
          {showModal === 'gallery' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-2 md:p-4 z-50">
              <div id="farm12-gallery-dialog" role="dialog" aria-modal="true" aria-label="台灣蔬果農業圖鑑" className="story-paper bg-white p-5 md:p-8 rounded-[2rem] md:rounded-[2.5rem] max-w-4xl w-full shadow-2xl animate-in zoom-in duration-300 max-h-[95vh] flex flex-col">
                <div className="flex justify-between items-center mb-4 md:mb-6 border-b pb-3 md:pb-4 shrink-0">
                  <h2 className="text-xl md:text-2xl font-black text-indigo-900 flex items-center gap-1 md:gap-2">📖 台灣蔬果農業圖鑑</h2>
                  <button onClick={() => setShowModal(null)} className="bg-slate-100 p-1.5 md:p-2 rounded-full hover:bg-slate-200 transition-colors">❌</button>
                </div>

                <div className="overflow-y-auto custom-scrollbar flex-1 pr-2 md:pr-4 pb-4">
                  <p className="text-[10px] md:text-xs font-bold text-slate-500 mb-4 md:mb-6">
                    想種什麼，先翻翻這本小圖鑑。每包種子能種滿 8 格，首次收成後還能讀到作物故事。這裡的生長天數是遊戲設定，和真實種植所需時間不同。
                  </p>

                  <div className="space-y-6 md:space-y-8">
                    {Object.entries(CROPS).map(([seasonKey, cropList]) => {
                      const sName = { SPRING: '春季', SUMMER: '夏季', AUTUMN: '秋季', WINTER: '冬季', SPECIAL: '傳說隱藏' }[seasonKey];
                      const sColor = { SPRING: 'text-green-600', SUMMER: 'text-yellow-600', AUTUMN: 'text-orange-600', WINTER: 'text-blue-600', SPECIAL: 'text-purple-600' }[seasonKey];
                      const sBorder = { SPRING: 'border-green-200', SUMMER: 'border-yellow-200', AUTUMN: 'border-orange-200', WINTER: 'border-blue-200', SPECIAL: 'border-purple-300' }[seasonKey];
                      const sBg = { SPRING: 'bg-green-50/30', SUMMER: 'bg-yellow-50/30', AUTUMN: 'bg-orange-50/30', WINTER: 'bg-blue-50/30', SPECIAL: 'bg-gradient-to-br from-purple-50 to-pink-50' }[seasonKey];

                      return (
                        <div key={seasonKey}>
                          <h3 className={`text-base md:text-lg font-black mb-3 md:mb-4 border-b-2 inline-block pb-1 ${sColor}`}>
                            {seasonKey === 'SPECIAL' ? '✨ ' : ''}{sName}作物
                          </h3>

                          <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 md:gap-4">
                            {cropList.map(crop => {
                              const record = gallery[crop?.id];
                              const isUnlocked = !!record?.unlocked;

                              return (
                                <div key={crop?.id} className={`p-4 md:p-5 rounded-xl md:rounded-2xl border-2 flex items-start gap-4 md:gap-5 relative transition-all ${isUnlocked ? `${sBorder} ${sBg}` : 'border-slate-100 bg-slate-50'}`}>

                                  <div className={`text-5xl md:text-6xl shrink-0 drop-shadow-sm mt-1 ${seasonKey === 'SPECIAL' && isUnlocked ? 'animate-pulse' : ''}`}>
                                    <CropArt crop={crop} growth={crop.days} mode="gallery" fallback={crop.icon} />
                                  </div>

                                  <div className="flex-1 min-w-0">
                                    <div className={`font-black text-base md:text-lg ${seasonKey === 'SPECIAL' && isUnlocked ? 'text-purple-800' : 'text-slate-700'}`}>
                                      {crop.name}
                                    </div>

                                    <dl className="story-crop-guide">
                                      <div><dt>生長天數</dt><dd>{crop.days} 天・{crop.type === 'leaf' ? '葉菜類' : crop.type === 'root' ? '根莖類' : '瓜果類'}</dd></div>
                                      <div><dt>種子來源</dt><dd>{seasonKey === 'SPECIAL' ? ({golden_peach:'春季',crystal_melon:'夏季',giant_pumpkin:'秋季',white_strawberry:'冬季'})[crop.id] + '完成委託獎勵' : sName + '商店・$' + crop.price.toLocaleString()}</dd></div>
                                      <div><dt>收成單價</dt><dd>${crop.value.toLocaleString()}</dd></div>
                                      <div><dt>適用肥料</dt><dd>{({leaf:'氮肥',root:'磷肥',fruit:'鉀肥'})[crop.type]}・同類作物加快 1 天</dd></div>
                                    </dl>
                                    <p className="story-guide-tip">晴天記得澆水，雨天會自動澆好。防蟲網能擋住新來的菜蟲，防風網能抵禦颱風；田裡原有的菜蟲與雜草仍要清除。</p>
                                    <div className="story-crop-story">{isUnlocked ? <><strong>已收成・作物故事</strong><p>{crop.desc}</p></> : <p>首次收成後，解鎖作物故事。</p>}</div>
                                  </div>

                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 小型雞舍：最多三隻，每隻各自記錄餵食與互動 */}
          {showModal === 'coop' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div id="farm12-coop-dialog" ref={coopDialogRef} tabIndex={-1} role="dialog" aria-modal="true" aria-label="小雞的家" className="story-paper picturebook-coop-modal w-full max-h-[90vh] overflow-y-auto text-center">
                <button className="float-right text-xl p-2" aria-label="關閉雞舍" onClick={() => setShowModal(null)}>×</button>
                <StorySprite sheet="village-atlas" columns={2} index={1} label="木造雞舍與母雞" className="story-coop-illustration" />
                <small className="story-eyebrow">一起照顧小雞</small><h2 className="text-2xl font-black text-amber-950 mb-2">小雞的家</h2>
                {!coop.built ? <>
                  <p className="mb-4">先迎接一隻母雞，再慢慢擴建成三隻的小家。每隻每天吃 1 份飼料，隔天就會留下 1 顆蛋。忘記餵食的那天不會產蛋，母雞仍會留在雞舍等你。</p>
                  <button onClick={buildCoop} disabled={gold < 3000} className="picturebook-primary w-full">建造雞舍・$3,000（附 2 份飼料）</button>
                </> : <div className="space-y-4">
                  <p className="font-bold">{hungryHens.length ? `還有 ${hungryHens.length} 隻需要餵食` : '大家都吃飽了，明天來收蛋吧！'}</p>
                  <p>飼料 {coop.feed} 份・雞窩 {coop.eggs} 顆蛋・包包 {inventory.eggs || 0} 顆蛋</p>
                  <div className="story-hens">{coop.hens.map(hen => <HenCard key={hen.id} hen={hen} day={day} onRename={renameHen} onPet={petHen} />)}</div>
                  <div className="story-coop-actions">
                    <button onClick={feedHen} disabled={!hungryHens.length || coop.feed < 1} className="picturebook-primary">{hungryHens.length ? (coop.feed ? `餵食 ${Math.min(hungryHens.length, coop.feed)} 份` : '請先購買飼料') : '全體已餵食'}</button>
                    <button onClick={buyFeed} disabled={gold < 60 * coop.hens.length} className="picturebook-secondary">買 {coop.hens.length} 份飼料・${60 * coop.hens.length}</button>
                  </div>
                  <button onClick={collectEggs} disabled={coop.eggs < 1} className="picturebook-secondary w-full"><Farm12UiIcon name="egg" className="story-egg" />收蛋 {coop.eggs} 顆到包包</button>
                  {coop.hens.length < 3 ? <button onClick={upgradeCoop} disabled={gold < Care.upgradePrice(coop)} className="picturebook-secondary w-full">擴建到 {coop.hens.length + 1} 隻・${Care.upgradePrice(coop).toLocaleString()}（含新母雞）</button> : <p>三隻母雞都到齊了，雞舍已完整擴建。</p>}
                  <p className="story-guide-tip">每天首次摸摸增加 1 點親密度（上限 10），不影響產蛋。雞蛋可在商店出售，每顆 $120。</p>
                </div>}
                <p className="story-coop-feedback" role="status">{coopMessage}</p>
              </div>
            </div>
          )}

          {/* 睡覺與存檔確認彈窗 */}
          {showModal === 'sleep' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="story-paper bg-white p-6 md:p-8 rounded-[2rem] md:rounded-[2.5rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in duration-200 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div className="text-5xl md:text-6xl mb-3 md:mb-4">🌙</div>
                <h2 className="text-xl md:text-2xl font-black mb-3">睡前待辦</h2>
                <p className="text-slate-500 mb-3 font-bold text-[10px] md:text-xs leading-relaxed">
                  休息前，再看看田裡吧。缺水會讓作物暫停生長；蟲害或雜草若連續兩晚沒有清理，作物就會枯萎。
                </p>
                <div className="space-y-2 text-left mb-5 max-h-[30vh] overflow-y-auto custom-scrollbar" aria-label="各區睡前待辦">
                  {sleepChecklist.length === 0 ? (
                    <p className="rounded-xl bg-emerald-50 p-3 text-center font-bold text-emerald-700 text-xs">田裡的農務都完成了。</p>
                  ) : sleepChecklist.map(item => (
                    <button key={item.plotId} onClick={() => visitSleepTask(item.plotId)} className="block w-full rounded-xl border border-amber-200 bg-amber-50 p-3 text-left hover:bg-amber-100 transition-colors">
                      <strong className="block text-sm text-amber-900">第 {item.plotId + 1} 區 → 前往處理</strong>
                      <span className="block text-xs text-slate-700 mt-1">
                        {[item.water > 0 && `澆水 ${item.water} 格`, item.bugs > 0 && `驅蟲 ${item.bugs} 格`, item.weeds > 0 && `除草 ${item.weeds} 格`, item.windRisk > 0 && `防風 ${item.windRisk} 格`].filter(Boolean).join('・')}
                      </span>
                      {item.windRisk > 0 && <span className="block mt-1 text-xs font-black text-red-700">今晚每株有 50% 受損機率，請先架設防風網</span>}
                      {item.urgent > 0 && <span className="block mt-1 text-xs font-black text-red-700">其中 {item.urgent} 格若再過夜將枯死</span>}
                    </button>
                  ))}
                </div>
                {coop.built && hungryHens.length > 0 && <button type="button" onClick={visitHungryHens} className="story-sleep-coop-task"><Farm12UiIcon name="egg" /><span><strong>小雞的家 → 前往餵食</strong><small>還有 {hungryHens.length} 隻沒吃飽{coop.feed < hungryHens.length ? '，記得補買飼料。' : '，飼料已經準備好了。'}</small></span></button>}
                <div className="flex gap-3 md:gap-4">
                  <button onClick={() => setShowModal(null)} className="flex-1 bg-slate-100 text-slate-600 py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-200 transition-colors">
                    再巡一下
                  </button>
                  <button onClick={processNextDay} className="flex-1 bg-slate-800 text-white py-3 md:py-4 rounded-xl md:rounded-2xl font-black text-sm md:text-base hover:bg-slate-700 transition-colors">
                    休息，迎接明天
                  </button>
                </div>

                <div className="flex flex-col gap-3 md:gap-4 w-full mt-6 pt-6 border-t border-slate-100">
                  <div className="flex gap-3 md:gap-4">
                    <button onClick={handleSave} className="flex-1 bg-blue-100 text-blue-700 py-3 rounded-xl font-black text-sm hover:bg-blue-200 transition-colors active:scale-95 shadow-sm">
                      💾 儲存進度
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 結算彈窗 */}
          {showModal === 'contest' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="story-paper bg-white p-8 md:p-10 rounded-[2.5rem] md:rounded-[3rem] max-w-sm w-full text-center shadow-2xl animate-in zoom-in">
                <div className="text-6xl md:text-7xl mb-4 md:mb-6">🥇</div>
                <h2 className="text-xl md:text-3xl font-black mb-2 uppercase">百日農莊評選</h2>
                <p className="text-slate-400 text-[10px] md:text-xs mb-6 md:mb-8 font-bold">來到第 {day} 天了！小鎮送來一筆獎金，金額是目前農莊資金的 20%。</p>
                <div className="bg-slate-100 p-4 md:p-6 rounded-2xl md:rounded-3xl mb-6 md:mb-8">
                  <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 uppercase">農莊獎金</div>
                  <div className="text-3xl md:text-4xl font-black text-yellow-600">${Math.floor(gold * 0.2).toLocaleString()}</div>
                </div>
                <button onClick={() => { setGold(g => g + Math.floor(g * 0.2)); setShowModal(null); playEffect('coin'); }} className="w-full bg-slate-800 text-white py-4 md:py-5 rounded-xl md:rounded-2xl font-black uppercase tracking-widest hover:bg-slate-700 transition-all">領取獎勵</button>
              </div>
            </div>
          )}

          {/* 遊戲結束結果 */}
          {showModal === 'result' && (
            <div className="story-overlay fixed inset-0 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-4 z-50">
              <div className="story-paper bg-white p-8 md:p-12 rounded-[2.5rem] md:rounded-[3.5rem] max-w-lg w-full text-center shadow-2xl overflow-y-auto max-h-[90vh] hide-scrollbar">
                <div className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest mb-3 md:mb-4">這一年的農莊日記</div>
                <h1 className="text-4xl md:text-5xl font-black mb-6 md:mb-8 italic">這一年，辛苦了</h1>
                <div className="grid grid-cols-2 gap-3 md:gap-4 mb-8 md:mb-10">
                  <div className="bg-slate-50 p-6 md:p-8 rounded-2xl md:rounded-3xl border border-slate-100">
                    <div className="text-[9px] md:text-[10px] font-black text-slate-400 mb-1 md:mb-2 uppercase">結餘資金</div>
                    <div className="text-xl md:text-3xl font-black font-mono text-slate-800">${gold.toLocaleString()}</div>
                  </div>
                  <div className="bg-blue-600 p-6 md:p-8 rounded-2xl md:rounded-3xl text-white shadow-xl shadow-blue-200">
                    <div className="text-[9px] md:text-[10px] font-black opacity-60 mb-1 md:mb-2 uppercase">年度評等</div>
                    <div className="text-5xl md:text-6xl font-black">{gold > 1000000 ? 'S' : gold > 500000 ? 'A' : gold > 100000 ? 'B' : 'C'}</div>
                  </div>
                </div>
                <button onClick={() => {
                  localStorage.removeItem(Care.SAVE_KEY);
                  window.location.reload();
                }} className="w-full bg-slate-800 text-white py-5 md:py-6 rounded-2xl md:rounded-3xl font-black text-sm md:text-base uppercase tracking-widest hover:bg-slate-700 active:scale-95 transition-all">刪除這份日記，重新開始</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
