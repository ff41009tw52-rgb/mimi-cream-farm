<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橘咪咪與白奶油的科學農場</title>
<style>body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#f0fdf4;color:#166534;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:3px solid #86efac;border-radius:24px;padding:28px;text-align:center;box-shadow:0 8px 24px #0001}p{font-weight:700}</style>
</head>
<body>
<div class="box"><h1>🌱 科學農場載入中</h1><p>正在準備小白菜救援任務……</p></div>
<script>
const sourceUrl='https://raw.githubusercontent.com/ff41009tw52-rgb/mimi-cream-farm/3281db76110cf7f2c56f58bbd64834b1889054db/40.html';
fetch(sourceUrl).then(r=>r.text()).then(html=>{
html=html.replaceAll('edge/cabbage-dry.png','./picture/cabbage-dry.png').replaceAll('edge/cabbage-low-light.png','./picture/cabbage-low-light.png').replaceAll('edge/cabbage-pest.png','./picture/cabbage-pest.png').replaceAll('./assets/illustrations/cream.svg','./picture/Christmascream.jpg').replaceAll('./assets/illustrations/mimi.svg','./picture/Christmasmimi.jpg');
document.open();document.write(html);document.close();
}).catch(()=>{document.body.innerHTML='<div class="box"><h1>暫時無法載入網站</h1><p>請重新整理後再試一次。</p></div>'});
</script>
</body>
</html>
