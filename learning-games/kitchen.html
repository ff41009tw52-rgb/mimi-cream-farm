<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e7ede4">
  <meta name="description" content="讀料理手帳，排出步驟並找出線索。四年級國語閱讀遊戲。">
  <title>白奶油的文字料理屋｜橘咪咪與白奶油</title>
  <link rel="stylesheet" href="../fonts/classroom/classroom.css">
  <link rel="stylesheet" href="play.css">
  <link rel="stylesheet" href="recipe.css">
  <script defer src="play.js?v=20261125-story"></script>
  <script defer src="recipe.js?v=20261125-story"></script>
<link rel="stylesheet" href="story/guide.css">
<script type="module" src="story/guide.js"></script>
</head>
<body data-story="recipe" data-game="kitchen">
  <div class="recipe-shell">
    <header class="recipe-header">
      <a href="../chinese.html">語文故事屋</a>
      <div class="recipe-font" aria-label="閱讀字體大小">
        <button type="button" id="recipe-smaller" aria-label="縮小閱讀字體" disabled>A−</button>
        <button type="button" id="recipe-larger" aria-label="放大閱讀字體">A＋</button>
      </div>
    </header>
    <div class="recipe-title">
      <h1>白奶油的文字料理屋</h1>
      <p>康軒四上・美味的一堂課</p>
    </div>
    <nav class="recipe-modes" aria-label="遊戲模式">
      <button type="button" id="recipe-mode" aria-pressed="true">美食特攻隊</button>
      <button type="button" id="sensory-mode" aria-pressed="false">五感描寫</button>
    </nav>

    <main id="recipe-app"></main>
    <main id="sensory-practice" hidden aria-label="五感描寫">
      <section class="hero" hidden>
        <div id="subject-badge"></div>
        <h2 id="game-title"></h2>
        <p id="game-subtitle"></p>
      </section>
      <div class="bar">
        <span id="round-number">第 1 題</span>
        <div class="meter" aria-label="遊戲進度"><div id="fill"></div></div>
        <span id="score">完成 0 題</span>
      </div>
      <div class="task">
        <div id="stage"></div>
        <div id="message" role="status" aria-live="polite"></div>
        <div class="actions"><button id="next" class="primary" type="button" disabled>下一題</button></div>
      </div>
      <section class="guide"><h3>怎麼玩？</h3><p id="guide-text"></p></section>
    </main>
    <noscript><p>請開啟 JavaScript，才能操作料理手帳。</p></noscript>
  </div>
</body>
</html>
