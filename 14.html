<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播種小達人 - 國小自然課互動遊戲</title>
    <!-- 引入 React 與 Tailwind CSS 相關資源 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f0fdf4;
            user-select: none;
            /* 確保在手機上滑動不會捲動整個網頁 */
            touch-action: none;
        }
        /* 泥土背景與紋理 */
        .soil-texture {
            background-color: #795548;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%235D4037' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .seed-glow {
            box-shadow: 0 0 5px 2px rgba(255, 255, 255, 0.8);
        }
        
        /* 動畫與游標 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating { animation: float 3s ease-in-out infinite; }
        .cursor-pointer { cursor: pointer; }
        .cursor-hide { cursor: none; }
        
        @keyframes spray-drop {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(40px) scale(0.5); opacity: 0; }
        }
        .grid-water-drop { animation: spray-drop 0.3s linear infinite; }

        /* 濕潤與覆土渲染濾鏡 - 讓獨立圓點融合在一起 */
        .water-wet-container {
            filter: blur(5px) contrast(2); 
        }
        .soil-cover-container {
            filter: blur(5px) contrast(2); 
        }
        .soil-particle {
            transition: opacity 0.1s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVG 圖示元件庫 ---
        const Icon = ({ path, className, size = 24, style }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
                {path}
            </svg>
        );

        // 粗吸管圖示
        const Straw = (props) => (
             <Icon {...props} path={
                 <>
                    <line x1="17" y1="3" x2="8" y2="20" strokeWidth="6" stroke="#fbbf24" strokeLinecap="butt" />
                    <line x1="17" y1="3" x2="8" y2="20" strokeWidth="2" stroke="#b45309" strokeLinecap="butt" />
                    <line x1="15.5" y1="6" x2="13.5" y2="9" strokeWidth="2" stroke="#ef4444" />
                    <line x1="12.5" y1="11" x2="10.5" y2="14" strokeWidth="2" stroke="#ef4444" />
                 </>
             } />
        );

        const Shovel = (props) => <Icon {...props} path={<><path d="M2 22v-5l5-5 5 5-5 5z"/><path d="M9.5 14.5L16 8"/><path d="M17 2l5 5-.5.5a3.53 3.53 0 0 1-5 0s0 0 0 0L17 2z"/></>} />;
        const CloudRain = (props) => <Icon {...props} path={<><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 19v2"/><path d="M8 13v2"/><path d="M16 19v2"/><path d="M16 13v2"/><path d="M12 21v2"/><path d="M12 15v2"/></>} />;
        const Hand = (props) => <Icon {...props} path={<><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></>} />;
        const RefreshCcw = (props) => <Icon {...props} path={<><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></>} />;
        const ArrowRight = (props) => <Icon {...props} path={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />;
        const Home = (props) => <Icon {...props} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />;
        const Plus = (props) => <Icon {...props} path={<><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></>} />;
        
        const RedWateringCan = (props) => (
             <svg xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 100 100" className={props.className} style={props.style}>
                 <g transform="translate(10,10) scale(0.8)">
                    <path d="M20 80 L25 40 L75 40 L80 80 Z" fill="#EF4444" stroke="#991B1B" strokeWidth="3" />
                    <path d="M75 50 L95 30 L100 35 L80 60 Z" fill="#EF4444" stroke="#991B1B" strokeWidth="3" />
                    <path d="M25 50 C 0 50, 0 80, 20 80" fill="none" stroke="#991B1B" strokeWidth="6" />
                    <path d="M93 28 L102 37" stroke="#7f1d1d" strokeWidth="5" />
                 </g>
            </svg>
        );

        // --- 數學與插值演算法 ---
        const lerp = (start, end, t) => start * (1 - t) + end * t;
        const distance = (p1, p2) => Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));

        // --- 遊戲狀態與常數 ---
        const GAME_STAGES = {
            MENU: 'menu',
            TUTORIAL: 'tutorial',
            PLANTING: 'planting',
            COVERING: 'covering',
            WATERING: 'watering',
            SUCCESS: 'success'
        };

        const VEGGIES = {
            BOKCHOY: {
                id: 'bokchoy',
                name: '小白菜',
                method: '撒播',
                desc: '種子要均勻撒在土壤上',
                icon: '🥬',
                targetSeeds: 20
            },
            TOMATO: {
                id: 'tomato',
                name: '番茄',
                method: '點播',
                desc: '用粗吸管壓出淺洞，每個洞放入 2~3 顆種子',
                icon: '🍅',
                targetHoles: 4
            }
        };

        // 網格解析度
        const BOKCHOY_GRID_ROWS = 24;
        const BOKCHOY_GRID_COLS = 24;
        const WET_ROWS = 40;
        const WET_COLS = 40;

        const App = () => {
            const [stage, setStage] = useState(GAME_STAGES.MENU);
            const [selectedVeggie, setSelectedVeggie] = useState(null);
            const [message, setMessage] = useState("");
            
            // 小白菜狀態
            const [scatterSeeds, setScatterSeeds] = useState([]);
            const [bokChoyCoverGrid, setBokChoyCoverGrid] = useState(Array(BOKCHOY_GRID_ROWS * BOKCHOY_GRID_COLS).fill(false));
            
            // 澆水狀態 (全部共用)
            const [wetGrid, setWetGrid] = useState(Array(WET_ROWS * WET_COLS).fill(false));

            // 番茄狀態
            const [tomatoHoles, setTomatoHoles] = useState([
                { id: 1, x: 25, y: 30, state: 'flat', seeds: 0 },
                { id: 2, x: 75, y: 30, state: 'flat', seeds: 0 },
                { id: 3, x: 25, y: 70, state: 'flat', seeds: 0 },
                { id: 4, x: 75, y: 70, state: 'flat', seeds: 0 },
            ]);
            const [activeTool, setActiveTool] = useState('straw'); 
            
            // 全域互動狀態
            const [cursorPos, setCursorPos] = useState({ x: -1000, y: -1000 }); 
            const [isActionActive, setIsActionActive] = useState(false); 
            
            const containerRef = useRef(null); 
            const lastPosRef = useRef(null); 
            const isTransitioningRef = useRef(false);

            // --- Handlers ---
            const resetGame = () => {
                setStage(GAME_STAGES.MENU);
                setScatterSeeds([]);
                setBokChoyCoverGrid(Array(BOKCHOY_GRID_ROWS * BOKCHOY_GRID_COLS).fill(false));
                setWetGrid(Array(WET_ROWS * WET_COLS).fill(false));
                setTomatoHoles(tomatoHoles.map(h => ({ ...h, state: 'flat', seeds: 0 })));
                setMessage("");
                setActiveTool('straw');
                lastPosRef.current = null;
                isTransitioningRef.current = false;
                setIsActionActive(false);
            };

            const startGame = (veggieKey) => {
                setSelectedVeggie(VEGGIES[veggieKey]);
                setBokChoyCoverGrid(Array(BOKCHOY_GRID_ROWS * BOKCHOY_GRID_COLS).fill(false));
                setWetGrid(Array(WET_ROWS * WET_COLS).fill(false));
                setStage(GAME_STAGES.TUTORIAL);
            };

            // 小白菜撒播
            const handleScatterClick = (e) => {
                if (stage !== GAME_STAGES.PLANTING || selectedVeggie.id !== 'bokchoy') return;
                
                if (scatterSeeds.length >= VEGGIES.BOKCHOY.targetSeeds) {
                    setMessage("種子已經夠多了！不能再撒了！");
                    return;
                }

                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const isTooClose = scatterSeeds.some(s => Math.hypot(s.x - x, s.y - y) < 30);
                
                if (isTooClose) {
                    setMessage("太擠了！撒開一點喔！");
                    setTimeout(() => setMessage(""), 1000);
                } else {
                    const newSeed = { x, y, id: Date.now() };
                    const newSeeds = [...scatterSeeds, newSeed];
                    setScatterSeeds(newSeeds);
                    
                    if (newSeeds.length >= VEGGIES.BOKCHOY.targetSeeds) {
                        setMessage("太棒了！種子撒得很均勻！下一步準備覆土！");
                    } else {
                        setMessage(`目前有 ${newSeeds.length} 顆種子，繼續撒！`);
                    }
                }
            };

            // 番茄點播與覆土
            const handleHoleClick = (holeId) => {
                if (selectedVeggie.id !== 'tomato') return;

                if (stage === GAME_STAGES.PLANTING) {
                    setTomatoHoles(prev => prev.map(hole => {
                        if (hole.id !== holeId) return hole;
                        if (activeTool === 'straw') {
                            if (hole.state === 'flat') return { ...hole, state: 'dug' };
                            return hole;
                        }
                        if (activeTool === 'seedbag') {
                            if (hole.state !== 'dug') {
                                setMessage("要先用粗吸管壓洞才能放種子喔！");
                                return hole;
                            }
                            if (hole.seeds >= 3) {
                                setMessage("只要 2~3 顆就夠了喔！");
                                return hole;
                            }
                            return { ...hole, seeds: hole.seeds + 1 };
                        }
                        return hole;
                    }));
                }
                
                if (stage === GAME_STAGES.COVERING) {
                    const targetHole = tomatoHoles.find(h => h.id === holeId);
                    if (targetHole && targetHole.state !== 'covered') {
                        setTomatoHoles(prev => {
                            const newHoles = prev.map(hole => {
                                if (hole.id === holeId) return { ...hole, state: 'covered' };
                                return hole;
                            });
                            
                            if (newHoles.every(h => h.state === 'covered')) {
                                setMessage("都蓋好了！準備澆水！");
                                setTimeout(() => setStage(GAME_STAGES.WATERING), 1000);
                            }
                            return newHoles;
                        });
                    }
                }
            };

            const checkPlantingComplete = () => {
                if (selectedVeggie.id === 'bokchoy') {
                    if (scatterSeeds.length >= VEGGIES.BOKCHOY.targetSeeds) {
                        setStage(GAME_STAGES.COVERING);
                        setMessage("現在請用手滑過土壤，把土撥到種子上！");
                    } else {
                        setMessage(`種子還不夠多喔！至少要 ${VEGGIES.BOKCHOY.targetSeeds} 顆`);
                    }
                } else {
                    const allDug = tomatoHoles.every(h => h.state !== 'flat');
                    const allSeeded = tomatoHoles.every(h => h.seeds >= 2 && h.seeds <= 3);
                    if (allDug && allSeeded) {
                        setStage(GAME_STAGES.COVERING);
                        setActiveTool('hand');
                        setMessage("太好了！點擊洞口把土蓋回去吧！");
                    } else {
                        setMessage("請檢查：每個洞都要有 2~3 顆種子！");
                    }
                }
            };

            // --- 核心：連續滑動塗抹渲染演算法 (支援覆土與澆水) ---
            const paintGrid = (x, y, rect, type) => {
                const isWatering = type === 'water';
                const rows = isWatering ? WET_ROWS : BOKCHOY_GRID_ROWS;
                const cols = isWatering ? WET_COLS : BOKCHOY_GRID_COLS;
                const cellWidth = rect.width / cols;
                const cellHeight = rect.height / rows;
                const radius = isWatering ? 3 : 2.5;

                const setGridFunc = isWatering ? setWetGrid : setBokChoyCoverGrid;

                setGridFunc(prevGrid => {
                    const newGrid = [...prevGrid];
                    
                    const applyPaint = (px, py) => {
                        const col = px / cellWidth;
                        const row = py / cellHeight;
                        const rStart = Math.floor(row - radius);
                        const rEnd = Math.ceil(row + radius);
                        const cStart = Math.floor(col - radius);
                        const cEnd = Math.ceil(col + radius);

                        for (let r = rStart; r <= rEnd; r++) {
                            for (let c = cStart; c <= cEnd; c++) {
                                if (r >= 0 && r < rows && c >= 0 && c < cols) {
                                    if (Math.pow(r - row, 2) + Math.pow(c - col, 2) <= Math.pow(radius, 2)) {
                                        if (isWatering) {
                                            if (Math.random() > 0.2) newGrid[r * cols + c] = true;
                                        } else {
                                            newGrid[r * cols + c] = true;
                                        }
                                    }
                                }
                            }
                        }
                    };

                    if (lastPosRef.current) {
                        const dist = distance(lastPosRef.current, {x, y});
                        const steps = Math.floor(dist / 10);
                        for (let i = 1; i <= steps; i++) {
                            const t = i / steps;
                            applyPaint(lerp(lastPosRef.current.x, x, t), lerp(lastPosRef.current.y, y, t));
                        }
                    }
                    applyPaint(x, y);
                    
                    // 檢查過關條件 (小白菜覆土)
                    if (!isWatering && !isTransitioningRef.current) {
                        const allCovered = scatterSeeds.every(seed => {
                            const c = Math.floor(seed.x / cellWidth);
                            const r = Math.floor(seed.y / cellHeight);
                            if(r < 0 || r >= rows || c < 0 || c >= cols) return false;
                            return newGrid[r * cols + c];
                        });

                        if (allCovered) {
                            isTransitioningRef.current = true;
                            setMessage("種子都蓋好被子了！準備澆水！");
                            setTimeout(() => {
                                setStage(GAME_STAGES.WATERING);
                                isTransitioningRef.current = false;
                                lastPosRef.current = null;
                            }, 1000);
                        }
                    }
                    return newGrid;
                });

                lastPosRef.current = {x, y};
            };

            // --- 整合的 Pointer Events ---
            const handlePointerDown = (e) => {
                if (!containerRef.current) return;
                e.currentTarget.setPointerCapture(e.pointerId);
                setIsActionActive(true);

                const rect = containerRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                setCursorPos({ x, y });
                lastPosRef.current = null;

                if (stage === GAME_STAGES.COVERING && selectedVeggie.id === 'bokchoy') {
                    paintGrid(x, y, rect, 'cover');
                } else if (stage === GAME_STAGES.WATERING) {
                    paintGrid(x + 60, y + 40, rect, 'water');
                }
            };

            const handlePointerMove = (e) => {
                if (!containerRef.current) return;
                
                const rect = containerRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                setCursorPos({ x, y });

                if (isActionActive) {
                    if (stage === GAME_STAGES.COVERING && selectedVeggie.id === 'bokchoy') {
                        paintGrid(x, y, rect, 'cover');
                    } else if (stage === GAME_STAGES.WATERING) {
                        paintGrid(x + 60, y + 40, rect, 'water');
                    }
                }
            };

            const handlePointerUp = (e) => {
                e.currentTarget.releasePointerCapture(e.pointerId);
                setIsActionActive(false);
                lastPosRef.current = null;

                if (stage === GAME_STAGES.WATERING && !isTransitioningRef.current) {
                    const wetCount = wetGrid.filter(Boolean).length;
                    const percent = (wetCount / wetGrid.length) * 100;

                    if (percent >= 80) {
                        isTransitioningRef.current = true;
                        setStage(GAME_STAGES.SUCCESS);
                    } else if (percent > 0 && percent < 80) {
                        // 【優化】無數據化文字提示
                        setMessage("還有一些地方乾乾的喔，請繼續均勻澆水！");
                    }
                }
            };

            // --- 畫面渲染 ---
            const renderMainMenu = () => (
                <div className="flex flex-col items-center justify-center h-full space-y-8 p-4 relative">
                     <a href="https://ff41009tw52-rgb.github.io/mimi-cream-farm/" className="absolute top-4 left-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 decoration-none transition-all hover:scale-105 z-50">
                        <Home size={20} /> 回農場
                    </a>
                    <h1 className="text-4xl font-bold text-green-800 tracking-wider">播種小達人</h1>
                    <p className="text-xl text-gray-600">請選擇你要種植的蔬菜</p>
                    <div className="grid grid-cols-2 gap-8 w-full max-w-2xl">
                        {Object.keys(VEGGIES).map(key => (
                            <button 
                                key={key}
                                onClick={() => startGame(key)}
                                className="group relative bg-white p-8 rounded-3xl shadow-xl border-4 border-transparent hover:border-green-400 transition-all transform hover:-translate-y-2"
                            >
                                <div className="text-8xl mb-4 floating">{VEGGIES[key].icon}</div>
                                <h2 className="text-3xl font-bold text-gray-800">{VEGGIES[key].name}</h2>
                                <span className="inline-block mt-2 px-4 py-1 bg-green-100 text-green-700 rounded-full text-lg">
                                    {VEGGIES[key].method}
                                </span>
                            </button>
                        ))}
                    </div>
                </div>
            );

            const renderTutorial = () => (
                <div className="flex flex-col items-center justify-center h-full p-8 text-center bg-white/90 rounded-xl max-w-2xl mx-auto mt-20 shadow-2xl relative">
                     <a href="https://ff41009tw52-rgb.github.io/mimi-cream-farm/" className="absolute top-4 left-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 decoration-none transition-all hover:scale-105 z-50">
                        <Home size={20} /> 回農場
                    </a>
                    <h2 className="text-3xl font-bold text-green-700 mb-6">任務說明：{selectedVeggie.name}</h2>
                    <div className="bg-yellow-50 p-6 rounded-xl border-2 border-yellow-200 mb-8">
                        <p className="text-2xl text-gray-700 leading-relaxed font-bold">
                            {selectedVeggie.desc}
                        </p>
                    </div>
                    <button 
                        onClick={() => setStage(GAME_STAGES.PLANTING)}
                        className="bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-lg transition-transform active:scale-95 flex items-center gap-3"
                    >
                        開始播種 <Hand size={28} />
                    </button>
                </div>
            );

            const renderGameArea = () => {
                const isBokchoy = selectedVeggie.id === 'bokchoy';
                const isWateringPhase = stage === GAME_STAGES.WATERING;
                const isDragMode = isWateringPhase || (stage === GAME_STAGES.COVERING && isBokchoy);

                let instruction = "";
                if (stage === GAME_STAGES.PLANTING) {
                    instruction = isBokchoy ? "點擊土壤撒種子 (種子要保持距離喔！)" : "先用粗吸管壓出淺洞，再放 2~3 顆種子";
                } else if (stage === GAME_STAGES.COVERING) {
                    instruction = isBokchoy ? "【互動】按住並滑動，用手把土撥平" : "【互動】點擊每一個洞口，把土撥回去填平";
                } else if (isWateringPhase) {
                    instruction = "【互動】按住並滑動澆花器，均勻地澆濕土壤！";
                }

                return (
                    <div className="flex flex-col h-full max-w-4xl mx-auto p-4 relative overflow-hidden">
                        <a href="https://ff41009tw52-rgb.github.io/mimi-cream-farm/" className="absolute top-2 left-2 md:top-6 md:left-6 z-50 bg-green-600 hover:bg-green-700 text-white px-3 py-2 md:px-4 md:py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 decoration-none transition-all hover:scale-105">
                            <Home size={20} /> <span className="hidden md:inline">回農場</span>
                        </a>

                        <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-md mb-4 z-10 ml-12 md:ml-32">
                            <div className="flex items-center gap-3">
                                <span className="text-4xl">{selectedVeggie.icon}</span>
                                <div>
                                    <h3 className="text-xl font-bold text-gray-800">{selectedVeggie.name} ({selectedVeggie.method})</h3>
                                    <p className="text-green-600 font-bold text-sm md:text-base animate-pulse">{instruction}</p>
                                </div>
                            </div>
                            
                            {!isBokchoy && stage === GAME_STAGES.PLANTING && (
                                <div className="flex gap-2 bg-gray-100 p-1 rounded-lg">
                                    <button 
                                        onClick={() => setActiveTool('straw')}
                                        className={`p-3 rounded-lg flex items-center gap-2 ${activeTool === 'straw' ? 'bg-blue-500 text-white shadow-md' : 'text-gray-500 hover:bg-gray-200'}`}
                                    >
                                        <Straw size={20} /> 粗吸管
                                    </button>
                                    <button 
                                        onClick={() => setActiveTool('seedbag')}
                                        className={`p-3 rounded-lg flex items-center gap-2 ${activeTool === 'seedbag' ? 'bg-yellow-500 text-white shadow-md' : 'text-gray-500 hover:bg-gray-200'}`}
                                    >
                                        <span className="text-lg">🌰</span> 種子
                                    </button>
                                </div>
                            )}

                            {/* 【優化】已移除右上角的 % 數進度條顯示 */}

                            {stage === GAME_STAGES.PLANTING && (
                                <button 
                                    onClick={checkPlantingComplete}
                                    className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg flex items-center gap-2"
                                >
                                    完成 <ArrowRight size={20} />
                                </button>
                            )}
                        </div>

                        {message && (
                            <div className="absolute top-28 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-2 rounded-full shadow-xl font-bold z-50 animate-pulse whitespace-nowrap">
                                {message}
                            </div>
                        )}

                        <div 
                            ref={containerRef}
                            className={`relative flex-grow soil-texture rounded-xl shadow-inner border-4 border-amber-800 overflow-hidden 
                                        ${isDragMode ? 'cursor-hide' : 'cursor-crosshair'}`}
                             onClick={stage === GAME_STAGES.PLANTING && isBokchoy ? handleScatterClick : undefined}
                             onPointerDown={isDragMode ? handlePointerDown : undefined}
                             onPointerMove={isDragMode ? handlePointerMove : undefined}
                             onPointerUp={isDragMode ? handlePointerUp : undefined}
                             onPointerCancel={isDragMode ? handlePointerUp : undefined}
                        >

                            {/* --- 澆水濕度層 (動態滑動渲染) --- */}
                            <div className="absolute inset-0 pointer-events-none water-wet-container"
                                 style={{ display: 'grid', gridTemplateColumns: `repeat(${WET_COLS}, minmax(0, 1fr))`, gridTemplateRows: `repeat(${WET_ROWS}, minmax(0, 1fr))` }}>
                                {wetGrid.map((isWet, idx) => (
                                    <div 
                                        key={idx}
                                        className={`transition-colors duration-500 rounded-full scale-150 ${isWet ? 'bg-black/50' : 'bg-transparent'}`}
                                    ></div>
                                ))}
                            </div>

                            {/* --- 小白菜覆土層 (滑動塗抹) --- */}
                            {isBokchoy && stage === GAME_STAGES.COVERING && (
                                <div className="absolute inset-0 soil-cover-container pointer-events-none z-20"
                                     style={{ display: 'grid', gridTemplateColumns: `repeat(${BOKCHOY_GRID_COLS}, minmax(0, 1fr))`, gridTemplateRows: `repeat(${BOKCHOY_GRID_ROWS}, minmax(0, 1fr))` }}>
                                    {bokChoyCoverGrid.map((covered, idx) => (
                                        <div 
                                            key={idx}
                                            className={`soil-particle transition-opacity duration-300 w-[150%] h-[150%] -translate-x-1/4 -translate-y-1/4 rounded-full ${covered ? 'bg-[#5D4037] opacity-100' : 'bg-transparent opacity-0'}`}
                                        ></div>
                                    ))}
                                </div>
                            )}

                            {/* --- 游標與特效渲染 --- */}
                            {isBokchoy && stage === GAME_STAGES.COVERING && (
                                <div 
                                    className="absolute pointer-events-none z-50"
                                    style={{ 
                                        left: cursorPos.x, top: cursorPos.y,
                                        transform: `translate(-50%, -50%) ${isActionActive ? 'scale(0.9) rotate(-10deg)' : 'scale(1)'}`,
                                        transition: 'transform 0.1s'
                                    }}
                                >
                                    <Hand size={60} className="text-amber-100 drop-shadow-xl" />
                                </div>
                            )}

                            {isWateringPhase && (
                                <div 
                                    className="absolute pointer-events-none z-50 transition-transform duration-75"
                                    style={{ 
                                        left: cursorPos.x, top: cursorPos.y,
                                        transform: `translate(-10px, -50px) ${isActionActive ? 'rotate(30deg)' : 'rotate(0deg)'}`
                                    }}
                                >
                                    <RedWateringCan size={100} className="drop-shadow-2xl" />
                                    {isActionActive && (
                                        <div className="absolute right-0 top-12 flex gap-1 z-10" style={{ transform: 'translateX(20px)' }}>
                                            <div className="w-2 h-2 bg-blue-400 rounded-full water-drop"></div>
                                            <div className="w-2 h-2 bg-blue-300 rounded-full water-drop" style={{animationDelay: '0.1s'}}></div>
                                            <div className="w-2 h-2 bg-blue-500 rounded-full water-drop" style={{animationDelay: '0.2s'}}></div>
                                            <div className="w-2 h-2 bg-blue-200 rounded-full water-drop"></div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* --- 小白菜種子層 --- */}
                            {isBokchoy && (stage === GAME_STAGES.PLANTING || stage === GAME_STAGES.COVERING) && scatterSeeds.map(seed => (
                                <div 
                                    key={seed.id}
                                    className="absolute w-3 h-3 bg-yellow-200 rounded-full seed-glow transition-all z-10"
                                    style={{ left: seed.x, top: seed.y, transform: 'translate(-50%, -50%)' }}
                                ></div>
                            ))}

                            {/* --- 番茄洞口與種子層 --- */}
                            {!isBokchoy && (stage === GAME_STAGES.PLANTING || stage === GAME_STAGES.COVERING) && tomatoHoles.map(hole => (
                                <div 
                                    key={hole.id}
                                    onClick={() => handleHoleClick(hole.id)}
                                    className={`absolute w-24 h-24 md:w-32 md:h-32 rounded-full border-4 transition-all duration-500 flex items-center justify-center flex-wrap gap-1 p-4
                                        ${hole.state === 'flat' ? 'border-dashed border-white/50 bg-black/10 hover:bg-black/20' : ''}
                                        ${hole.state === 'dug' || hole.state === 'seeded' ? 'border-amber-900/50 bg-[#2d1b15] shadow-[inset_0_8px_16px_rgba(0,0,0,0.8)] scale-95' : ''}
                                        ${hole.state === 'covered' ? 'border-transparent bg-[#5D4037] scale-105 shadow-lg' : ''}
                                        ${stage === GAME_STAGES.COVERING && hole.state !== 'covered' ? 'cursor-pointer hover:scale-105 z-30' : ''}
                                    `}
                                    style={{ left: `${hole.x}%`, top: `${hole.y}%`, transform: 'translate(-50%, -50%)' }}
                                >
                                    {hole.state === 'flat' && stage === GAME_STAGES.PLANTING && (
                                        <div className="flex flex-col items-center justify-center animate-pulse pointer-events-none">
                                            <Plus size={40} className="text-white drop-shadow-lg mb-1" strokeWidth={4} />
                                            <div className="text-white font-bold bg-black/30 px-2 py-0.5 rounded-full text-xs md:text-sm backdrop-blur-sm">吸管壓洞</div>
                                        </div>
                                    )}
                                    
                                    {hole.state !== 'covered' && Array.from({ length: hole.seeds }).map((_, i) => (
                                        <div key={i} className="w-3 h-3 md:w-4 md:h-4 bg-yellow-200 rounded-full seed-glow"></div>
                                    ))}

                                    {(hole.state === 'dug' || hole.state === 'seeded') && stage === GAME_STAGES.PLANTING && (
                                        <div className="absolute -bottom-8 bg-white/80 px-2 rounded text-sm font-bold pointer-events-none">
                                            {hole.seeds} 顆
                                        </div>
                                    )}
                                    
                                    {stage === GAME_STAGES.COVERING && hole.state !== 'covered' && (
                                        <div className="absolute -top-10 animate-bounce text-amber-100 text-3xl drop-shadow-md pointer-events-none">👇</div>
                                    )}
                                </div>
                            ))}

                             {/* --- 成功畫面 --- */}
                             {stage === GAME_STAGES.SUCCESS && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/50">
                                    <div className="bg-white p-8 rounded-3xl shadow-2xl text-center transform scale-110">
                                        <div className="text-6xl mb-4 animate-bounce">🌱</div>
                                        <h2 className="text-4xl font-bold text-green-600 mb-2">大成功！</h2>
                                        <p className="text-xl text-gray-600 mb-6">你已經完美掌握{selectedVeggie.method}與澆水技巧了！</p>
                                        <div className="flex justify-center gap-4">
                                            <button 
                                                onClick={resetGame}
                                                className="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2"
                                            >
                                                <RefreshCcw size={20} /> 再玩一次
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-screen w-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-green-50">
                    {stage === GAME_STAGES.MENU && renderMainMenu()}
                    {stage === GAME_STAGES.TUTORIAL && renderTutorial()}
                    {(stage === GAME_STAGES.PLANTING || stage === GAME_STAGES.COVERING || stage === GAME_STAGES.WATERING || stage === GAME_STAGES.SUCCESS) && renderGameArea()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="home-button.js"></script>
</body>
</html>
