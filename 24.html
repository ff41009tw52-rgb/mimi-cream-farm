<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水的三態魔法保衛戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body { font-family: 'Noto Sans TC', sans-serif; touch-action: manipulation; }
        
        .bounce-click:active { transform: scale(0.92); }
        
        /* 魔法星空背景特效 */
        .magic-bg {
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* 抖動特效 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .shake-it { animation: shake 0.3s ease-in-out; }

        /* 水晶發光特效 */
        @keyframes crystal-pulse {
            0%, 100% { filter: drop-shadow(0 0 10px #c084fc); transform: translateY(0); }
            50% { filter: drop-shadow(0 0 25px #e879f9); transform: translateY(-5px); }
        }
        .crystal-anim { animation: crystal-pulse 2s infinite ease-in-out; }

        /* --- 魔物本體設計 --- */
        .monster-body {
            border-radius: 50% 50% 20% 20%;
            transition: all 0.3s ease-out;
            position: relative;
        }
        
        /* 惡魔的角 */
        .monster-horn {
            position: absolute;
            top: -6px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid #cbd5e1; 
            z-index: -1;
        }
        .horn-left { left: 10px; transform: rotate(-25deg); }
        .horn-right { right: 10px; transform: rotate(25deg); }

        /* Boss 受傷閃爍特效 */
        .boss-hurt .monster-body { animation: boss-hurt-anim 0.3s ease-out; }
        @keyframes boss-hurt-anim {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(0.9); filter: brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(3); }
        }

        /* --- 專屬魔法受擊特效 --- */
        .effect-融化 .speech-bubble { opacity: 0; transition: 0.2s; }
        .effect-融化 .monster-body { animation: melt-anim 0.6s forwards; }
        @keyframes melt-anim {
            0% { transform: scale(1); }
            40% { transform: scale(1.3, 0.5) translateY(20px); background-color: #ef4444; border-radius: 50% 50% 40% 40%; }
            100% { transform: scale(1.8, 0) translateY(40px); background-color: #f97316; opacity: 0; }
        }

        .effect-凝固 .speech-bubble { opacity: 0; transition: 0.2s; }
        .effect-凝固 .monster-body { animation: freeze-anim 0.6s forwards; }
        @keyframes freeze-anim {
            0% { }
            30% { transform: scale(1.05); background-color: #bae6fd; box-shadow: 0 0 20px #38bdf8; border-radius: 10%; border: 4px solid #e0f2fe; }
            100% { transform: scale(1.05); background-color: #bae6fd; box-shadow: 0 0 20px #38bdf8; border-radius: 10%; border: 4px solid #e0f2fe; opacity: 0; }
        }

        .effect-蒸發 .speech-bubble { opacity: 0; transition: 0.2s; }
        .effect-蒸發 .monster-body { animation: evaporate-anim 0.6s forwards; }
        @keyframes evaporate-anim {
            0% { }
            30% { transform: translateY(-20px) scale(1.1); opacity: 0.3; background-color: transparent; box-shadow: none; border-radius: 50%; filter: blur(1px); }
            100% { transform: translateY(-60px) scale(1.5); opacity: 0; background-color: transparent; filter: blur(4px); }
        }

        .effect-凝結 .speech-bubble { opacity: 0; transition: 0.2s; }
        .effect-凝結 .monster-body { animation: condense-anim 0.6s forwards; }
        @keyframes condense-anim {
            0% { }
            40% { transform: scale(0.6); background-color: #3b82f6; border-radius: 50% 50% 50% 50%; box-shadow: inset 0 0 15px #1d4ed8; border: 2px solid #93c5fd; }
            100% { transform: scale(0.1) translateY(80px); background-color: #1e40af; opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center select-none overflow-hidden">

    <div class="w-full max-w-5xl mx-auto h-[100dvh] border-0 md:border-x-4 border-fuchsia-900 bg-slate-900 shadow-[0_0_40px_rgba(76,29,149,0.5)] flex flex-col relative magic-bg" id="game-container">
        
        <div id="overlay-screen" class="absolute inset-0 z-50 bg-slate-900/95 backdrop-blur-md flex flex-col items-center justify-center p-4 md:p-6 text-center transition-opacity duration-300 overflow-y-auto">
            <div class="my-auto flex flex-col items-center justify-center w-full max-w-lg">
                <h1 id="overlay-title" class="text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-fuchsia-400 to-cyan-400 mb-6 drop-shadow-lg leading-tight">
                    魔法水晶保衛戰
                </h1>
                
                <div id="overlay-desc" class="text-slate-300 text-xl md:text-2xl mb-8 leading-relaxed w-full">
                    <div class="bg-slate-800/80 border-2 border-cyan-500/50 rounded-3xl p-6 md:p-8 mb-2 text-left shadow-[0_0_15px_rgba(6,182,212,0.3)] w-full">
                        <h2 class="text-cyan-400 font-bold text-3xl mb-4 flex items-center justify-center">💡 遊戲說明</h2>
                        <ul class="text-slate-200 text-lg md:text-xl space-y-3 list-disc pl-6">
                            <li>魔物會<span class="text-cyan-300 font-bold">隨機掉落</span>，點擊正確的魔法元素擊退它們！</li>
                            <li>⚠️ <span class="text-rose-400 font-bold">施展錯誤魔法會扣除 1 隻擊退數</span>！</li>
                            <li><span class="text-yellow-300 font-bold">最後一關會有巨大史萊姆王</span>，必須連續答對多題才能消滅牠！</li>
                        </ul>
                    </div>
                </div>

                <!-- 難度選擇區 -->
                <div id="settings-box" class="w-full max-w-sm bg-slate-800/80 p-4 rounded-xl border border-fuchsia-500/30 mb-6 flex flex-col items-center gap-3">
                    <span class="text-cyan-300 font-bold text-lg md:text-xl">選擇挑戰難度</span>
                    <div class="flex items-center justify-center w-full gap-4">
                        <button id="btn-normal" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition border-2 border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.4)]" onclick="setDifficulty(15)">
                            普通模式<br><span class="text-sm">(目標: 15隻)</span>
                        </button>
                        <button id="btn-hard" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-4 rounded-xl transition border-2 border-slate-500" onclick="setDifficulty(30)">
                            困難模式<br><span class="text-sm">(目標: 30隻)</span>
                        </button>
                    </div>
                </div>

                <div id="final-score-box" class="hidden mb-6 bg-slate-800/80 p-8 rounded-3xl border border-fuchsia-500/30 w-full max-w-sm">
                    <span class="block text-slate-300 text-xl md:text-2xl mb-2" id="final-msg">本次擊退魔物</span>
                    <div>
                        <span id="final-score" class="text-8xl font-black text-cyan-400 drop-shadow-md">0</span>
                        <span class="text-slate-300 text-4xl ml-2">隻</span>
                    </div>
                </div>

                <div class="flex flex-col items-center gap-5 mt-2 w-full">
                    <button id="start-btn" class="bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 text-white font-black text-3xl py-6 px-14 rounded-full shadow-[0_0_25px_rgba(192,132,252,0.6)] transition bounce-click w-full max-w-sm" onclick="startGame()">
                        開始守護 🔮
                    </button>
                    <a href="index.html" class="inline-flex items-center justify-center text-slate-400 hover:text-fuchsia-300 transition text-lg py-3 px-6 border border-transparent hover:border-fuchsia-800 rounded-full bg-slate-800/50">
                        ◀ 結束挑戰並返回農場
                    </a>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center px-6 py-4 z-30 bg-slate-900/80 backdrop-blur-md border-b border-fuchsia-800/50">
            <div class="flex items-center space-x-2" id="hearts-container">
                <span class="text-4xl drop-shadow-md">❤️</span><span class="text-4xl drop-shadow-md">❤️</span><span class="text-4xl drop-shadow-md">❤️</span>
            </div>
            
            <div class="flex-1 mx-6 max-w-sm relative hidden md:block">
                <div id="progress-target-text" class="text-base text-fuchsia-300 text-center mb-1.5 font-bold tracking-wide">過關進度 (包含最終Boss)</div>
                <div class="w-full bg-slate-700 rounded-full h-3">
                    <div class="bg-cyan-400 h-3 rounded-full transition-all duration-300" id="progress-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="text-right">
                <div class="text-fuchsia-300 text-base md:text-lg font-bold tracking-wider mb-0.5">打倒魔物</div>
                <div id="score-display" class="text-4xl md:text-5xl font-black text-cyan-400 drop-shadow-[0_0_5px_rgba(34,211,238,0.8)]">0</div>
            </div>
        </div>

        <div class="flex-1 relative overflow-hidden" id="play-area">
            <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 z-10 text-center" id="crystal-container">
                <div class="text-[6rem] crystal-anim" id="crystal">🔮</div>
                <div class="absolute w-32 h-6 bg-fuchsia-500/20 blur-md rounded-full -bottom-1 left-1/2 transform -translate-x-1/2"></div>
            </div>
        </div>

        <div class="h-auto bg-slate-950 p-4 md:p-5 pb-6 border-t-2 border-fuchsia-900 z-30">
            <div class="grid grid-cols-4 gap-2 md:gap-4">
                <button class="spell-btn relative bg-gradient-to-br from-rose-900 to-slate-800 hover:from-rose-800 border border-rose-500/50 text-rose-200 font-bold py-4 md:py-6 rounded-2xl shadow-inner transition bounce-click flex flex-col items-center justify-center gap-2" onclick="castSpell('融化')">
                    <span class="text-3xl md:text-5xl drop-shadow-md">🔥</span><span class="tracking-widest text-base md:text-xl font-black">融化</span>
                </button>
                <button class="spell-btn relative bg-gradient-to-br from-sky-900 to-slate-800 hover:from-sky-800 border border-sky-500/50 text-sky-200 font-bold py-4 md:py-6 rounded-2xl shadow-inner transition bounce-click flex flex-col items-center justify-center gap-2" onclick="castSpell('凝固')">
                    <span class="text-3xl md:text-5xl drop-shadow-md">❄️</span><span class="tracking-widest text-base md:text-xl font-black">凝固</span>
                </button>
                <button class="spell-btn relative bg-gradient-to-br from-slate-700 to-slate-800 hover:from-slate-600 border border-slate-400/50 text-slate-200 font-bold py-4 md:py-6 rounded-2xl shadow-inner transition bounce-click flex flex-col items-center justify-center gap-2" onclick="castSpell('蒸發')">
                    <span class="text-3xl md:text-5xl drop-shadow-md text-slate-300 flex items-center justify-center">
                        <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 2" stroke-linecap="round" stroke-linejoin="round" class="opacity-75">
                            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
                            <path d="M13 10.5a3.5 3.5 0 0 0-5 3"></path>
                        </svg>
                    </span>
                    <span class="tracking-widest text-base md:text-xl font-black">蒸發</span>
                </button>
                <button class="spell-btn relative bg-gradient-to-br from-teal-900 to-slate-800 hover:from-teal-800 border border-teal-500/50 text-teal-200 font-bold py-4 md:py-6 rounded-2xl shadow-inner transition bounce-click flex flex-col items-center justify-center gap-2" onclick="castSpell('凝結')">
                    <span class="text-3xl md:text-5xl drop-shadow-md">💧</span><span class="tracking-widest text-base md:text-xl font-black">凝結</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        let TARGET_MONSTERS = 15; // 預設普通難度：14隻小怪 + 1隻Boss
        let lastSpawnedAnswer = ""; 
        
        const questionBank = [
            { text: "冰塊放在桌上變成水", ans: "融化", icon: "🧊" },
            { text: "冷飲瓶外面布滿小水珠", ans: "凝結", icon: "🥤" },
            { text: "水壺燒開後有透明無色的氣體跑出", ans: "蒸發", icon: "🫖" },
            { text: "果汁放進冷凍庫變成冰棒", ans: "凝固", icon: "🍧" },
            { text: "裝水的容器放幾天後水變少", ans: "蒸發", icon: "🪣" },
            { text: "空氣裡的水蒸氣遇冷變水珠", ans: "凝結", icon: "🌧️" },
            { text: "巧克力遇熱變軟", ans: "融化", icon: "🍫" },
            { text: "水溫低於0℃結成冰", ans: "凝固", icon: "🌡️" },
            { text: "吹風機把溼頭髮吹乾", ans: "蒸發", icon: "💨" },
            { text: "吃熱麵時，眼鏡鏡片變得霧霧的", ans: "凝結", icon: "👓" },
            { text: "裝熱湯的鍋蓋上有很多小水珠", ans: "凝結", icon: "🍲" },
            { text: "撐開溼雨傘放在旁邊晾乾", ans: "蒸發", icon: "☔" },
            { text: "天冷呵氣時，嘴巴吐出白煙", ans: "凝結", icon: "🗣️" },
            { text: "冰塊加入熱紅茶後變小不見了", ans: "融化", icon: "☕" },
            { text: "太陽把地上的積水晒乾", ans: "蒸發", icon: "☀️" },
            { text: "冬天窗戶玻璃上出現小水珠", ans: "凝結", icon: "🪟" }
        ];

        const monsterColors = ['bg-purple-500', 'bg-rose-500', 'bg-emerald-500', 'bg-amber-500', 'bg-indigo-500'];
        const spellIcons = { 
            '融化': '🔥', 
            '凝固': '❄️', 
            '蒸發': '<svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 2" stroke-linecap="round" stroke-linejoin="round" class="opacity-75"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><path d="M13 10.5a3.5 3.5 0 0 0-5 3"></path></svg>', 
            '凝結': '💧' 
        };

        let isPlaying = false;
        let defeatedCount = 0;
        let lives = 3;
        
        let activeEnemies = [];
        let isBossActive = false;
        let animationFrameId;
        let lastTime = 0;
        let spawnTimer = 0;

        const uiScore = document.getElementById('score-display');
        const uiHearts = document.getElementById('hearts-container');
        const progressBar = document.getElementById('progress-bar');
        const playArea = document.getElementById('play-area');
        const overlayScreen = document.getElementById('overlay-screen');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const finalScoreBox = document.getElementById('final-score-box');
        const finalScoreText = document.getElementById('final-score');
        const finalMsg = document.getElementById('final-msg');
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');
        const settingsBox = document.getElementById('settings-box');
        const btnNormal = document.getElementById('btn-normal');
        const btnHard = document.getElementById('btn-hard');

        function setDifficulty(target) {
            TARGET_MONSTERS = target;
            if (target === 15) {
                btnNormal.className = "flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl transition border-2 border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.4)]";
                btnHard.className = "flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-4 rounded-xl transition border-2 border-slate-500";
            } else {
                btnNormal.className = "flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-4 rounded-xl transition border-2 border-slate-500";
                btnHard.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 px-4 rounded-xl transition border-2 border-rose-400 shadow-[0_0_15px_rgba(225,29,72,0.4)]";
            }
        }

        function startGame() {
            document.getElementById('progress-target-text').innerText = `過關進度 (目標: ${TARGET_MONSTERS}隻)`;

            defeatedCount = 0;
            lives = 3;
            spawnTimer = 2000; 
            isPlaying = true;
            isBossActive = false;
            lastSpawnedAnswer = ""; 
            activeEnemies.forEach(e => e.el.remove()); 
            activeEnemies = [];
            
            updateScoreUI();
            updateLivesUI();
            
            overlayScreen.classList.add('opacity-0', 'pointer-events-none');
            finalScoreBox.classList.add('hidden');
            settingsBox.classList.add('hidden');
            
            lastTime = performance.now();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function getUniqueQuestion() {
            let availableQuestions = questionBank.filter(q => q.ans !== lastSpawnedAnswer);
            if (availableQuestions.length === 0) availableQuestions = questionBank; 
            const q = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
            lastSpawnedAnswer = q.ans; 
            return q;
        }

        function createEnemy() {
            let targetX;
            let attempts = 0;
            let isOverlapping = true;
            while (isOverlapping && attempts < 10) {
                targetX = 15 + Math.random() * 70; 
                isOverlapping = activeEnemies.some(e => e.y < 160 && Math.abs(e.x - targetX) < 25);
                attempts++;
            }

            const q = getUniqueQuestion();
            const color = monsterColors[Math.floor(Math.random() * monsterColors.length)];
            const el = document.createElement('div');
            
            el.className = 'enemy-container absolute transform -translate-x-1/2 flex flex-col items-center z-20';
            el.style.left = `${targetX}%`;
            el.innerHTML = `
                <div class="speech-bubble bg-slate-100 text-slate-900 font-bold text-[14px] leading-snug text-center p-3 rounded-xl shadow-md mb-2 relative w-36 md:w-52 z-20 border-2 border-slate-300">
                    ${q.text}
                    <div class="absolute -bottom-1.5 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-slate-100 border-b-2 border-r-2 border-slate-300 rotate-45"></div>
                </div>
                <div class="monster-body w-16 h-16 md:w-20 md:h-20 ${color} relative flex items-center justify-center text-3xl md:text-4xl shadow-[0_5px_15px_rgba(0,0,0,0.4)] border-2 border-slate-700/30">
                    <div class="monster-horn horn-left"></div>
                    <div class="monster-horn horn-right"></div>
                    <span class="z-10 drop-shadow-md mt-2 opacity-90">${q.icon}</span>
                    <div class="absolute top-3 left-3.5 w-4 h-4 bg-white rounded-full flex justify-center items-center shadow-inner"><div class="w-2 h-2 bg-slate-900 rounded-full mt-0.5"></div></div>
                    <div class="absolute top-3 right-3.5 w-4 h-4 bg-white rounded-full flex justify-center items-center shadow-inner"><div class="w-2 h-2 bg-slate-900 rounded-full mt-0.5"></div></div>
                </div>
            `;
            playArea.appendChild(el);
            return { el, y: -140, x: targetX, q, isDying: false, isBoss: false, hp: 1 };
        }

        function spawnBoss() {
            isBossActive = true;
            const q = getUniqueQuestion();

            const el = document.createElement('div');
            el.className = 'enemy-container absolute transform -translate-x-1/2 flex flex-col items-center z-20';
            el.style.left = `50%`; 

            let hpStars = Array(5).fill('⭐').join('');

            el.innerHTML = `
                <div class="speech-bubble bg-slate-100 text-slate-900 font-bold text-[16px] md:text-xl leading-snug text-center p-4 rounded-2xl shadow-[0_0_20px_rgba(232,121,249,0.8)] mb-3 relative w-56 md:w-72 z-20 border-4 border-fuchsia-400">
                    <div class="boss-hp text-lg text-yellow-400 mb-2 drop-shadow flex justify-center gap-1">${hpStars}</div>
                    <div class="boss-q-text">${q.text}</div>
                    <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-5 h-5 bg-slate-100 border-b-4 border-r-4 border-fuchsia-400 rotate-45"></div>
                </div>
                <div class="monster-body w-28 h-28 md:w-36 md:h-36 bg-purple-700 relative flex items-center justify-center text-5xl md:text-6xl shadow-[0_15px_35px_rgba(147,51,234,0.6)] border-4 border-fuchsia-400">
                    <div class="monster-horn horn-left" style="border-bottom: 24px solid #ef4444; top: -12px; left: 15px;"></div>
                    <div class="monster-horn horn-right" style="border-bottom: 24px solid #ef4444; top: -12px; right: 15px;"></div>
                    <span class="boss-icon z-10 drop-shadow-xl mt-3 opacity-95">${q.icon}</span>
                    <div class="absolute top-5 left-5 w-6 h-6 bg-white rounded-full flex justify-center items-center shadow-inner"><div class="w-3 h-3 bg-rose-900 rounded-full mt-1"></div></div>
                    <div class="absolute top-5 right-5 w-6 h-6 bg-white rounded-full flex justify-center items-center shadow-inner"><div class="w-3 h-3 bg-rose-900 rounded-full mt-1"></div></div>
                </div>
            `;
            playArea.appendChild(el);
            activeEnemies.push({ el, y: -250, x: 50, q, isDying: false, isBoss: true, hp: 5 });
        }

        function gameLoop(currentTime) {
            if (!isPlaying) return;

            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            spawnTimer += deltaTime;

            let currentSpeed = 0.45 + (defeatedCount * 0.008); 

            // Bug 修復：判斷分數是否已達到「召喚Boss的門檻」
            // 讓小怪不再產出，並等待畫面上小怪清空後，召喚巨大史萊姆王
            if (defeatedCount >= TARGET_MONSTERS - 1) {
                if (!isBossActive && activeEnemies.length === 0) {
                    spawnBoss();
                }
            } else {
                let maxEnemies = 1 + Math.floor(defeatedCount / 5);
                maxEnemies = Math.min(3, maxEnemies);
                let currentSpawnInterval = Math.max(1200, 3000 - (defeatedCount * 80));

                if (spawnTimer >= currentSpawnInterval) {
                    spawnTimer = 0;
                    if (activeEnemies.length < maxEnemies) {
                        const newEnemy = createEnemy();
                        if (newEnemy) activeEnemies.push(newEnemy);
                    }
                }
            }

            const playAreaHeight = playArea.clientHeight;
            const hitZone = playAreaHeight - 120; 

            for (let i = activeEnemies.length - 1; i >= 0; i--) {
                let enemy = activeEnemies[i];
                if (enemy.isDying) continue;

                if (enemy.isBoss) {
                    enemy.y += currentSpeed * 0.22 * (deltaTime / 16);
                } else {
                    enemy.y += currentSpeed * (deltaTime / 16);
                }
                
                enemy.el.style.top = enemy.y + 'px';

                if (enemy.y > hitZone) {
                    takeDamage();
                    if (enemy.isBoss) {
                        enemy.y = 20; 
                    } else {
                        enemy.el.remove();
                        activeEnemies.splice(i, 1);
                    }
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function castSpell(spellName) {
            if (!isPlaying) return;

            const validEnemies = activeEnemies.filter(e => e.q.ans === spellName && !e.isDying);
            
            if (validEnemies.length > 0) {
                validEnemies.sort((a, b) => b.y - a.y);
                const targetEnemy = validEnemies[0];
                targetEnemy.isDying = true; 

                shootProjectile(spellIcons[spellName], targetEnemy, spellName);

            } else {
                // 防呆機制：若有 Boss 存在，最低扣分到 TARGET_MONSTERS - 1，避免退回小怪關
                if (isBossActive) {
                    defeatedCount = Math.max(TARGET_MONSTERS - 1, defeatedCount - 1);
                } else {
                    defeatedCount = Math.max(0, defeatedCount - 1);
                }
                updateScoreUI();
                
                gameContainer.classList.add('shake-it');
                document.body.style.backgroundColor = '#4c0519'; 
                setTimeout(() => {
                    gameContainer.classList.remove('shake-it');
                    document.body.style.backgroundColor = '';
                }, 300);
            }
        }

        function shootProjectile(icon, targetEnemy, spellName) {
            const proj = document.createElement('div');
            proj.innerHTML = icon;
            proj.className = 'absolute left-1/2 bottom-12 transform -translate-x-1/2 text-5xl md:text-6xl z-30 filter drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]' + (spellName === '蒸發' ? ' text-slate-200' : '');
            playArea.appendChild(proj);

            const targetY = targetEnemy.isBoss ? targetEnemy.y + 80 : targetEnemy.y + 55; 
            const playAreaHeight = playArea.clientHeight;
            const playAreaWidth = playArea.clientWidth;
            const startY = playAreaHeight - 80;
            const targetX_px = (targetEnemy.x - 50) / 100 * playAreaWidth;

            const anim = proj.animate([
                { transform: `translate(-50%, 0) scale(0.5)`, opacity: 1 },
                { transform: `translate(calc(-50% + ${targetX_px}px), -${startY - targetY}px) scale(1.5) rotate(360deg)`, opacity: 1 }
            ], { duration: 300, easing: 'ease-in' });

            anim.onfinish = () => {
                proj.remove();

                if (targetEnemy.isBoss) {
                    targetEnemy.hp--;
                    
                    if (targetEnemy.hp > 0) {
                        targetEnemy.isDying = false; 
                        
                        const newQ = getUniqueQuestion();
                        targetEnemy.q = newQ;
                        
                        let hpStars = Array(targetEnemy.hp).fill('⭐').join('');
                        targetEnemy.el.querySelector('.boss-hp').innerHTML = hpStars;
                        targetEnemy.el.querySelector('.boss-q-text').innerHTML = newQ.text;
                        targetEnemy.el.querySelector('.boss-icon').innerHTML = newQ.icon;

                        targetEnemy.el.classList.add('boss-hurt');
                        setTimeout(() => targetEnemy.el.classList.remove('boss-hurt'), 300);

                    } else {
                        defeatedCount++;
                        updateScoreUI();
                        targetEnemy.el.classList.add(`effect-${spellName}`);
                        setTimeout(() => {
                            targetEnemy.el.remove();
                            activeEnemies = activeEnemies.filter(e => e !== targetEnemy);
                            isBossActive = false;
                            checkWinCondition(); 
                        }, 600); 
                    }
                } else {
                    // Bug 修復：確保小怪死亡只會加分到出王門檻，避免直接通關
                    if (defeatedCount < TARGET_MONSTERS - 1) {
                        defeatedCount++;
                    }
                    updateScoreUI();
                    targetEnemy.el.classList.add(`effect-${spellName}`);
                    
                    setTimeout(() => {
                        targetEnemy.el.remove();
                        activeEnemies = activeEnemies.filter(e => e !== targetEnemy);
                    }, 600); 
                }
            };
        }

        function takeDamage() {
            lives--;
            updateLivesUI();
            
            gameContainer.classList.add('shake-it');
            document.body.style.backgroundColor = '#4c0519'; 
            
            setTimeout(() => {
                gameContainer.classList.remove('shake-it');
                document.body.style.backgroundColor = '';
            }, 300);

            if (lives <= 0) endGame(false);
        }

        function updateScoreUI() {
            uiScore.innerText = defeatedCount;
            const progress = Math.min(100, (defeatedCount / TARGET_MONSTERS) * 100);
            progressBar.style.width = `${progress}%`;
        }

        function updateLivesUI() {
            let heartsHtml = '';
            for (let i = 0; i < lives; i++) heartsHtml += '<span class="text-4xl drop-shadow-md">❤️</span>';
            for (let i = lives; i < 3; i++) heartsHtml += '<span class="text-4xl drop-shadow-md opacity-30 grayscale">🖤</span>';
            uiHearts.innerHTML = heartsHtml;
        }

        function checkWinCondition() {
            if (defeatedCount >= TARGET_MONSTERS && isPlaying) {
                endGame(true);
            }
        }

        function endGame(isWin) {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            
            if (isWin) {
                overlayTitle.innerText = "🌟 守護成功 🌟";
                overlayTitle.className = "text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-emerald-400 mb-6 drop-shadow-lg leading-tight";
                overlayDesc.innerHTML = "太厲害了！你完全掌握了水的三態變化，<br>成功消滅了巨大史萊姆王！";
                finalMsg.innerText = "成功擊退魔物";
                finalScoreText.classList.replace('text-cyan-400', 'text-yellow-400');
                startBtn.innerText = "再次挑戰傳說 🏆";
            } else {
                overlayTitle.innerText = "水晶魔力耗盡...";
                overlayTitle.className = "text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-orange-500 mb-6 drop-shadow-lg leading-tight";
                overlayDesc.innerHTML = "魔物太多了！別灰心，<br>再複習一下「溫度變化」下次一定能過關！";
                finalMsg.innerText = "本次擊退魔物";
                finalScoreText.classList.replace('text-yellow-400', 'text-cyan-400');
                startBtn.innerText = "重新防禦 🛡️";
            }
            
            finalScoreText.innerText = defeatedCount;
            finalScoreBox.classList.remove('hidden');
            settingsBox.classList.remove('hidden');
            overlayScreen.classList.remove('opacity-0', 'pointer-events-none');
        }

    </script>
</body>
