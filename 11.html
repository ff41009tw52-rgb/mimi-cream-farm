<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔬菜分類大挑戰 - 橘咪咪與白奶油(聖誕版)</title>
    
    <!-- 1. 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- 2. 引入 Babel (讓瀏覽器看懂 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 3. 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 補充動畫樣式 */
        @keyframes conveyor {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .animate-conveyor {
            animation: conveyor 2s linear infinite;
        }
        .animate-bounce-gentle {
            animation: bounce-gentle 2s infinite;
        }
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0) scale(1.0); }
            50% { transform: translateY(-5px) scale(1.0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        /* 自定義字型 */
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-green-50 to-blue-100 overflow-hidden">
    
    <div id="root"></div>

    <script type="text/babel">
        // --- 內建圖示元件 (取代 lucide-react) ---
        // 為了讓單一檔案運作，我們手動定義這些 SVG 圖示
        const IconBase = ({ d, size = 24, className = "", ...props }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {d}
            </svg>
        );

        // 修正：多個路徑元素必須用 Fragment (<>...</>) 包裹
        const Play = (props) => <IconBase d={<polygon points="5 3 19 12 5 21 5 3" />} {...props} />;
        const RotateCcw = (props) => <IconBase d={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></>} {...props} />;
        const BookOpen = (props) => <IconBase d={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></>} {...props} />;
        const Star = (props) => <IconBase d={<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />} {...props} />;
        const CheckCircle = (props) => <IconBase d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></>} {...props} />;
        const XCircle = (props) => <IconBase d={<><circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" /></>} {...props} />;
        const Info = (props) => <IconBase d={<><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></>} {...props} />;
        const ChevronRight = (props) => <IconBase d={<polyline points="9 18 15 12 9 6" />} {...props} />;
        
        // --- 遊戲邏輯與資料 (完全移植自原版) ---
        const { useState, useEffect, useRef } = React;

        const VEGETABLE_DATA = [
            { id: 'v1', name: '蘿蔔', category: '根', icon: '🥕', hint: '雖然長得粗粗的，但它是根喔！' },
            { id: 'v2', name: '馬鈴薯', category: '莖', icon: '🥔', hint: '小心！它長在土裡，但它是「塊莖」！' },
            { id: 'v3', name: '竹筍', category: '莖', icon: '🎍', hint: '它是從地下莖長出來的嫩莖。' },
            { id: 'v4', name: '小白菜', category: '葉', icon: '🥬', hint: '我們吃它綠綠的葉子。' },
            { id: 'v5', name: '菠菜', category: '葉', icon: '🍃', hint: '大力水手愛吃的葉子！' },
            { id: 'v6', name: '花椰菜', category: '花', icon: '🥦', hint: '一朵朵白白綠綠的，其實是花喔。' },
            { id: 'v7', name: '金針花', category: '花', icon: '🏵️', hint: '名字裡就有「花」字了！' },
            { id: 'v8', name: '番茄', category: '果實', icon: '🍅', hint: '花謝了之後長出來的果實。' },
            { id: 'v9', name: '南瓜', category: '果實', icon: '🎃', hint: '大大的果實，裡面有種子。' },
            { id: 'v10', name: '秋葵', category: '果實', icon: '🌟', hint: '切開像星星一樣的果實。' },
            { id: 'v11', name: '絲瓜', category: '果實', icon: '🥒', hint: '長長的瓜，是果實喔。' },
        ];

        const CATEGORIES = [
            { id: '根', color: 'bg-amber-600', textColor: 'text-amber-100', icon: '🥕' },
            { id: '莖', color: 'bg-yellow-600', textColor: 'text-yellow-100', icon: '🎍' },
            { id: '葉', color: 'bg-green-600', textColor: 'text-green-100', icon: '🍃' },
            { id: '花', color: 'bg-pink-500', textColor: 'text-pink-100', icon: '🌸' },
            { id: '果實', color: 'bg-red-500', textColor: 'text-red-100', icon: '🍎' },
        ];

        // --- 角色元件 (已更新為使用圖片) ---
        const Mascot = ({ type, emotion = 'happy', size = 'md', className = '' }) => {
            const isMimi = type === 'mimi';
            // 根據類型選擇對應的圖片路徑
            const imgSrc = isMimi ? 'Christmasmimi.jpg' : 'Christmascream.jpg';
            const sizePx = size === 'lg' ? 96 : size === 'md' ? 64 : 40;
            
            return (
                <div className={`flex flex-col items-center ${className} transform transition-all duration-300`}>
                <div className={`relative ${emotion === 'excited' ? 'animate-bounce' : ''}`}>
                    {/* 使用 img 標籤取代原本的 SVG Cat 元件 */}
                    <img 
                        src={imgSrc} 
                        alt={isMimi ? '橘咪咪' : '白奶油'}
                        width={sizePx}
                        height={sizePx}
                        className="drop-shadow-sm object-contain"
                    />
                    {emotion === 'excited' && <div className="absolute -top-2 -right-2 text-xl">✨</div>}
                    {emotion === 'sad' && <div className="absolute -top-2 -right-2 text-xl">💧</div>}
                </div>
                <span className={`font-bold mt-1 text-sm ${isMimi ? 'text-orange-700' : 'text-stone-600'} bg-white/80 px-2 py-0.5 rounded-full shadow-sm`}>
                    {isMimi ? '橘咪咪' : '白奶油'}
                </span>
                </div>
            );
        };

        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        // --- 主元件 ---
        function VegetableGame() {
            const [gameState, setGameState] = useState('menu'); 
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [gameQueue, setGameQueue] = useState([]);
            const [lastAnswerCorrect, setLastAnswerCorrect] = useState(false);
            
            const startGame = () => {
                const queue = shuffleArray([...VEGETABLE_DATA]); 
                setGameQueue(queue);
                setCurrentQuestionIndex(0);
                setScore(0);
                setGameState('playing');
            };

            const handleAnswer = (category) => {
                const currentItem = gameQueue[currentQuestionIndex];
                const isCorrect = currentItem.category === category;
                
                setLastAnswerCorrect(isCorrect);
                if (isCorrect) {
                setScore(s => s + 10);
                }
                
                setGameState('feedback');
                
                setTimeout(() => {
                if (currentQuestionIndex < gameQueue.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setGameState('playing');
                } else {
                    setGameState('gameover');
                }
                }, 2500); 
            };

            // 1. 選單畫面
            const MenuView = () => (
                <div className="flex flex-col items-center justify-center h-full space-y-6 animate-fade-in text-center p-4 relative z-10">
                <div className="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-2xl border-4 border-green-500 max-w-lg w-full relative">
                    <div className="absolute -top-16 -left-4 transform -rotate-12">
                    <Mascot type="mimi" size="lg" emotion="excited" />
                    </div>
                    <div className="absolute -top-16 -right-4 transform rotate-12">
                    <Mascot type="butter" size="lg" emotion="happy" />
                    </div>

                    <h1 className="text-4xl md:text-5xl font-bold text-green-700 mb-2 mt-4 tracking-wider">
                    蔬菜分類大挑戰
                    </h1>
                    <p className="text-lg text-green-600 mb-8 font-medium bg-green-50 p-2 rounded-lg">
                    跟著橘咪咪和白奶油，<br/>一起認識蔬菜的部位吧！
                    </p>
                    
                    <div className="flex flex-col gap-4">
                    <button 
                        onClick={() => setGameState('learning')}
                        className="flex items-center justify-center gap-3 bg-blue-500 hover:bg-blue-600 text-white text-2xl font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 w-full group"
                    >
                        <BookOpen size={28} className="group-hover:animate-bounce" />
                        去預習教室找白奶油
                    </button>
                    
                    <button 
                        onClick={startGame}
                        className="flex items-center justify-center gap-3 bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 w-full group"
                    >
                        <Play size={28} className="group-hover:animate-pulse" />
                        和橘咪咪一起玩遊戲
                    </button>
                    </div>
                </div>
                <p className="text-green-800 font-bold opacity-70">三年級自然科數位教材</p>
                </div>
            );

            // 2. 預習教室
            const LearningView = () => (
                <div className="flex flex-col h-full overflow-hidden bg-white/95 rounded-xl max-w-4xl mx-auto w-full shadow-2xl my-4 relative">
                <div className="bg-blue-500 p-4 text-white flex justify-between items-center shadow-md shrink-0 z-20">
                    <h2 className="text-2xl font-bold flex items-center gap-2">
                    <BookOpen /> 預習教室
                    </h2>
                    <button 
                    onClick={startGame}
                    className="bg-green-400 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-full shadow transition flex items-center gap-2 animate-pulse"
                    >
                    我準備好了！ <ChevronRight />
                    </button>
                </div>

                <div className="flex-1 overflow-y-auto p-6 space-y-8 bg-blue-50 relative">
                    <div className="flex items-start gap-4 mb-2">
                    <Mascot type="mimi" size="md" className="shrink-0" />
                    <div className="bg-white p-4 rounded-r-2xl rounded-bl-2xl shadow-md border-l-4 border-orange-400 text-gray-700">
                        <p className="font-bold text-lg mb-1">橘咪咪說：</p>
                        嗨！我是橘咪咪。記住喔，像<span className="text-orange-600 font-bold">蘿蔔</span>和<span className="text-yellow-600 font-bold">馬鈴薯</span>都長在土裡，但是它們的部位不一樣喔！
                    </div>
                    </div>

                    {CATEGORIES.slice(0, 3).map(cat => (
                    <CategorySection key={cat.id} cat={cat} />
                    ))}

                    <div className="flex items-start gap-4 mb-2 flex-row-reverse">
                    <Mascot type="butter" size="md" className="shrink-0" />
                    <div className="bg-white p-4 rounded-l-2xl rounded-br-2xl shadow-md border-r-4 border-stone-400 text-gray-700 text-right">
                        <p className="font-bold text-lg mb-1">白奶油說：</p>
                        我是白奶油～有些蔬菜是<span className="text-pink-500 font-bold">花</span>或<span className="text-red-500 font-bold">果實</span>，通常長在地面上，顏色很漂亮呢！
                    </div>
                    </div>

                    {CATEGORIES.slice(3).map(cat => (
                    <CategorySection key={cat.id} cat={cat} />
                    ))}
                </div>
                </div>
            );

            const CategorySection = ({ cat }) => {
                const items = VEGETABLE_DATA.filter(v => v.category === cat.id);
                return (
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-blue-100 flex flex-col md:flex-row gap-4 items-start md:items-center transform transition hover:scale-[1.01]">
                    <div className={`${cat.color} ${cat.textColor} w-20 h-20 rounded-2xl flex flex-col items-center justify-center shrink-0 shadow-inner`}>
                    <span className="text-3xl mb-1">{cat.icon}</span>
                    <span className="text-xl font-bold">{cat.id}</span>
                    </div>
                    <div className="flex-1 w-full">
                    <div className="flex flex-wrap gap-3">
                        {items.map(item => (
                        <div key={item.id} className="flex flex-col items-center bg-gray-50 p-2 rounded-xl border border-gray-200 min-w-[70px]">
                            <span className="text-3xl mb-1 drop-shadow-sm">{item.icon}</span>
                            <span className="font-bold text-gray-700 text-sm">{item.name}</span>
                            {(item.name === '馬鈴薯' || item.name === '蘿蔔') && (
                            <span className="text-[10px] bg-red-100 text-red-600 px-1 rounded mt-1 font-bold animate-pulse">
                                注意!
                            </span>
                            )}
                        </div>
                        ))}
                    </div>
                    <div className="mt-2 text-sm text-gray-500">
                        {cat.id === '根' && '蘿蔔是根，會吸收水分。'}
                        {cat.id === '莖' && '馬鈴薯是塊莖，竹筍是嫩莖。'}
                        {cat.id === '葉' && '大多數綠色蔬菜都是葉子。'}
                        {cat.id === '花' && '花椰菜和金針花都是花。'}
                        {cat.id === '果實' && '番茄、南瓜裡面有種子，是果實。'}
                    </div>
                    </div>
                </div>
                );
            };

            // 3. 遊戲進行畫面
            const GameView = () => {
                const currentItem = gameQueue[currentQuestionIndex];

                return (
                <div className="flex flex-col h-full w-full max-w-4xl mx-auto py-2 px-2">
                    <div className="flex justify-between items-end bg-white/60 p-2 rounded-xl shadow-sm mb-2 mx-2">
                    <div className="flex items-center gap-2 transform translate-y-2">
                        <Mascot type="mimi" size="sm" emotion="excited" />
                        <div className="hidden md:block bg-white text-xs px-2 py-1 rounded-lg shadow border border-orange-200 text-orange-600 mb-4">
                        加油加油！
                        </div>
                    </div>

                    <div className="flex flex-col items-center">
                        <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow-md border-2 border-yellow-400">
                        <Star className="text-yellow-500 fill-yellow-500 w-6 h-6" />
                        <span className="text-2xl font-black text-yellow-600">{score}</span>
                        </div>
                        <span className="text-xs text-gray-500 font-bold mt-1">第 {currentQuestionIndex + 1} / {gameQueue.length} 題</span>
                    </div>

                    <div className="flex items-center gap-2 transform translate-y-2">
                        <div className="hidden md:block bg-white text-xs px-2 py-1 rounded-lg shadow border border-stone-200 text-stone-600 mb-4">
                        要看仔細喔~
                        </div>
                        <Mascot type="butter" size="sm" emotion="neutral" />
                    </div>
                    </div>

                    <div className="flex-1 relative flex flex-col items-center justify-center min-h-[250px]">
                    <div className="absolute top-1/2 left-0 w-full h-24 bg-gray-200 border-y-4 border-gray-300 transform -translate-y-1/2 overflow-hidden opacity-60">
                        <div className="w-[200%] h-full flex items-center animate-conveyor">
                            {Array.from({length: 20}).map((_, i) => (
                            <div key={i} className="w-4 h-full bg-gray-300/50 mx-8 transform -skew-x-12"></div>
                            ))}
                        </div>
                    </div>

                    <div className="z-10 bg-white p-6 md:p-8 rounded-full shadow-2xl border-8 border-white animate-bounce-gentle flex flex-col items-center transform scale-110 md:scale-125 hover:scale-130 transition cursor-pointer">
                        <span className="text-7xl md:text-8xl filter drop-shadow-md">{currentItem.icon}</span>
                        <span className="text-2xl md:text-3xl font-bold text-gray-800 mt-2 bg-white/90 px-4 py-1 rounded-full shadow-sm">{currentItem.name}</span>
                    </div>
                    </div>

                    <div className="grid grid-cols-5 gap-2 p-2 pb-6">
                    {CATEGORIES.map(cat => (
                        <button
                        key={cat.id}
                        onClick={() => handleAnswer(cat.id)}
                        className={`${cat.color} hover:brightness-110 active:scale-95 transition-all transform rounded-xl py-2 px-1 flex flex-col items-center justify-between h-28 md:h-32 shadow-lg border-b-4 border-black/10 group relative overflow-hidden`}
                        >
                        <div className="absolute top-0 left-0 w-full h-1 bg-white/30"></div>
                        <div className="bg-white/20 w-full flex-1 rounded-lg mb-1 border-2 border-white/30 border-dashed flex items-center justify-center group-hover:bg-white/30 transition-colors">
                            <span className="text-xl opacity-60 group-hover:opacity-100 transition-opacity">⬇️</span>
                        </div>
                        <span className={`${cat.textColor} font-bold text-lg md:text-2xl drop-shadow-sm`}>{cat.id}</span>
                        </button>
                    ))}
                    </div>
                </div>
                );
            };

            // 4. 回饋畫面
            const FeedbackOverlay = () => {
                const currentItem = gameQueue[currentQuestionIndex];
                
                return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
                    <div className={`bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center transform scale-100 md:scale-110 border-8 ${lastAnswerCorrect ? 'border-green-400' : 'border-red-400'} relative`}>
                    
                    <div className="absolute -top-12 left-1/2 transform -translate-x-1/2">
                        {lastAnswerCorrect ? (
                        <Mascot type="mimi" size="lg" emotion="excited" />
                        ) : (
                        <Mascot type="butter" size="lg" emotion="sad" />
                        )}
                    </div>

                    <div className="mt-8 mb-4">
                        <h2 className={`text-4xl font-bold mb-2 ${lastAnswerCorrect ? 'text-green-600' : 'text-red-500'}`}>
                        {lastAnswerCorrect ? '答對了！' : '哎呀，猜錯了'}
                        </h2>
                        <div className="text-sm text-gray-400 font-bold">
                        {lastAnswerCorrect ? '橘咪咪為你歡呼！' : '白奶油說：沒關係，學起來就好！'}
                        </div>
                    </div>

                    <div className="bg-gray-50 rounded-2xl p-6 mb-6 border-2 border-gray-100">
                        <div className="text-6xl mb-4 animate-bounce-gentle inline-block">{currentItem.icon}</div>
                        <p className="text-2xl text-gray-700 font-bold mb-2">
                        {currentItem.name} 是 <span className={`text-3xl mx-1 px-2 py-1 rounded ${lastAnswerCorrect ? 'bg-green-100 text-green-600' : 'bg-blue-100 text-blue-600'} underline decoration-wavy`}>{currentItem.category}</span>
                        </p>
                        <div className="flex items-start justify-center gap-2 mt-4 text-left bg-white p-3 rounded-xl shadow-sm">
                        <Info size={20} className="text-blue-400 shrink-0 mt-0.5" />
                        <p className="text-gray-600 font-medium">{currentItem.hint}</p>
                        </div>
                    </div>
                    </div>
                </div>
                );
            };

            // 5. 遊戲結束畫面
            const GameOverView = () => {
                let comment = "再接再厲！";
                if (score >= 100) comment = "太厲害了！";
                else if (score >= 80) comment = "很棒喔！";

                return (
                <div className="flex flex-col items-center justify-center h-full text-center p-4 animate-fade-in relative z-10">
                    <div className="bg-white p-8 md:p-12 rounded-3xl shadow-2xl max-w-lg w-full border-4 border-yellow-400 relative overflow-visible">
                    
                    <div className="absolute -top-10 left-4">
                        <Mascot type="mimi" size="md" emotion="excited" />
                    </div>
                    <div className="absolute -top-10 right-4">
                        <Mascot type="butter" size="md" emotion="happy" />
                    </div>

                    <h2 className="text-4xl font-bold text-gray-800 mb-2 mt-4">遊戲結束</h2>
                    <p className="text-gray-500 font-bold mb-6">本次成績</p>
                    
                    <div className="flex justify-center items-end gap-2 mb-8 bg-yellow-50 py-4 rounded-2xl">
                        <span className="text-8xl font-black text-yellow-500 drop-shadow-sm">{score}</span>
                        <span className="text-2xl text-gray-400 font-bold mb-4">分</span>
                    </div>

                    <h3 className="text-2xl font-bold text-green-600 mb-8">{comment}</h3>

                    <div className="flex flex-col gap-3">
                        <button 
                        onClick={startGame}
                        className="flex items-center justify-center gap-2 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 text-xl"
                        >
                        <RotateCcw /> 再玩一次
                        </button>
                        <button 
                        onClick={() => setGameState('menu')}
                        className="text-gray-400 hover:text-gray-600 font-bold py-2 underline"
                        >
                        回主畫面
                        </button>
                    </div>
                    </div>
                </div>
                );
            };

            return (
                <div className="w-full h-screen relative">
                    {/* 背景浮水印 */}
                    <div className="absolute top-10 left-10 text-6xl opacity-5 rotate-12 pointer-events-none">🥬</div>
                    <div className="absolute bottom-20 right-10 text-8xl opacity-5 -rotate-12 pointer-events-none">🥕</div>
                    
                    {gameState === 'menu' && <MenuView />}
                    {gameState === 'learning' && <LearningView />}
                    {(gameState === 'playing' || gameState === 'feedback') && <GameView />}
                    {gameState === 'feedback' && <FeedbackOverlay />}
                    {gameState === 'gameover' && <GameOverView />}
                </div>
            );
        }

        // --- 啟動 React ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
