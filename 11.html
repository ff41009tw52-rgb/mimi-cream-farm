<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播種小達人 - 國小自然課互動遊戲</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f0fdf4;
            user-select: none;
            cursor: default;
        }
        .soil-texture {
            background-color: #5D4037;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23795548' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .seed-glow {
            box-shadow: 0 0 5px 2px rgba(255, 255, 255, 0.8);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        /* Custom Cursors */
        .cursor-hand {
            cursor: grab;
        }
        .cursor-hand:active {
            cursor: grabbing;
        }
        /* Hand Animation */
        @keyframes pat {
            0% { transform: scale(1); }
            50% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1); }
        }
        .pat-animation {
            animation: pat 0.2s ease-in-out;
        }
        
        /* New Soil Covering Effect */
        .soil-cover-container {
            filter: blur(8px) contrast(1.2); /* Blend the soil particles together */
        }
        .soil-particle {
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Internal Icon Components (No external dependencies) ---
        const Icon = ({ path, className, size = 24 }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {path}
            </svg>
        );

        const Shovel = (props) => (
            <Icon {...props} path={<><path d="M2 22v-5l5-5 5 5-5 5z"/><path d="M9.5 14.5L16 8"/><path d="M17 2l5 5-.5.5a3.53 3.53 0 0 1-5 0s0 0 0 0L17 2z"/></>} />
        );
        const CloudRain = (props) => (
            <Icon {...props} path={<><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 19v2"/><path d="M8 13v2"/><path d="M16 19v2"/><path d="M16 13v2"/><path d="M12 21v2"/><path d="M12 15v2"/></>} />
        );
        const Hand = (props) => (
            <Icon {...props} path={<><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></>} />
        );
        const CheckCircle = (props) => (
            <Icon {...props} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />
        );
        const RefreshCcw = (props) => (
            <Icon {...props} path={<><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></>} />
        );
        const ArrowRight = (props) => (
            <Icon {...props} path={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />
        );
        const Sprout = (props) => (
             <Icon {...props} path={<><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></>} />
        );
        const Home = (props) => (
            <Icon {...props} path={<><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />
        );
        const Plus = (props) => (
             <Icon {...props} path={<><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></>} />
        );

        // --- Game Constants & Helpers ---
        const GAME_STAGES = {
            MENU: 'menu',
            TUTORIAL: 'tutorial',
            PLANTING: 'planting',
            COVERING: 'covering',
            WATERING: 'watering',
            SUCCESS: 'success'
        };

        const VEGGIES = {
            BOKCHOY: {
                id: 'bokchoy',
                name: '小白菜',
                method: '撒播',
                desc: '種子要均勻撒在土壤上',
                icon: '🥬',
                seedColor: 'bg-yellow-200',
                targetSeeds: 20
            },
            TOMATO: {
                id: 'tomato',
                name: '番茄',
                method: '點播',
                desc: '挖洞後，每個洞放入 2~3 顆種子',
                icon: '🍅',
                seedColor: 'bg-yellow-100',
                targetHoles: 4
            }
        };

        // Grid size for Bok Choy cover
        const GRID_ROWS = 12;
        const GRID_COLS = 12;

        const App = () => {
            const [stage, setStage] = useState(GAME_STAGES.MENU);
            const [selectedVeggie, setSelectedVeggie] = useState(null);
            const [message, setMessage] = useState("");
            
            // Bok Choy State
            const [scatterSeeds, setScatterSeeds] = useState([]);
            const [coverGrid, setCoverGrid] = useState([]); // Array of booleans for coverage

            // Tomato State
            // state: 'flat' -> 'dug' -> 'seeded' -> 'covered'
            const [tomatoHoles, setTomatoHoles] = useState([
                { id: 1, x: 25, y: 30, state: 'flat', seeds: 0 },
                { id: 2, x: 75, y: 30, state: 'flat', seeds: 0 },
                { id: 3, x: 25, y: 70, state: 'flat', seeds: 0 },
                { id: 4, x: 75, y: 70, state: 'flat', seeds: 0 },
            ]);
            const [activeTool, setActiveTool] = useState('hand'); 

            // Watering State
            const [waterLevel, setWaterLevel] = useState(0);
            const [isWatering, setIsWatering] = useState(false);
            const waterInterval = useRef(null);

            // Interaction State
            const [isPatting, setIsPatting] = useState(false);

            // --- Handlers ---

            const resetGame = () => {
                setStage(GAME_STAGES.MENU);
                setScatterSeeds([]);
                setCoverGrid(Array(GRID_ROWS * GRID_COLS).fill(false));
                setTomatoHoles(tomatoHoles.map(h => ({ ...h, state: 'flat', seeds: 0 })));
                setWaterLevel(0);
                setMessage("");
                setActiveTool('hand');
            };

            const startGame = (veggieKey) => {
                setSelectedVeggie(VEGGIES[veggieKey]);
                // Initialize Bok Choy grid
                setCoverGrid(Array(GRID_ROWS * GRID_COLS).fill(false)); 
                setStage(GAME_STAGES.TUTORIAL);
            };

            // Bok Choy Logic
            const handleScatterClick = (e) => {
                if (stage !== GAME_STAGES.PLANTING || selectedVeggie.id !== 'bokchoy') return;
                
                const rect = e.target.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const isTooClose = scatterSeeds.some(s => Math.hypot(s.x - x, s.y - y) < 20);
                
                if (isTooClose) {
                    setMessage("太擠了！分開一點喔！");
                    setTimeout(() => setMessage(""), 1000);
                } else {
                    const newSeed = { x, y, id: Date.now() };
                    setScatterSeeds([...scatterSeeds, newSeed]);
                    if (scatterSeeds.length + 1 >= VEGGIES.BOKCHOY.targetSeeds) {
                        setMessage("太棒了！種子撒得很均勻！下一步準備覆土！");
                    } else {
                        setMessage(`目前有 ${scatterSeeds.length + 1} 顆種子，繼續撒！`);
                    }
                }
            };

            const handleBokChoyCoverHover = (index) => {
                if (stage !== GAME_STAGES.COVERING || selectedVeggie.id !== 'bokchoy') return;
                
                if (!coverGrid[index]) {
                    const newGrid = [...coverGrid];
                    // Cover the hovered cell
                    newGrid[index] = true;
                    
                    // Also cover neighbors to make it feel more like a brush
                    const neighbors = [index-1, index+1, index-GRID_COLS, index+GRID_COLS];
                    neighbors.forEach(n => {
                        if (n >= 0 && n < newGrid.length) newGrid[n] = true;
                    });

                    setCoverGrid(newGrid);
                    
                    // Check progress
                    const coveredCount = newGrid.filter(Boolean).length;
                    const total = newGrid.length;
                    if (coveredCount / total > 0.85) {
                        setMessage("覆土完成！準備澆水！");
                        setTimeout(() => setStage(GAME_STAGES.WATERING), 1500);
                    }
                }
            };

            // Tomato Logic
            const handleHoleClick = (holeId) => {
                if (selectedVeggie.id !== 'tomato') return;

                // Planting Phase
                if (stage === GAME_STAGES.PLANTING) {
                    setTomatoHoles(prev => prev.map(hole => {
                        if (hole.id !== holeId) return hole;

                        // Step 1: Digging
                        if (activeTool === 'shovel') {
                            if (hole.state === 'flat') return { ...hole, state: 'dug' };
                            return hole;
                        }

                        // Step 2: Seeding
                        if (activeTool === 'seedbag') {
                            if (hole.state !== 'dug') {
                                setMessage("要先挖洞才能放種子喔！");
                                return hole;
                            }
                            
                            // Strict limit at 3
                            if (hole.seeds >= 3) {
                                setMessage("只要 2~3 顆就夠了喔！");
                                return hole; // Do not add more
                            }
                            
                            return { ...hole, seeds: hole.seeds + 1 };
                        }
                        return hole;
                    }));
                }
                
                // Covering Phase
                if (stage === GAME_STAGES.COVERING) {
                    setTomatoHoles(prev => {
                        const newHoles = prev.map(hole => {
                            if (hole.id === holeId && hole.state === 'dug' && hole.seeds > 0) {
                                return { ...hole, state: 'covered' };
                            }
                            return hole;
                        });
                        
                        // Check if all covered
                        const allCovered = newHoles.every(h => h.state === 'covered');
                        if (allCovered) {
                            setMessage("都蓋好了！準備澆水！");
                            setTimeout(() => setStage(GAME_STAGES.WATERING), 1500);
                        }
                        
                        return newHoles;
                    });
                    setIsPatting(true);
                    setTimeout(() => setIsPatting(false), 200);
                }
            };

            // Watering Logic
            const startWatering = () => {
                if (stage !== GAME_STAGES.WATERING) return;
                setIsWatering(true);
                waterInterval.current = setInterval(() => {
                    setWaterLevel(prev => {
                        if (prev >= 100) return 100;
                        return prev + 1.5;
                    });
                }, 50);
            };

            const stopWatering = () => {
                setIsWatering(false);
                clearInterval(waterInterval.current);
                
                if (waterLevel > 40 && waterLevel < 80) {
                    setStage(GAME_STAGES.SUCCESS);
                } else if (waterLevel >= 80) {
                    setMessage("淹水啦！下次小心一點！");
                    setTimeout(() => {
                        setWaterLevel(0);
                        setMessage("");
                    }, 1500);
                } else {
                    setMessage("水還不夠喔，土壤要溼潤才行！");
                }
            };

            // Transition Check
            const checkPlantingComplete = () => {
                if (selectedVeggie.id === 'bokchoy') {
                    if (scatterSeeds.length >= VEGGIES.BOKCHOY.targetSeeds) {
                        setStage(GAME_STAGES.COVERING);
                        setMessage("現在請用手，輕輕把土撥到種子上！");
                    } else {
                        setMessage("種子還不夠多喔！");
                    }
                } else {
                    // Tomato
                    const allDug = tomatoHoles.every(h => h.state !== 'flat');
                    const allSeeded = tomatoHoles.every(h => h.seeds >= 2 && h.seeds <= 3);
                    if (allDug && allSeeded) {
                        setStage(GAME_STAGES.COVERING);
                        setActiveTool('hand'); // Force tool to hand
                        setMessage("太好了！現在用手把洞口填平吧！");
                    } else {
                        setMessage("請檢查：每個洞都要有 2~3 顆種子！");
                    }
                }
            };

            // --- Render Components ---

            const renderMainMenu = () => (
                <div className="flex flex-col items-center justify-center h-full space-y-8 p-4 relative">
                    {/* Back Button on Menu as well */}
                     <a 
                        href="https://ff41009tw52-rgb.github.io/mimi-cream-farm/"
                        className="absolute top-4 left-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 decoration-none transition-all hover:scale-105 z-50"
                    >
                        <Home size={20} /> 回農場
                    </a>

                    <h1 className="text-4xl font-bold text-green-800 tracking-wider">播種小達人</h1>
                    <p className="text-xl text-gray-600">請選擇你要種植的蔬菜</p>
                    <div className="grid grid-cols-2 gap-8 w-full max-w-2xl">
                        {Object.keys(VEGGIES).map(key => (
                            <button 
                                key={key}
                                onClick={() => startGame(key)}
                                className="group relative bg-white p-8 rounded-3xl shadow-xl border-4 border-transparent hover:border-green-400 transition-all transform hover:-translate-y-2"
                            >
                                <div className="text-8xl mb-4 floating">{VEGGIES[key].icon}</div>
                                <h2 className="text-3xl font-bold text-gray-800">{VEGGIES[key].name}</h2>
                                <span className="inline-block mt-2 px-4 py-1 bg-green-100 text-green-700 rounded-full text-lg">
                                    {VEGGIES[key].method}
                                </span>
                            </button>
                        ))}
                    </div>
                </div>
            );

            const renderTutorial = () => (
                <div className="flex flex-col items-center justify-center h-full p-8 text-center bg-white/90 rounded-xl max-w-2xl mx-auto mt-20 shadow-2xl relative">
                     <a 
                        href="https://ff41009tw52-rgb.github.io/mimi-cream-farm/"
                        className="absolute top-4 left-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 decoration-none transition-all hover:scale-105 z-50"
                    >
                        <Home size={20} /> 回農場
                    </a>

                    <h2 className="text-3xl font-bold text-green-700 mb-6">任務說明：{selectedVeggie.name}</h2>
                    <div className="bg-yellow-50 p-6 rounded-xl border-2 border-yellow-200 mb-8">
                        <p className="text-2xl text-gray-700 leading-relaxed font-bold">
                            {selectedVeggie.desc}
                        </p>
                    </div>
                    <button 
                        onClick={() => setStage(GAME_STAGES.PLANTING)}
                        className="bg-green-500 hover:bg-green-600 text-white text-2xl font-bold py-4 px-12 rounded-full shadow-lg transition-transform active:scale-95 flex items-center gap-3"
                    >
                        開始播種 <Hand size={28} />
                    </button>
                </div>
            );

            const renderGameArea = () => {
                const isBokchoy = selectedVeggie.id === 'bokchoy';
                
                // Instructions based on stage
                let instruction = "";
                if (stage === GAME_STAGES.PLANTING) {
                    instruction = isBokchoy ? "點擊土壤撒種子 (目標: 20顆以上)" : "先用鏟子挖洞，再放 2~3 顆種子";
                } else if (stage === GAME_STAGES.COVERING) {
                    instruction = isBokchoy ? "【互動】在畫面上滑動，將一層薄土蓋在種子上" : "【互動】點擊每一個洞口，把土撥回去填平";
                } else if (stage === GAME_STAGES.WATERING) {
                    instruction = "長按澆水按鈕，直到土壤溼潤";
                }

                return (
                    <div className="flex flex-col h-full max-w-4xl mx-auto p-4 relative">
                        {/* Back Button (Always Visible) */}
                        <a 
                            href="https://ff41009tw52-rgb.github.io/mimi-cream-farm/"
                            className="absolute top-2 left-2 md:top-6 md:left-6 z-50 bg-green-600 hover:bg-green-700 text-white px-3 py-2 md:px-4 md:py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 decoration-none transition-all hover:scale-105"
                        >
                            <Home size={20} /> <span className="hidden md:inline">回農場</span>
                        </a>

                        {/* Header Info */}
                        <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-md mb-4 z-10 ml-12 md:ml-32">
                            <div className="flex items-center gap-3">
                                <span className="text-4xl">{selectedVeggie.icon}</span>
                                <div>
                                    <h3 className="text-xl font-bold text-gray-800">{selectedVeggie.name} ({selectedVeggie.method})</h3>
                                    <p className="text-green-600 font-bold text-sm md:text-base animate-pulse">{instruction}</p>
                                </div>
                            </div>
                            
                            {/* Tomato Tools (Only visible in Planting) */}
                            {!isBokchoy && stage === GAME_STAGES.PLANTING && (
                                <div className="flex gap-2 bg-gray-100 p-1 rounded-lg">
                                    <button 
                                        onClick={() => setActiveTool('shovel')}
                                        className={`p-3 rounded-lg flex items-center gap-2 ${activeTool === 'shovel' ? 'bg-blue-500 text-white shadow-md' : 'text-gray-500 hover:bg-gray-200'}`}
                                    >
                                        <Shovel size={20} /> 鏟子
                                    </button>
                                    <button 
                                        onClick={() => setActiveTool('seedbag')}
                                        className={`p-3 rounded-lg flex items-center gap-2 ${activeTool === 'seedbag' ? 'bg-yellow-500 text-white shadow-md' : 'text-gray-500 hover:bg-gray-200'}`}
                                    >
                                        <span className="text-lg">🌰</span> 種子
                                    </button>
                                </div>
                            )}

                             {/* Hand Tool Indicator for Covering */}
                             {stage === GAME_STAGES.COVERING && (
                                <div className="bg-amber-100 px-4 py-2 rounded-lg text-amber-800 font-bold flex items-center gap-2">
                                    <Hand size={20} /> 使用雙手覆土
                                </div>
                            )}

                            {/* Proceed Button (Only in Planting Stage) */}
                            {stage === GAME_STAGES.PLANTING && (
                                <button 
                                    onClick={checkPlantingComplete}
                                    className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg font-bold shadow-lg flex items-center gap-2"
                                >
                                    完成 <ArrowRight size={20} />
                                </button>
                            )}
                        </div>

                        {/* Message Toast */}
                        {message && (
                            <div className="absolute top-28 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-2 rounded-full shadow-xl font-bold z-50 animate-pulse whitespace-nowrap">
                                {message}
                            </div>
                        )}

                        {/* SOIL AREA */}
                        <div className={`relative flex-grow soil-texture rounded-xl shadow-inner border-4 border-amber-800 overflow-hidden 
                                        ${stage === GAME_STAGES.COVERING ? 'cursor-hand' : 'cursor-crosshair'}`}
                             onClick={isBokchoy ? handleScatterClick : undefined}
                        >
                            {/* --- Bok Choy Interaction Layer --- */}
                            
                            {/* 1. Seeds Layer (Visible under soil) */}
                            {isBokchoy && scatterSeeds.map(seed => (
                                <div 
                                    key={seed.id}
                                    className="absolute w-3 h-3 bg-yellow-200 rounded-full seed-glow transition-all"
                                    style={{ left: seed.x, top: seed.y, transform: 'translate(-50%, -50%)' }}
                                ></div>
                            ))}

                            {/* 2. Soil Covering Layer (Natural Blur Effect) */}
                            {isBokchoy && stage === GAME_STAGES.COVERING && (
                                <div className="absolute inset-0 grid grid-cols-12 grid-rows-12 soil-cover-container pointer-events-none">
                                    {coverGrid.map((covered, idx) => (
                                        <div 
                                            key={idx}
                                            // Make the "particle" larger than the grid cell to overlap
                                            className={`soil-particle transition-opacity duration-700 w-[150%] h-[150%] -translate-x-1/4 -translate-y-1/4 rounded-full ${covered ? 'bg-amber-900 opacity-90' : 'bg-transparent opacity-0'}`}
                                        ></div>
                                    ))}
                                </div>
                            )}

                            {/* Invisible Touch/Hover Grid for Bok Choy (On top to capture events) */}
                            {isBokchoy && stage === GAME_STAGES.COVERING && (
                                <div className="absolute inset-0 grid grid-cols-12 grid-rows-12 z-20">
                                    {coverGrid.map((_, idx) => (
                                        <div 
                                            key={idx}
                                            onMouseEnter={() => handleBokChoyCoverHover(idx)}
                                            onTouchMove={(e) => {
                                                const touch = e.touches[0];
                                                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                                                if (el && el.dataset.idx) handleBokChoyCoverHover(parseInt(el.dataset.idx));
                                            }}
                                            data-idx={idx}
                                            className="bg-transparent"
                                        ></div>
                                    ))}
                                </div>
                            )}

                             {/* --- Tomato Interaction Layer --- */}
                            
                            {!isBokchoy && tomatoHoles.map(hole => (
                                <div 
                                    key={hole.id}
                                    onClick={() => handleHoleClick(hole.id)}
                                    className={`absolute w-32 h-32 rounded-full border-4 transition-all duration-500 flex items-center justify-center flex-wrap gap-1 p-4
                                        ${hole.state === 'flat' ? 'border-dashed border-white/50 bg-black/10 hover:bg-black/20' : ''}
                                        /* Deep dark brown with inset shadow for depth */
                                        ${hole.state === 'dug' || hole.state === 'seeded' ? 'border-amber-900/50 bg-[#2d1b15] shadow-[inset_0_8px_16px_rgba(0,0,0,0.8)] scale-95' : ''}
                                        ${hole.state === 'covered' ? 'border-transparent bg-amber-800 scale-105 shadow-lg' : ''}
                                    `}
                                    style={{ left: `${hole.x}%`, top: `${hole.y}%`, transform: 'translate(-50%, -50%)' }}
                                >
                                    {/* NEW: Explicit Dig Indicator */}
                                    {hole.state === 'flat' && stage === GAME_STAGES.PLANTING && (
                                        <div className="flex flex-col items-center justify-center animate-pulse pointer-events-none">
                                            <Plus size={48} className="text-white drop-shadow-lg mb-1" strokeWidth={4} />
                                            <div className="text-white font-bold bg-black/30 px-2 py-0.5 rounded-full text-sm backdrop-blur-sm">挖這裡</div>
                                        </div>
                                    )}
                                    
                                    {/* Seeds inside hole (Visible only if not covered) */}
                                    {hole.state !== 'covered' && Array.from({ length: hole.seeds }).map((_, i) => (
                                        <div key={i} className="w-4 h-4 bg-yellow-200 rounded-full seed-glow"></div>
                                    ))}
                                    
                                    {/* Covered Mound Visual */}
                                    {hole.state === 'covered' && (
                                        <div className="text-amber-900/50 font-bold select-none">已覆土</div>
                                    )}

                                    {/* Helper text for count */}
                                    {(hole.state === 'dug' || hole.state === 'seeded') && stage === GAME_STAGES.PLANTING && (
                                        <div className="absolute -bottom-8 bg-white/80 px-2 rounded text-sm font-bold pointer-events-none">
                                            {hole.seeds} 顆
                                        </div>
                                    )}
                                    
                                    {/* Prompt to cover */}
                                    {stage === GAME_STAGES.COVERING && hole.state !== 'covered' && (
                                        <div className="absolute -top-10 animate-bounce text-amber-100 text-3xl drop-shadow-md pointer-events-none">
                                            👇
                                        </div>
                                    )}
                                </div>
                            ))}


                            {/* Watering UI Overlay (Fades in soil color naturally) */}
                            {stage === GAME_STAGES.WATERING && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center z-30 pointer-events-none">
                                    {/* Darken soil globally for watering stage */}
                                    <div className="absolute inset-0 bg-amber-900/80 -z-10 transition-opacity duration-1000"></div>
                                    
                                    <div className="bg-white/90 p-6 rounded-2xl shadow-2xl text-center pointer-events-auto">
                                        <h3 className="text-2xl font-bold text-blue-600 mb-4">澆水時間！</h3>
                                        <p className="mb-4 text-gray-600">長按按鈕，讓水充滿綠色區域！</p>
                                        
                                        {/* Water Meter */}
                                        <div className="w-64 h-8 bg-gray-200 rounded-full overflow-hidden border-2 border-gray-400 relative mb-4">
                                            <div className="absolute top-0 bottom-0 left-[40%] right-[20%] bg-green-200/50 border-l-2 border-r-2 border-green-500 z-0"></div>
                                            <div 
                                                className={`h-full transition-all duration-100 z-10 ${waterLevel > 80 ? 'bg-red-500' : 'bg-blue-500'}`}
                                                style={{ width: `${waterLevel}%` }}
                                            ></div>
                                        </div>

                                        <button 
                                            onMouseDown={startWatering}
                                            onMouseUp={stopWatering}
                                            onMouseLeave={stopWatering}
                                            onTouchStart={(e) => {e.preventDefault(); startWatering()}}
                                            onTouchEnd={(e) => {e.preventDefault(); stopWatering()}}
                                            className="bg-blue-500 active:bg-blue-700 text-white p-6 rounded-full shadow-lg transform transition-transform active:scale-95"
                                        >
                                            <CloudRain size={48} />
                                        </button>
                                    </div>
                                </div>
                            )}

                             {/* Success UI Overlay */}
                             {stage === GAME_STAGES.SUCCESS && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center z-40 bg-black/50">
                                    <div className="bg-white p-8 rounded-3xl shadow-2xl text-center transform scale-110">
                                        <div className="text-6xl mb-4 animate-bounce">🌱</div>
                                        <h2 className="text-4xl font-bold text-green-600 mb-2">大成功！</h2>
                                        <p className="text-xl text-gray-600 mb-6">你已經學會{selectedVeggie.method}了！</p>
                                        <div className="flex justify-center gap-4">
                                            <button 
                                                onClick={resetGame}
                                                className="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2"
                                            >
                                                <RefreshCcw size={20} /> 再玩一次
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-screen w-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-green-50">
                    {stage === GAME_STAGES.MENU && renderMainMenu()}
                    {stage === GAME_STAGES.TUTORIAL && renderTutorial()}
                    {(stage === GAME_STAGES.PLANTING || stage === GAME_STAGES.COVERING || stage === GAME_STAGES.WATERING || stage === GAME_STAGES.SUCCESS) && renderGameArea()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
