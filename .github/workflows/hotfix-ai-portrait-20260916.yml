name: Hotfix AI portrait viewer

on:
  push:
    paths:
      - '.github/workflows/hotfix-ai-portrait-20260916.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI version only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('herbgameai-formal.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) AI 版暫停人物大圖 Viewer，避免點擊成員頭像時載入大型立繪造成卡頓。
          marker = "      const doc = document;\n      const viewer = doc.getElementById('member-portrait-viewer');"
          replacement = "      const doc = document;\n      const MEMBER_PORTRAIT_VIEWER_ENABLED = false; // 2026-09-16: 暫停大圖 Viewer，先確保 Day 1 測試順暢\n      const viewer = doc.getElementById('member-portrait-viewer');"
          if 'const MEMBER_PORTRAIT_VIEWER_ENABLED = false;' not in text:
              if marker not in text:
                  raise SystemExit('portrait viewer init marker not found')
              text = text.replace(marker, replacement, 1)

          open_marker = "      function openMemberPortraitViewer(characterId) {\n        const resolved = resolvePortraitCharacter(characterId);"
          open_replacement = "      function openMemberPortraitViewer(characterId) {\n        if (!MEMBER_PORTRAIT_VIEWER_ENABLED) return false;\n        const resolved = resolvePortraitCharacter(characterId);"
          if open_replacement not in text:
              if open_marker not in text:
                  raise SystemExit('openMemberPortraitViewer marker not found')
              text = text.replace(open_marker, open_replacement, 1)

          # 視覺提示同步改為不可放大，避免仍顯示 zoom-in 游標。
          text = text.replace(
              ".member-avatar-img[data-character-id] {\n            cursor: zoom-in;",
              ".member-avatar-img[data-character-id] {\n            cursor: default;",
              1
          )

          # 2) AI 版移除陳冠瑋老師真人形象引用；保留老師角色、台詞與資料。
          text = re.sub(
              r'^\s*avatar:\s*[\"\']picture/herb-game/chen-guanwei-thinking\.png[\"\'],?\s*\n',
              '', text, flags=re.MULTILINE
          )
          text = re.sub(
              r'^\s*avatarFallback:\s*[\"\']https://raw\.githubusercontent\.com/ff41009tw52-rgb/mimi-cream-farm/main/picture/herb-game/chen-guanwei-thinking\.png[\"\'],?\s*\n',
              '', text, flags=re.MULTILINE
          )
          text = re.sub(
              r'^\s*[\"\']picture/herb-game/chen-guanwei-thinking\.png[\"\']:\s*\n\s*GITHUB_HERB_RAW\s*\+\s*[\"\']chen-guanwei-thinking\.png[\"\'],?\s*\n',
              '', text, flags=re.MULTILINE
          )

          if text == original:
              raise SystemExit('no changes were made')
          if 'chen-guanwei-thinking.png' in text:
              raise SystemExit('Chen real-person image reference still remains in AI HTML')
          if 'const MEMBER_PORTRAIT_VIEWER_ENABLED = false;' not in text:
              raise SystemExit('portrait viewer feature flag missing')
          if "if (!MEMBER_PORTRAIT_VIEWER_ENABLED) return false;" not in text:
              raise SystemExit('portrait viewer open guard missing')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Regression guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          # 真人版必須完全不在本次差異中
          test -z "$(git diff --name-only -- herbgame-formal.html)"
          grep -q "const MEMBER_PORTRAIT_VIEWER_ENABLED = false;" herbgameai-formal.html
          ! grep -q "chen-guanwei-thinking.png" herbgameai-formal.html
          grep -q "STUDENT_INFO" herbgameai-formal.html
          grep -q "member-avatar-img" herbgameai-formal.html

      - name: JavaScript syntax check for portrait viewer module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('herbgameai-formal.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="member-portrait-viewer-script">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit('member portrait viewer script not found')
          Path('/tmp/member-portrait-viewer.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/member-portrait-viewer.js

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-ai-portrait-20260916.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herbgameai-formal.html .github/workflows/hotfix-ai-portrait-20260916.yml
          git commit -m "fix: disable laggy AI portrait zoom and remove Chen photo"
          git push origin HEAD:main
