name: Test aquarium V0.6 feeding, decor tutorial and multi-tank
on:
  push:
    paths: ['aquarium-v0.6*.html', 'assets/aquarium-v06/**', 'tests/aquarium-v06/**', 'scripts/build-aquarium-v06.py', '.github/workflows/test-aquarium-v06.yml']
  pull_request:
    paths: ['aquarium-v0.6*.html', 'assets/aquarium-v06/**', 'tests/aquarium-v06/**', 'scripts/build-aquarium-v06.py', '.github/workflows/test-aquarium-v06.yml']
concurrency:
  group: aquarium-v06-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 25
    env:
      AQUARIUM_ENTRY: aquarium-v0.6.html
      AQUARIUM_ARTIFACTS: artifacts/aquarium-v06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate schema, migration, unchanged V0.5 and offline bundle
        run: |
          for f in assets/aquarium-v06/*.js; do node --check "$f"; done
          node tests/aquarium/schema-v05.test.cjs
          node tests/aquarium-v06/schema.test.cjs
          node tests/aquarium-v06/economy.test.cjs
          node tests/aquarium-v06/species-content.test.cjs
          python3 scripts/build-aquarium-v06.py
          git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- aquarium-v0.6-standalone.html
      - name: Prepare browsers
        run: |
          apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix /tmp/aquarium-v06-runtime playwright@1.58.2
          echo 'NODE_PATH=/tmp/aquarium-v06-runtime/node_modules' >> "$GITHUB_ENV"
      - name: Verify 35 shared species profiles and purchase journeys
        run: node tests/aquarium-v06/species-stories.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: species-stories-evidence
          path: artifacts/aquarium-v06/species-*
      - name: Verify free design, reward compensation and marine integration
        run: |
          node tests/aquarium-v06/quality.test.cjs
          node tests/aquarium-v06/design.test.cjs
      - name: Verify economy, teaching, food rules, migration, three tanks and five sizes
        run: |
          failed=0
          for suite in touch-stability stability crustaceans expansion decor decor-mobile browser extra tutorial journey; do
            node tests/aquarium-v06/$suite.test.cjs || failed=1
          done
          exit "$failed"
      - name: Check WebKit touch input, all tanks and food picker
        env:
          AQUARIUM_BROWSER: webkit
          AQUARIUM_ARTIFACTS: artifacts/aquarium-v06/webkit
        run: |
          node tests/aquarium-v06/species-stories.test.cjs
          node tests/aquarium-v06/quality.test.cjs
          node tests/aquarium-v06/mobile.test.cjs
          node tests/aquarium-v06/touch-stability.test.cjs
          node tests/aquarium-v06/design.test.cjs
          node tests/aquarium-v06/crustaceans.test.cjs
          node tests/aquarium-v06/decor-mobile.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aquarium-v06-evidence
          path: artifacts/aquarium-v06/

  normal-progression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/aquarium-v06-runtime playwright@1.58.2
      - name: Play from a fresh save through the first marine fish
        env:
          NODE_PATH: /tmp/aquarium-v06-runtime/node_modules
          AQUARIUM_LONG_JOURNEY: '1'
        run: node tests/aquarium-v06/journey.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-progression-evidence
          path: artifacts/aquarium-v06/

  appearance:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      AQUARIUM_BROWSER: ${{ matrix.browser }}
      AQUARIUM_ARTIFACTS: artifacts/appearance/${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix /tmp/aquarium-v06-runtime playwright@1.58.2
      - name: Verify 93 purchases, growth transitions, retained adults and all 35 real tank sizes
        env:
          NODE_PATH: /tmp/aquarium-v06-runtime/node_modules
        run: |
          node tests/aquarium-v06/economy-browser.test.cjs
          node tests/aquarium-v06/crustacean-motion.test.cjs
          node tests/aquarium-v06/appearance.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-${{ matrix.browser }}
          path: artifacts/appearance/
