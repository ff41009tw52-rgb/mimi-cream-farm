name: Verify herb student portraits on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-herb-student-v2-live.yml'

permissions:
  contents: write

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for AI page with v2 portrait paths
        shell: bash
        run: |
          set -euo pipefail
          page='https://ff41009tw52-rgb.github.io/mimi-cream-farm/herbgameai-formal.html'
          ok=0
          for i in $(seq 1 24); do
            if curl -L --fail --silent --show-error "$page?portrait_verify=$GITHUB_SHA-$i" -o /tmp/herbgameai-live.html; then
              if grep -q 'mint_student_transparent_v2.png' /tmp/herbgameai-live.html && grep -q 'marigold_student_transparent_v2.png' /tmp/herbgameai-live.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          grep -q 'src:STUDENT_INFO.mint_student.avatar' /tmp/herbgameai-live.html
          grep -q "this.parentElement.textContent='人物圖片載入失敗'" /tmp/herbgameai-live.html
          ! grep -q 'picture/herb-game/ai-characters/01_小琳_mint_student.png' /tmp/herbgameai-live.html

      - name: Verify all 11 public images return and match exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pillow
          python - <<'PY'
          from pathlib import Path
          import subprocess, hashlib
          from PIL import Image

          expected = {
            'mint_student_transparent_v2.png':'5f844bae6206bb63455b9ea6722256a86784444fd10c49040cd22f63471aa20e',
            'left_student_transparent_v2.png':'c1b41750e61bd2696b1b3d4fd91befcdcb48331d5acd0113231d2ffe202dc05d',
            'lemongrass_student_transparent_v2.png':'b9dd0a7b2f41c2708f525126ca31b01921e999a1f7ee638f0f4f532d1bc36c46',
            'pandan_student_transparent_v2.png':'15e3d46db0a8e955ebdb8dea6d67dd4f7ae7a1b974cd025a6a8678752f2c78bc',
            'mugwort_student_transparent_v2.png':'a2aa970333d86869325e78783932ecf3a3e284b0455efb38f0d0de15f65984f3',
            'fishmint_student_transparent_v2.png':'15f18ece5884aaeb5e0259911f39e43d3d0ee5803395c05d278b094eb50c7d07',
            'pricklyash_student_transparent_v2.png':'3bc3e90a8f5eca72d3c7727c9b1c3b7f44368e7f9281409489347ece03bb7a1c',
            'shellginger_student_transparent_v2.png':'eebefff3c42adfc239564b57509354ff04092e94dadb15b2a302768d78428f08',
            'teatree_student_transparent_v2.png':'66c2102cb601993e70b96859c64d9482f6592d6ac963fa4d7c44d20a9a8f186c',
            'turmeric_student_transparent_v2.png':'fc6ab1b7e47a72b5698ff9ac7b788d8505c17e01a77d85008826c13207b5fbbe',
            'marigold_student_transparent_v2.png':'791b4317da5dd52a6b32f358e3222d31c0ffdbae3dde19ab9b881a124cb95a39',
          }
          base='https://ff41009tw52-rgb.github.io/mimi-cream-farm/picture/herb-game/ai-characters'
          out=Path('/tmp/live-portraits'); out.mkdir(exist_ok=True)
          for i,(name,want) in enumerate(expected.items()):
            p=out/name
            url=f'{base}/{name}?verify={i}'
            subprocess.run(['curl','-L','--fail','--silent','--show-error','--retry','3','-o',str(p),url],check=True)
            got=hashlib.sha256(p.read_bytes()).hexdigest()
            if got != want: raise SystemExit(f'live hash mismatch: {name}: {got}')
            with Image.open(p) as im:
              im.load()
              if im.size != (1024,1536): raise SystemExit(f'live bad size: {name}: {im.size}')
              a=im.convert('RGBA').getchannel('A'); amin,amax=a.getextrema(); alpha0=a.histogram()[0]/(im.width*im.height)
              if amin != 0 or amax == 0 or alpha0 < .30: raise SystemExit(f'live bad alpha: {name}: {amin}-{amax}, {alpha0:.2%}')
            print(f'LIVE OK {name}: HTTP 200, sha256 exact, alpha0={alpha0:.2%}')
          PY

      - name: Remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-herb-student-v2-live.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git diff --cached --name-only | grep -qx '.github/workflows/verify-herb-student-v2-live.yml'
          git commit -m 'chore: remove temporary portrait live-check workflow'
          git push origin HEAD:main
