name: PR23 P2 mobile visual QA

on:
  push:
    branches:
      - qa/pr23-mobile-visual

permissions:
  contents: read

jobs:
  p2-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Playwright core
        run: npm install --no-save playwright-core@1.55.0

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pr23-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/play.html >/dev/null

      - name: Run P2 visual QA
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node qa/pr23-interaction.js

      - name: Print report
        if: always()
        run: cat qa-interaction/report.md || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr23-p2-mobile-visual-qa
          path: qa-interaction
          if-no-files-found: error
          retention-days: 7
