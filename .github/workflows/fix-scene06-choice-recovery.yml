name: Fix scene06 choice recovery
on:
  push:
    paths:
      - '.github/workflows/fix-scene06-choice-recovery.yml'
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Protect formal version and patch AI trial only
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          python3 .github/scripts/fix_scene06_choice_recovery.py
          git diff --exit-code -- herbgame-formal.html
      - name: Static syntax checks
        run: |
          set -euo pipefail
          rm -rf /tmp/herb-js && mkdir -p /tmp/herb-js
          python3 -c "from pathlib import Path; import re; s=Path('herbgameai-formal.html').read_text(encoding='utf-8'); blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I); [Path(f'/tmp/herb-js/{i}.js').write_text(b,encoding='utf-8') for i,b in enumerate(x for x in blocks if x.strip())]"
          for f in /tmp/herb-js/*.js; do node --check "$f"; done
          grep -Fq 'const currentStoryNode = getStoryRef()?.nodes?.[engine.currentNodeId];' herbgameai-formal.html
          grep -Fq 'engine.showChoices(currentStoryNode.choices);' herbgameai-formal.html
          grep -Fq 'if (event.repeat) return;' herbgameai-formal.html
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Targeted scene06 verification
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/herb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python3 .github/scripts/verify_scene06_choice_recovery.py
      - name: Commit repair and remove temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-scene06-choice-recovery.yml
          rm -f .github/workflows/diag-scene06-choice.yml
          rm -f .github/scripts/fix_scene06_choice_recovery.py
          rm -f .github/scripts/verify_scene06_choice_recovery.py
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git diff --exit-code -- herbgame-formal.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add herbgameai-formal.html .github/workflows/fix-scene06-choice-recovery.yml .github/workflows/diag-scene06-choice.yml .github/scripts/fix_scene06_choice_recovery.py .github/scripts/verify_scene06_choice_recovery.py
          git diff --cached --name-only
          git commit -m 'fix: recover missing choice UI on dialogue nodes'
          git push origin HEAD:main