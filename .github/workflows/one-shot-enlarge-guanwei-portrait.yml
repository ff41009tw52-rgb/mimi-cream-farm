name: One-shot enlarge Guanwei portrait

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-enlarge-guanwei-portrait.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enlarge Guanwei portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('herbgame.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('width: clamp(120px, 15vw, 175px);', 'width: clamp(170px, 22vw, 260px);'),
              ('max-height: 225px;', 'max-height: 330px;'),
              ('.dialogue-wrapper.has-portrait .choices-container { width: min(68%, 760px); left: 60%; }', '.dialogue-wrapper.has-portrait .choices-container { width: min(62%, 720px); left: 64%; }'),
              ('.speaker-portrait { left: 0.35rem; width: 112px; max-height: 165px; bottom: calc(100% - 3px); }', '.speaker-portrait { left: 0.2rem; width: 155px; max-height: 230px; bottom: calc(100% - 3px); }'),
              ('.dialogue-wrapper.has-portrait .choices-container { width: 72%; left: 62%; }', '.dialogue-wrapper.has-portrait .choices-container { width: 65%; left: 66%; }'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected CSS not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/one-shot-enlarge-guanwei-portrait.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herbgame.html .github/workflows/one-shot-enlarge-guanwei-portrait.yml
          git commit -m "Fix blank portraits and enlarge Guanwei character"
          git push
