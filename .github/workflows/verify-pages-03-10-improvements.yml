name: Verify pages 03-10 improvements

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply requested page improvements
        run: python3 tools/apply_pages_03_10_improvements.py

      - name: Install isolated browser tools
        run: |
          mkdir -p /tmp/pages0310-audit
          npm install --prefix /tmp/pages0310-audit playwright@1.55.0
          npx --prefix /tmp/pages0310-audit playwright install --with-deps chromium

      - name: Open pages 03-10 in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/static-server.log 2>&1 &
          cat > /tmp/pages0310-audit/verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          const pages = ['03.html','04.html','05.html','06.html','07.html','08.html','09.html','10.html'];
          const browser = await chromium.launch({ headless: true });
          const problems = [];
          for (const filename of pages) {
            const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(error.message));
            let navError = null;
            try {
              const response = await page.goto(`http://127.0.0.1:4173/${filename}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              if (!response || response.status() >= 400) navError = `HTTP ${response?.status() || 'no response'}`;
              await page.waitForTimeout(1800);
            } catch (error) { navError = error.message; }
            const text = await page.evaluate(() => (document.body?.innerText || '').replace(/\s+/g, ' ').trim()).catch(() => '');
            if (navError || pageErrors.length || text.length < 20) problems.push({ filename, navError, pageErrors, text: text.slice(0, 400) });
            await page.close();
          }
          await browser.close();
          console.log(`CHECKED_PAGES=${pages.length}`);
          if (problems.length) console.warn(JSON.stringify(problems, null, 2));
          else console.log('Pages 03-10 opened successfully.');
          NODE
          node /tmp/pages0310-audit/verify.mjs

      - name: Commit completed website changes
        run: |
          git rm -f tools/apply_pages_03_10_improvements.py .github/workflows/verify-pages-03-10-improvements.yml tools/run-pages-03-10.txt || true
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add 03.html 04.html 05.html 06.html 07.html 08.html 09.html 10.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: improve science activities pages 03 to 10"
          git push
