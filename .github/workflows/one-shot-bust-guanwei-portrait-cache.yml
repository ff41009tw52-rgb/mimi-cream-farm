name: One-shot bust Guanwei portrait cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-bust-guanwei-portrait-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version portrait asset URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('herbgame.html')
          s = p.read_text(encoding='utf-8')
          for name in ['normal', 'thinking', 'surprised']:
              old = f'picture/herb-game/characters/chen-guanwei-{name}.jpg'
              new = old + '?v=20260906-portrait-fix'
              if old not in s:
                  raise SystemExit(f'Portrait path not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/one-shot-bust-guanwei-portrait-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herbgame.html .github/workflows/one-shot-bust-guanwei-portrait-cache.yml
          git commit -m "Refresh Guanwei portrait asset cache"
          git push
