name: Remove herbgame bravery system

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-herbgame-bravery.yml'

permissions:
  contents: write

jobs:
  remove-bravery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest game
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove bravery system from active AI version
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          python3 - <<'PY'
          from pathlib import Path
          import re

          base_path = Path('herbgameai-formal-base.html')
          wrapper_path = Path('herbgameai-formal.html')
          base = base_path.read_text(encoding='utf-8')
          wrapper = wrapper_path.read_text(encoding='utf-8')

          def replace_exact(text, old, new, expected=1, label='replacement'):
              count = text.count(old)
              if count != expected:
                  raise AssertionError(f'{label}: expected {expected}, found {count}')
              return text.replace(old, new)

          def regex_exact(text, pattern, repl, expected=1, label='regex', flags=0):
              text2, count = re.subn(pattern, repl, text, flags=flags)
              if count != expected:
                  raise AssertionError(f'{label}: expected {expected}, found {count}')
              return text2

          # 1) 玩家面板：真正刪除勇氣卡片與說明，不使用 display:none。
          base = regex_exact(
              base,
              r'\n\s*<div class="stat-card">\s*\n\s*<div class="stat-label">勇氣值</div>\s*\n\s*<div class="stat-value" id="panel-bravery">0</div>\s*\n\s*</div>',
              '',
              label='remove panel bravery card'
          )
          base = replace_exact(
              base,
              '勇氣值範圍為 0～100；一般活動完成時基本增加 2，主動向校長問早增加 1。',
              '',
              label='remove bravery panel note'
          )

          # 2) Day 1 結算：整列與 DOM 更新全部移除。
          base = regex_exact(
              base,
              r'\s*<div class="de-summary-row"><span>勇氣值</span><span id="de-bravery">0</span></div>\s*',
              '\n                ',
              label='remove day1 bravery row'
          )
          base = replace_exact(
              base,
              "document.getElementById('de-bravery').innerText=`${this.gameState.bravery} / 100`;",
              '',
              label='remove day1 bravery renderer'
          )

          # 3) 首頁系統描述：不再暗示有勇氣能力值；自然語言「鼓起勇氣」保留。
          base = replace_exact(
              base,
              '同學之間的羈絆、教師與校長的信任，以及你自己的勇氣，都會影響之後能遇到的事件與選擇。',
              '你認識的人、經歷過的事件，以及做過的選擇，都可能影響之後的校園生活。',
              label='update intro system description'
          )

          # 4) 地圖分類語言改為互動／合作／協調，不再把勇氣當事件分類。
          map_replacements = {
              '這裡很適合友情、活潑互動、勇氣與遊戲型事件。': '這裡很適合友情、主動互動與遊戲型事件。',
              '適合球類、團隊合作、人物衝突與勇氣調停事件。': '適合球類、團隊合作、人物衝突與協調事件。',
              '適合互助、同伴鼓勵與小型勇氣事件。': '適合互助、同伴鼓勵與合作事件。',
          }
          for old, new in map_replacements.items():
              base = replace_exact(base, old, new, label=f'map copy: {old}')

          # 5) 校長問早：中性選項＋行動旗標，不給勇氣分數。
          base = replace_exact(base, 'text: "要不要鼓起勇氣跟校長打招呼？"', 'text: "要不要跟校長打招呼？"', label='greeting prompt')
          base = replace_exact(base, 'text: "鼓起勇氣，向校長說早安！"', 'text: "校長早安！"', label='greeting A copy')
          base = replace_exact(base, 'text: "還是有點害羞……默默走過去好了"', 'text: "今天還是有點不好意思，默默走過去。"', label='greeting B copy')
          base = replace_exact(base, '// A 路線：向校長問早（最新企劃：勇氣 +1；影片本身不重複加值）', '// A 路線：向校長問早', label='greeting comment')

          # 6) STORY_DATA 中所有勇氣獎勵欄位移除。
          base, bravery_change_count = re.subn(r'\bbraveryChange\s*:\s*[-+]?\d+\s*,', '', base)
          if bravery_change_count != 3:
              raise AssertionError(f'expected 3 braveryChange fields, removed {bravery_change_count}')
          base, add_bravery_count = re.subn(r'\baddBravery\s*:\s*[-+]?\d+\s*,', '', base)
          if add_bravery_count != 2:
              raise AssertionError(f'expected 2 addBravery fields, removed {add_bravery_count}')

          # 問早兩個選項留下 morningGreeting 行動紀錄。
          base = regex_exact(
              base,
              r'(id:\s*"A",\s*\n\s*text:\s*"校長早安！",)\s*\n(\s*)next:\s*"scene01_A_video"',
              r'\1\n\2setState: { morningGreeting: "greet" },\n\2next: "scene01_A_video"',
              label='add greet flag'
          )
          base = regex_exact(
              base,
              r'(id:\s*"B",\s*\n\s*text:\s*"今天還是有點不好意思，默默走過去。",)\s*\n(\s*)next:\s*"scene01_B_video"',
              r'\1\n\2setState: { morningGreeting: "passby" },\n\2next: "scene01_B_video"',
              label='add passby flag'
          )

          # 7) DOM 引用與 render：移除 panelBravery，保留其他面板更新。
          base = regex_exact(
              base,
              r'^\s*panelBravery:\s*document\.getElementById\(\'panel-bravery\'\),\s*\n',
              '',
              label='remove panelBravery DOM ref',
              flags=re.M
          )
          base = replace_exact(
              base,
              "            renderPlayerPanel() {\n                if (!this.dom.panelBravery) return;\n                this.dom.panelBravery.innerText = `${this.gameState.bravery} / 100`;\n                this.dom.panelObservation.innerText = this.gameState.observation;",
              "            renderPlayerPanel() {\n                if (!this.dom.panelObservation) return;\n                this.dom.panelObservation.innerText = this.gameState.observation;",
              label='remove bravery render'
          )

          # 8) gameState：正式刪除 bravery，新增非分數型 morningGreeting 行動旗標。
          base = replace_exact(
              base,
              '                    bravery: 0,\n                    trustByMember:',
              '                    trustByMember:',
              label='constructor bravery field'
          )
          base = replace_exact(
              base,
              'this.gameState = { bravery: 0, trustByMember:',
              'this.gameState = { trustByMember:',
              label='startGame bravery field'
          )
          base = replace_exact(
              base,
              '                    observation: 0,\n                    unlockedChars:',
              '                    observation: 0,\n                    morningGreeting: null,\n                    unlockedChars:',
              label='constructor morningGreeting'
          )
          base = replace_exact(
              base,
              '}, observation: 0, unlockedChars:',
              '}, observation: 0, morningGreeting: null, unlockedChars:',
              label='startGame morningGreeting'
          )

          # 9) History clone / restore：勇氣欄位移除，morningGreeting 可正常回上一步。
          base = replace_exact(
              base,
              '                    bravery: this.gameState.bravery,\n',
              '',
              label='clone bravery field'
          )
          base = replace_exact(
              base,
              '                    observation: this.gameState.observation,\n                    unlockedChars:',
              '                    observation: this.gameState.observation,\n                    morningGreeting: this.gameState.morningGreeting ?? null,\n                    unlockedChars:',
              label='clone morningGreeting'
          )
          base = replace_exact(
              base,
              '                    bravery: snapshot.gameState.bravery,\n',
              '',
              label='restore bravery field'
          )
          base = replace_exact(
              base,
              '                    observation: snapshot.gameState.observation,\n                    unlockedChars:',
              '                    observation: snapshot.gameState.observation,\n                    morningGreeting: snapshot.gameState.morningGreeting ?? null,\n                    unlockedChars:',
              label='restore morningGreeting'
          )

          # 10) 節點 addBravery 的執行邏輯與勇氣 Toast 完整刪除。
          base = replace_exact(
              base,
              '''                    if (node.addBravery) {\n                        const oldBravery = this.gameState.bravery;\n                        this.gameState.bravery = Math.max(0, Math.min(100, oldBravery + node.addBravery));\n                        const actualChange = this.gameState.bravery - oldBravery;\n                        const sign = actualChange > 0 ? "+" : "";\n                        this.showToast({ title: "【勇氣值變化】", message: `勇氣 ${sign}${actualChange}（${this.gameState.bravery}/100）`, duration: 2200 });\n                    }\n''',
              '',
              label='remove addBravery runtime'
          )

          # 11) requiredBravery 與「勇氣不足」整套門檻刪除。
          base = replace_exact(
              base,
              '''                if (choice.requiredBravery && this.gameState.bravery < choice.requiredBravery) {\n                    this.showToast({\n                        title: "【勇氣不足】",\n                        message: `需要勇氣值 ${choice.requiredBravery}`,\n                        duration: 2200\n                    });\n                    this.isShowingChoices = false;\n                    this.dom.choicesContainer.classList.remove('show');\n\n                    const failure = choice.failureResponse;\n                    if (failure) {\n                        const tempId = `_tempResponse_${++this.tempResponseCounter}`;\n                        STORY_DATA.nodes[tempId] = failure;\n                        this.loadNode(tempId, { skipHistory: true });\n                    } else if (choice.failureNext) {\n                        this.loadNode(choice.failureNext, { skipHistory: true });\n                    } else {\n                        setTimeout(() => this.loadNode(this.currentNodeId, { skipHistory: true, skipSideEffects: true }), 350);\n                    }\n                    return;\n                }\n\n''',
              '',
              label='remove requiredBravery gate'
          )

          # 12) choice braveryChange 執行與 Toast 完整刪除。
          base = replace_exact(
              base,
              '''                if (choice.braveryChange) {\n                    const oldBravery = this.gameState.bravery;\n                    this.gameState.bravery = Math.max(0, Math.min(100, oldBravery + choice.braveryChange));\n                    const actualChange = this.gameState.bravery - oldBravery;\n                    const sign = actualChange > 0 ? "+" : "";\n                    this.showToast({ title: "【勇氣值變化】", message: `勇氣 ${sign}${actualChange}（${this.gameState.bravery}/100）`, duration: 2000 });\n                    this.renderPlayerPanel();\n                }\n\n''',
              '',
              label='remove braveryChange runtime'
          )

          # 13) 選項可寫入非分數型狀態旗標。未新增 requiredFlags 等新門檻系統。
          base = replace_exact(
              base,
              '                if (choice.trustChange && choice.trustTarget) {',
              '''                if (choice.setState && typeof choice.setState === "object") {\n                    Object.entries(choice.setState).forEach(([key, value]) => {\n                        this.gameState[key] = value;\n                    });\n                }\n\n                if (choice.trustChange && choice.trustTarget) {''',
              label='generic setState support'
          )

          # 14) Day 1 日記：問早只作為中性的行動回憶。
          helper_anchor = '''    function addNode(nodes, id, node) { nodes[id] = { ...node }; }'''
          helper = '''    function getMorningGreetingDiaryLine() {\n      const greeting = engine.gameState?.morningGreeting;\n      if (greeting === "greet") return "早上｜我主動向校長說了早安。";\n      if (greeting === "passby") return "早上｜看到校長時，我最後還是默默走了過去。";\n      return "";\n    }\n\n    function getDay1DiaryText() {\n      return [\n        getMorningGreetingDiaryLine(),\n        `上午下課，我去了${getSelectedLocationName()}，在那裡遇到了小琳。`,\n        "下午，我在241自然教室拿到了自己的植物卡——迷迭香。"\n      ].filter(Boolean).join("<br><br>");\n    }\n\n    function addNode(nodes, id, node) { nodes[id] = { ...node }; }'''
          wrapper = replace_exact(wrapper, helper_anchor, helper, label='diary helper')
          wrapper = replace_exact(
              wrapper,
              'addNode(n,"ai_day1_diary",{type:"systemOverlay",title:"【Day 1 日記】",text:`上午下課，我去了${getSelectedLocationName()}，在那裡遇到了小琳。<br><br>下午，我在241自然教室拿到了自己的植物卡——迷迭香。`,next:"day1_end"});',
              'addNode(n,"ai_day1_diary",{type:"systemOverlay",title:"【Day 1 日記】",text:getDay1DiaryText(),next:"day1_end"});',
              label='initial diary text'
          )
          wrapper = replace_exact(
              wrapper,
              'STORY_DATA.nodes[nodeId].text = `上午下課，我去了${getSelectedLocationName()}，在那裡遇到了小琳。<br><br>下午，我在241自然教室拿到了自己的植物卡——迷迭香。`;',
              'STORY_DATA.nodes[nodeId].text = getDay1DiaryText();',
              label='dynamic diary text'
          )

          # 15) 靜態完整驗收：活躍 AI 版不得再有任何勇氣數值系統 token。
          forbidden = [
              r'bravery', r'requiredBravery', r'braveryChange', r'addBravery',
              r'panel-bravery', r'de-bravery', r'勇氣值', r'勇氣不足',
              r'勇氣結局', r'勇氣100', r'勇氣門檻'
          ]
          for name, text in [('AI base', base), ('AI wrapper', wrapper)]:
              for token in forbidden:
                  if re.search(token, text, flags=re.I):
                      raise AssertionError(f'{name} still contains forbidden bravery-system token: {token}')

          # 一般中文的「鼓起勇氣」只允許保留在遊戲簡介自然敘事中。
          courage_lines = [line.strip() for line in base.splitlines() if '勇氣' in line]
          assert courage_lines == ['<p>在這個學期裡，你需要鼓起勇氣認識同學與老師，學習與大家互動、合作，也一步一步認識香草園裡的植物與相關知識。</p>'], courage_lines

          # 關鍵企劃驗收。
          assert 'setState: { morningGreeting: "greet" }' in base
          assert 'setState: { morningGreeting: "passby" }' in base
          assert 'morningGreeting: null' in base
          assert 'text: "校長早安！"' in base
          assert 'text: "今天還是有點不好意思，默默走過去。"' in base
          assert '你認識的人、經歷過的事件，以及做過的選擇，都可能影響之後的校園生活。' in base
          assert '友情、主動互動與遊戲型事件' in base
          assert '人物衝突與協調事件' in base
          assert '互助、同伴鼓勵與合作事件' in base
          assert '對不起，我忘記今天星期三了",  trustChange: 5' in base or '對不起，我忘記今天星期三了", trustChange: 5' in base
          assert 'missionComplete: { title: "【任務完成】", name: "第一次香草園巡查"' in base
          assert '早上｜我主動向校長說了早安。' in wrapper
          assert '早上｜看到校長時，我最後還是默默走了過去。' in wrapper
          assert 'SEL值' not in base + wrapper
          assert '同理心值' not in base + wrapper
          assert '社交值' not in base + wrapper
          assert '自信值' not in base + wrapper
          assert 'SEL總分' not in base + wrapper

          base_path.write_text(base, encoding='utf-8')
          wrapper_path.write_text(wrapper, encoding='utf-8')
          print('Static bravery-system removal checks passed.')
          print('Remaining natural-language courage line:', courage_lines[0])
          PY
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"

      - name: Runtime smoke and history acceptance
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q websocket-client
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/herbgame-http.log 2>&1 &
          echo $! > /tmp/herbgame-http.pid
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/herbgame-chrome http://127.0.0.1:8000/herbgameai-formal.html > /tmp/herbgame-chrome.log 2>&1 &
          echo $! > /tmp/herbgame-chrome.pid
          python3 - <<'PY'
          import json, time, urllib.request
          import websocket

          def get_json(url, tries=80):
              last=None
              for _ in range(tries):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as r:
                          return json.load(r)
                  except Exception as e:
                      last=e; time.sleep(.25)
              raise last

          targets=get_json('http://127.0.0.1:9222/json/list')
          page=next(t for t in targets if t.get('type')=='page')
          ws=websocket.create_connection(page['webSocketDebuggerUrl'], timeout=20, suppress_origin=True)
          seq=0
          def cdp(method, params=None):
              global seq
              seq+=1
              ident=seq
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==ident:
                      if 'error' in msg: raise RuntimeError(msg['error'])
                      return msg.get('result',{})

          cdp('Runtime.enable')
          expr=r'''(async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            let frame,w,d,e;
            for(let i=0;i<120;i++){
              frame=document.getElementById('formal-frame');
              w=frame?.contentWindow; d=frame?.contentDocument; e=w?.gameEngine;
              if(e?.__aiVisualBranchInstalled) break;
              await sleep(50);
            }
            if(!e?.__aiVisualBranchInstalled) throw new Error('AI game engine did not initialize');
            const story=w.eval('STORY_DATA');
            const out={};
            out.home=!!d.getElementById('screen-home') && !!d.getElementById('btn-start');
            e.renderPlayerPanel();
            out.panel=!!d.getElementById('panel-observation') && !d.getElementById('panel-bravery') && !Object.prototype.hasOwnProperty.call(e.gameState,'bravery');
            out.noEndBravery=!d.getElementById('de-bravery');

            const greet=story.nodes.scene01_05.choices.find(c=>c.id==='A');
            const pass=story.nodes.scene01_05.choices.find(c=>c.id==='B');
            out.greetingData=greet.text==='校長早安！' && pass.text==='今天還是有點不好意思，默默走過去。' && greet.setState?.morningGreeting==='greet' && pass.setState?.morningGreeting==='passby' && !('braveryChange' in greet) && !('braveryChange' in pass);

            e.startGame();
            out.startNoBravery=!Object.prototype.hasOwnProperty.call(e.gameState,'bravery') && e.gameState.morningGreeting===null;
            e.currentNodeId='scene01_05';
            e.isShowingChoices=true;
            const a=d.createElement('button');a.className='choice-btn';e.dom.choicesContainer.appendChild(a);
            const aNext=greet.next; greet.next=null;
            e.handleChoiceSelection(greet,a,{stopPropagation(){}});
            out.greetRecorded=e.gameState.morningGreeting==='greet' && !Object.prototype.hasOwnProperty.call(e.gameState,'bravery');
            e.goBackOneStep();
            out.backStep=e.gameState.morningGreeting===null && !Object.prototype.hasOwnProperty.call(e.gameState,'bravery');
            await sleep(450); greet.next=aNext;

            e.startGame();
            const trustBefore=JSON.stringify(e.gameState.trustByMember);
            e.currentNodeId='scene01_05';
            e.isShowingChoices=true;
            const b=d.createElement('button');b.className='choice-btn';e.dom.choicesContainer.appendChild(b);
            const bNext=pass.next; pass.next=null;
            e.handleChoiceSelection(pass,b,{stopPropagation(){}});
            out.passRecorded=e.gameState.morningGreeting==='passby' && JSON.stringify(e.gameState.trustByMember)===trustBefore;
            await sleep(450); pass.next=bNext;

            const loud=story.nodes.scene06_02.choices.find(c=>c.id==='C');
            const honest=story.nodes.scene09_07.choices.find(c=>c.id==='B');
            out.gatherChoice=loud.text.includes('老師，我來了') && !('braveryChange' in loud);
            out.honestChoice=honest.text.includes('忘記今天星期三') && honest.trustChange===5 && !('braveryChange' in honest);
            out.mission=!!story.nodes.scene16_05.missionComplete && !('addBravery' in story.nodes.scene16_05);
            out.noBraveryGate=!JSON.stringify(story).includes('requiredBravery');

            e.gameState.morningGreeting='greet';
            e.loadNode('ai_day1_diary',{skipHistory:true,skipSideEffects:true});
            out.diaryGreet=story.nodes.ai_day1_diary.text.includes('早上｜我主動向校長說了早安。') && !story.nodes.ai_day1_diary.text.includes('勇氣');
            e.gameState.morningGreeting='passby';
            e.loadNode('ai_day1_diary',{skipHistory:true,skipSideEffects:true});
            out.diaryPass=story.nodes.ai_day1_diary.text.includes('早上｜看到校長時，我最後還是默默走了過去。') && !story.nodes.ai_day1_diary.text.includes('勇氣');

            e.showDemoEnd();
            const labels=[...d.querySelectorAll('#demo-end-screen .de-summary-row span:first-child')].map(x=>x.textContent.trim());
            out.endSummary=!labels.includes('勇氣值') && labels.includes('觀察力') && labels.includes('已認識同學') && labels.includes('我的植物') && labels.includes('陳冠瑋老師信任度') && labels.includes('許恒維老師信任度') && labels.includes('小琳羈絆度');
            out.summaryLabels=labels;
            return out;
          })()'''
          res=cdp('Runtime.evaluate',{'expression':expr,'awaitPromise':True,'returnByValue':True})
          if 'exceptionDetails' in res:
              raise RuntimeError(res['exceptionDetails'])
          value=res['result']['value']
          print(json.dumps(value,ensure_ascii=False,indent=2))
          required=['home','panel','noEndBravery','greetingData','startNoBravery','greetRecorded','backStep','passRecorded','gatherChoice','honestChoice','mission','noBraveryGate','diaryGreet','diaryPass','endSummary']
          failed=[k for k in required if value.get(k) is not True]
          if failed:
              raise AssertionError('runtime acceptance failed: '+', '.join(failed))
          ws.close()
          PY

      - name: Final source scan and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          active = Path('herbgameai-formal-base.html').read_text(encoding='utf-8') + '\n' + Path('herbgameai-formal.html').read_text(encoding='utf-8')
          tokens=['bravery','requiredBravery','braveryChange','addBravery','panel-bravery','de-bravery','勇氣值','勇氣不足','勇氣結局','勇氣100','勇氣門檻']
          bad=[t for t in tokens if re.search(re.escape(t),active,re.I)]
          assert not bad,bad
