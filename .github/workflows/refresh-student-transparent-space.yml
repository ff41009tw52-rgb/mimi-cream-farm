name: Repair student portrait deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-student-transparent-space.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and repair only the broken portrait deployment
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e5ca7bfce4494a3505e82ab905853ebd5aebb813 HEAD
          test ! -e herbgameai-formal-base.html
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,re
          mapping={
            'mint_student':'01_小琳_mint_student.png','left_student':'02_小安_left_student.png',
            'lemongrass_student':'03_小凱_lemongrass_student.png','pandan_student':'04_小樂_pandan_student.png',
            'mugwort_student':'05_小希_mugwort_student.png','fishmint_student':'06_小柏_fishmint_student.png',
            'pricklyash_student':'07_小杰_pricklyash_student.png','shellginger_student':'08_小羽_shellginger_student.png',
            'teatree_student':'09_小森_teatree_student.png','turmeric_student':'10_小辰_turmeric_student.png',
            'marigold_student':'11_小晴_marigold_student.png'}
          base=Path('picture/herb-game/ai-characters'); hashes=[]
          for sid,name in mapping.items():
            p=base/name
            if not p.exists(): raise SystemExit(f'missing valid web portrait: {name}')
            with Image.open(p) as im:
              im.load(); a=im.convert('RGBA').getchannel('A'); amin,amax=a.getextrema(); h=a.histogram(); alpha0=h[0]/(im.width*im.height)
              if im.height<900 or amin!=0 or amax!=255 or alpha0<.30: raise SystemExit(f'invalid {name}: size={im.size}, alpha={amin}-{amax}, alpha0={alpha0:.1%}')
              print('valid',sid,name,im.size,f'alpha0={alpha0:.1%}')
            hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          if len(set(hashes))!=11: raise SystemExit('valid student portraits are not unique')

          p=Path('herbgameai-formal.html'); s=p.read_text(encoding='utf-8')
          for sid,name in mapping.items():
            pat=rf'(id:\"{re.escape(sid)}\",avatar:\")[^\"]+(\"\s*,name:)'
            s,n=re.subn(pat,rf'\g<1>picture/herb-game/ai-characters/{name}\2',s,count=1)
            if n!=1: raise SystemExit(f'avatar patch failed: {sid}')
            if f'id:\"{sid}\", src:STUDENT_INFO.{sid}.avatar' not in s: raise SystemExit(f'AI_CHARACTER_ASSETS no longer reads STUDENT_INFO.avatar: {sid}')

          required=[
            '#ai-character-layer.visible.listening #ai-character-sprite{opacity:.85}',
            'if (event.repeat) return;', 'hasInteractiveKeyboardFocus',
            'playerPanel?.classList.contains(\"active\")',
            'campusMapLayer?.classList.contains(\"active\")',
            'researchTabletLayer?.classList.contains(\"active\")',
            'videoPlaceholder?.classList.contains(\"active\")',
            'locationName === \"241自然教室\"',
            'mint_student_event_01', 'getDay1DiaryText', 'plant-card-reveal-layer',
            'this.gameState.unlockedStudents.has(id)'
          ]
          for x in required:
            if x not in s: raise SystemExit(f'required existing behavior missing: {x}')
          if '_transparent.png' in s: raise SystemExit('broken _transparent portrait reference remains in production HTML')
          p.write_text(s,encoding='utf-8')
          print('production HTML paths repaired; story and interaction logic preserved')
          PY

          rm -f picture/herb-game/ai-characters/{mint_student,left_student,lemongrass_student,pandan_student,mugwort_student,fishmint_student,pricklyash_student,shellginger_student,teatree_student,turmeric_student,marigold_student}_transparent.png

      - name: Deterministic regression acceptance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/herb-js; mkdir -p /tmp/herb-js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('herbgameai-formal.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if len(blocks)<1: raise SystemExit('no inline JavaScript found')
          for i,x in enumerate(blocks): Path(f'/tmp/herb-js/{i}.js').write_text(x,encoding='utf-8')
          expected=['01_小琳_mint_student.png','02_小安_left_student.png','03_小凱_lemongrass_student.png','04_小樂_pandan_student.png','05_小希_mugwort_student.png','06_小柏_fishmint_student.png','07_小杰_pricklyash_student.png','08_小羽_shellginger_student.png','09_小森_teatree_student.png','10_小辰_turmeric_student.png','11_小晴_marigold_student.png']
          for x in expected:
            if s.count(x)!=1: raise SystemExit(f'expected avatar path count != 1: {x}: {s.count(x)}')
          if 'member-avatar-img' not in s or 'object-fit:contain' not in s or 'object-position:center bottom' not in s: raise SystemExit('gallery portrait layout missing')
          if "unlocked && info.avatar" not in s: raise SystemExit('gallery unlock gate missing')
          if "'？？<br><small>未解鎖</small>'" not in s: raise SystemExit('locked gallery state missing')
          if 'student image load failed' not in s or 'student sprite load failed' not in s: raise SystemExit('image failure handlers missing')
          print('deterministic source acceptance passed; scripts=',len(blocks))
          PY
          for js in /tmp/herb-js/*.js; do node --check "$js"; done
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          test "$(find picture/herb-game/ai-characters -maxdepth 1 -type f -name '*_transparent.png' | wc -l)" -eq 0

      - name: Commit repair and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-student-transparent-space.yml
          rm -f .github/scripts/refresh_student_transparent_space.py
          rm -f .github/scripts/herb_runtime_acceptance.cjs
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A herbgameai-formal.html picture/herb-game/ai-characters .github/workflows .github/scripts
          if git diff --cached --name-only | grep -qx herbgame-formal.html; then exit 1; fi
          test "$(git diff --cached --name-only | grep -c '_transparent.png')" -eq 11
          git commit -m 'fix: restore valid student web portraits'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate final GitHub Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ff41009tw52-rgb.github.io/mimi-cream-farm'
          ok=0
          for i in $(seq 1 48); do
            html=$(curl -fsS "$BASE/herbgameai-formal.html?v=$FINAL_SHA" || true)
            if printf '%s' "$html" | grep -q '01_小琳_mint_student.png' && ! printf '%s' "$html" | grep -q 'mint_student_transparent.png'; then ok=1; break; fi
            sleep 10
          done
          test "$ok" -eq 1
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image
          names=['01_小琳_mint_student.png','02_小安_left_student.png','03_小凱_lemongrass_student.png','04_小樂_pandan_student.png','05_小希_mugwort_student.png','06_小柏_fishmint_student.png','07_小杰_pricklyash_student.png','08_小羽_shellginger_student.png','09_小森_teatree_student.png','10_小辰_turmeric_student.png','11_小晴_marigold_student.png']
          base='https://ff41009tw52-rgb.github.io/mimi-cream-farm/picture/herb-game/ai-characters'
          for i,n in enumerate(names):
            p=Path('/tmp')/f'live-{i}.png'
            subprocess.run(['curl','-L','--fail','--silent','--show-error','-o',str(p),f'{base}/{n}'],check=True)
            with Image.open(p) as im:
              im.load(); a=im.convert('RGBA').getchannel('A'); amin,amax=a.getextrema(); h=a.histogram(); alpha0=h[0]/(im.width*im.height)
              if amin!=0 or amax!=255 or alpha0<.30: raise SystemExit(f'bad live portrait: {n}')
              print('live valid',n,im.size,f'alpha0={alpha0:.1%}')
          print('all 11 deployed student portraits decode correctly with transparency')
          PY
