name: Refresh transparent students and dialogue controls

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-student-transparent-space.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard protected formal version
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b8a0b29ba2a52063a09937c85473e0586f39a18e HEAD
          test -f herbgameai-formal.html
          test ! -e herbgameai-formal-base.html
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"

      - name: Download, verify, and patch
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .github/scripts/refresh_student_transparent_space.py

      - name: Check inline JavaScript syntax
        run: |
          set -euo pipefail
          rm -rf /tmp/herb-js && mkdir -p /tmp/herb-js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('herbgameai-formal.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          for i,b in enumerate(blocks): Path(f'/tmp/herb-js/{i:02d}.js').write_text(b,encoding='utf-8')
          print('script blocks',len(blocks))
          PY
          for js in /tmp/herb-js/*.js; do node --check "$js"; done

      - name: Local runtime acceptance
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          npm install --no-save --silent puppeteer-core@24.16.0
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/herb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          CHROME="$CHROME" node .github/scripts/herb_runtime_acceptance.cjs

      - name: Commit scoped production changes
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-student-transparent-space.yml
          rm -f .github/scripts/refresh_student_transparent_space.py
          rm -f .github/scripts/herb_runtime_acceptance.cjs
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A herbgameai-formal.html picture/herb-game/ai-characters .github/workflows .github/scripts
          if git diff --cached --name-only | grep -qx 'herbgame-formal.html'; then exit 1; fi
          test "$(git diff --cached --name-only | grep -c '_transparent.png')" -eq 11
          git commit -m "fix: use transparent student portraits and persistent dialogue focus"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for GitHub Pages and verify all 11 deployed PNGs
        run: |
          set -euo pipefail
          BASE='https://ff41009tw52-rgb.github.io/mimi-cream-farm'
          ok=0
          for i in $(seq 1 36); do
            if curl -fsS "$BASE/herbgameai-formal.html?v=$FINAL_SHA" | grep -q 'mint_student_transparent.png'; then ok=1; break; fi
            sleep 10
          done
          test "$ok" -eq 1
          for sid in mint_student left_student lemongrass_student pandan_student mugwort_student fishmint_student pricklyash_student shellginger_student teatree_student turmeric_student marigold_student; do
            code=$(curl -L -sS -o "/tmp/$sid.png" -w '%{http_code}' "$BASE/picture/herb-game/ai-characters/${sid}_transparent.png?v=$FINAL_SHA")
            test "$code" = '200'
            test "$(head -c 8 /tmp/$sid.png | xxd -p)" = '89504e470d0a1a0a'
            echo "$sid HTTP $code"
          done

      - name: GitHub Pages runtime acceptance
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          TEST_URL="https://ff41009tw52-rgb.github.io/mimi-cream-farm/herbgameai-formal.html?v=$FINAL_SHA" CHROME="$CHROME" node /home/runner/work/mimi-cream-farm/mimi-cream-farm/.github/scripts/herb_runtime_acceptance.cjs
