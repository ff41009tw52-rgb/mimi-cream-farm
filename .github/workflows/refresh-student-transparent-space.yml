name: Repair student portrait deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-student-transparent-space.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and repair only the broken portrait deployment
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e5ca7bfce4494a3505e82ab905853ebd5aebb813 HEAD
          test ! -e herbgameai-formal-base.html
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib,re
          mapping={
            'mint_student':'01_小琳_mint_student.png','left_student':'02_小安_left_student.png',
            'lemongrass_student':'03_小凱_lemongrass_student.png','pandan_student':'04_小樂_pandan_student.png',
            'mugwort_student':'05_小希_mugwort_student.png','fishmint_student':'06_小柏_fishmint_student.png',
            'pricklyash_student':'07_小杰_pricklyash_student.png','shellginger_student':'08_小羽_shellginger_student.png',
            'teatree_student':'09_小森_teatree_student.png','turmeric_student':'10_小辰_turmeric_student.png',
            'marigold_student':'11_小晴_marigold_student.png'}
          base=Path('picture/herb-game/ai-characters'); hashes=[]
          for sid,name in mapping.items():
            p=base/name
            with Image.open(p) as im:
              im.load(); a=im.convert('RGBA').getchannel('A'); amin,amax=a.getextrema(); h=a.histogram(); alpha0=h[0]/(im.width*im.height)
              if im.height<900 or amin!=0 or amax!=255 or alpha0<.30: raise SystemExit(f'invalid {name}')
              print('valid',sid,name,im.size,f'alpha0={alpha0:.1%}')
            hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          if len(set(hashes))!=11: raise SystemExit('duplicate valid portraits')
          p=Path('herbgameai-formal.html'); s=p.read_text(encoding='utf-8')
          for sid,name in mapping.items():
            pat=rf'(id:\"{re.escape(sid)}\",avatar:\")[^\"]+(\"\s*,name:)'
            s,n=re.subn(pat,rf'\g<1>picture/herb-game/ai-characters/{name}\2',s,count=1)
            if n!=1: raise SystemExit(f'avatar patch failed {sid}')
            if f'id:\"{sid}\", src:STUDENT_INFO.{sid}.avatar' not in s: raise SystemExit(f'asset map broken {sid}')
          required=['#ai-character-layer.visible.listening #ai-character-sprite{opacity:.85}','if (event.repeat) return;','hasInteractiveKeyboardFocus','locationName === \"241自然教室\"','mint_student_event_01','getDay1DiaryText','plant-card-reveal-layer']
          for x in required:
            if x not in s: raise SystemExit(f'missing behavior {x}')
          if '_transparent.png' in s: raise SystemExit('broken portrait ref remains')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f picture/herb-game/ai-characters/{mint_student,left_student,lemongrass_student,pandan_student,mugwort_student,fishmint_student,pricklyash_student,shellginger_student,teatree_student,turmeric_student,marigold_student}_transparent.png

      - name: Syntax and local runtime acceptance
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/herb-js; mkdir -p /tmp/herb-js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('herbgameai-formal.html').read_text(encoding='utf-8'); b=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,x in enumerate(b): Path(f'/tmp/herb-js/{i}.js').write_text(x,encoding='utf-8')
          print('script blocks',len(b))
          PY
          for js in /tmp/herb-js/*.js; do node --check "$js"; done
          npm install --no-save --package-lock=false --silent puppeteer-core@24.16.0
          cat > /tmp/herb-runtime.cjs <<'JS'
          const puppeteer=require('puppeteer-core'),assert=require('assert'); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const base=process.env.TEST_URL||'http://127.0.0.1:8000/herbgameai-formal.html',url=base+(base.includes('?')?'&':'?')+'preview=xiaolin-event-01';
          const ids=['mint_student','left_student','lemongrass_student','pandan_student','mugwort_student','fishmint_student','pricklyash_student','shellginger_student','teatree_student','turmeric_student','marigold_student'];
          (async()=>{const b=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});const p=await b.newPage();const errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto(url,{waitUntil:'networkidle2',timeout:60000});await p.waitForFunction(()=>window.gameEngine&&window.__HERBGAME_AI_VISUAL,{timeout:30000});await p.waitForFunction(()=>{const e=document.querySelector('#ai-character-sprite');return e?.src.includes('01_小琳_mint_student.png')&&e.complete&&e.naturalWidth>0},{timeout:30000});let a=await p.evaluate(()=>{const e=document.querySelector('#ai-character-sprite'),r=e.getBoundingClientRect();return{id:gameEngine.currentNodeId,src:e.getAttribute('src'),o:getComputedStyle(e).opacity,x:r.x,w:r.width,h:r.height}});assert.equal(a.id,'ai_mint_e01_01');assert.equal(a.o,'1');let z=await p.evaluate(()=>{const e=document.querySelector('#ai-character-sprite'),c=document.createElement('canvas');c.width=e.naturalWidth;c.height=e.naturalHeight;let x=c.getContext('2d');x.drawImage(e,0,0);let d=x.getImageData(0,0,c.width,c.height).data,n=0;for(let i=3;i<d.length;i+=4)if(d[i]===0)n++;return n/(d.length/4)});assert(z>.3);await p.evaluate(()=>{window.__r=0;document.querySelector('#ai-character-sprite').addEventListener('load',()=>window.__r++)});if(await p.evaluate(()=>gameEngine.isTyping)){await p.keyboard.press('Space');await sleep(80)}await p.keyboard.press('Space');await p.waitForFunction(()=>gameEngine.currentNodeId==='ai_mint_e01_02',{timeout:5000});await sleep(220);let q=await p.evaluate(()=>{const e=document.querySelector('#ai-character-sprite'),r=e.getBoundingClientRect();return{o:getComputedStyle(e).opacity,x:r.x,w:r.width,h:r.height,r:window.__r}});assert.equal(q.o,'0.85');assert.equal(q.r,0);assert(Math.abs(q.x-a.x)<1&&Math.abs(q.w-a.w)<1&&Math.abs(q.h-a.h)<1);await p.evaluate(ids=>{ids.forEach(id=>gameEngine.gameState.unlockedStudents.add(id));gameEngine.renderPlayerPanel()},ids);let g=await p.$$eval('#member-list img.member-avatar-img',es=>es.map(e=>e.getAttribute('src')).filter(x=>x?.includes('ai-characters/')));assert.equal(g.length,11);assert.equal(new Set(g).size,11);assert(g.every(x=>!x.includes('_transparent.png')));if(errs.length)throw Error(errs.join('\n'));console.log('runtime passed',{alpha0:z,gallery:g.length});await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/herb-http.log 2>&1 & PID=$!; trap 'kill $PID || true' EXIT
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; test -n "$CHROME"
          NODE_PATH="$PWD/node_modules" CHROME="$CHROME" node /tmp/herb-runtime.cjs

      - name: Commit repair and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-student-transparent-space.yml .github/scripts/refresh_student_transparent_space.py .github/scripts/herb_runtime_acceptance.cjs
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A herbgameai-formal.html picture/herb-game/ai-characters .github/workflows .github/scripts
          if git diff --cached --name-only | grep -qx herbgame-formal.html; then exit 1; fi
          test "$(git diff --cached --name-only | grep -c '_transparent.png')" -eq 11
          git commit -m 'fix: restore valid student web portraits'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate live Pages images and runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ff41009tw52-rgb.github.io/mimi-cream-farm'; ok=0
          for i in $(seq 1 36); do if curl -fsS "$BASE/herbgameai-formal.html?v=$FINAL_SHA" | grep -q '01_小琳_mint_student.png'; then ok=1; break; fi; sleep 10; done; test "$ok" -eq 1
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image
          names=['01_小琳_mint_student.png','02_小安_left_student.png','03_小凱_lemongrass_student.png','04_小樂_pandan_student.png','05_小希_mugwort_student.png','06_小柏_fishmint_student.png','07_小杰_pricklyash_student.png','08_小羽_shellginger_student.png','09_小森_teatree_student.png','10_小辰_turmeric_student.png','11_小晴_marigold_student.png']
          for i,n in enumerate(names):
            p=Path('/tmp')/f'live{i}.png'; subprocess.run(['curl','-L','-f','-sS','-o',str(p),f'https://ff41009tw52-rgb.github.io/mimi-cream-farm/picture/herb-game/ai-characters/{n}'],check=True)
            with Image.open(p) as im: im.load(); a=im.convert('RGBA').getchannel('A'); assert a.getextrema()==(0,255); print('live valid',n,im.size)
          PY
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          NODE_PATH="$PWD/node_modules" TEST_URL="$BASE/herbgameai-formal.html?v=$FINAL_SHA" CHROME="$CHROME" node /tmp/herb-runtime.cjs
