name: Clear incomplete Pages deployment
on:
  push:
    branches: [repair/cancel-stuck-pages-20261101]
    paths: [.github/workflows/cancel-stuck-pages.yml]
permissions:
  contents: read
  pages: write
jobs:
  inspect-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect old and current Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in 818dfb5b68878edfe0251f2fcff1d4b1f3af4e59; do
            echo "Deployment: $sha"
            curl --fail-with-body --silent --show-error --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/ff41009tw52-rgb/mimi-cream-farm/pages/deployments/$sha/cancel"
            echo
          done
