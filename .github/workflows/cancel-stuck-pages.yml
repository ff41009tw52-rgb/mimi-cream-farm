name: Cancel stuck Pages deployment
on:
  push:
    branches: [repair/cancel-stuck-pages-20261101]
    paths: [.github/workflows/cancel-stuck-pages.yml]
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the blocked Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ff41009tw52-rgb/mimi-cream-farm/pages/deployments/dc9d37b0e15156b0951ca76bb2819498fc502e3d/cancel"
          echo "Requested cancellation of the stuck Pages deployment."
