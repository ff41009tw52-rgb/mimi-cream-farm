name: Clear incomplete homepage deployments
on:
  push:
    branches: [repair/cancel-stuck-pages-20261101]
    paths: [.github/workflows/cancel-stuck-pages.yml]
permissions:
  contents: read
  pages: write
  actions: write
jobs:
  clear-incomplete-deployments:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop waiting workflow and cancel incomplete Pages records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/ff41009tw52-rgb/mimi-cream-farm/actions/runs/41290588953/cancel"
          for sha in f292fecebdc241afa7871dfda378761c60a58055 818dfb5b68878edfe0251f2fcff1d4b1f3af4e59; do
            echo "Cancel incomplete deployment: $sha"
            curl --silent --show-error --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/ff41009tw52-rgb/mimi-cream-farm/pages/deployments/$sha/cancel"
            echo
          done
