name: Verify circuit and badge fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused fixes
        run: python3 tools/patch_08_09.py

      - name: Install Chromium test tools
        run: |
          mkdir -p /tmp/circuit-badge-test
          npm install --prefix /tmp/circuit-badge-test playwright@1.55.0
          npx --prefix /tmp/circuit-badge-test playwright install --with-deps chromium

      - name: Test 08 circuits and 09 badges in a browser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/static-server.log 2>&1 &
          cat > /tmp/circuit-badge-test/verify.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const problems = [];
          let circuits = null;
          let badges = null;

          const check08 = await browser.newPage({ viewport: { width: 1366, height: 900 } });
          const errors08 = [];
          check08.on('pageerror', error => errors08.push(error.message));
          await check08.goto('http://127.0.0.1:4173/08.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await check08.waitForTimeout(1800);
          circuits = await check08.evaluate(() => {
            const evaluateCircuit = window.__evaluateCircuit08;
            if (!evaluateCircuit) return { missingEvaluator: true };
            const battery = { id: 'bat-1', type: 'battery' };
            const bulb1 = { id: 'bulb-1', type: 'bulb' };
            const bulb2 = { id: 'bulb-2', type: 'bulb' };
            const wire = (a, at, b, bt) => ({ start: { compId: a, pointType: at }, end: { compId: b, pointType: bt } });
            const ids = result => [...result.litBulbIds].sort().join(',');
            const shortResult = evaluateCircuit([battery, bulb1], [wire('bat-1','pos','bat-1','neg')]);
            return {
              single: ids(evaluateCircuit([battery, bulb1], [wire('bat-1','pos','bulb-1','tip'), wire('bat-1','neg','bulb-1','thread')])),
              unconnectedExtra: ids(evaluateCircuit([battery, bulb1, bulb2], [wire('bat-1','pos','bulb-1','tip'), wire('bat-1','neg','bulb-1','thread')])),
              incompleteExtra: ids(evaluateCircuit([battery, bulb1, bulb2], [wire('bat-1','pos','bulb-1','tip'), wire('bat-1','neg','bulb-1','thread'), wire('bat-1','pos','bulb-2','tip')])),
              parallel: ids(evaluateCircuit([battery, bulb1, bulb2], [wire('bat-1','pos','bulb-1','tip'), wire('bat-1','neg','bulb-1','thread'), wire('bat-1','pos','bulb-2','tip'), wire('bat-1','neg','bulb-2','thread')])),
              series: ids(evaluateCircuit([battery, bulb1, bulb2], [wire('bat-1','pos','bulb-1','tip'), wire('bulb-1','thread','bulb-2','tip'), wire('bulb-2','thread','bat-1','neg')])),
              short: { lit: ids(shortResult), directShort: shortResult.directShort },
            };
          });
          if (errors08.length || circuits.missingEvaluator || circuits.single !== 'bulb-1' || circuits.unconnectedExtra !== 'bulb-1' || circuits.incompleteExtra !== 'bulb-1' || circuits.parallel !== 'bulb-1,bulb-2' || circuits.series !== 'bulb-1,bulb-2' || circuits.short.lit !== '' || circuits.short.directShort !== true) {
            problems.push({ page: '08.html', errors: errors08, circuits });
          }
          await check08.close();

          const check09 = await browser.newPage({ viewport: { width: 1366, height: 900 } });
          const errors09 = [];
          check09.on('pageerror', error => errors09.push(error.message));
          await check09.goto('http://127.0.0.1:4173/09.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await check09.waitForTimeout(800);
          badges = await check09.evaluate(() => {
            const originalChangeMission = game.changeMission;
            const originalShowResult = game.showResult;
            const originalFloat = game.showFloatingText;
            const originalUpdate = game.updateUI;
            let resultCalls = [];
            game.changeMission = () => {};
            game.showResult = (isWin) => resultCalls.push(isWin);
            game.showFloatingText = () => {};
            game.updateUI = () => {};
            const item = type => ({ data: { type } });
            const resetFor = type => {
              game.state.score = 0;
              game.state.lives = 3;
              game.state.currentMission = game.missions.find(mission => mission.type === type);
              game.state.currentMissionTarget = 2;
              game.state.missionItemsCollected = 0;
              game.state.completedBadges = new Set();
              resultCalls = [];
            };
            resetFor('acid');
            game.handleCollection(item('acid'));
            const afterOne = { progress: game.state.missionItemsCollected, badges: [...game.state.completedBadges] };
            game.handleCollection(item('acid'));
            const afterTwo = { progress: game.state.missionItemsCollected, badges: [...game.state.completedBadges] };
            for (const type of ['base', 'neutral']) {
              game.state.currentMission = game.missions.find(mission => mission.type === type);
              game.state.missionItemsCollected = 0;
              game.handleCollection(item(type));
              game.handleCollection(item(type));
            }
            const earnedAll = [...game.state.completedBadges].sort();
            const winCalls = [...resultCalls];
            resetFor('acid');
            game.handleCollection(item('base'));
            const wrong = { lives: game.state.lives, badges: [...game.state.completedBadges], progress: game.state.missionItemsCollected };
            game.changeMission = originalChangeMission;
            game.showResult = originalShowResult;
            game.showFloatingText = originalFloat;
            game.updateUI = originalUpdate;
            return { afterOne, afterTwo, earnedAll, winCalls, wrong };
          });
          if (errors09.length || badges.afterOne.progress !== 1 || badges.afterOne.badges.length !== 0 || badges.afterTwo.badges.join(',') !== 'acid' || badges.earnedAll.join(',') !== 'acid,base,neutral' || !badges.winCalls.includes(true) || badges.wrong.lives !== 2 || badges.wrong.badges.length !== 0 || badges.wrong.progress !== 0) {
            problems.push({ page: '09.html', errors: errors09, badges });
          }
          await check09.close();

          await browser.close();
          fs.writeFileSync('/tmp/circuit-badge-test/results.json', JSON.stringify({ circuits, badges, problems }, null, 2));
          if (problems.length) {
            console.error(JSON.stringify(problems, null, 2));
            process.exit(1);
          }
          console.log('08 circuit cases and 09 badge cases passed.');
          NODE
          node /tmp/circuit-badge-test/verify.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-badge-verification
          path: /tmp/circuit-badge-test/results.json
          if-no-files-found: warn

      - name: Commit only the verified website fixes
        run: |
          git rm -f tools/patch_08_09.py .github/workflows/verify-08-09-fix.yml tools/trigger-verify-08-09.txt
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add 08.html 09.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: correct circuit and badge game logic"
          git push
