name: Sync herb student characters from Drive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-herb-characters.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download 11 final transparent student PNGs from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p picture/herb-game/ai-characters

          download_png() {
            local id="$1"
            local out="$2"
            local url="https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            echo "Downloading ${out}"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 -o "${out}" "${url}"
            python -c "import pathlib,struct,sys; p=pathlib.Path(sys.argv[1]); d=p.read_bytes(); assert len(d)>=32 and d[:8]==b'\\x89PNG\\r\\n\\x1a\\n', f'Not a valid PNG: {p} ({len(d)} bytes)'; w,h=struct.unpack('>II',d[16:24]); assert w>=500 and h>=700, f'Unexpected PNG dimensions: {p}={w}x{h}'; print(f'OK {p.name}: {w}x{h}, {len(d)} bytes')" "${out}"
          }

          download_png '1etFumWOsRzXMg8xLStUOEJjM112DSEYc' 'picture/herb-game/ai-characters/01_小琳_mint_student_transparent_v2.png'
          download_png '100dlw2OoGsuvKGAsTvRObTb6rxYAmOcR' 'picture/herb-game/ai-characters/02_小安_left_student_transparent_v2.png'
          download_png '1o6NbWyrXWaHy2cfi12f_D4DmqhtjeW3X' 'picture/herb-game/ai-characters/03_小凱_lemongrass_student_transparent_v2.png'
          download_png '1jSNzmKn3gVXJSC3LxCGSoAjdY6kiyLOn' 'picture/herb-game/ai-characters/04_小樂_pandan_student_transparent_v2.png'
          download_png '1-CCw6whKxArcXbRC_Bf9IyF7aLaoHcVP' 'picture/herb-game/ai-characters/05_小希_mugwort_student_transparent_v2.png'
          download_png '1HCgoKTtemi2IF_7PCVCh6w_fEVP0nquz' 'picture/herb-game/ai-characters/06_小柏_fishmint_student_transparent_v2.png'
          download_png '1VCo2dmho8chozFOkshuzvWDJq4CNyqh2' 'picture/herb-game/ai-characters/07_小杰_pricklyash_student_transparent_v2.png'
          download_png '1KVgEvoCVpmH2wPM8-nOSGIrkfFwdeheS' 'picture/herb-game/ai-characters/08_小羽_shellginger_student_transparent_v2.png'
          download_png '1PHwaFgbhkfxpZ7AMRCQP25tAxXHZCxbk' 'picture/herb-game/ai-characters/09_小森_teatree_student_transparent_v2.png'
          download_png '1CT8-yIyZ-E7Jf90kSOXDBAJ-ducZoEL-' 'picture/herb-game/ai-characters/10_小辰_turmeric_student_transparent_v2.png'
          download_png '1ENyYdS41HpWjSbqfozjIT4Fv_QKeEw2Y' 'picture/herb-game/ai-characters/11_小晴_marigold_student_transparent_v2.png'

      - name: Update AI version character paths only
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('herbgameai-formal.html'); s=p.read_text(encoding='utf-8'); pairs=[('01_小琳_mint_student.png','01_小琳_mint_student_transparent_v2.png'),('02_小安_left_student.png','02_小安_left_student_transparent_v2.png'),('03_小凱_lemongrass_student.png','03_小凱_lemongrass_student_transparent_v2.png'),('04_小樂_pandan_student.png','04_小樂_pandan_student_transparent_v2.png'),('05_小希_mugwort_student.png','05_小希_mugwort_student_transparent_v2.png'),('06_小柏_fishmint_student.png','06_小柏_fishmint_student_transparent_v2.png'),('07_小杰_pricklyash_student.png','07_小杰_pricklyash_student_transparent_v2.png'),('08_小羽_shellginger_student.png','08_小羽_shellginger_student_transparent_v2.png'),('09_小森_teatree_student.png','09_小森_teatree_student_transparent_v2.png'),('10_小辰_turmeric_student.png','10_小辰_turmeric_student_transparent_v2.png'),('11_小晴_marigold_student.png','11_小晴_marigold_student_transparent_v2.png')]; prefix='picture/herb-game/ai-characters/'; [None for old,new in pairs if not (s:=s.replace(prefix+old,prefix+new))]; missing=[new for _,new in pairs if prefix+new not in s]; assert not missing, f'Missing updated paths: {missing}'; p.write_text(s,encoding='utf-8'); print('Updated herbgameai-formal.html only.')"
          git diff --exit-code -- herbgame-formal.html

      - name: Commit and push synced assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add herbgameai-formal.html picture/herb-game/ai-characters/*_transparent_v2.png
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'sync: update AI student character assets from Drive'
          git push origin HEAD:main
