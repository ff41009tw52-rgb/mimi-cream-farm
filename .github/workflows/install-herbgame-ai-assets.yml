name: Install herbgame AI assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-herbgame-ai-assets.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate AI asset package
        env:
          ASSET_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/316e917a-cd6a-459a-a88c-899a71af8d7f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDY1ZmQ3MGQ4NTJmNzhjYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTE1MjI2OX0.1f5jJCgUzkFPztaw8sFE7bNvLBevsy_TRGnVpRo2X0Q'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$ASSET_URL" --output "$RUNNER_TEMP/herbgame-ai-transfer.png"
          unzip -q "$RUNNER_TEMP/herbgame-ai-transfer.png" -d "$RUNNER_TEMP/herbgame-ai-assets"
          cp -a "$RUNNER_TEMP/herbgame-ai-assets/picture/." picture/
          test "$(find picture/herb-game/ai-backgrounds -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 18
          test "$(find picture/herb-game/ai-characters -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 11
          test -f picture/herb-game/ai-backgrounds/scene-20-playground.jpg
          test -f picture/herb-game/ai-characters/01_小琳_mint_student.png
          grep -q 'ai-backgrounds/scene-20-playground.jpg' herbgameai-formal.html
          grep -q 'ai-characters/01_小琳_mint_student.png' herbgameai-formal.html
          if grep -q 'drive.google.com' herbgameai-formal.html; then echo 'Drive hotlink found'; exit 1; fi

      - name: Commit installed assets and remove one-shot installer
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-herbgame-ai-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: install herb game AI visual assets"
          git push origin HEAD:main
