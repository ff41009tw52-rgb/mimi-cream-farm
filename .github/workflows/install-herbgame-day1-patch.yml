name: Install herbgame Day 1 patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-herbgame-day1-patch.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, validate, and install Day 1 patch
        env:
          ASSET_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/2203e700-785d-4e95-834b-ed068624715c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzAxMzYxODIyNDYwMmE5YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTIwNjAxOH0.ZphCO_WT4eVHFJh1H2bJrLU3aQgvWKMNi7uBEJR__B0'
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          curl --fail --location --retry 3 --retry-delay 2 "$ASSET_URL" --output "$RUNNER_TEMP/day1-ai-patch-transfer.png"
          echo '74eec23262f1e48620ded308fe835df57f753c64b154b7704b9c01f797c0b051  '"$RUNNER_TEMP/day1-ai-patch-transfer.png" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/day1-ai-patch"
          set +e
          unzip -q "$RUNNER_TEMP/day1-ai-patch-transfer.png" -d "$RUNNER_TEMP/day1-ai-patch"
          unzip_rc=$?
          set -e
          test "$unzip_rc" -le 1
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'day1-ai-patch'
          manifest=json.loads((root/'day1-ai-patch-manifest.json').read_text(encoding='utf-8'))
          for rel, expected in manifest.items():
              actual=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              assert actual == expected, (rel, actual, expected)
          print(f'validated {len(manifest)} patch files')
          PY
          test "$(find "$RUNNER_TEMP/day1-ai-patch/picture/herb-game/plant-cards" -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 12
          grep -q 'mint_student_event_01' "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html"
          grep -q '欸！是你！' "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html"
          grep -q '早上最後一個跑到香草園的那個！' "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html"
          grep -q '早上許老師讓我們觀察的時候給我的' "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html"
          grep -q 'plantCardReveal:"rosemary"' "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html"
          grep -q 'background:rgba(0,0,0,.44)' "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html"
          if grep -q 'drive.google.com' "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html"; then echo 'Drive hotlink found'; exit 1; fi
          cp "$RUNNER_TEMP/day1-ai-patch/herbgameai-formal.html" herbgameai-formal.html
          mkdir -p picture/herb-game/plant-cards
          cp -a "$RUNNER_TEMP/day1-ai-patch/picture/herb-game/plant-cards/." picture/herb-game/plant-cards/
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"

      - name: Commit Day 1 patch and remove one-shot installer
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-herbgame-day1-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -qx 'herbgame-formal.html'; then echo 'Protected formal file was staged'; exit 1; fi
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete Day 1 Xiaolin event and plant card reveals"
          git push origin HEAD:main
