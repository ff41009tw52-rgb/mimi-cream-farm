name: One-shot center Guanwei interrogation portrait
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-center-guanwei-interrogation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch interrogation portrait behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('herbgame.html')
          text = p.read_text(encoding='utf-8')

          old_css = '''        .speaker-portrait {
            position: absolute;
            left: 1.25rem;
            bottom: calc(100% - 5px);
            width: clamp(170px, 22vw, 260px);
            max-height: 330px;
            object-fit: contain;
            z-index: 16;
            pointer-events: none;
            background: rgba(255,255,255,0.98);
            border: 3px solid rgba(255,255,255,0.92);
            border-bottom: 0;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 10px 24px rgba(0,0,0,0.32);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .speaker-portrait.hidden { display: none; }
        .dialogue-wrapper.has-portrait .choices-container { width: min(62%, 720px); left: 64%; }
        @media (max-width: 768px) {
            .speaker-portrait { left: 0.2rem; width: 155px; max-height: 230px; bottom: calc(100% - 3px); }
            .dialogue-wrapper.has-portrait .choices-container { width: 65%; left: 66%; }
        }'''

          new_css = '''        .speaker-portrait {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 1.5vh);
            transform: translateX(-50%);
            width: clamp(260px, 30vw, 430px);
            max-height: 54vh;
            object-fit: contain;
            z-index: 12;
            pointer-events: none;
            background: transparent;
            border: 0;
            border-radius: 24px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.32);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .speaker-portrait.hidden { display: none; }
        @media (max-width: 768px) {
            .speaker-portrait {
                width: clamp(230px, 52vw, 340px);
                max-height: 50vh;
                bottom: calc(100% + 1vh);
            }
        }'''

          if old_css not in text:
              raise SystemExit('portrait CSS block not found')
          text = text.replace(old_css, new_css, 1)

          start = text.index('            getPortraitForNode(node) {')
          end = text.index('\n            showDialogue(node) {', start)
          new_functions = '''            getPortraitForNode(node) {
                if (!node) return null;

                // 人物圖只在「老師質疑主角」這段事件顯示，不跟著一般對話常駐。
                const text = node.text || "";
                const interrogationTexts = [
                    "那邊那位同學。",
                    "……？",
                    "你是不是剛到？",
                    "是嗎？",
                    "……巡視校園？"
                ];

                if (interrogationTexts.some(t => text.includes(t))) {
                    // 使用已確認可正常顯示的嚴肅／叉腰照片；版本參數避免舊快取。
                    return "picture/herb-game/characters/chen-guanwei-normal.jpg?v=20260906-interrogation-center";
                }
                return null;
            }

            updateSpeakerPortrait(node) {
                const portraitEl = this.dom.speakerPortrait;
                const portraitPath = this.getPortraitForNode(node);

                if (portraitPath) {
                    portraitEl.src = portraitPath;
                    portraitEl.classList.remove('hidden');
                } else {
                    portraitEl.removeAttribute('src');
                    portraitEl.classList.add('hidden');
                }
            }
'''
          text = text[:start] + new_functions + text[end:]

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-center-guanwei-interrogation.yml
          git add herbgame.html
          git commit -m 'Center Guanwei portrait during protagonist interrogation only'
          git push
