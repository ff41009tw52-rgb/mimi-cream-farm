name: Apply Day1 2026-09-13 patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/day1-20260913.payload'
      - '.github/workflows/day1-20260913-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode verified patch builder and stabilize smoke assertions
        shell: bash
        run: |
          git show 53abd913564e5619568f4dfccb67730068fb0430:tools/day1-20260913.payload > /tmp/day1-verified.payload
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = Path('/tmp/day1-verified.payload').read_text().strip()
          p = Path('/tmp/build_day1_patch.py')
          p.write_bytes(gzip.decompress(base64.b64decode(data)))
          s = p.read_text(encoding='utf-8')

          old1 = "      assert(!JSON.stringify(Object.values(n).filter(x => String(x?.day1PortraitManaged))).includes('全部拔掉最快'), 'removed weed option still reachable in Day1 patch');"
          new1 = "      assert(!n.d1_20260913_garden_08?.choices?.some(choice => String(choice?.text || '').includes('全部拔掉最快')), 'removed weed option still reachable in garden choice');"

          old2 = "      engine.finishTyping?.(n.d1_20260913_kai_08); await wait(40);\n      const cardLayer = doc.getElementById('plant-card-reveal-layer');\n      assert(cardLayer?.classList.contains('active'), 'plant card did not open');\n      doc.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true,cancelable:true}));\n      await wait(30);\n      assert(engine.currentNodeId === 'd1_20260913_kai_08', 'first Space advanced past card node');\n      assert(!cardLayer?.classList.contains('active'), 'first Space did not close plant card');"
          new2 = "      engine.finishTyping?.(n.d1_20260913_kai_08);\n      const cardLayer = doc.getElementById('plant-card-reveal-layer');\n      for (let i=0; i<20 && cardLayer?.getAttribute('aria-hidden') !== 'false'; i++) await wait(25);\n      assert(cardLayer?.getAttribute('aria-hidden') === 'false', 'plant card did not open');\n      doc.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true,cancelable:true}));\n      await wait(100);\n      assert(engine.currentNodeId === 'd1_20260913_kai_08', 'first Space advanced past card node');\n      assert(cardLayer?.getAttribute('aria-hidden') === 'true', 'first Space did not close plant card');\n      assert(!cardLayer?.classList.contains('active'), 'plant card active class returned after close');"

          old3 = "      assert(engine.dom?.choicesContainer?.classList.contains('show'), 'choice UI not visible after Space');\n\n      // Plant card: first Space closes only; second advances and restores student portrait."
          new3 = "      assert(engine.dom?.choicesContainer?.classList.contains('show'), 'choice UI not visible after Space');\n      engine.isShowingChoices = false;\n      engine.dom?.choicesContainer?.classList.remove('show');\n      if (engine.dom?.choicesContainer) engine.dom.choicesContainer.innerHTML = '';\n\n      // Plant card: first Space closes only; second advances and restores student portrait."

          assert old1 in s and old2 in s and old3 in s, 'verified payload no longer matches expected smoke harness'
          s = s.replace(old1, new1).replace(old2, new2).replace(old3, new3)

          # AI-only hardening: a delayed nested rAF must not re-activate a card after Space already closed it.
          old_apply = "    text = path.read_text(encoding='utf-8')\n    start = '    <script id=\"day1-20260913-patch\">'"
          new_apply = "    text = path.read_text(encoding='utf-8')\n    card_raf = 'requestAnimationFrame(() => requestAnimationFrame(() => plantCardLayer.classList.add(\"active\")));'\n    guarded_card_raf = 'requestAnimationFrame(() => requestAnimationFrame(() => { if (plantCardActive) plantCardLayer.classList.add(\"active\"); }));'\n    if card_raf in text:\n        text = text.replace(card_raf, guarded_card_raf, 1)\n    start = '    <script id=\"day1-20260913-patch\">'"
          assert old_apply in s, 'apply() marker missing'
          s = s.replace(old_apply, new_apply)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 /tmp/build_day1_patch.py
      - name: Verify target isolation and syntax
        shell: bash
        run: |
          git diff --check
          git diff --exit-code HEAD -- herbgame-formal.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('herbgameai-formal.html').read_text(encoding='utf-8')
          assert 'if (plantCardActive) plantCardLayer.classList.add("active")' in html, 'plant-card race guard missing'
          m=re.search(r'<script id="day1-20260913-patch">(.*?)</script><!-- /day1-20260913-patch -->', html, re.S)
          assert m, 'Day1 patch script missing'
          Path('/tmp/day1-patch.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/day1-patch.js
      - name: Browser smoke test
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/day1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          timeout 40s "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8765/herbgameai-formal.html?selftest=day1-20260913' >/tmp/day1-dom.txt 2>/tmp/day1-chrome.log
          if ! grep -Eq '<pre id="day1-selftest-result"[^>]*>DAY1_SELFTEST_PASS</pre>' /tmp/day1-dom.txt; then
            grep -A40 -B2 '<pre id="day1-selftest-result"' /tmp/day1-dom.txt || true
            tail -100 /tmp/day1-chrome.log || true
            tail -40 /tmp/day1-http.log || true
            exit 1
          fi
      - name: Commit tested AI Day1 update and remove temporary patch tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add herbgameai-formal.html
          git rm -f .github/workflows/day1-20260913-apply.yml tools/day1-20260913.payload
          git commit -m 'feat: implement integrated Day 1 story and portrait sync'
          git push origin HEAD:main
