name: Verify sand separation animation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply sand animation repair
        run: python3 tools/patch_05_sand_animation.py

      - name: Install Chromium
        run: |
          mkdir -p /tmp/sand-check
          npm install --prefix /tmp/sand-check playwright@1.55.0
          npx --prefix /tmp/sand-check playwright install --with-deps chromium

      - name: Verify final pile and replay
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/static-server.log 2>&1 &
          cat > /tmp/sand-check/verify.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          await page.goto('http://127.0.0.1:4173/05.html', { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(900);
          const initial = await page.evaluate(() => {
            const home = document.getElementById('farm-home-button')?.getBoundingClientRect();
            return {
              helper: typeof window.__prepareReplay05 === 'function',
              right: Boolean(home && window.innerWidth - home.right <= 20),
              setting: document.body.dataset.farmHomePosition,
            };
          });
          await page.evaluate(() => window.__prepareReplay05(4));
          await page.waitForTimeout(7500);
          const middle = await page.evaluate(() => window.__getSandLabState05());
          await page.waitForTimeout(11000);
          const final = await page.evaluate(() => ({
            ...window.__getSandLabState05(),
            resultVisible: document.getElementById('finalResultCard').classList.contains('show'),
          }));
          await page.screenshot({ path: '/tmp/sand-check/05-final.png', fullPage: true });
          await page.evaluate(() => window.__prepareReplay05(4));
          await page.waitForTimeout(2500);
          const replay = await page.evaluate(() => window.__getSandLabState05());
          await page.screenshot({ path: '/tmp/sand-check/05-replay.png', fullPage: true });
          await browser.close();
          const report = { initial, middle, final, replay, errors };
          fs.writeFileSync('/tmp/sand-check/report.json', JSON.stringify(report, null, 2));
          const failed = errors.length || !initial.helper || !initial.right || initial.setting !== 'right' ||
            middle.step !== 4 || middle.sandDeposited < 35 || middle.pileMaximum <= 0 ||
            final.step !== 5 || !final.resultVisible || final.sandDeposited < 112 || final.pileMaximum < 20 ||
            replay.step !== 4 || replay.sandDeposited < 3 || replay.pileMaximum <= 0;
          if (failed) { console.error(JSON.stringify(report, null, 2)); process.exit(1); }
          NODE
          node /tmp/sand-check/verify.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sand-animation-verification
          path: /tmp/sand-check
          if-no-files-found: warn

      - name: Commit verified webpage only
        run: |
          git rm -f tools/patch_05_sand_animation.py tools/sitecustomize.py tools/trigger-05-animation-check.txt .github/workflows/verify-05-sand-animation.yml
          rmdir tools 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add 05.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: retain sand during filtering animation"
          git push
