name: One-shot fix herbgame left-right answer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-herbgame-choice.yml'

permissions:
  contents: write

jobs:
  fix-choice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix Scene 14 left-right answer
        shell: python
        run: |
          from pathlib import Path

          path = Path('herbgame.html')
          text = path.read_text(encoding='utf-8')

          old_left = '{ id: "A", text: "左邊", isCorrect: true, response: { speaker: "許恒維老師", speakerType: "npc", text: "沒錯。", next: "scene16_01" } },'
          new_left = '{ id: "A", text: "左邊", isCorrect: false, response: { speaker: "許恒維老師", speakerType: "npc", text: "再看仔細一點。", next: "scene14_wrong" } },'
          old_right = '{ id: "B", text: "右邊", isCorrect: false, response: { speaker: "許恒維老師", speakerType: "npc", text: "再看仔細一點。", next: "scene14_wrong" } },'
          new_right = '{ id: "B", text: "右邊", isCorrect: true, response: { speaker: "許恒維老師", speakerType: "npc", text: "沒錯。", next: "scene16_01" } },'

          if text.count(old_left) != 1:
              raise SystemExit(f'Expected exactly one old left-choice line, found {text.count(old_left)}')
          if text.count(old_right) != 1:
              raise SystemExit(f'Expected exactly one old right-choice line, found {text.count(old_right)}')

          text = text.replace(old_left, new_left, 1)
          text = text.replace(old_right, new_right, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit precise fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herbgame.html
          git rm .github/workflows/fix-herbgame-choice.yml
          git diff --cached --check
          git commit -m "Fix herbgame left-right answer"
          git push origin HEAD:main
