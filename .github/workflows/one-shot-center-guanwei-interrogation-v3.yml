name: One-shot center Guanwei interrogation v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-center-guanwei-interrogation-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Center portrait only for interrogation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('herbgame.html')
          s = p.read_text(encoding='utf-8')

          css_start = s.index('        .speaker-portrait {')
          css_end = s.index('        .dialogue-box {', css_start)
          new_css = """        .speaker-portrait {
              position: absolute;
              left: 50%;
              bottom: calc(100% + 1.5vh);
              transform: translateX(-50%);
              width: clamp(260px, 30vw, 430px);
              max-height: 54vh;
              object-fit: contain;
              z-index: 12;
              pointer-events: none;
              background: transparent;
              border: 0;
              border-radius: 24px;
              box-shadow: 0 16px 36px rgba(0,0,0,0.32);
              transition: opacity 0.18s ease, transform 0.18s ease;
          }
          .speaker-portrait.hidden { display: none; }
          @media (max-width: 768px) {
              .speaker-portrait {
                  width: clamp(230px, 52vw, 340px);
                  max-height: 50vh;
                  bottom: calc(100% + 1vh);
              }
          }
"""
          s = s[:css_start] + new_css + s[css_end:]

          js_start = s.index('            getPortraitForNode(node) {')
          js_end = s.index('\n            showDialogue(node) {', js_start)
          new_js = """            getPortraitForNode(node) {
                  if (!node) return null;

                  const text = node.text || \"\";
                  const interrogationTexts = [
                      \"那邊那位同學。\",
                      \"……？\",
                      \"你是不是剛到？\",
                      \"是嗎？\",
                      \"……巡視校園？\"
                  ];

                  if (interrogationTexts.some(t => text.includes(t))) {
                      return \"picture/herb-game/characters/chen-guanwei-normal.jpg?v=20260906-interrogation-center-v3\";
                  }
                  return null;
              }

              updateSpeakerPortrait(node) {
                  const portraitEl = this.dom.speakerPortrait;
                  const portraitPath = this.getPortraitForNode(node);

                  if (portraitPath) {
                      portraitEl.src = portraitPath;
                      portraitEl.classList.remove('hidden');
                  } else {
                      portraitEl.removeAttribute('src');
                      portraitEl.classList.add('hidden');
                  }
              }
"""
          s = s[:js_start] + new_js + s[js_end:]
          s = s.replace('alt=\"陳冠瑋老師人物立繪\"', 'alt=\"陳冠瑋老師質疑主角人物立繪\"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflows
        run: |
          rm -f .github/workflows/one-shot-center-guanwei-interrogation.yml
          rm -f .github/workflows/one-shot-center-guanwei-interrogation-v2.yml
          rm -f .github/workflows/one-shot-center-guanwei-interrogation-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herbgame.html .github/workflows/
          git commit -m "Show centered Guanwei portrait only during interrogation"
          git push
