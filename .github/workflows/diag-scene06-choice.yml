name: Diagnose scene06 choice input
on:
  push:
    paths:
      - '.github/workflows/diag-scene06-choice.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Inspect scene06_02 runtime state
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/herb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width":1755,"height":878})
              page.route('https://**/*', lambda route: route.abort())
              page.goto('http://127.0.0.1:8765/herbgameai-formal.html', wait_until='domcontentloaded')
              page.wait_for_function('window.gameEngine && window.__HERBGAME_AI_VISUAL', timeout=10000)
              page.evaluate("""() => {
                const e = window.gameEngine;
                e.dom.screenHome.classList.remove('active');
                e.dom.screenIntro.classList.remove('active');
                e.dom.screenGame.classList.add('active');
                e.loadNode('scene06_02', {skipHistory:true});
              }""")
              page.wait_for_timeout(1200)
              state = page.evaluate("""() => {
                const e = window.gameEngine;
                const c = e.dom.choicesContainer;
                const icon = e.dom.continueIcon;
                const cs = getComputedStyle(c);
                const rect = c.getBoundingClientRect();
                return {
                  node:e.currentNodeId,
                  isTyping:e.isTyping,
                  isShowingChoices:e.isShowingChoices,
                  isProcessingEvent:e.isProcessingEvent,
                  choicesClass:c.className,
                  choicesCount:c.querySelectorAll('.choice-btn').length,
                  choicesHtml:c.innerHTML,
                  opacity:cs.opacity,
                  pointerEvents:cs.pointerEvents,
                  display:cs.display,
                  visibility:cs.visibility,
                  rect:{x:rect.x,y:rect.y,width:rect.width,height:rect.height,bottom:rect.bottom},
                  iconClass:icon.className,
                  iconOpacity:getComputedStyle(icon).opacity,
                  activeElement:document.activeElement?.id || document.activeElement?.tagName,
                  dialogueText:e.dom.dialogueText.textContent
                };
              }""")
              print('SCENE06_STATE=' + json.dumps(state, ensure_ascii=False))
              assert state['node'] == 'scene06_02'
              assert state['isTyping'] is False
              assert state['isShowingChoices'] is True
              assert state['choicesCount'] == 3
              assert state['opacity'] == '1'
              assert state['pointerEvents'] == 'auto'
              browser.close()
          PY