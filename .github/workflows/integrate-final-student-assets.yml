name: Integrate final student character assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download final transparent PNGs from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p picture/herb-game/ai-characters
          python3 - <<'PY'
          import subprocess, pathlib, sys

          assets = [
              ("mint_student",       "1etFumWOsRzXMg8xLStUOEJjM112DSEYc"),
              ("left_student",       "1CT8-yIyZ-E7Jf90kSOXDBAJ-ducZoEL-"),
              ("lemongrass_student", "1o6NbWyrXWaHy2cfi12f_D4DmqhtjeW3X"),
              ("pandan_student",     "1ENyYdS41HpWjSbqfozjIT4Fv_QKeEw2Y"),
              ("mugwort_student",    "1-CCw6whKxArcXbRC_Bf9IyF7aLaoHcVP"),
              ("fishmint_student",   "1HCgoKTtemi2IF_7PCVCh6w_fEVP0nquz"),
              ("pricklyash_student", "1VCo2dmho8chozFOkshuzvWDJq4CNyqh2"),
              ("shellginger_student","1KVgEvoCVpmH2wPM8-nOSGIrkfFwdeheS"),
              ("teatree_student",    "1PHwaFgbhkfxpZ7AMRCQP25tAxXHZCxbk"),
              ("turmeric_student",   "100dlw2OoGsuvKGAsTvRObTb6rxYAmOcR"),
              ("marigold_student",   "1jSNzmKn3gVXJSC3LxCGSoAjdY6kiyLOn"),
          ]
          outdir = pathlib.Path("picture/herb-game/ai-characters")
          for sid, file_id in assets:
              target = outdir / f"{sid}.png"
              urls = [
                  f"https://drive.usercontent.google.com/download?id={file_id}&export=download&confirm=t",
                  f"https://drive.google.com/uc?export=download&id={file_id}&confirm=t",
              ]
              ok = False
              for url in urls:
                  proc = subprocess.run(["curl","-L","--fail","--silent","--show-error","--retry","2","-o",str(target),url])
                  if proc.returncode == 0 and target.exists() and target.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n":
                      ok = True
                      break
              if not ok:
                  sample = target.read_bytes()[:120] if target.exists() else b""
                  print(f"Drive download failed for {sid}; received prefix={sample!r}", file=sys.stderr)
                  sys.exit(2)
              print(sid, target.stat().st_size)
          PY

      - name: Verify PNG transparency and uniqueness
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, sys

          ids = ["mint_student","left_student","lemongrass_student","pandan_student","mugwort_student","fishmint_student","pricklyash_student","shellginger_student","teatree_student","turmeric_student","marigold_student"]
          hashes=[]
          for sid in ids:
              p=Path("picture/herb-game/ai-characters")/f"{sid}.png"
              with Image.open(p) as im:
                  if im.size != (1024,1536): raise SystemExit(f"{sid}: unexpected size {im.size}")
                  if im.mode not in ("RGBA","LA") and "transparency" not in im.info: raise SystemExit(f"{sid}: no alpha/transparency ({im.mode})")
                  rgba=im.convert("RGBA")
                  amin,amax=rgba.getchannel("A").getextrema()
                  if amin >= 255: raise SystemExit(f"{sid}: alpha channel is fully opaque")
                  if amax <= 0: raise SystemExit(f"{sid}: image is fully transparent")
                  print(f"{sid}: {im.size[0]}x{im.size[1]} {im.mode} alpha={amin}-{amax}")
              hashes.append(hashlib.sha256(p.read_bytes()).hexdigest())
          if len(set(hashes)) != len(ids): raise SystemExit("duplicate student image bytes detected")
          PY

      - name: Patch formal AI game page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("herbgameai-formal.html")
          s=p.read_text(encoding="utf-8")
          ids=[
            "mint_student","left_student","lemongrass_student","pandan_student","mugwort_student","fishmint_student","pricklyash_student","shellginger_student","teatree_student","turmeric_student","marigold_student"
          ]
          names={
            "mint_student":"小琳","left_student":"小安","lemongrass_student":"小凱","pandan_student":"小樂","mugwort_student":"小希","fishmint_student":"小柏","pricklyash_student":"小杰","shellginger_student":"小羽","teatree_student":"小森","turmeric_student":"小辰","marigold_student":"小晴"
          }

          # Single source of truth: each STUDENT_INFO entry owns its final avatar path.
          for sid in ids:
              path=f"picture/herb-game/ai-characters/{sid}.png"
              pat=rf'id:"{re.escape(sid)}",name:'
              repl=f'id:"{sid}",avatar:"{path}",name:'
              s,n=re.subn(pat,repl,s,count=1)
              if n != 1: raise SystemExit(f"Could not add avatar path to STUDENT_INFO.{sid}: matches={n}")

          # Character sprite mapping must read the same STUDENT_INFO asset instead of a second path table.
          for sid,name in names.items():
              pat=rf'"{re.escape(name)}": \{{ id:"{re.escape(sid)}", src:"picture/herb-game/ai-characters/[^\"]+" \}}'
              repl=f'"{name}": {{ id:"{sid}", src:STUDENT_INFO.{sid}.avatar }}'
              s,n=re.subn(pat,repl,s,count=1)
              if n != 1: raise SystemExit(f"Could not unify AI_CHARACTER_ASSETS for {sid}: matches={n}")

          old = '''                const studentCards = STUDENT_ORDER.map(id => {
                    const info=STUDENT_INFO[id], unlocked=this.gameState.unlockedStudents.has(id), relation=this.gameState.studentRelations[id] || {bond:0,status:"未認識",completedEvents:[],discoveries:[]};
                    const plantShown=this.gameState.discoveredHerbNames.has(info.plant)?info.plant:"？？？";
                    return `<div class="member-card ${unlocked ? '' : 'locked'}"><div class="member-card-layout"><div class="member-avatar-slot ${unlocked ? '' : 'locked'}">${unlocked ? '人物頭像<br><small>待放入</small>' : '？？<br><small>未解鎖</small>'}</div><div class="member-main"><div class="member-name">${unlocked ? info.name : '？？？'}<span class="member-type-badge">學生</span></div>${unlocked ? `<div class="member-meta"><div class="member-meta-row"><strong>代表植物</strong><span>${plantShown}</span></div><div class="member-meta-row"><strong>喜歡的地方</strong><span>${info.favoritePlace}</span></div><div class="member-meta-row"><strong>目前印象</strong><span>${info.currentImpression}</span></div>${relation.discoveries?.length ? `<div class="member-meta-row"><strong>新的發現</strong><span>${relation.discoveries.join("／")}</span></div>` : ""}<div class="member-meta-row"><strong>故事進度</strong><span>${relation.status}</span></div></div><div class="member-bond"><span>相處進度</span><span class="member-bond-value">${relation.bond}%</span></div>` : '<div class="member-desc">尚未解鎖。</div>'}</div></div></div>`;
                }).join('');'''
          new = '''                const studentCards = STUDENT_ORDER.map(id => {
                    const info=STUDENT_INFO[id], unlocked=this.gameState.unlockedStudents.has(id), relation=this.gameState.studentRelations[id] || {bond:0,status:"未認識",completedEvents:[],discoveries:[]};
                    const plantShown=this.gameState.discoveredHerbNames.has(info.plant)?info.plant:"？？？";
                    const avatarHtml = unlocked && info.avatar
                        ? `<img class="member-avatar-img" src="${info.avatar}" alt="${info.name}" draggable="false" onerror="const failedPath=this.getAttribute('src');console.error('[HerbGame] student image load failed','${id}',failedPath);this.style.display='none';this.parentElement.innerHTML='人物圖片<br><small>載入失敗</small>';" />`
                        : '？？<br><small>未解鎖</small>';
                    return `<div class="member-card ${unlocked ? '' : 'locked'}"><div class="member-card-layout"><div class="member-avatar-slot ${unlocked ? '' : 'locked'}">${avatarHtml}</div><div class="member-main"><div class="member-name">${unlocked ? info.name : '？？？'}<span class="member-type-badge">學生</span></div>${unlocked ? `<div class="member-meta"><div class="member-meta-row"><strong>代表植物</strong><span>${plantShown}</span></div><div class="member-meta-row"><strong>喜歡的地方</strong><span>${info.favoritePlace}</span></div><div class="member-meta-row"><strong>目前印象</strong><span>${info.currentImpression}</span></div>${relation.discoveries?.length ? `<div class="member-meta-row"><strong>新的發現</strong><span>${relation.discoveries.join("／")}</span></div>` : ""}<div class="member-meta-row"><strong>故事進度</strong><span>${relation.status}</span></div></div><div class="member-bond"><span>相處進度</span><span class="member-bond-value">${relation.bond}%</span></div>` : '<div class="member-desc">尚未解鎖。</div>'}</div></div></div>`;
                }).join('');'''
          if old not in s: raise SystemExit("studentCards block did not match current formal page")
          s=s.replace(old,new,1)

          s=s.replace(
            '.member-card-layout { display:grid; grid-template-columns:92px 1fr; gap:1rem; align-items:start; }',
            '.member-card-layout { display:grid; grid-template-columns:104px 1fr; gap:1rem; align-items:start; }',1)
          s=s.replace(
            '.member-avatar-slot { width:92px; min-height:92px; border-radius:18px; border:2px dashed #cbd5e1; background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%); display:flex; align-items:center; justify-content:center; text-align:center; color:#64748b; font-weight:900; line-height:1.25; padding:.5rem; box-sizing:border-box; }',
            '.member-avatar-slot { width:104px; height:124px; min-height:124px; overflow:hidden; border-radius:18px; border:2px dashed #cbd5e1; background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%); display:flex; align-items:center; justify-content:center; text-align:center; color:#64748b; font-weight:900; line-height:1.25; padding:.35rem; box-sizing:border-box; }',1)
          s=s.replace('            min-height:88px;\n            object-fit:contain;', '            min-height:0;\n            object-fit:contain;',1)
          s=s.replace(
            '@media (max-width:760px) { .herb-progress-list,.research-options,.de-summary-grid { grid-template-columns:1fr; } .member-meta-row { grid-template-columns:90px 1fr; } .member-card-layout { grid-template-columns:72px 1fr; gap:.8rem; } .member-avatar-slot { width:72px; min-height:72px; border-radius:16px; font-size:.92rem; } }',
            '@media (max-width:760px) { .herb-progress-list,.research-options,.de-summary-grid { grid-template-columns:1fr; } .member-meta-row { grid-template-columns:90px 1fr; } .member-card-layout { grid-template-columns:72px 1fr; gap:.8rem; } .member-avatar-slot { width:72px; height:88px; min-height:88px; border-radius:16px; font-size:.92rem; } }',1)

          marker='''    const sprite = characterLayer.querySelector("img");

    const plantCardLayer = doc.createElement("div");'''
          replacement='''    const sprite = characterLayer.querySelector("img");
    sprite.addEventListener("error", () => {
      const failedPath = sprite.getAttribute("src") || "";
      console.error("[HerbGame] student sprite load failed", activeSpeaker || "unknown", failedPath);
      characterLayer.classList.remove("visible");
      sprite.removeAttribute("src");
    });

    const plantCardLayer = doc.createElement("div");'''
          if marker not in s: raise SystemExit("sprite marker not found")
          s=s.replace(marker,replacement,1)

          # Static invariants for this scoped change.
          for sid in ids:
              path=f"picture/herb-game/ai-characters/{sid}.png"
              if s.count(path) != 1: raise SystemExit(f"{sid}: expected exactly one canonical path in HTML, got {s.count(path)}")
          if '人物頭像<br><small>待放入</small>' in s[s.find('const studentCards'):s.find('this.dom.memberList.innerHTML')]:
              raise SystemExit("student avatar placeholder still exists")
          if "？？<br><small>未解鎖</small>" not in s[s.find('const studentCards'):s.find('this.dom.memberList.innerHTML')]:
              raise SystemExit("locked-student placeholder was lost")
          p.write_text(s,encoding="utf-8")
          PY

      - name: Static integration checks
        run: |
          set -euo pipefail
          grep -q 'avatar:"picture/herb-game/ai-characters/mint_student.png"' herbgameai-formal.html
          grep -q 'src:STUDENT_INFO.mint_student.avatar' herbgameai-formal.html
          grep -q '\[HerbGame\] student image load failed' herbgameai-formal.html
          grep -q '\[HerbGame\] student sprite load failed' herbgameai-formal.html
          if grep -Eq 'src:"picture/herb-game/ai-characters/[0-9][0-9]_' herbgameai-formal.html; then
            echo 'Old numbered AI character paths remain in active mapping' >&2; exit 1
          fi
          for f in mint_student left_student lemongrass_student pandan_student mugwort_student fishmint_student pricklyash_student shellginger_student teatree_student turmeric_student marigold_student; do
            test -s "picture/herb-game/ai-characters/$f.png"
          done

      - name: Browser smoke tests
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8765 >/tmp/herb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python3 - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          import json, time

          ids=["mint_student","left_student","lemongrass_student","pandan_student","mugwort_student","fishmint_student","pricklyash_student","shellginger_student","teatree_student","turmeric_student","marigold_student"]
          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=1920,1080')
          d=webdriver.Chrome(options=opt)
          try:
              d.get('http://127.0.0.1:8765/herbgameai-formal.html')
              WebDriverWait(d,15).until(lambda x: x.execute_script('return !!window.gameEngine && !!window.__HERBGAME_AI_VISUAL'))

              # Morning state: only 小琳 is known. Other ten must stay locked and reveal no image.
              result=d.execute_script('''
                const e=window.gameEngine;
                e.gameState.unlockedStudents=new Set(['mint_student']);
                e.renderPlayerPanel();
                const cards=[...document.querySelectorAll('#member-list .member-card')].slice(-11);
                return {imgs:cards.map(c=>c.querySelectorAll('img.member-avatar-img').length), locked:cards.map(c=>c.classList.contains('locked')), text:cards.map(c=>c.textContent)};
              ''')
              if result['imgs'][0] != 1 or any(result['imgs'][1:]): raise SystemExit(f"morning unlock image leak: {result}")
              if result['locked'][0] or not all(result['locked'][1:]): raise SystemExit(f"morning lock state wrong: {result['locked']}")
              WebDriverWait(d,10).until(lambda x: x.execute_script("return document.querySelector('#member-list .member-card:nth-last-child(11) img.member-avatar-img')?.naturalWidth > 0"))

              # Afternoon group intro state: all 11 known; each card must load its own canonical image.
              all_state=d.execute_script('''
                const ids=arguments[0], e=window.gameEngine;
                e.gameState.unlockedStudents=new Set(ids);
                e.renderPlayerPanel();
                return [...document.querySelectorAll('#member-list .member-card')].slice(-11).map((c,i)=>({src:c.querySelector('img.member-avatar-img')?.getAttribute('src')||'',locked:c.classList.contains('locked')}));
              ''',ids)
              if any(x['locked'] for x in all_state): raise SystemExit(f"afternoon cards still locked: {all_state}")
              expected=[f'picture/herb-game/ai-characters/{x}.png' for x in ids]
              if [x['src'] for x in all_state] != expected: raise SystemExit(f"gallery source mismatch: {all_state}")
              WebDriverWait(d,12).until(lambda x: x.execute_script("return [...document.querySelectorAll('#member-list .member-card')].slice(-11).every(c=>c.querySelector('img.member-avatar-img')?.naturalWidth>0)"))

              # 小琳 Event-style sprite: playground, transparent sprite layer behind dialogue, visible and in viewport.
              sprite_check=d.execute_script('''
                const e=window.gameEngine;
                e.dom.hudLocation.textContent='遊樂場';
                window.__HERBGAME_AI_VISUAL.renderCharacterForDialogue({speaker:'小琳',speakerType:'npc'});
                return true;
              ''')
              WebDriverWait(d,10).until(lambda x: x.execute_script("return document.querySelector('#ai-character-sprite')?.naturalWidth>0 && document.querySelector('#ai-character-layer')?.classList.contains('visible')"))
              geom=d.execute_script('''
                const s=document.querySelector('#ai-character-sprite'), dlg=document.querySelector('.dialogue-wrapper'), r=s.getBoundingClientRect();
                return {src:s.getAttribute('src'),left:r.left,right:r.right,top:r.top,bottom:r.bottom,w:innerWidth,h:innerHeight,spriteZ:getComputedStyle(s.parentElement).zIndex,dialogueZ:getComputedStyle(dlg).zIndex};
              ''')
              if geom['src']!='picture/herb-game/ai-characters/mint_student.png': raise SystemExit(f"sprite source mismatch: {geom}")
              if geom['left']<0 or geom['right']>geom['w']+1 or geom['top']<0 or geom['bottom']>geom['h']+20: raise SystemExit(f"sprite outside viewport: {geom}")
              if int(geom['dialogueZ']) <= int(geom['spriteZ']): raise SystemExit(f"dialogue is not in front: {geom}")

              # Reload: repository-relative assets still resolve.
              d.refresh(); WebDriverWait(d,15).until(lambda x: x.execute_script('return !!window.gameEngine && !!window.__HERBGAME_AI_VISUAL'))
              ok=d.execute_script('''return fetch('picture/herb-game/ai-characters/mint_student.png').then(r=>r.ok)''')
              if not ok: raise SystemExit('asset failed after reload')
              print('browser smoke tests passed')
          finally:
              d.quit()
          PY

      - name: Commit integrated assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-final-student-assets.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add herbgameai-formal.html picture/herb-game/ai-characters .github || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate final transparent student character assets"
          git push origin HEAD:${{ github.head_ref }}
