name: Center Guanwei interrogation portrait v2
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-center-guanwei-interrogation-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch_portrait.py
          python /tmp/patch_portrait.py
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-center-guanwei-interrogation.yml || true
          git rm -f .github/workflows/one-shot-center-guanwei-interrogation-v2.yml || true
          git add herbgame.html
          git commit -m 'Show centered Guanwei portrait only during interrogation'
          git push
