name: Patch circuit and badge logic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch 08 and 09
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 08: 每顆燈泡都必須真正跨接在電池正負極之間才會亮。
          p = Path('08.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('// --- 核心邏輯 ---')
          end = s.index('            return (', start)
          replacement = '''            // --- 核心邏輯 ---
            const runSimulation = () => {
                setErrorMsg('');
                setLitBulbIds(new Set());
                setBrightness(0);

                const node = (id, terminal) => id + ':' + terminal;
                const makeGraph = (skipBulbId) => {
                    const graph = {};
                    const addNode = (key) => { if (!graph[key]) graph[key] = []; };
                    const connect = (a, b) => { addNode(a); addNode(b); graph[a].push(b); graph[b].push(a); };

                    components.forEach(component => {
                        if (component.type === COMPONENT_TYPES.BATTERY) {
                            addNode(node(component.id, 'pos'));
                            addNode(node(component.id, 'neg'));
                        } else {
                            addNode(node(component.id, 'thread'));
                            addNode(node(component.id, 'tip'));
                        }
                    });

                    wires.forEach(wire => connect(
                        node(wire.start.compId, wire.start.pointType),
                        node(wire.end.compId, wire.end.pointType)
                    ));

                    // 測試某一顆燈泡時，不走過它自己的燈絲；其他燈泡可以作為串聯路徑。
                    components.filter(component => component.type === COMPONENT_TYPES.BULB && component.id !== skipBulbId)
                        .forEach(bulb => connect(node(bulb.id, 'thread'), node(bulb.id, 'tip')));
                    return graph;
                };

                const reachable = (graph, startNode) => {
                    const seen = new Set([startNode]);
                    const queue = [startNode];
                    while (queue.length) {
                        const current = queue.shift();
                        (graph[current] || []).forEach(next => {
                            if (!seen.has(next)) {
                                seen.add(next);
                                queue.push(next);
                            }
                        });
                    }
                    return seen;
                };

                const batteries = components.filter(component => component.type === COMPONENT_TYPES.BATTERY);
                const bulbs = components.filter(component => component.type === COMPONENT_TYPES.BULB);
                if (batteries.length === 0) {
                    setErrorMsg('需要電池才能供電！');
                    setIsSwitchOn(false);
                    return;
                }

                const litBulbs = new Set();
                batteries.forEach(battery => {
                    bulbs.forEach(bulb => {
                        const graph = makeGraph(bulb.id);
                        const fromPositive = reachable(graph, node(battery.id, 'pos'));
                        const fromNegative = reachable(graph, node(battery.id, 'neg'));
                        const thread = node(bulb.id, 'thread');
                        const tip = node(bulb.id, 'tip');
                        const isAcrossBattery = (fromPositive.has(thread) && fromNegative.has(tip)) ||
                                                (fromPositive.has(tip) && fromNegative.has(thread));
                        if (isAcrossBattery) litBulbs.add(bulb.id);
                    });
                });

                // 只用導線檢查電池正負極有沒有被直接短接。
                const wireOnlyGraph = makeGraph('__skip_all_bulbs__');
                const directShort = batteries.some(battery =>
                    reachable(wireOnlyGraph, node(battery.id, 'pos')).has(node(battery.id, 'neg'))
                );

                if (litBulbs.size > 0) {
                    setLitBulbIds(litBulbs);
                    setBrightness(batteries.length >= 2 ? 2 : 1);
                    setErrorMsg('電路形成完整圈圈！' + litBulbs.size + ' 顆燈泡發光。');
                } else if (directShort) {
                    setErrorMsg('電池正負極被電線直接連起來了，請讓電流先經過燈泡。');
                } else {
                    setErrorMsg('電源已開啟，但每一顆燈泡都還沒有形成完整迴路。');
                }
            };

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          # 09: 每種酸鹼分類完成兩次，才取得對應徽章；三枚徽章都完成即過關。
          p = Path('09.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('🏆 分數: 0 / 100', '🏅 任務徽章: 0 / 3')

          start = s.index('    changeMission: function() {')
          end = s.index('    spawnItem: function() {', start)
          change_mission = '''    changeMission: function() {
        const remaining = this.missions.filter(mission => !this.state.completedBadges.has(mission.type));
        if (remaining.length === 0) {
            this.showResult(true, 'pass');
            return;
        }

        let choices = remaining.filter(mission => !this.state.currentMission || mission.type !== this.state.currentMission.type);
        if (choices.length === 0) choices = remaining;

        const newMission = choices[Math.floor(Math.random() * choices.length)];
        this.state.currentMission = newMission;
        this.state.missionItemsCollected = 0;
        this.state.currentMissionTarget = 2;

        const missionEl = document.getElementById('current-mission');
        const textEl = document.getElementById('mission-text');
        textEl.textContent = newMission.text + '（0/' + this.state.currentMissionTarget + '）';
        missionEl.style.backgroundColor = newMission.color;
        missionEl.style.borderColor = newMission.borderColor;
        missionEl.style.transform = 'scale(1.15)';
        setTimeout(() => missionEl.style.transform = 'scale(1)', 250);
    },

'''
          s = s[:start] + change_mission + s[end:]

          start = s.index('    handleCollection: function(item) {')
          end = s.index('    showResult: function(', start)
          handle_collection = '''    handleCollection: function(item) {
        const isCorrect = item.data.type === this.state.currentMission.type;

        if (isCorrect) {
            this.state.score += 1;
            this.state.missionItemsCollected += 1;
            const progress = this.state.missionItemsCollected;
            const target = this.state.currentMissionTarget;

            if (progress >= target) {
                const badgeNames = { acid: '酸性小達人', base: '鹼性小達人', neutral: '中性小達人' };
                this.state.completedBadges.add(this.state.currentMission.type);
                this.showFloatingText('獲得：' + badgeNames[this.state.currentMission.type] + '！', '#2ecc71', this.player.x);
                this.updateUI();

                if (this.state.completedBadges.size >= 3) {
                    this.showResult(true, 'pass');
                    return;
                }

                setTimeout(() => this.changeMission(), 450);
            } else {
                this.showFloatingText('答對！再收集 ' + (target - progress) + ' 個。', '#2ecc71', this.player.x);
                document.getElementById('mission-text').textContent = this.state.currentMission.text + '（' + progress + '/' + target + '）';
            }
        } else {
            this.state.lives -= 1;
            this.showFloatingText('挑戰機會 -1', '#e74c3c', this.player.x);
            this.canvas.style.transform = 'translateX(5px)';
            setTimeout(() => this.canvas.style.transform = 'translateX(0)', 50);
            if (this.state.lives <= 0) this.showResult(false, 'fail');
        }
        this.updateUI();
    },

'''
          s = s[:start] + handle_collection + s[end:]

          start = s.index('    showResult: function(')
          end = s.index('    updateUI: function()', start)
          show_result = '''    showResult: function(isWin, type) {
        this.state.isPlaying = false;
        const titleEl = document.getElementById('result-title');
        const msgEl = document.getElementById('result-msg');
        const scoreEl = document.getElementById('final-score');
        const screen = document.getElementById('result-screen');
        const badges = {
            acid: this.state.completedBadges.has('acid') ? '✅ 酸性小達人' : '⬜ 酸性小達人',
            base: this.state.completedBadges.has('base') ? '✅ 鹼性小達人' : '⬜ 鹼性小達人',
            neutral: this.state.completedBadges.has('neutral') ? '✅ 中性小達人' : '⬜ 中性小達人'
        };

        scoreEl.textContent = this.state.completedBadges.size + ' / 3';
        screen.classList.remove('hidden');

        if (isWin) {
            titleEl.textContent = '🎉 三個任務徽章都完成了！';
            titleEl.style.color = '#2ecc71';
            msgEl.innerHTML = '<span style="color:#f1c40f">白奶油博士：</span>「你成功分辨酸性、鹼性和中性溶液！」<br><br>' +
                badges.acid + '<br>' + badges.base + '<br>' + badges.neutral +
                '<br><br><span style="color:#e67e22">橘咪咪：</span>「科學小達人，分類任務成功！」';
        } else {
            titleEl.textContent = '再挑戰一次';
            titleEl.style.color = '#e67e22';
            msgEl.innerHTML = '<span style="color:#e67e22">橘咪咪：</span>「先看清楚白奶油博士要收集哪一類溶液，再試一次！」<br><br>' +
                badges.acid + '<br>' + badges.base + '<br>' + badges.neutral;
        }
    },

'''
          s = s[:start] + show_result + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Static safety checks
        run: |
          grep -q "const makeGraph" 08.html
          grep -q "每一顆燈泡都還沒有形成完整迴路" 08.html
          grep -q "const remaining = this.missions.filter" 09.html
          grep -q "三個任務徽章都完成了" 09.html

      - name: Browser load check
        run: |
          mkdir -p /tmp/page-check
          npm install --prefix /tmp/page-check playwright@1.55.0
          npx --prefix /tmp/page-check playwright install --with-deps chromium
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/static-server.log 2>&1 &
          cat > /tmp/page-check/check.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const file of ['08.html', '09.html']) {
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/' + file, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1500);
            const text = await page.evaluate(() => document.body.innerText || '');
            if (!text.includes(file === '08.html' ? '跟著做模式' : '任務徽章')) throw new Error(file + ' required text is missing');
            if (errors.length) throw new Error(file + ' page errors: ' + errors.join(' | '));
            await page.close();
          }
          await browser.close();
          NODE
          node /tmp/page-check/check.mjs

      - name: Commit completed changes
        run: |
          rm -f .github/workflows/patch-08-09.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete circuit and badge game logic"
          git push
