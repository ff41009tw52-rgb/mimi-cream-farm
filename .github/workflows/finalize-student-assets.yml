name: Finalize student assets
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/final-integrate-student-assets' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original final PNGs
        run: python3 tools/download_final_students.py
      - name: Apply final integration
        run: python3 tools/finalize_student_assets.py
      - name: Commit integrated assets
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate final transparent student character assets"
          git push
