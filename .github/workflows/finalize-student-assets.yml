name: Finalize student assets
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/final-integrate-student-assets' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply character integration
        run: |
          sed -i 's/width < 500/width < 250/' tools/apply_character_integration.py
          python3 tools/apply_character_integration.py
      - name: Commit integrated game page
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate final student character assets into formal game"
          git push
