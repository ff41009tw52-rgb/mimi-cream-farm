name: One-shot herbgame Guanwei portraits

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-herbgame-guanwei-portraits.yml'

permissions:
  contents: write

jobs:
  patch-herbgame:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch herbgame
        run: python .github/scripts/patch_herbgame_guanwei_portraits.py

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-herbgame-guanwei-portraits.yml
          rm -f .github/scripts/patch_herbgame_guanwei_portraits.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Guanwei teacher dialogue portraits"
          git push origin HEAD:main
