name: Apply compatible Babel version

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin Babel to a compatible version
        run: python3 tools/apply_babel_pin.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify every homepage activity and all pinned Babel pages
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/static-server.log 2>&1 &
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const indexHtml = fs.readFileSync('index.html', 'utf8');
          const homepagePages = [...indexHtml.matchAll(/<a\s+href="([^"#?]+\.html)"[^>]*class="open-btn"/g)].map((m) => m[1]);
          const findPinnedBabelPages = (directory = '.') => fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
            if (entry.name === '.git' || entry.name === 'node_modules') return [];
            const full = path.join(directory, entry.name);
            if (entry.isDirectory()) return findPinnedBabelPages(full);
            if (entry.isFile() && entry.name.endsWith('.html') && fs.readFileSync(full, 'utf8').includes('@babel/standalone@7.26.10')) {
              return [full.replace(/^\.\//, '')];
            }
            return [];
          });
          const pages = [...new Set(['index.html', ...homepagePages, ...findPinnedBabelPages()])];
          const browser = await chromium.launch({ headless: true });
          const problems = [];
          for (const filename of pages) {
            const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto(`http://127.0.0.1:4173/${filename}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1800);
            const state = await page.evaluate(() => {
              const root = document.getElementById('root');
              const text = (document.body.innerText || '').replace(/\s+/g, ' ').trim();
              return { rootExists: Boolean(root), rootChildCount: root?.childElementCount ?? null, text };
            });
            if (errors.length || (state.rootExists && state.rootChildCount === 0) || /^(🏡\s*)?回到?農場首頁$|^🐾\s*回農場$/.test(state.text)) {
              problems.push({ filename, errors, state });
            }
            await page.close();
          }
          await browser.close();
          console.log(`CHECKED_PAGES=${pages.length}`);
          if (problems.length) {
            console.error(JSON.stringify(problems, null, 2));
            process.exit(1);
          }
          console.log('All checked pages rendered successfully.');
          NODE

      - name: Commit only the verified website changes
        run: |
          rm tools/apply_babel_pin.py
          rmdir tools 2>/dev/null || true
          rm .github/workflows/fix-pinned-babel.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: pin Babel for legacy activity pages"
          git push
