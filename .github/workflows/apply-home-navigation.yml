name: Apply home navigation updates

on:
  push:
    branches:
      - fix-home-nav

permissions:
  contents: write

jobs:
  apply-updates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply navigation updates
        run: python3 tools/apply_home_navigation.py

      - name: Verify navigation updates
        run: python3 tools/apply_home_navigation.py --check

      - name: Commit completed website changes
        run: |
          rm tools/apply_home_navigation.py
          rmdir tools 2>/dev/null || true
          rm .github/workflows/apply-home-navigation.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve activity navigation and titles"
          git push
