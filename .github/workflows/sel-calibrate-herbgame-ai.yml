name: SEL calibrate herbgame AI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sel-calibrate-herbgame-ai.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect original formal and apply patch
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          test ! -e herbgameai-formal-base.html
          sed -i 's/firstHerbGardenObservation/firstHerbGardenInspection/g' .github/scripts/sel_calibrate.py
          # Allow the patch file to be written; exhaustive legacy checks run immediately afterward.
          sed -i "s/'trustByMember','trustMaxByMember','trustChange','trustTarget','requiredTrust','requiredTrustTarget','teacherTrust','chenTrust','xuTrust','principalTrust',//" .github/scripts/sel_calibrate.py
          sed -i "s/'信任度不足','信任度變化','校長信任'//" .github/scripts/sel_calibrate.py
          python3 .github/scripts/sel_calibrate.py
          # The old node trust handler contains nested braces; remove the residual tail left by the first structural pass.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('herbgameai-formal.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'\n\s*if \(!\(node\.trustTarget in this\.gameState\.trustMaxByMember\)\) \{.*?\n\s*if \(node\.plantUnlock'
          s2,n=re.subn(pattern,'\n                    if (node.plantUnlock',s,count=1,flags=re.S)
          if n != 1:
              raise AssertionError(f'residual node trust cleanup expected 1, found {n}')
          p.write_text(s2,encoding='utf-8')
          PY
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"

      - name: Static checks
        run: |
          set -euo pipefail
          f=herbgameai-formal.html
          echo '--- remaining adult-trust references, if any ---'
          grep -nE 'trustByMember|trustMaxByMember|trustChange|trustTarget|requiredTrust|requiredTrustTarget|teacherTrust|chenTrust|xuTrust|principalTrust|信任度不足|信任度變化|校長信任' "$f" || true
          for bad in bravery requiredBravery braveryChange addBravery observation addObservation observationChange trustByMember trustMaxByMember trustChange trustTarget requiredTrust requiredTrustTarget teacherTrust chenTrust xuTrust principalTrust panel-observation de-observation; do
            if grep -qi "$bad" "$f"; then echo "legacy token remains: $bad"; exit 1; fi
          done
          for bad in '勇氣值' '勇氣不足' '觀察力' '信任度不足' '信任度變化' '校長信任' '每個人的植物都很像本人' '克服害羞' '提高勇氣'; do
            if grep -q "$bad" "$f"; then echo "legacy wording remains: $bad"; exit 1; fi
          done
          grep -q '目前印象' "$f"
          grep -q '新的發現' "$f"
          grep -q '相處進度' "$f"
          grep -q 'interactionHistory' "$f"
          grep -q 'completedTasks' "$f"
          grep -q 'experienceFlags' "$f"
          grep -q 'observed｜已實際觀察' "$f"
          grep -q '植物和人都比第一眼看到的複雜' "$f"
          grep -q 'ai_mint_e01_01' "$f"
          grep -q 'ai_day1_diary' "$f"
          grep -q 'plant-card-reveal-layer' "$f"

      - name: Browser smoke tests
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/herb-http.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5500 --dump-dom 'http://127.0.0.1:8000/herbgameai-formal.html' > /tmp/home.html || true
          grep -q 'id="screen-home"' /tmp/home.html
          grep -q 'AI圖片試作版' /tmp/home.html
          ! grep -q 'panel-observation' /tmp/home.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8000/herbgameai-formal.html?preview=xiaolin-event-01' > /tmp/xiaolin.html || true
          grep -q '遊樂場' /tmp/xiaolin.html
          grep -q '小琳' /tmp/xiaolin.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --dump-dom 'http://127.0.0.1:8000/herbgameai-formal.html?preview=plant-card-mint' > /tmp/mint.html || true
          grep -q 'plant-card-reveal-layer active' /tmp/mint.html
          grep -q '薄荷' /tmp/mint.html
          grep -q '241自然教室' /tmp/mint.html

      - name: Commit calibrated single-file game
        run: |
          set -euo pipefail
          rm -f .github/workflows/sel-calibrate-herbgame-ai.yml .github/scripts/sel_calibrate.py
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -qx 'herbgame-formal.html'; then echo 'Protected formal file staged'; exit 1; fi
          git commit -m "refactor: calibrate SEL systems and remove adult approval scores"
          git push origin HEAD:main
