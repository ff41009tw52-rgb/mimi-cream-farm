name: SEL calibrate herbgame AI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sel-calibrate-herbgame-ai.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect original formal and apply patch
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          test ! -e herbgameai-formal-base.html
          sed -i 's/firstHerbGardenObservation/firstHerbGardenInspection/g' .github/scripts/sel_calibrate.py
          sed -i "s/'trustByMember','trustMaxByMember','trustChange','trustTarget','requiredTrust','requiredTrustTarget','teacherTrust','chenTrust','xuTrust','principalTrust',//" .github/scripts/sel_calibrate.py
          sed -i "s/'信任度不足','信任度變化','校長信任'//" .github/scripts/sel_calibrate.py
          python3 .github/scripts/sel_calibrate.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('herbgameai-formal.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'\n\s*if \(!\(node\.trustTarget in this\.gameState\.trustMaxByMember\)\) \{.*?\n\s*if \(node\.plantUnlock'
          s2,n=re.subn(pattern,'\n                    if (node.plantUnlock',s,count=1,flags=re.S)
          if n != 1:
              raise AssertionError(f'residual node trust cleanup expected 1, found {n}')
          p.write_text(s2,encoding='utf-8')
          PY
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"

      - name: Exhaustive SEL source checks
        run: |
          set -euo pipefail
          f=herbgameai-formal.html
          for bad in bravery requiredBravery braveryChange addBravery observation addObservation observationChange trustByMember trustMaxByMember trustChange trustTarget requiredTrust requiredTrustTarget teacherTrust chenTrust xuTrust principalTrust panel-observation de-observation; do
            if grep -qi "$bad" "$f"; then echo "legacy token remains: $bad"; exit 1; fi
          done
          for bad in '勇氣值' '勇氣不足' '勇氣檢定' '勇氣選項' '勇氣結局' '觀察力' '信任度不足' '信任度變化' '校長信任' '老師信任增加' '老師信任下降' '校長信任增加' '每個人的植物都很像本人' '克服害羞' '提高勇氣'; do
            if grep -q "$bad" "$f"; then echo "legacy wording remains: $bad"; exit 1; fi
          done
          grep -q '目前印象' "$f"
          grep -q '新的發現' "$f"
          grep -q '相處進度' "$f"
          grep -q 'interactionHistory' "$f"
          grep -q 'dailyChoices' "$f"
          grep -q 'completedTasks' "$f"
          grep -q 'experienceFlags' "$f"
          grep -q 'discovered｜已知道名稱' "$f"
          grep -q 'observed｜已實際觀察' "$f"
          grep -q 'researched｜已查詢資料' "$f"
          grep -q 'complete｜完整圖鑑 ✓' "$f"
          grep -q '植物和人都比第一眼看到的複雜' "$f"
          grep -q 'getDay1DiaryText' "$f"
          grep -q 'mint_student_event_01' "$f"
          grep -q 'plant-card-reveal-layer' "$f"
          grep -q 'morningGreeting: "greet"' "$f"
          grep -q 'morningGreeting: "passby"' "$f"
          grep -q '校長早安！' "$f"
          grep -q '今天還是有點不好意思，默默走過去。' "$f"
          grep -q '先看清楚兩邊的差別' "$f"
          grep -q '今天這一區就照這個方式繼續' "$f"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('herbgameai-formal.html').read_text(encoding='utf-8')
          for m in re.finditer(r'bondChange\s*:', s):
              window=s[max(0,m.start()-650):m.start()+650]
              if 'studentEventComplete' not in window:
                  raise SystemExit('bondChange found outside formal student event')
          forbidden_score_terms=['selScore','empathyScore','socialScore','confidenceScore','selfAwarenessScore','selfManagementScore','socialAwarenessScore','relationshipSkillsScore','responsibleDecisionMakingScore']
          for term in forbidden_score_terms:
              if term.lower() in s.lower():
                  raise SystemExit(f'new SEL score found: {term}')
          print('relationship and no-replacement-score checks passed')
          PY

      - name: Deterministic JavaScript and structure acceptance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('herbgameai-formal.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('no inline scripts found')
          out=Path('/tmp/herb-scripts'); out.mkdir(exist_ok=True)
          for i,script in enumerate(scripts):
              (out/f'script-{i:02d}.js').write_text(script,encoding='utf-8')
          print(f'extracted {len(scripts)} script blocks')
          required_history=[
              'interactionHistory: JSON.parse(JSON.stringify(this.gameState.interactionHistory',
              'dailyChoices: { ...(this.gameState.dailyChoices || {}) }',
              'completedTasks: new Set(this.gameState.completedTasks || [])',
              'experienceFlags: new Set(this.gameState.experienceFlags || [])',
              'interactionHistory: JSON.parse(JSON.stringify(snapshot.gameState.interactionHistory',
              'dailyChoices: { ...(snapshot.gameState.dailyChoices || {}) }',
              'completedTasks: new Set(snapshot.gameState.completedTasks || [])',
              'experienceFlags: new Set(snapshot.gameState.experienceFlags || [])'
          ]
          for token in required_history:
              if token not in html:
                  raise SystemExit(f'History record missing: {token}')
          for token in ['scene01_01','scene09_07','scene14_02','scene16_01','ai_mint_e01_01','ai_mint_bell_2','ai_day1_diary','day1_end']:
              if token not in html:
                  raise SystemExit(f'Day 1 anchor missing: {token}')
          for token in ['btn-back-step','goBackOneStep','pushHistorySnapshot']:
              if token not in html:
                  raise SystemExit(f'History/back anchor missing: {token}')
          print('History/back and Day 1 structural anchors passed')
          PY
          for js in /tmp/herb-scripts/*.js; do node --check "$js"; done
          echo 'all inline JavaScript blocks pass node --check'

      - name: Commit calibrated single-file game
        run: |
          set -euo pipefail
          rm -f .github/workflows/sel-calibrate-herbgame-ai.yml .github/scripts/sel_calibrate.py
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -qx 'herbgame-formal.html'; then echo 'Protected formal file staged'; exit 1; fi
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          test "$changed" = "herbgameai-formal.html"
          git commit -m "refactor: calibrate SEL systems and remove adult approval scores"
          git push origin HEAD:main
