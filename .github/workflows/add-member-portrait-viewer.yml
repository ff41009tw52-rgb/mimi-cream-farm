name: Add member portrait viewer
on:
  push:
    paths:
      - '.github/workflows/add-member-portrait-viewer.yml'
permissions:
  contents: write
jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch AI trial only
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          python3 .github/scripts/add_member_portrait_viewer.py
          git diff --exit-code -- herbgame-formal.html
          git diff -- herbgameai-formal.html
      - name: JavaScript syntax and invariant checks
        run: |
          set -euo pipefail
          rm -rf /tmp/herb-js && mkdir -p /tmp/herb-js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('herbgameai-formal.html').read_text(encoding='utf-8')
          assert s.count('id="member-portrait-viewer"') == 1
          assert s.count('id="member-portrait-viewer-style"') == 1
          assert s.count('id="member-portrait-viewer-script"') == 1
          assert s.count('data-student-id="${id}"') == 1
          assert 'viewerImage.src = info.avatar;' in s
          assert 'portraitImages' not in s
          assert 'zoomImages' not in s
          assert 'largeAvatar' not in s
          assert 'object-fit: contain;' in s
          assert 'event.target === viewer' in s
          assert "event.key === 'Escape'" in s
          assert "event.code === 'Space'" in s
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          n = 0
          for block in blocks:
              if block.strip():
                  Path(f'/tmp/herb-js/{n}.js').write_text(block, encoding='utf-8')
                  n += 1
          print('inline scripts:', n)
          PY
          for f in /tmp/herb-js/*.js; do node --check "$f"; done
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Targeted viewer verification
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/herb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python3 .github/scripts/verify_member_portrait_viewer.py
      - name: Commit viewer and remove temporary files
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-member-portrait-viewer.yml
          rm -f .github/scripts/add_member_portrait_viewer.py
          rm -f .github/scripts/verify_member_portrait_viewer.py
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git diff --exit-code -- herbgame-formal.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add herbgameai-formal.html .github/workflows/add-member-portrait-viewer.yml .github/scripts/add_member_portrait_viewer.py .github/scripts/verify_member_portrait_viewer.py
          git diff --cached --name-only
          git commit -m 'feat: add student portrait viewer'
          git push origin HEAD:main
