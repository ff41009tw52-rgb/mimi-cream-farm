name: Add member portrait viewer
on:
  push:
    paths:
      - '.github/workflows/add-member-portrait-viewer.yml'
permissions:
  contents: write
jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch AI trial only
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          cp herbgameai-formal.html /tmp/herbgameai-before.html
          python3 - <<'PY'
          from pathlib import Path

          p = Path('herbgameai-formal.html')
          s = p.read_text(encoding='utf-8')

          if 'id="member-portrait-viewer"' in s or 'id="member-portrait-viewer-style"' in s:
              raise SystemExit('member portrait viewer already exists; refusing duplicate patch')

          old = '<img class="member-avatar-img" src="${info.avatar}" alt="${info.name}" draggable="false"'
          new = '<img class="member-avatar-img" data-student-id="${id}" src="${info.avatar}" alt="${info.name}" draggable="false"'
          if s.count(old) != 1:
              raise SystemExit(f'student avatar template match count: {s.count(old)}')
          s = s.replace(old, new, 1)

          style = r'''
    <style id="member-portrait-viewer-style">
        .member-avatar-img[data-student-id] {
            cursor: zoom-in;
            transition: transform 160ms ease;
            transform-origin: center bottom;
        }
        @media (hover: hover) and (pointer: fine) {
            .member-avatar-img[data-student-id]:hover { transform: scale(1.03); }
        }

        .member-portrait-viewer {
            position: fixed;
            inset: 0;
            z-index: 160;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 3vw, 2rem);
            box-sizing: border-box;
            background: rgba(2, 6, 23, 0.82);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
        }
        .member-portrait-viewer.active { opacity: 1; pointer-events: auto; }
        .member-portrait-viewer-card {
            position: relative;
            width: min(960px, 92vw);
            max-height: 92vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
            align-items: center;
            gap: clamp(1rem, 3vw, 2.5rem);
            padding: clamp(1.1rem, 3vw, 2rem);
            box-sizing: border-box;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.94);
            box-shadow: 0 24px 70px rgba(0,0,0,0.48);
        }
        .member-portrait-viewer-image-wrap {
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .member-portrait-viewer-image {
            display: block;
            width: auto;
            height: auto;
            max-width: min(48vw, 560px);
            max-height: 76vh;
            object-fit: contain;
            object-position: center;
            background: transparent;
            user-select: none;
            -webkit-user-drag: none;
        }
        .member-portrait-viewer-failure {
            min-width: min(360px, 55vw);
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
            border: 1px dashed rgba(255,255,255,0.28);
            border-radius: 18px;
            color: #fecaca;
            font-weight: 900;
            text-align: center;
            background: rgba(127,29,29,0.16);
        }
        .member-portrait-viewer-failure[hidden] { display: none; }
        .member-portrait-viewer-info { color: white; text-align: left; }
        .member-portrait-viewer-name {
            font-size: clamp(1.8rem, 4vw, 3rem);
            line-height: 1.15;
            font-weight: 900;
            letter-spacing: .06em;
        }
        .member-portrait-viewer-plant {
            margin-top: .8rem;
            color: #d9f99d;
            font-size: clamp(1rem, 2.2vw, 1.35rem);
            line-height: 1.5;
            font-weight: 800;
        }
        .member-portrait-viewer-close {
            position: absolute;
            top: .8rem;
            right: .8rem;
            z-index: 2;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,255,255,.28);
            border-radius: 50%;
            background: rgba(15,23,42,.76);
            color: white;
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
        }
        .member-portrait-viewer-close:hover { background: rgba(51,65,85,.95); }

        @media (max-width: 700px) {
            .member-portrait-viewer { padding: .7rem; }
            .member-portrait-viewer-card {
                width: 94vw;
                max-height: 94vh;
                grid-template-columns: 1fr;
                gap: .55rem;
                padding: 1rem 1rem 1.1rem;
                overflow-y: auto;
            }
            .member-portrait-viewer-image { max-width: 82vw; max-height: 68vh; }
            .member-portrait-viewer-info { text-align: center; }
            .member-portrait-viewer-plant { margin-top: .35rem; }
            .member-portrait-viewer-close { width: 46px; height: 46px; top: .55rem; right: .55rem; }
        }
    </style>
'''
          if s.count('</head>') != 1:
              raise SystemExit('unexpected </head> count')
          s = s.replace('</head>', style + '</head>', 1)

          viewer = r'''
    <!-- 共用學生人物立繪 Viewer：圖片來源沿用 STUDENT_INFO[id].avatar -->
    <div id="member-portrait-viewer" class="member-portrait-viewer" aria-hidden="true">
        <div class="member-portrait-viewer-card" role="dialog" aria-modal="true" aria-labelledby="member-portrait-viewer-name">
            <button id="member-portrait-viewer-close" class="member-portrait-viewer-close" type="button" aria-label="關閉人物立繪">×</button>
            <div class="member-portrait-viewer-image-wrap">
                <img id="member-portrait-viewer-image" class="member-portrait-viewer-image" alt="" draggable="false" />
                <div id="member-portrait-viewer-failure" class="member-portrait-viewer-failure" hidden>人物圖片載入失敗</div>
            </div>
            <div class="member-portrait-viewer-info">
                <div id="member-portrait-viewer-name" class="member-portrait-viewer-name"></div>
                <div id="member-portrait-viewer-plant" class="member-portrait-viewer-plant"></div>
            </div>
        </div>
    </div>

    <script id="member-portrait-viewer-script">
    (() => {
      'use strict';
      const doc = document;
      const viewer = doc.getElementById('member-portrait-viewer');
      const viewerImage = doc.getElementById('member-portrait-viewer-image');
      const viewerFailure = doc.getElementById('member-portrait-viewer-failure');
      const viewerName = doc.getElementById('member-portrait-viewer-name');
      const viewerPlant = doc.getElementById('member-portrait-viewer-plant');
      const viewerClose = doc.getElementById('member-portrait-viewer-close');
      const memberList = doc.getElementById('member-list');

      if (!viewer || !viewerImage || !viewerFailure || !viewerName || !viewerPlant || !viewerClose || !memberList) {
        console.error('[HerbGame] member portrait viewer init failed');
        return;
      }

      let currentStudentId = null;

      function getStudentInfo(studentId) {
        if (typeof STUDENT_INFO === 'undefined' || !studentId) return null;
        return STUDENT_INFO[studentId] || null;
      }

      function isStudentUnlocked(studentId) {
        return Boolean(window.gameEngine?.gameState?.unlockedStudents?.has?.(studentId));
      }

      function openMemberPortraitViewer(studentId) {
        const info = getStudentInfo(studentId);
        const state = window.gameEngine?.gameState;
        if (!info || !state || !isStudentUnlocked(studentId) || !info.avatar) return false;

        currentStudentId = studentId;
        viewer.dataset.studentId = studentId;
        viewerName.textContent = info.name;
        const plantDiscovered = Boolean(state.discoveredHerbNames?.has?.(info.plant));
        viewerPlant.textContent = `代表植物｜${plantDiscovered ? info.plant : '？？？'}`;

        viewerFailure.hidden = true;
        viewerImage.hidden = false;
        viewerImage.alt = `${info.name}完整人物立繪`;
        viewerImage.src = info.avatar;

        viewer.classList.add('active');
        viewer.setAttribute('aria-hidden', 'false');
        return true;
      }

      function closeMemberPortraitViewer() {
        if (!viewer.classList.contains('active')) return false;
        viewer.classList.remove('active');
        viewer.setAttribute('aria-hidden', 'true');

        const focused = doc.activeElement;
        if (focused && viewer.contains(focused) && typeof focused.blur === 'function') focused.blur();

        currentStudentId = null;
        delete viewer.dataset.studentId;
        return true;
      }

      memberList.addEventListener('click', (event) => {
        const portrait = event.target?.closest?.('.member-avatar-img[data-student-id]');
        if (!portrait || !memberList.contains(portrait)) return;
        const studentId = portrait.dataset.studentId;
        if (!isStudentUnlocked(studentId) || !getStudentInfo(studentId)) return;
        openMemberPortraitViewer(studentId);
      });

      viewerClose.addEventListener('click', (event) => {
        event.preventDefault();
        closeMemberPortraitViewer();
      });

      viewer.addEventListener('click', (event) => {
        if (event.target === viewer) closeMemberPortraitViewer();
      });

      viewerImage.addEventListener('load', () => {
        if (!currentStudentId) return;
        viewerFailure.hidden = true;
        viewerImage.hidden = false;
      });

      viewerImage.addEventListener('error', () => {
        const studentId = currentStudentId;
        const info = getStudentInfo(studentId);
        const failedPath = viewerImage.getAttribute('src') || '';
        console.error('[HerbGame] member portrait viewer image load failed', {
          id: studentId,
          name: info?.name || '',
          path: failedPath,
          error: 'load failed'
        });
        viewerImage.hidden = true;
        viewerFailure.hidden = false;
      });

      // Capture phase guarantees Viewer keyboard safety before any existing dialogue handler.
      doc.addEventListener('keydown', (event) => {
        if (!viewer.classList.contains('active')) return;

        if (event.key === 'Escape') {
          event.preventDefault();
          event.stopImmediatePropagation();
          closeMemberPortraitViewer();
          return;
        }

        if (event.code === 'Space' || event.key === ' ') {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.__HERBGAME_MEMBER_PORTRAIT_VIEWER = {
        openMemberPortraitViewer,
        closeMemberPortraitViewer,
        get activeStudentId() { return currentStudentId; }
      };
    })();
    </script>
'''
          if s.count('</body>') != 1:
              raise SystemExit('unexpected </body> count')
          s = s.replace('</body>', viewer + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --exit-code -- herbgame-formal.html
          git diff -- herbgameai-formal.html

      - name: JavaScript syntax and invariant checks
        run: |
          set -euo pipefail
          rm -rf /tmp/herb-js && mkdir -p /tmp/herb-js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('herbgameai-formal.html').read_text(encoding='utf-8')
          assert s.count('id="member-portrait-viewer"') == 1
          assert s.count('id="member-portrait-viewer-style"') == 1
          assert s.count('id="member-portrait-viewer-script"') == 1
          assert s.count('data-student-id="${id}"') == 1
          assert 'viewerImage.src = info.avatar;' in s
          assert 'portraitImages' not in s
          assert 'zoomImages' not in s
          assert 'largeAvatar' not in s
          assert 'object-fit: contain;' in s
          assert 'event.target === viewer' in s
          assert "event.key === 'Escape'" in s
          assert "event.code === 'Space'" in s
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S | re.I)
          n = 0
          for block in blocks:
              if block.strip():
                  Path(f'/tmp/herb-js/{n}.js').write_text(block, encoding='utf-8')
                  n += 1
          print('inline scripts:', n)
          PY
          for f in /tmp/herb-js/*.js; do node --check "$f"; done
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"

      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright==1.55.0
          python3 -m playwright install --with-deps chromium >/dev/null

      - name: Targeted member portrait viewer verification
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/herb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width":1366,"height":768})
              page_errors = []
              page.on('pageerror', lambda err: page_errors.append(str(err)))
              page.route('https://**/*', lambda route: route.abort())
              page.goto('http://127.0.0.1:8765/herbgameai-formal.html', wait_until='domcontentloaded')
              page.wait_for_function('window.gameEngine && window.__HERBGAME_MEMBER_PORTRAIT_VIEWER', timeout=10000)

              page.evaluate("""() => {
                const e = window.gameEngine;
                e.dom.screenHome.classList.remove('active');
                e.dom.screenIntro.classList.remove('active');
                e.dom.screenGame.classList.add('active');
                e.gameState.unlockedStudents.add('mint_student');
                e.gameState.discoveredHerbNames.add('薄荷');
                e.openPlayerPanel();
                e.switchPanelTab('members');
                const body = document.querySelector('.player-panel-body');
                body.scrollTop = 220;
              }""")
              page.wait_for_timeout(150)

              portrait = page.locator('.member-avatar-img[data-student-id="mint_student"]')
              assert portrait.count() == 1
              assert page.locator('.member-avatar-img[data-student-id="left_student"]').count() == 0
              thumb = page.evaluate("""() => {
                const img=document.querySelector('.member-avatar-img[data-student-id="mint_student"]');
                return {src:img.getAttribute('src'), expected:STUDENT_INFO.mint_student.avatar, cursor:getComputedStyle(img).cursor};
              }""")
              assert thumb['src'] == thumb['expected']
              assert thumb['cursor'] == 'zoom-in'

              scroll_before = page.eval_on_selector('.player-panel-body', 'el => el.scrollTop')
              portrait.click()
              page.wait_for_timeout(100)
              opened = page.evaluate("""() => {
                const v=document.getElementById('member-portrait-viewer');
                const img=document.getElementById('member-portrait-viewer-image');
                const r=img.getBoundingClientRect();
                return {
                  active:v.classList.contains('active'),
                  id:v.dataset.studentId,
                  src:img.getAttribute('src'),
                  expected:STUDENT_INFO.mint_student.avatar,
                  fit:getComputedStyle(img).objectFit,
                  maxHeight:getComputedStyle(img).maxHeight,
                  name:document.getElementById('member-portrait-viewer-name').textContent,
                  plant:document.getElementById('member-portrait-viewer-plant').textContent,
                  imageWithinViewport:r.top >= 0 && r.bottom <= innerHeight && r.left >= 0 && r.right <= innerWidth,
                  panelActive:window.gameEngine.dom.playerPanel.classList.contains('active'),
                  membersActive:document.querySelector('[data-panel-tab="members"]').classList.contains('active')
                };
              }""")
              assert opened['active'] and opened['id'] == 'mint_student'
              assert opened['src'] == opened['expected']
              assert opened['fit'] == 'contain'
              assert opened['name'] == '小琳'
              assert opened['plant'] == '代表植物｜薄荷'
              assert opened['imageWithinViewport']
              assert opened['panelActive'] and opened['membersActive']

              # Clicking the portrait itself must not close the viewer.
              page.locator('#member-portrait-viewer-image').click()
              assert page.locator('#member-portrait-viewer').evaluate('el => el.classList.contains("active")')

              # Space must do absolutely nothing while the viewer is open.
              before_space = page.evaluate("""() => ({
                active:document.getElementById('member-portrait-viewer').classList.contains('active'),
                node:window.gameEngine.currentNodeId,
                text:window.gameEngine.dom.dialogueText.textContent
              })""")
              page.keyboard.press('Space')
              page.wait_for_timeout(50)
              after_space = page.evaluate("""() => ({
                active:document.getElementById('member-portrait-viewer').classList.contains('active'),
                node:window.gameEngine.currentNodeId,
                text:window.gameEngine.dom.dialogueText.textContent
              })""")
              assert after_space == before_space

              # Backdrop closes, while panel/tab and scroll position stay intact.
              page.locator('#member-portrait-viewer').evaluate('el => el.click()')
              assert not page.locator('#member-portrait-viewer').evaluate('el => el.classList.contains("active")')
              assert page.locator('#player-panel').evaluate('el => el.classList.contains("active")')
              assert page.locator('[data-panel-tab="members"]').evaluate('el => el.classList.contains("active")')
              assert abs(page.eval_on_selector('.player-panel-body', 'el => el.scrollTop') - scroll_before) <= 2

              # Undiscovered plant remains hidden.
              page.evaluate("window.gameEngine.gameState.discoveredHerbNames.delete('薄荷')")
              portrait.click()
              assert page.locator('#member-portrait-viewer-plant').inner_text() == '代表植物｜？？？'

              # Esc closes only the viewer, not the player panel.
              page.keyboard.press('Escape')
              assert not page.locator('#member-portrait-viewer').evaluate('el => el.classList.contains("active")')
              assert page.locator('#player-panel').evaluate('el => el.classList.contains("active")')

              # Close button closes and must not leave hidden Viewer focus behind.
              portrait.click()
              page.locator('#member-portrait-viewer-close').click()
              focus_state = page.evaluate("""() => ({
                active:document.getElementById('member-portrait-viewer').classList.contains('active'),
                focusInside:document.getElementById('member-portrait-viewer').contains(document.activeElement),
                panelActive:window.gameEngine.dom.playerPanel.classList.contains('active'),
                membersActive:document.querySelector('[data-panel-tab="members"]').classList.contains('active'),
                cardText:document.querySelector('.member-avatar-img[data-student-id="mint_student"]').closest('.member-card').innerText
              })""")
              assert not focus_state['active'] and not focus_state['focusInside']
              assert focus_state['panelActive'] and focus_state['membersActive']
              for label in ['代表植物','喜歡的地方','目前印象','故事進度','相處進度']:
                  assert label in focus_state['cardText']

              assert page_errors == [], page_errors
              print('MEMBER_VIEWER_OK=' + json.dumps({'thumb':thumb,'opened':opened,'focus':focus_state}, ensure_ascii=False))
              browser.close()
          PY

      - name: Commit viewer and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-member-portrait-viewer.yml
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          git diff --exit-code -- herbgame-formal.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add herbgameai-formal.html .github/workflows/add-member-portrait-viewer.yml
          git diff --cached --name-only
          git commit -m 'feat: add student portrait viewer'
          git push origin HEAD:main
