name: Patch Oppenheimer dialogue layout

on:
  push:
    paths:
      - '.github/workflows/patch-oppenheimer-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix desktop dialogue layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Oppenheimer.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* OPPENHEIMER_DIALOGUE_LAYOUT_FIX_20260831 */'

          if marker in text:
              raise SystemExit('Layout fix already present; nothing to do.')

          if '.transcript-area{border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-bottom:24px;min-height:300px;max-height:55vh;' not in text:
              raise SystemExit('Expected dialogue transcript CSS not found; refusing an unsafe patch.')

          override = r'''/* OPPENHEIMER_DIALOGUE_LAYOUT_FIX_20260831 */
#dialogue.paper{min-height:calc(100vh - 68px);padding:36px 0 56px}
#dialogue .head{padding-bottom:18px;margin-bottom:28px}
#dialogue .dl-layout{grid-template-columns:minmax(240px,280px) minmax(0,1fr);gap:36px;align-items:start}
#dialogue .dl-left{position:sticky;top:96px;padding-right:28px}
#dialogue .dl-photo{aspect-ratio:4/5;max-height:350px;margin-bottom:18px}
#dialogue .dl-name{font-size:25px}
#dialogue .dl-en{font-size:12px;margin-bottom:12px}
#dialogue .dl-years{margin-bottom:12px}
#dialogue .dl-roles{margin-bottom:18px}
#dialogue .dl-right{min-width:0}
#dialogue .archivebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px;padding-bottom:14px;margin-bottom:20px;line-height:1.35}
#dialogue .dl-disclaimer{margin-bottom:20px}
#dialogue .dl-tags{gap:8px;margin-bottom:24px}
#dialogue .q-tag{padding:7px 12px}
#dialogue .transcript-area{height:clamp(220px,28vh,280px);min-height:220px;max-height:none;margin-bottom:16px}
#dialogue .t-entry{padding:16px 0}
#dialogue .dl-input-wrap{padding:18px 20px}
#dialogue .dl-input-wrap label{margin-bottom:8px}
#dialogue .dl-textarea{margin-bottom:12px}
#dialogue .dl-controls{gap:16px}
@media(max-width:1050px){
#dialogue.paper{padding:44px 0 64px}
#dialogue .head{margin-bottom:34px}
#dialogue .dl-layout{grid-template-columns:1fr;gap:32px}
#dialogue .dl-left{position:static;top:auto;padding-right:0}
#dialogue .dl-photo{aspect-ratio:3/4;max-height:none}
#dialogue .archivebar{grid-template-columns:repeat(2,minmax(0,1fr))}
#dialogue .transcript-area{height:300px;min-height:240px;max-height:50vh}
}
@media(max-width:720px){
#dialogue.paper{padding:32px 0 52px}
#dialogue .head{padding-bottom:16px;margin-bottom:28px}
#dialogue .archivebar{grid-template-columns:1fr 1fr;gap:10px}
#dialogue .transcript-area{height:280px;min-height:220px;max-height:none}
#dialogue .dl-input-wrap{padding:16px}
}
@media(max-width:480px){
#dialogue .archivebar{grid-template-columns:1fr}
#dialogue .transcript-area{height:260px}
}
'''

          style_close = '</style>'
          pos = text.find(style_close)
          if pos == -1:
              raise SystemExit('Missing </style>; refusing an unsafe patch.')

          text = text[:pos] + override + text[pos:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-oppenheimer-layout.yml
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Oppenheimer dialogue desktop layout'
          git push
