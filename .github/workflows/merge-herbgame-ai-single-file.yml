name: Merge herbgame AI into single file

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-herbgame-ai-single-file.yml'

permissions:
  contents: write

jobs:
  merge-single-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest game
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge AI base and wrapper
        run: |
          set -euo pipefail
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          test -f herbgameai-formal-base.html
          test -f herbgameai-formal.html
          python3 - <<'PY'
          from pathlib import Path

          base_path = Path('herbgameai-formal-base.html')
          wrapper_path = Path('herbgameai-formal.html')
          base = base_path.read_text(encoding='utf-8')
          wrapper = wrapper_path.read_text(encoding='utf-8')

          script_start = wrapper.index('<script>') + len('<script>')
          script_end = wrapper.rindex('</script>')
          script = wrapper[script_start:script_end].strip()

          frame_decl = '  const frame = document.getElementById("formal-frame");\n  const bootNote = document.getElementById("boot-note");\n\n'
          if frame_decl not in script:
              raise AssertionError('Expected iframe declarations were not found')
          script = script.replace(frame_decl, '', 1)

          boot_marker = '  frame.addEventListener("load", () => {'
          idx = script.find(boot_marker)
          if idx < 0:
              raise AssertionError('Expected iframe boot block was not found')
          prefix = script[:idx]
          direct_boot = '''  let __aiBootTries = 0;
          const __aiBootTimer = setInterval(() => {
            __aiBootTries++;
            if (window.gameEngine) {
              clearInterval(__aiBootTimer);
              installAIVisualBranch(window, document, window.gameEngine);
            } else if (__aiBootTries > 100) {
              clearInterval(__aiBootTimer);
              console.error("AI圖片試作版載入失敗：找不到正式版遊戲引擎。");
            }
          }, 30);
          })();'''
          script = prefix + direct_boot

          if '</body>' not in base:
              raise AssertionError('Base HTML has no closing body tag')
          merged_script = '\n<!-- AI圖片正式試作版：單檔整合層 -->\n<script>\n' + script + '\n</script>\n'
          merged = base.replace('</body>', merged_script + '</body>', 1)
          merged = merged.replace('<title>《天啊！我被香草包圍了》</title>', '<title>《天啊！我被香草包圍了》｜AI圖片正式試作版</title>', 1)

          forbidden = ['herbgameai-formal-base.html', 'formal-frame', 'frame.contentWindow', 'frame.contentDocument', 'boot-note']
          for token in forbidden:
              if token in merged:
                  raise AssertionError(f'Standalone HTML still contains wrapper dependency: {token}')

          required = [
              'AI_SCENE_ASSETS', 'AI_CHARACTER_ASSETS', 'PLANT_CARD_ASSETS',
              'installAIVisualBranch(window, document, window.gameEngine)',
              'ai_mint_e01_01', '欸！是你！', '遊樂場',
              'plant-card-reveal-layer', 'getDay1DiaryText',
              'morningGreeting', 'mint_student_event_01'
          ]
          for token in required:
              if token not in merged:
                  raise AssertionError(f'Merged HTML missing required feature: {token}')

          for token in ['bravery', 'requiredBravery', 'braveryChange', 'addBravery', 'panel-bravery', 'de-bravery', '勇氣值', '勇氣不足']:
              if token.lower() in merged.lower():
                  raise AssertionError(f'Merged HTML resurrected removed bravery-system token: {token}')

          wrapper_path.write_text(merged, encoding='utf-8')
          base_path.unlink()
          print('Merged single-file size:', wrapper_path.stat().st_size)
          PY
          test ! -e herbgameai-formal-base.html
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"

      - name: Browser acceptance for standalone file
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/herbgame-http.log 2>&1 &
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"

          # GitHub-hosted Chrome can return a non-zero process code because of DBus/GPU teardown
          # even when --dump-dom has completed. Validate the produced DOM instead of that exit code.
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=4500 --dump-dom \
            'http://127.0.0.1:8000/herbgameai-formal.html' > /tmp/home-dom.html || true
          test -s /tmp/home-dom.html
          grep -q 'id="screen-home"' /tmp/home-dom.html
          grep -q 'id="ai-character-layer"' /tmp/home-dom.html
          grep -q 'id="plant-card-reveal-layer"' /tmp/home-dom.html
          grep -q 'AI圖片試作版' /tmp/home-dom.html
          ! grep -q 'formal-frame' /tmp/home-dom.html
          ! grep -q 'panel-bravery' /tmp/home-dom.html

          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=6500 --dump-dom \
            'http://127.0.0.1:8000/herbgameai-formal.html?preview=plant-card-mint' > /tmp/mint-dom.html || true
          test -s /tmp/mint-dom.html
          grep -q 'plant-card-reveal-layer active' /tmp/mint-dom.html
          grep -q '薄荷' /tmp/mint-dom.html
          grep -q '241自然教室' /tmp/mint-dom.html

          grep -q 'ai_mint_e01_01' herbgameai-formal.html
          grep -q '欸！是你！' herbgameai-formal.html
          grep -q '遊樂場' herbgameai-formal.html
          grep -q 'mint_student_event_01' herbgameai-formal.html

      - name: Final source verification and commit
        run: |
          set -euo pipefail
          test ! -e herbgameai-formal-base.html
          test "$(git hash-object herbgame-formal.html)" = "7444b15a2b440030b37b403d83f169606831ec7c"
          grep -q 'AI_SCENE_ASSETS' herbgameai-formal.html
          grep -q 'PLANT_CARD_ASSETS' herbgameai-formal.html
          grep -q 'morningGreeting' herbgameai-formal.html
          ! grep -qi 'bravery' herbgameai-formal.html
          ! grep -q 'herbgameai-formal-base.html' herbgameai-formal.html
          rm -f .github/workflows/merge-herbgame-ai-single-file.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -qx 'herbgame-formal.html'; then echo 'Protected formal file was staged'; exit 1; fi
          git commit -m "refactor: merge AI herb game into single HTML"
          git push origin HEAD:main
