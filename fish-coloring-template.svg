<circle cx="598" cy="275" r="7" fill="#192e3b"/>
<circle cx="600" cy="273" r="2" fill="white"/>
<text x="400" y="459" text-anchor="middle" class="sub">畫好後，將整張紙攤平拍照；四個角落的黑色方塊都要入鏡。</text>
<text x="400" y="483" text-anchor="middle" class="sub">拍照前請確認紙張沒有被遮住，也不要沿著魚形剪下來。</text>
<text x="400" y="552" text-anchor="middle" font-size="12" fill="#70828b">班級彩繪水族館 ｜ A4 橫式，建議 100% 原尺寸列印</text>
