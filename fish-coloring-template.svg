<text x="400" y="78" text-anchor="middle" font-size="29" font-weight="700">我的彩繪小魚</text>
<text x="400" y="107" text-anchor="middle" class="sub">請在魚的輪廓內自由著色，魚身的空白也可以上色</text>
<text x="94" y="132" class="small">魚的名字（選填）：___________________</text>
<!-- The following fish silhouette path is identical to the JS mask in the web prototype. -->
<path d="M225 286 C204 264 167 225 136 207 L144 366 C174 347 205 322 225 309 C268 257 332 225 400 211 L444 164 L471 214 C550 218 622 251 659 282 Q681 292 658 309 C614 348 537 365 472 362 L442 408 L400 363 C333 359 269 339 225 309 Q214 297 225 286 Z" fill="white" stroke="#192e3b" stroke-width="3.5" stroke-linejoin="round"/>
